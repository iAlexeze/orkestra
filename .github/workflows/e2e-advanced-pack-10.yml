name: Orkestra E2E Test (Custom Constructor)

on:
  workflow_dispatch:
    inputs:
      image_repo:
        description: "Container image repository (default: ghcr.io/orkspace/orkestra-typed-extensions)"
        required: false
        default: "ghcr.io/orkspace/orkestra-typed-extensions"
      image_tag:
        description: "Container image tag (default: short git commit hash)"
        required: false
        default: ""

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ork-e2e

      # Compute short git hash with "constructor-" prefix if no image_tag provided
      - name: Set image tag
        id: vars
        run: |
          if [ -z "${{ github.event.inputs.image_tag }}" ]; then
            SHORT_SHA=$(git rev-parse --short HEAD)
            echo "tag=constructor-$SHORT_SHA" >> $GITHUB_OUTPUT
            echo "Image tag will be: constructor-$SHORT_SHA"
          else
            echo "tag=${{ github.event.inputs.image_tag }}" >> $GITHUB_OUTPUT
          fi
          echo "repo=${{ github.event.inputs.image_repo }}" >> $GITHUB_OUTPUT

      # ----------------------------------------------------------------------
      # Setup operator and generate registry
      # ----------------------------------------------------------------------
      - name: Setup operator and generate registry
        id: ork
        uses: orkspace/orkestra-action@v0.0.1
        with:
          init: true
          pack: advanced
          example-subdir: 10-constructors
          generate-registry: true

      - name: Examine generated registry
        run: cat ${{ steps.ork.outputs.registry_file }}

      # ----------------------------------------------------------------------
      # Validation: standard ork (expected to fail)
      # ----------------------------------------------------------------------
      - name: Validate with standard ork (should fail)
        id: validate_std
        uses: orkspace/orkestra-action@v0.0.1
        with:
          katalog: ${{ steps.ork.outputs.katalog_path }}
          validate: true
        continue-on-error: true

      - name: Write validation failure to summary
        if: always()
        run: |
          echo "## ❌ Standard ork validation (expected failure)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat ${{ steps.validate_std.outputs.validate_log }} >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      # ----------------------------------------------------------------------
      # Build custom binary
      # ----------------------------------------------------------------------
      - name: Build custom binary
        run: |
          cd ${{ steps.ork.outputs.operator_dir }}
          make clean
          make build

      - name: Validate with custom binary (should pass)
        run: |
          cd ${{ steps.ork.outputs.operator_dir }}
          ./~/.orkestra/bin/ork validate -k ${{ steps.ork.outputs.katalog_path }}

      # ----------------------------------------------------------------------
      # Build and push Docker image using custom binary
      # ----------------------------------------------------------------------
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push custom image
        run: |
          cd ${{ steps.ork.outputs.operator_dir }}
          cp ~/.orkestra/bin/ork ./ork
          docker build -t ${{ steps.vars.outputs.repo }}:${{ steps.vars.outputs.tag }} .
          docker push ${{ steps.vars.outputs.repo }}:${{ steps.vars.outputs.tag }}
          echo "Pushed image: ${{ steps.vars.outputs.repo }}:${{ steps.vars.outputs.tag }}"

      # ----------------------------------------------------------------------
      # Generate and apply bundle (using the custom binary)
      # ----------------------------------------------------------------------
      - name: Generate bundle with custom binary
        run: |
          cd ${{ steps.ork.outputs.operator_dir }}
          ~/.orkestra/bin/ork generate bundle -k ${{ steps.ork.outputs.katalog_path }} \
            -o bundle.yaml -n ${{ steps.ork.outputs.namespace }}
          kubectl apply -f bundle.yaml

      - name: Apply CRD
        run: kubectl apply -f ${{ steps.ork.outputs.crd_path }}

      # ----------------------------------------------------------------------
      # Install Helm chart using the pushed image
      # ----------------------------------------------------------------------
      - name: Install Orkestra Helm chart
        run: |
          helm repo add orkestra https://orkspace.github.io/orkestra
          helm install orkestra orkestra/orkestra \
            --namespace ${{ steps.ork.outputs.namespace }} \
            --set runtime.image.repository=${{ steps.vars.outputs.repo }} \
            --set runtime.image.tag=${{ steps.vars.outputs.tag }} \
            --set runtime.image.pullPolicy=Always

      # ----------------------------------------------------------------------
      # Step Summary: Initialize report
      # ----------------------------------------------------------------------
      - name: Initialize summary
        run: |
          echo "# Orkestra E2E Test Report (Custom Constructor)" >> $GITHUB_STEP_SUMMARY
          echo "**Pack:** advanced / 10-constructors (Pipeline CRD)" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** ${{ steps.vars.outputs.repo }}:${{ steps.vars.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      # ----------------------------------------------------------------------
      # Before CR – verify no Jobs exist
      # ----------------------------------------------------------------------
      - name: Verify no resources before CR
        run: |
          echo "## 📌 Before applying Pipeline CR" >> $GITHUB_STEP_SUMMARY
          echo "No Jobs should exist." >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "Jobs in default namespace:" >> $GITHUB_STEP_SUMMARY
          kubectl get jobs -n default || true >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      # ----------------------------------------------------------------------
      # Apply the Pipeline CR
      # ----------------------------------------------------------------------
      - name: Apply Pipeline CR
        run: kubectl apply -f ${{ steps.ork.outputs.cr_path }}

      # ----------------------------------------------------------------------
      # Wait for operator and verify Jobs (state machine)
      # ----------------------------------------------------------------------
      - name: Wait for operator and verify Jobs
        run: |
          kubectl wait --for=condition=available deployment -l app.kubernetes.io/name=orkestra \
            -n ${{ steps.ork.outputs.namespace }} --timeout=120s

          echo "Waiting for Pipeline to start..."
          sleep 10

          # Wait for the first Job (build) to complete
          echo "Waiting for build Job to complete..."
          kubectl wait --for=condition=complete job/build-and-test-build -n default --timeout=60s || true

          # Wait for the second Job (test) to complete
          echo "Waiting for test Job to complete..."
          kubectl wait --for=condition=complete job/build-and-test-test -n default --timeout=60s || true

          # Wait for the third Job (notify) to complete
          echo "Waiting for notify Job to complete..."
          kubectl wait --for=condition=complete job/build-and-test-notify -n default --timeout=60s || true

          # Verify all Jobs succeeded
          if ! kubectl get job build-and-test-build -n default -o jsonpath='{.status.succeeded}' | grep -q 1; then
            echo "❌ Build job did not succeed"
            exit 1
          fi
          if ! kubectl get job build-and-test-test -n default -o jsonpath='{.status.succeeded}' | grep -q 1; then
            echo "❌ Test job did not succeed"
            exit 1
          fi
          if ! kubectl get job build-and-test-notify -n default -o jsonpath='{.status.succeeded}' | grep -q 1; then
            echo "❌ Notify job did not succeed"
            exit 1
          fi

          echo "✅ All Jobs succeeded"

          echo "## ✅ After applying Pipeline CR" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "Jobs in default namespace:" >> $GITHUB_STEP_SUMMARY
          kubectl get jobs -n default >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      # ----------------------------------------------------------------------
      # Cleanup test: delete CR and verify Jobs removed
      # ----------------------------------------------------------------------
      - name: Delete Pipeline CR and verify cleanup
        run: |
          CR_NAME=$(kubectl get pipeline -o jsonpath='{.items[0].metadata.name}')
          kubectl delete pipeline "$CR_NAME"
          sleep 10

          # Verify Jobs are gone (owner references cause garbage collection)
          if kubectl get job build-and-test-build -n default &>/dev/null; then
            echo "❌ Build job still exists"
            exit 1
          fi
          if kubectl get job build-and-test-test -n default &>/dev/null; then
            echo "❌ Test job still exists"
            exit 1
          fi
          if kubectl get job build-and-test-notify -n default &>/dev/null; then
            echo "❌ Notify job still exists"
            exit 1
          fi

          echo "## 🧹 After deleting Pipeline CR" >> $GITHUB_STEP_SUMMARY
          echo "✅ All Jobs removed." >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "Jobs in default namespace:" >> $GITHUB_STEP_SUMMARY
          kubectl get jobs -n default || true >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      # ----------------------------------------------------------------------
      # Show logs on failure
      # ----------------------------------------------------------------------
      - name: Show logs on failure
        if: failure()
        run: |
          echo "## 🔍 Debug logs (failure)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          kubectl logs -n ${{ steps.ork.outputs.namespace }} deployment/orkestra-runtime --tail=100 || true >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Show Helm release info
        if: always()
        run: helm list -A