# ── E2E: Orkestra Helm chart ────────────────────────────────────────────
# Installs the chart into a kind cluster via ork e2e and asserts infrastructure.
# Can be triggered manually or called from release-helm after metadata update.
name: Orkestra Chart E2E

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to test (applies chart metadata before e2e)'
        required: false
        type: string
  workflow_call:
    inputs:
      image_tag:
        description: 'Image tag to test (applies chart metadata before e2e)'
        required: false
        type: string
      repository:
        description: 'GitHub repository (owner/name) for image registry'
        required: false
        type: string
        default: ${{ github.repository }}
      ork:
        description: 'Shorthand for orkestra (used in chart name)'
        required: false
        type: string
        default: 'orkestra'

jobs:
  orkestra-chart:
    name: E2E — Orkestra chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install yq
        if: ${{ inputs.image_tag != '' }}
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Apply chart metadata
        if: ${{ inputs.image_tag != '' }}
        run: |
          ORK="${{ inputs.ork || 'orkestra' }}"
          REPO="${{ inputs.repository || github.repository }}"
          TAG="${{ inputs.image_tag }}"
          yq eval ".appVersion = \"${TAG}\"" -i charts/${ORK}/Chart.yaml
          yq eval ".runtime.image.tag = \"${TAG}\"" -i charts/${ORK}/values.yaml
          yq eval ".runtime.image.repository = \"ghcr.io/${REPO}\"" -i charts/${ORK}/values.yaml
          yq eval ".gateway.image.tag = \"${TAG}\"" -i charts/${ORK}/values.yaml
          yq eval ".gateway.image.repository = \"ghcr.io/${REPO}-gateway\"" -i charts/${ORK}/values.yaml
          yq eval ".controlCenter.image.tag = \"${TAG}\"" -i charts/${ORK}/values.yaml
          yq eval ".controlCenter.image.repository = \"ghcr.io/${REPO}-cc\"" -i charts/${ORK}/values.yaml

      - name: Run chart e2e
        uses: orkspace/orkestra-action@v1
        with:
          working-directory: charts/orkestra
          e2e: "true"
