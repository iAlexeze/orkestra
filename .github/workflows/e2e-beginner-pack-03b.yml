name: Orkestra E2E Test (ConfigMap Distribution)

on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ork-e2e

      # ----------------------------------------------------------------------
      # Setup operator and generate artifacts (CRD, CR, bundle, katalog)
      # ----------------------------------------------------------------------
      - name: Setup operator, validate katalog and generate bundle
        id: ork
        uses: orkspace/orkestra-action@v0.0.1
        with:
          init: true
          pack: beginner
          example-subdir: 03b-bonus-configmap-copy
          validate: true
          generate-bundle: true

      # ----------------------------------------------------------------------
      # Prepare namespaces and source ConfigMap (from setup.yaml)
      # ----------------------------------------------------------------------
      - name: Check content of setup file
        run: cat ${{ steps.ork.outputs.example_dir }}/setup.yaml

      - name: Prepare namespaces and source ConfigMap
        run: kubectl apply -f ${{ steps.ork.outputs.example_dir }}/setup.yaml

      # ----------------------------------------------------------------------
      # Create Orkestra namespace (required before applying CRD and bundle)
      # ----------------------------------------------------------------------
      - name: Create Orkestra namespace
        run: kubectl create namespace orkestra-system --dry-run=client -o yaml | kubectl apply -f -

      # ----------------------------------------------------------------------
      # Apply CRD
      # ----------------------------------------------------------------------
      - name: Apply CRD
        run: kubectl apply -f ${{ steps.ork.outputs.crd_path }}

      # ----------------------------------------------------------------------
      # Examine and Apply generated bundle (RBAC + ConfigMap)
      # ----------------------------------------------------------------------
      - name: Examine generated bundle
        run: cat ${{ steps.ork.outputs.bundle_file }}

      - name: Apply generated bundle
        run: kubectl apply -f ${{ steps.ork.outputs.bundle_file }}

      # ----------------------------------------------------------------------
      # Install Orkestra Helm chart (operator runtime)
      # ----------------------------------------------------------------------
      - name: Install Orkestra Helm chart
        run: |
          helm repo add orkestra https://orkspace.github.io/orkestra
          helm install orkestra orkestra/orkestra \
            --namespace orkestra-system \
            --create-namespace

      # ----------------------------------------------------------------------
      # Step Summary: Initialize report
      # ----------------------------------------------------------------------
      - name: Initialize summary
        run: |
          echo "# Orkestra E2E Test Report" >> $GITHUB_STEP_SUMMARY
          echo "**Pack:** beginner / 03b-bonus-configmap-copy" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      # ----------------------------------------------------------------------
      # Before CR – verify no ConfigMap copies
      # ----------------------------------------------------------------------
      - name: Verify no ConfigMap copies exist before CR
        run: |
          echo "## 📌 Before applying ConfigMapDistribution CR" >> $GITHUB_STEP_SUMMARY
          echo "Target namespaces should have NO ConfigMap copies." >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "team-alpha:" >> $GITHUB_STEP_SUMMARY
          kubectl get configmap app-config -n team-alpha || true >> $GITHUB_STEP_SUMMARY
          echo "team-beta:" >> $GITHUB_STEP_SUMMARY
          kubectl get configmap app-config -n team-beta || true >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "Source ConfigMap in platform:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          kubectl get configmap app-config -n platform >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Original console output
          echo "==> Before applying ConfigMapDistribution CR, target namespaces should have NO ConfigMap copies"
          kubectl get configmap app-config -n team-alpha || true
          kubectl get configmap app-config -n team-beta || true
          echo "Source ConfigMap in platform:"
          kubectl get configmap app-config -n platform

      # ----------------------------------------------------------------------
      # Apply the ConfigMapDistribution CR
      # ----------------------------------------------------------------------
      - name: Apply ConfigMapDistribution CR
        run: kubectl apply -f ${{ steps.ork.outputs.cr_path }}

      # ----------------------------------------------------------------------
      # Wait for operator and verify ConfigMap copies
      # ----------------------------------------------------------------------
      - name: Wait for operator and verify ConfigMap copies
        run: |
          kubectl wait --for=condition=available deployment -l app.kubernetes.io/name=orkestra \
            -n orkestra-system --timeout=120s

          echo "Waiting for ConfigMap copies to appear..."
          sleep 10

          # Verify ConfigMap exists in team-alpha
          if ! kubectl get configmap app-config -n team-alpha &>/dev/null; then
            echo "❌ ConfigMap not found in team-alpha"
            exit 1
          fi
          kubectl get configmap -n team-alpha
          echo "✅ ConfigMap found in team-alpha"

          # Verify ConfigMap exists in team-beta
          if ! kubectl get configmap app-config -n team-beta &>/dev/null; then
            echo "❌ ConfigMap not found in team-beta"
            exit 1
          fi
          kubectl get configmap -n team-beta
          echo "✅ ConfigMap found in team-beta"

          # Write to summary
          echo "## ✅ After applying ConfigMapDistribution CR" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "team-alpha ConfigMaps:" >> $GITHUB_STEP_SUMMARY
          kubectl get configmap -n team-alpha >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "team-beta ConfigMaps:" >> $GITHUB_STEP_SUMMARY
          kubectl get configmap -n team-beta >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      # ----------------------------------------------------------------------
      # Test sync: source ConfigMap update and propagation
      # ----------------------------------------------------------------------
      - name: Test sync (source ConfigMap update)
        run: |
          echo "Updating source ConfigMap in 'platform' namespace..."
          kubectl patch configmap app-config -n platform \
            --type=merge -p '{"data":{"logLevel":"debug"}}'

          echo "Waiting for operator to sync (15s)..."
          sleep 15

          # Check updated logLevel in team-alpha copy
          LOG_LEVEL=$(kubectl get configmap app-config -n team-alpha \
            -o jsonpath='{.data.logLevel}')
          if [[ "$LOG_LEVEL" != "debug" ]]; then
            echo "❌ logLevel in team-alpha copy is not updated. Got: $LOG_LEVEL"
            exit 1
          fi
          echo "Updated logLevel: $LOG_LEVEL"
          echo "✅ ConfigMap synced to team-alpha"

          echo "## 🔄 Sync test" >> $GITHUB_STEP_SUMMARY
          echo "Source ConfigMap updated, logLevel synced to team-alpha: \`$LOG_LEVEL\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      # ----------------------------------------------------------------------
      # Test cleanup: delete CR and verify ConfigMaps are garbage-collected
      # ----------------------------------------------------------------------
      - name: Test cleanup (delete CR)
        run: |
          CR_NAME=$(kubectl get configmapdistribution -o jsonpath='{.items[0].metadata.name}')
          if [[ -z "$CR_NAME" ]]; then
            echo "No ConfigMapDistribution CR found"
            exit 1
          fi
          kubectl delete configmapdistribution "$CR_NAME"

          echo "Waiting 10 seconds for garbage collection..."
          sleep 10

          # Ensure ConfigMaps are removed from team-alpha and team-beta
          if kubectl get configmap app-config -n team-alpha &>/dev/null; then
            echo "❌ ConfigMap still exists in team-alpha after CR deletion"
            exit 1
          fi
          if kubectl get configmap app-config -n team-beta &>/dev/null; then
            echo "❌ ConfigMap still exists in team-beta after CR deletion"
            exit 1
          fi

          kubectl get configmap -n team-alpha
          kubectl get configmap -n team-beta
          echo "✅ ConfigMaps removed from target namespaces"

          # Source ConfigMap must remain untouched
          if ! kubectl get configmap app-config -n platform &>/dev/null; then
            echo "❌ Source ConfigMap was deleted - should not happen"
            exit 1
          fi

          kubectl get configmap -n platform
          echo "✅ Source ConfigMap still intact in platform namespace"

          # Write to summary
          echo "## 🧹 After deleting ConfigMapDistribution CR" >> $GITHUB_STEP_SUMMARY
          echo "✅ ConfigMaps removed from target namespaces." >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "team-alpha ConfigMaps:" >> $GITHUB_STEP_SUMMARY
          kubectl get configmap -n team-alpha >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "team-beta ConfigMaps:" >> $GITHUB_STEP_SUMMARY
          kubectl get configmap -n team-beta >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Source ConfigMap still intact in platform namespace." >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          kubectl get configmap app-config -n platform >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      # ----------------------------------------------------------------------
      # Show logs on failure
      # ----------------------------------------------------------------------
      - name: Show logs on failure
        if: failure()
        run: |
          echo "## 🔍 Debug logs (failure)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          kubectl logs -n orkestra-system deployment/orkestra-runtime --tail=100 || true >> $GITHUB_STEP_SUMMARY
          kubectl logs -n orkestra-system deployment/orkestra-cc --tail=100 || true >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      # ----------------------------------------------------------------------
      # Show Helm release info
      # ----------------------------------------------------------------------
      - name: Show Helm release info
        if: always()
        run: helm list -A