name: Orkestra E2E Test (Admission Webhooks)

on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ork-e2e

      # ----------------------------------------------------------------------
      # Setup operator and generate bundle (CRD, CR, bundle, katalog)
      # ----------------------------------------------------------------------
      - name: Setup operator, validate katalog and generate bundle
        id: ork
        uses: orkspace/orkestra-action@v0.0.1
        with:
          init: true
          pack: security
          example-subdir: admission
          validate: true
          generate-bundle: true

      # ----------------------------------------------------------------------
      # Apply CRD
      # ----------------------------------------------------------------------
      - name: Apply CRD
        run: kubectl apply -f ${{ steps.ork.outputs.crd_path }}

      # ----------------------------------------------------------------------
      # Examine and Apply generated bundle (RBAC + ConfigMap)
      # ----------------------------------------------------------------------
      - name: Examine generated bundle
        run: cat ${{ steps.ork.outputs.bundle_file }}

      - name: Apply generated bundle
        run: kubectl apply -f ${{ steps.ork.outputs.bundle_file }}

      # ----------------------------------------------------------------------
      # Install Orkestra Helm chart (operator runtime)
      # ----------------------------------------------------------------------
      - name: Install Orkestra Helm chart
        run: |
          helm repo add orkestra https://orkspace.github.io/orkestra
          helm install orkestra orkestra/orkestra \
            --namespace ${{ steps.ork.outputs.namespace }}

      # ----------------------------------------------------------------------
      # Step Summary: Initialize report
      # ----------------------------------------------------------------------
      - name: Initialize summary
        run: |
          echo "# Orkestra E2E Test Report – Admission Webhooks" >> $GITHUB_STEP_SUMMARY
          echo "**Pack:** security / admission" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      # ----------------------------------------------------------------------
      # Test 1: Apply valid CR (all fields present)
      # ----------------------------------------------------------------------
      - name: Apply valid CR
        run: kubectl apply -f ${{ steps.ork.outputs.example_dir }}/cr-valid.yaml

      - name: Wait for operator and verify status
        run: |
          kubectl wait --for=condition=available deployment -l app.kubernetes.io/name=orkestra \
            -n ${{ steps.ork.outputs.namespace }} --timeout=120s
          sleep 5
          echo "## ✅ Valid CR – should be Running" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          kubectl get platform my-platform -o yaml >> $GITHUB_STEP_SUMMARY 2>&1 || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      # ----------------------------------------------------------------------
      # Test 2: Apply bad CR (should be rejected by validation webhook)
      # ----------------------------------------------------------------------
      - name: Apply bad CR (should fail)
        id: apply_bad
        continue-on-error: true
        run: |
          kubectl apply -f ${{ steps.ork.outputs.example_dir }}/cr-bad.yaml 2>&1 | tee bad_output.log
          if grep -q "denied the request" bad_output.log; then
            echo "✅ Expected rejection occurred"
            exit 0
          else
            echo "❌ Expected rejection did NOT happen"
            exit 1
          fi

      - name: Record bad CR result in summary
        if: always()
        run: |
          echo "## 🚫 Bad CR – rejected by validation webhook" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat bad_output.log >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "No log found"
          echo '```' >> $GITHUB_STEP_SUMMARY

      # ----------------------------------------------------------------------
      # Test 3: Apply minimal CR (missing fields) – mutation should add defaults
      # ----------------------------------------------------------------------
      - name: Apply minimal CR
        run: |
          kubectl apply -f ${{ steps.ork.outputs.example_dir }}/cr-mutated.yaml
          sleep 5

      - name: Verify mutated fields in status
        run: |
          echo "## 🔄 Minimal CR – mutation applied (defaults filled)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "After mutation, the status fields show the actual values used by Orkestra:"
          kubectl get platform minimal-platform -o yaml >> $GITHUB_STEP_SUMMARY 2>&1
          echo '```' >> $GITHUB_STEP_SUMMARY

      # ----------------------------------------------------------------------
      # Test 4: Verify that a warn rule is logged (advisory)
      # ----------------------------------------------------------------------
      - name: Check logs for warn-level rule (rateLimit missing)
        run: |
          echo "## ⚠️ Warn rule – rateLimit missing (advisory only)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          kubectl logs -n ${{ steps.ork.outputs.namespace }} deployment/orkestra-runtime --tail=50 | grep -i "warn" || echo "No warn log found (may be acceptable)"
          echo '```' >> $GITHUB_STEP_SUMMARY

      # ----------------------------------------------------------------------
      # Cleanup test: delete CRs and verify removal (optional)
      # ----------------------------------------------------------------------
      - name: Delete test CRs
        run: |
          kubectl delete platform my-platform --ignore-not-found
          kubectl delete platform minimal-platform --ignore-not-found
          sleep 5

      - name: Show logs on failure
        if: failure()
        run: |
          echo "## 🔍 Debug logs (failure)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          kubectl logs -n ${{ steps.ork.outputs.namespace }} deployment/orkestra-runtime --tail=100 || true >> $GITHUB_STEP_SUMMARY
          kubectl logs -n ${{ steps.ork.outputs.namespace }} deployment/orkestra-cc --tail=100 || true >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Show Helm release info
        if: always()
        run: helm list -A