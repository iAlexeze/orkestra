name: Orkestra E2E Test (Beginner Pack 02)

on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ork-e2e

      - name: Setup operator, validate katalog and generate bundle
        id: ork
        uses: orkspace/orkestra-action@v0.0.1
        with:
          init: true
          pack: beginner
          example-subdir: 02-website-with-service
          validate: true
          generate-bundle: true

      - name: Apply CRD
        run: kubectl apply -f ${{ steps.ork.outputs.crd_path }}

      - name: Examine generated bundle
        run: cat ${{ steps.ork.outputs.bundle_file }}

      - name: Apply generated bundle (RBAC + ConfigMap)
        run: kubectl apply -f ${{ steps.ork.outputs.bundle_file }}

      - name: Install Orkestra Helm chart
        run: |
          helm repo add orkestra https://orkspace.github.io/orkestra
          helm install orkestra orkestra/orkestra \
            --namespace ${{ steps.ork.outputs.namespace }}

      # ----------------------------------------------------------------------
      # Step Summary: Initialize report
      # ----------------------------------------------------------------------
      - name: Initialize summary
        run: |
          echo "# Orkestra E2E Test Report" >> $GITHUB_STEP_SUMMARY
          echo "**Pack:** beginner / 02-website-with-service" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      # ----------------------------------------------------------------------
      # Before CR
      # ----------------------------------------------------------------------
      - name: Verify No Deployment and Service Before CR
        run: |
          echo "## 📌 Before applying Website CR" >> $GITHUB_STEP_SUMMARY
          echo "No deployment/service should exist." >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "Deployments:" >> $GITHUB_STEP_SUMMARY
          kubectl get deployment -n default || true >> $GITHUB_STEP_SUMMARY
          echo "Services:" >> $GITHUB_STEP_SUMMARY
          kubectl get service -n default || true >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Apply CR
        run: kubectl apply -f ${{ steps.ork.outputs.cr_path }}

      - name: Wait for operator to be ready
        run: |
          kubectl wait --for=condition=available deployment -l app.kubernetes.io/name=orkestra \
            -n orkestra-system --timeout=120s

      # ----------------------------------------------------------------------
      # After CR
      # ----------------------------------------------------------------------
      - name: Verify Deployment and Service created
        run: |
          kubectl wait --for=condition=available deployment --all -n default --timeout=60s

          echo "## ✅ After applying Website CR" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "Deployments:" >> $GITHUB_STEP_SUMMARY
          kubectl get deployment -n default >> $GITHUB_STEP_SUMMARY
          echo "Services:" >> $GITHUB_STEP_SUMMARY
          kubectl get service -n default >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Original logic
          DEPLOYMENTS=$(kubectl get deployment -n default -o name)
          if [[ -z "$DEPLOYMENTS" ]]; then
            echo "❌ No deployment found in default namespace" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "✅ Deployments found:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          kubectl get deployment -n default >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          SERVICES=$(kubectl get service -n default -o name)
          if [[ -z "$SERVICES" ]]; then
            echo "❌ No service found in default namespace" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Services found:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          kubectl get service -n default >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Delete Website CR
        run: |
          NAME=$(kubectl get websites -o jsonpath='{.items[0].metadata.name}')
          if [[ -n "$NAME" ]]; then
            kubectl delete website "$NAME"
            echo "Deleted website: $NAME"
          else
            echo "No website CR found to delete"
          fi

      # ----------------------------------------------------------------------
      # Cleanup verification
      # ----------------------------------------------------------------------
      - name: Verify cleanup (Deployment and Service removed)
        run: |
          echo "Waiting 10 seconds for operator to clean up..."
          sleep 10

          DEPLOYMENTS=$(kubectl get deployment -n default -o name 2>/dev/null | grep -v "kubernetes" || true)
          SERVICES=$(kubectl get service -n default -o name 2>/dev/null | grep -v "kubernetes" || true)

          echo "## 🧹 After deleting Website CR" >> $GITHUB_STEP_SUMMARY
          if [[ -z "$DEPLOYMENTS" ]] && [[ -z "$SERVICES" ]]; then
            echo "✅ Cleanup verified – no user deployments or services remain." >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "Deployments:" >> $GITHUB_STEP_SUMMARY
            kubectl get deployment -n default >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Services:" >> $GITHUB_STEP_SUMMARY
            kubectl get service -n default >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Cleanup failed – leftover resources:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            [[ -n "$DEPLOYMENTS" ]] && echo "Deployments: $DEPLOYMENTS" >> $GITHUB_STEP_SUMMARY
            [[ -n "$SERVICES" ]] && echo "Services: $SERVICES" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      # ----------------------------------------------------------------------
      # Failure logs
      # ----------------------------------------------------------------------
      - name: Show logs on failure
        if: failure()
        run: |
          echo "## 🔍 Debug logs (failure)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          kubectl logs -n orkestra-system deployment/orkestra-runtime --tail=100 || true >> $GITHUB_STEP_SUMMARY
          kubectl logs -n orkestra-system deployment/orkestra-cc --tail=100 || true >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Show Helm release info
        if: always()
        run: helm list -A