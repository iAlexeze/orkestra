name: Package Examples

on:
  workflow_call:
    inputs:
      github_repo:
        description: 'GitHub repository (owner/name) for the main repo'
        required: false
        type: string
        default: ${{ github.repository }}
      project_name:
        description: 'Human‑readable project name (used in summary)'
        required: false
        type: string
        default: 'Orkestra'

jobs:
  examples:
    name: Package Examples
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Package example packs
        run: |
          mkdir -p dist/examples
          TAG="${{ github.ref_name }}"

          # Beginner
          tar -czf "dist/examples_beginner_${TAG}.tar.gz" \
            -C examples/beginner .

          # Intermediate
          tar -czf "dist/examples_intermediate_${TAG}.tar.gz" \
            -C examples/intermediate .

          # Advanced
          tar -czf "dist/examples_advanced_${TAG}.tar.gz" \
            -C examples/advanced .

          # Use-cases
          tar -czf "dist/examples_use-cases_${TAG}.tar.gz" \
            -C examples/use-cases .

          # Security
          tar -czf "dist/examples_security_${TAG}.tar.gz" \
            -C examples/security .

          # Developer
          tar -czf "dist/examples_developer_${TAG}.tar.gz" \
            -C examples/developer .

          echo "📦 Example packs packaged"

      - name: Upload example packs
        uses: actions/upload-artifact@v7
        with:
          name: examples
          path: dist/examples_*.tar.gz
          retention-days: 1

      - name: Write examples summary
        run: |
          TAG="${{ github.ref_name }}"
          REPO="${{ inputs.github_repo }}"
          NAME="${{ inputs.project_name }}"
          echo "## 📦 Example Packs" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Pack | Description | Archive |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|-------------|---------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Beginner | Getting started with ${NAME} | \`examples_beginner_${TAG}.tar.gz\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Intermediate | Multi‑operator workflows | \`examples_intermediate_${TAG}.tar.gz\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Advanced | Custom resources & controllers | \`examples_advanced_${TAG}.tar.gz\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Use Cases | Real‑world scenarios | \`examples_use-cases_${TAG}.tar.gz\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Developer | Local to production in minutes | \`examples_developer_${TAG}.tar.gz\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Download from the release assets or run:**" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo "curl -LO https://github.com/${REPO}/releases/download/${TAG}/examples_beginner_${TAG}.tar.gz" >> "$GITHUB_STEP_SUMMARY"
          echo "tar -xzf examples_beginner_${TAG}.tar.gz" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"