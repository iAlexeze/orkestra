name: Release Helm Chart

on:
  workflow_call:
    inputs:
      image_tag:
        description: 'Container image tag (without v prefix)'
        required: true
        type: string
      repository:
        description: 'GitHub repository (owner/name) for image registry'
        required: false
        type: string
        default: ${{ github.repository }}
      ork:
        description: 'Shorthand for orkestra (used in chart name, repo, namespace)'
        required: false
        type: string
        default: 'orkestra'
      helm_repo_url:
        description: 'URL of the Helm repository (GitHub Pages)'
        required: false
        type: string
        default: 'https://orkspace.github.io/orkestra'
      helm_chart:
        description: 'Helm chart reference (repo/chart) – used in summary'
        required: false
        type: string
        default: ${{ github.repository }}

jobs:
  helm:
    name: Release Helm Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "${GPG_PRIVATE_KEY}" | gpg --batch --import
          FINGERPRINT=$(gpg --list-secret-keys --with-colons releases@${{ inputs.ork }}.io \
            | grep '^fpr' | head -1 | cut -d: -f10)
          echo "${FINGERPRINT}:6:" | gpg --import-ownertrust
          echo "GPG_FINGERPRINT=${FINGERPRINT}" >> "$GITHUB_ENV"
          echo "✅ GPG key imported: ${FINGERPRINT}"

          # Export the secret key to the legacy binary keyring format Helm requires.
          # Helm's signer reads --keyring as an OpenPGP secret keyring file, not the
          # modern GnuPG keybox. gpg --export-secret-keys produces the right format.
          gpg --batch --pinentry-mode loopback --passphrase "${GPG_PASSPHRASE}" \
            --export-secret-keys releases@${{ inputs.ork }}.io > /tmp/secring.gpg

          # Also export public key in binary format for helm verify
          gpg --export releases@${{ inputs.ork }}.io > /tmp/pubring.gpg

      - name: Update Chart metadata and values
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          yq eval ".version = \"${VERSION}\"" -i charts/${{ inputs.ork }}/Chart.yaml
          yq eval ".appVersion = \"${{ inputs.image_tag }}\"" -i charts/${{ inputs.ork }}/Chart.yaml
          yq eval ".runtime.image.tag = \"${{ inputs.image_tag }}\"" -i charts/${{ inputs.ork }}/values.yaml
          yq eval ".runtime.image.repository = \"ghcr.io/${{ inputs.repository }}\"" -i charts/${{ inputs.ork }}/values.yaml
          yq eval ".gateway.image.tag = \"${{ inputs.image_tag }}\"" -i charts/${{ inputs.ork }}/values.yaml
          yq eval ".gateway.image.repository = \"ghcr.io/${{ inputs.repository }}-gateway\"" -i charts/${{ inputs.ork }}/values.yaml
          yq eval ".controlCenter.image.tag = \"${{ inputs.image_tag }}\"" -i charts/${{ inputs.ork }}/values.yaml
          yq eval ".controlCenter.image.repository = \"ghcr.io/${{ inputs.repository }}-cc\"" -i charts/${{ inputs.ork }}/values.yaml

          # GPG_FINGERPRINT is now in the environment (exported from the import step above)
          yq eval ".annotations[\"artifacthub.io/signKey\"] = \"fingerprint: ${GPG_FINGERPRINT}\nurl: https://orkspace.github.io/orkestra/orkestra-public-key.asc\"" \
            -i charts/${{ inputs.ork }}/Chart.yaml

      - name: Package and sign Helm chart, push to gh-pages
        env:
          GH_TOKEN: ${{ secrets.ORK_PUBLISH_PAT }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -eux
          ORK="${{ inputs.ork }}"
          CHART_DIR="charts/${ORK}"
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          IMAGE_TAG="${{ inputs.image_tag }}"

          # Write passphrase to a temp file — helm --passphrase-file expects a path
          echo "${GPG_PASSPHRASE}" > /tmp/helm-passphrase

          # Package and sign. --keyring must point to the secret keyring (secring.gpg),
          # not the public keyring. This produces both .tgz and .tgz.prov.
          helm package "$CHART_DIR" \
            --version "$VERSION" --app-version "$IMAGE_TAG" \
            --sign --key "${GPG_FINGERPRINT}" \
            --keyring /tmp/secring.gpg \
            --passphrase-file /tmp/helm-passphrase \
            -d .cr-release-packages

          rm -f /tmp/helm-passphrase /tmp/secring.gpg

          # Verify locally before pushing
          helm verify ".cr-release-packages/${ORK}-${VERSION}.tgz" --keyring /tmp/pubring.gpg
          echo "✅ Signature verified"

          git clone --branch gh-pages "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/gh-pages

          cp ".cr-release-packages/${ORK}-${VERSION}.tgz" /tmp/gh-pages/
          cp ".cr-release-packages/${ORK}-${VERSION}.tgz.prov" /tmp/gh-pages/

          # Publish public key so users can run helm verify
          gpg --armor --export releases@${ORK}.io > /tmp/gh-pages/orkestra-public-key.asc

          # Sync README from chart source.
          # Inject shields.io version badges after the first heading line.
          cp "${CHART_DIR}/README.md" /tmp/gh-pages/README.md
          VERSION_BADGE="${VERSION//-/--}"
          IMAGE_TAG_BADGE="${IMAGE_TAG//-/--}"
          awk 'NR==1{print; print ""; print "![Chart Version](https://img.shields.io/badge/chart%20version-'"${VERSION_BADGE}"'-blue?style=flat-square) ![App Version](https://img.shields.io/badge/app%20version-'"${IMAGE_TAG_BADGE}"'-blue?style=flat-square)"; print ""; next}1' \
            /tmp/gh-pages/README.md > /tmp/README.tmp && mv /tmp/README.tmp /tmp/gh-pages/README.md

          # Copy values.yaml so users can inspect defaults from the gh-pages site
          cp "charts/${ORK}/values.yaml" /tmp/gh-pages/values.yaml

          cd /tmp/gh-pages
          if [[ -f index.yaml ]]; then
            helm repo index . --url "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}" --merge index.yaml
          else
            helm repo index . --url "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "*.tgz" "*.prov" index.yaml README.md values.yaml orkestra-public-key.asc
          git commit -m "Release ${ORK}-${VERSION}"
          git push origin gh-pages

      - name: Write summary
        run: |
          echo "### ⎈ Helm chart published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo "helm repo add ${{ inputs.ork }} ${{ inputs.helm_repo_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "helm repo update" >> "$GITHUB_STEP_SUMMARY"
          echo "helm upgrade --install ${{ inputs.ork }} ${{ inputs.helm_chart }} --namespace ${{ inputs.ork }}-system --create-namespace" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
