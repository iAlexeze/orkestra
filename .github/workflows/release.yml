name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  # ── Build binaries ─────────────────────────────────────────────────────────
  build:
    name: Build ${{ matrix.os }}_${{ matrix.arch }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            goarch: amd64
            goos: linux
          - os: linux
            arch: arm64
            goarch: arm64
            goos: linux
          - os: darwin
            arch: amd64
            goarch: amd64
            goos: darwin
          - os: darwin
            arch: arm64
            goarch: arm64
            goos: darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build runtime binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build \
            -trimpath \
            -ldflags="-s -w \
              -X github.com/orkspace/orkestra/pkg/version.Version=${{ github.ref_name }} \
              -X github.com/orkspace/orkestra/pkg/version.Commit=${{ github.sha }} \
              -X github.com/orkspace/orkestra/pkg/version.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o dist/ork \
            ./cmd/orkestra/
          echo "✅ Runtime built: dist/ork"

      - name: Build control center binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        working-directory: cmd/controlcenter
        run: |
          go build \
            -trimpath \
            -ldflags="-s -w \
              -X github.com/orkspace/orkestra-cc/version.Version=${{ github.ref_name }} \
              -X github.com/orkspace/orkestra-cc/version.Commit=${{ github.sha }} \
              -X github.com/orkspace/orkestra-cc/version.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o ../../dist/orkcc .
          echo "✅ Control Center built: dist/orkcc"

      - name: Package runtime tarball
        run: |
          ARCHIVE="ork_${{ matrix.os }}_${{ matrix.arch }}.tar.gz"
          tar -czf "dist/${ARCHIVE}" -C dist ork -C "${{ github.workspace }}" README.md LICENSE
          echo "✅ Archive: dist/${ARCHIVE}"

      - name: Package control center tarball
        run: |
          ARCHIVE="orkcc_${{ matrix.os }}_${{ matrix.arch }}.tar.gz"
          tar -czf "dist/${ARCHIVE}" -C dist orkcc -C "${{ github.workspace }}" README.md LICENSE
          echo "✅ Archive: dist/${ARCHIVE}"
      
      - name: Package example packs
        run: |
          mkdir -p dist/examples

          TAG="${{ github.ref_name }}"

          tar -czf "dist/examples_beginner_${TAG}.tar.gz"     -C examples beginner
          tar -czf "dist/examples_intermediate_${TAG}.tar.gz" -C examples intermediate
          tar -czf "dist/examples_advanced_${TAG}.tar.gz"     -C examples advanced
          tar -czf "dist/examples_use-cases_${TAG}.tar.gz"    -C examples use-cases

          echo "📦 Example packs packaged"


      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: ork_${{ matrix.os }}_${{ matrix.arch }}
          path: dist/ork_${{ matrix.os }}_${{ matrix.arch }}.tar.gz
          retention-days: 1

      - name: Upload control center artifact
        uses: actions/upload-artifact@v4
        with:
          name: orkcc_${{ matrix.os }}_${{ matrix.arch }}
          path: dist/orkcc_${{ matrix.os }}_${{ matrix.arch }}.tar.gz
          retention-days: 1

  # ── Build and push container image ─────────────────────────────────────────
  image:
    name: Build and Push Image
    runs-on: ubuntu-latest

    outputs:
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0
        id: setup-buildx
        with:
          driver-opts: |
            image=moby/buildkit:buildx-stable-1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for runtime
        id: meta-runtime
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/ialexeze/orkestra
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Extract metadata for control center
        id: meta-cc
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/ialexeze/orkestra-cc
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Cache compiled Linux binaries
        id: cache-binaries
        uses: actions/cache@v4
        with:
          path: |
            ork-amd64
            ork-arm64
            cmd/controlcenter/orkcc-amd64
            cmd/controlcenter/orkcc-arm64
          # Cache key based on go.sum and all Go source files
          key: linux-binaries-${{ hashFiles('go.sum', '**/*.go', 'cmd/**/*.go') }}

      - name: Build Linux binaries (if cache miss)
        if: steps.cache-binaries.outputs.cache-hit != 'true'
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o ork-amd64 ./cmd/orkestra
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o ork-arm64 ./cmd/orkestra

          cd ./cmd/controlcenter
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o orkcc-amd64 .
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o orkcc-arm64 .

      - name: Build and push runtime image
        id: push-runtime
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-runtime.outputs.tags }}
          labels: ${{ steps.meta-runtime.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ fromJSON(steps.meta-runtime.outputs.json).labels['org.opencontainers.image.created'] }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push control center image
        id: push-cc
        uses: docker/build-push-action@v5
        with:
          context: cmd/controlcenter
          file: cmd/controlcenter/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-cc.outputs.tags }}
          labels: ${{ steps.meta-cc.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ fromJSON(steps.meta-cc.outputs.json).labels['org.opencontainers.image.created'] }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Write image summary
        run: |
          echo "## 🐳 Container Images" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Component | Registry | Image |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Runtime | GHCR | \`ghcr.io/ialexeze/orkestra:${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Control Center | GHCR | \`ghcr.io/ialexeze/orkestra-cc:${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Platforms:** \`linux/amd64\`, \`linux/arm64\`" >> "$GITHUB_STEP_SUMMARY"

  # ── Helm chart release ─────────────────────────────────────────────────────
  helm:
    name: Release Helm Chart
    runs-on: ubuntu-latest
    needs: [build, image]
    if: ${{ !contains(github.ref_name, '-') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Update Chart metadata and values
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          
          # Sync Chart.yaml version fields
          yq eval ".version = \"${VERSION}\"" -i charts/orkestra/Chart.yaml
          yq eval ".appVersion = \"${TAG}\""  -i charts/orkestra/Chart.yaml
          
          # Update image tags in values.yaml
          yq eval ".runtime.image.tag = \"${TAG}\"" -i charts/orkestra/values.yaml
          yq eval ".controlCenter.image.tag = \"${TAG}\"" -i charts/orkestra/values.yaml

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          charts_dir: charts
          skip_existing: true

      - name: Write summary
        run: |
          echo "### ⎈ Helm chart published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo "helm repo add orkestra https://ialexeze.github.io/orkestra" >> "$GITHUB_STEP_SUMMARY"
          echo "helm repo update" >> "$GITHUB_STEP_SUMMARY"
          echo "helm install orkestra orkestra/orkestra --namespace orkestra-system --create-namespace" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ── Sign + Checksums + GitHub Release ──────────────────────────────────────
  release:
    name: Sign and Release
    runs-on: ubuntu-latest
    needs: [build, image]

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "${GPG_PRIVATE_KEY}" | gpg --batch --import
          FINGERPRINT=$(gpg --list-secret-keys --with-colons releases@orkestra.io \
            | grep '^fpr' \
            | head -1 \
            | cut -d: -f10)
          echo "${FINGERPRINT}:6:" | gpg --import-ownertrust
          echo "✅ GPG key imported: ${FINGERPRINT}"

      - name: Sign tarballs
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          cd dist
          for archive in ork_*.tar.gz orkcc_*.tar.gz; do
            gpg --batch --yes \
                --passphrase "${GPG_PASSPHRASE}" \
                --pinentry-mode loopback \
                --armor \
                --detach-sign \
                "${archive}"
            echo "✅ Signed: ${archive}"
          done

      - name: Export public key
        run: |
          gpg --armor --export releases@orkestra.io > dist/orkestra-public-key.asc
          echo "✅ Public key exported"

      - name: Generate checksums
        run: |
          cd dist
          sha256sum ork_*.tar.gz orkcc_*.tar.gz > checksums.txt
          echo "✅ Checksums generated"

      - name: Verify signatures
        run: |
          cd dist
          for archive in ork_*.tar.gz orkcc_*.tar.gz; do
            gpg --verify "${archive}.asc" "${archive}" \
              && echo "✅ Verified: ${archive}" \
              || { echo "❌ Failed: ${archive}"; exit 1; }
          done

      - name: Extract changelog
        run: |
          TAG="${GITHUB_REF_NAME}"
          if grep -q "## \[${TAG}\]" CHANGELOG.md 2>/dev/null; then
            awk "/## \[${TAG}\]/{found=1; next} /## \[v/{if(found) exit} found{print}" \
              CHANGELOG.md > release_notes.txt
          else
            echo "Release ${TAG}" > release_notes.txt
          fi

          cat >> release_notes.txt << EOF

          ### 📦 Installation

          #### CLI (Runtime + Control Center)

          \`\`\`bash
          # macOS
          brew tap ialexeze/tap && brew install ork orkcc

          # Linux
          curl -sSL https://raw.githubusercontent.com/ialexeze/orkestra/main/install.sh | bash
          \`\`\`

          #### Container Images

          \`\`\`bash
          # Runtime
          docker pull ghcr.io/ialexeze/orkestra:${TAG}

          # Control Center
          docker pull ghcr.io/ialexeze/orkestra-cc:${TAG}
          \`\`\`

          #### Helm

          \`\`\`bash
          helm repo add orkestra https://ialexeze.github.io/orkestra
          helm install orkestra orkestra/orkestra -n orkestra-system --create-namespace
          \`\`\`
          EOF

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ github.ref_name }}"
          body_path: release_notes.txt
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/ork_linux_amd64.tar.gz
            dist/ork_linux_amd64.tar.gz.asc
            dist/ork_linux_arm64.tar.gz
            dist/ork_linux_arm64.tar.gz.asc
            dist/ork_darwin_amd64.tar.gz
            dist/ork_darwin_amd64.tar.gz.asc
            dist/ork_darwin_arm64.tar.gz
            dist/ork_darwin_arm64.tar.gz.asc
            dist/orkcc_linux_amd64.tar.gz
            dist/orkcc_linux_amd64.tar.gz.asc
            dist/orkcc_linux_arm64.tar.gz
            dist/orkcc_linux_arm64.tar.gz.asc
            dist/orkcc_darwin_amd64.tar.gz
            dist/orkcc_darwin_amd64.tar.gz.asc
            dist/orkcc_darwin_arm64.tar.gz
            dist/orkcc_darwin_arm64.tar.gz.asc
            dist/checksums.txt
            dist/orkestra-public-key.asc

            # Examples
            dist/examples_beginner_${{ github.ref_name }}.tar.gz
            dist/examples_intermediate_${{ github.ref_name }}.tar.gz
            dist/examples_advanced_${{ github.ref_name }}.tar.gz
            dist/examples_use-cases_${{ github.ref_name }}.tar.gz
          fail_on_unmatched_files: true

  # ── Homebrew formulas update ───────────────────────────────────────────────
  homebrew:
    name: Update Homebrew Formulas
    runs-on: ubuntu-latest
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}

    steps:
      - name: Checkout tap
        uses: actions/checkout@v6.0.2
        with:
          repository: ialexeze/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Download checksums
        run: |
          TAG="${GITHUB_REF_NAME}"
          curl -sSfL \
            "https://github.com/orkspace/orkestra/releases/download/${TAG}/checksums.txt" \
            -o checksums.txt

      - name: Extract SHA256 values
        id: sha
        run: |
          # Runtime
          echo "ORK_DARWIN_AMD64=$(grep 'ork_darwin_amd64' checksums.txt | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "ORK_DARWIN_ARM64=$(grep 'ork_darwin_arm64' checksums.txt | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "ORK_LINUX_AMD64=$(grep  'ork_linux_amd64'  checksums.txt | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "ORK_LINUX_ARM64=$(grep  'ork_linux_arm64'  checksums.txt | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          
          # Control Center
          echo "CC_DARWIN_AMD64=$(grep 'orkcc_darwin_amd64' checksums.txt | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "CC_DARWIN_ARM64=$(grep 'orkcc_darwin_arm64' checksums.txt | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "CC_LINUX_AMD64=$(grep  'orkcc_linux_amd64'  checksums.txt | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "CC_LINUX_ARM64=$(grep  'orkcc_linux_arm64'  checksums.txt | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Update runtime formula
        env:
          TAG: ${{ github.ref_name }}
          DARWIN_AMD64: ${{ steps.sha.outputs.ORK_DARWIN_AMD64 }}
          DARWIN_ARM64: ${{ steps.sha.outputs.ORK_DARWIN_ARM64 }}
          LINUX_AMD64:  ${{ steps.sha.outputs.ORK_LINUX_AMD64 }}
          LINUX_ARM64:  ${{ steps.sha.outputs.ORK_LINUX_ARM64 }}
        run: |
          VERSION="${TAG#v}"
          cat > homebrew-tap/Formula/ork.rb << 'EOF'
          class Ork < Formula
            desc "Declarative Runtime for Kubernetes Operators"
            homepage "https://github.com/orkspace/orkestra"
            version "${VERSION}"
            license "Apache 2.0"

            on_macos do
              on_arm   do
                url    "https://github.com/orkspace/orkestra/releases/download/${TAG}/ork_darwin_arm64.tar.gz"
                sha256 "${DARWIN_ARM64}"
              end
              on_intel do
                url    "https://github.com/orkspace/orkestra/releases/download/${TAG}/ork_darwin_amd64.tar.gz"
                sha256 "${DARWIN_AMD64}"
              end
            end

            on_linux do
              on_arm   do
                url    "https://github.com/orkspace/orkestra/releases/download/${TAG}/ork_linux_arm64.tar.gz"
                sha256 "${LINUX_ARM64}"
              end
              on_intel do
                url    "https://github.com/orkspace/orkestra/releases/download/${TAG}/ork_linux_amd64.tar.gz"
                sha256 "${LINUX_AMD64}"
              end
            end

            def install
              bin.install "ork"
            end

            test do
              system "#{bin}/ork", "version"
            end
          end
          EOF
          
          # Replace variables
          sed -i "s/\${VERSION}/${VERSION}/g" homebrew-tap/Formula/ork.rb
          sed -i "s/\${TAG}/${TAG}/g" homebrew-tap/Formula/ork.rb
          sed -i "s/\${DARWIN_AMD64}/${DARWIN_AMD64}/g" homebrew-tap/Formula/ork.rb
          sed -i "s/\${DARWIN_ARM64}/${DARWIN_ARM64}/g" homebrew-tap/Formula/ork.rb
          sed -i "s/\${LINUX_AMD64}/${LINUX_AMD64}/g" homebrew-tap/Formula/ork.rb
          sed -i "s/\${LINUX_ARM64}/${LINUX_ARM64}/g" homebrew-tap/Formula/ork.rb

      - name: Update control center formula
        env:
          TAG: ${{ github.ref_name }}
          DARWIN_AMD64: ${{ steps.sha.outputs.CC_DARWIN_AMD64 }}
          DARWIN_ARM64: ${{ steps.sha.outputs.CC_DARWIN_ARM64 }}
          LINUX_AMD64:  ${{ steps.sha.outputs.CC_LINUX_AMD64 }}
          LINUX_ARM64:  ${{ steps.sha.outputs.CC_LINUX_ARM64 }}
        run: |
          VERSION="${TAG#v}"
          cat > homebrew-tap/Formula/orkcc.rb << 'EOF'
          class OrkCc < Formula
            desc "Web-based Control Center for Orkestra - visualize and manage your operators"
            homepage "https://github.com/orkspace/orkestra"
            version "${VERSION}"
            license "Apache 2.0"

            on_macos do
              on_arm   do
                url    "https://github.com/orkspace/orkestra/releases/download/${TAG}/orkcc_darwin_arm64.tar.gz"
                sha256 "${DARWIN_ARM64}"
              end
              on_intel do
                url    "https://github.com/orkspace/orkestra/releases/download/${TAG}/orkcc_darwin_amd64.tar.gz"
                sha256 "${DARWIN_AMD64}"
              end
            end

            on_linux do
              on_arm   do
                url    "https://github.com/orkspace/orkestra/releases/download/${TAG}/orkcc_linux_arm64.tar.gz"
                sha256 "${LINUX_ARM64}"
              end
              on_intel do
                url    "https://github.com/orkspace/orkestra/releases/download/${TAG}/orkcc_linux_amd64.tar.gz"
                sha256 "${LINUX_AMD64}"
              end
            end

            def install
              bin.install "orkcc"
            end

            test do
              system "#{bin}/orkcc", "--help"
            end
          end
          EOF
          
          # Replace variables
          sed -i "s/\${VERSION}/${VERSION}/g" homebrew-tap/Formula/orkcc.rb
          sed -i "s/\${TAG}/${TAG}/g" homebrew-tap/Formula/orkcc.rb
          sed -i "s/\${DARWIN_AMD64}/${DARWIN_AMD64}/g" homebrew-tap/Formula/orkcc.rb
          sed -i "s/\${DARWIN_ARM64}/${DARWIN_ARM64}/g" homebrew-tap/Formula/orkcc.rb
          sed -i "s/\${LINUX_AMD64}/${LINUX_AMD64}/g" homebrew-tap/Formula/orkcc.rb
          sed -i "s/\${LINUX_ARM64}/${LINUX_ARM64}/g" homebrew-tap/Formula/orkcc.rb

      - name: Commit and push
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/ork.rb Formula/orkcc.rb
          git commit -m "ork and orkcc ${GITHUB_REF_NAME}"
          git push

  # ── Final summary ──────────────────────────────────────────────────────────
  summary:
    name: Release Summary
    runs-on: ubuntu-latest
    needs: [build, image, release, helm, homebrew]
    if: always()

    steps:
      - name: Write summary
        run: |
          TAG="${GITHUB_REF_NAME}"

          echo "## Release ${TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Component | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|--------|" >> "$GITHUB_STEP_SUMMARY"

          icon() { [ "$1" = "success" ] && echo "✅" || ([ "$1" = "skipped" ] && echo "⏭️" || echo "❌"); }

          echo "| Runtime binaries | $(icon ${{ needs.build.result }}) ${{ needs.build.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Control Center binaries | $(icon ${{ needs.build.result }}) ${{ needs.build.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Container images | $(icon ${{ needs.image.result }}) ${{ needs.image.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| GPG signing + GitHub Release | $(icon ${{ needs.release.result }}) ${{ needs.release.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Helm chart | $(icon ${{ needs.helm.result }}) ${{ needs.helm.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Homebrew formulas | $(icon ${{ needs.homebrew.result }}) ${{ needs.homebrew.result }} |" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ needs.release.result }}" = "success" ] && [ "${{ needs.image.result }}" = "success" ]; then
            echo "### ✅ Release ${TAG} complete" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```bash' >> "$GITHUB_STEP_SUMMARY"
            echo "# Install CLI tools" >> "$GITHUB_STEP_SUMMARY"
            echo "brew tap ialexeze/tap && brew install ork" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "# Deploy with Helm (Runtime + Control Center)" >> "$GITHUB_STEP_SUMMARY"
            echo "helm repo add orkestra https://ialexeze.github.io/orkestra" >> "$GITHUB_STEP_SUMMARY"
            echo "helm install orkestra orkestra/orkestra -n orkestra-system --create-namespace" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "# Run Control Center separately" >> "$GITHUB_STEP_SUMMARY"
