# .github/workflows/validate-pr.yml
name: Validate Pull Request

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  validate-notes:
    name: Validate generated notes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run note generator
        run: make generate-notes

      - name: Check for uncommitted changes (catalog_generated.go)
        run: |
          if ! git diff --quiet pkg/note/catalog_generated.go; then
            echo "❌ pkg/note/catalog_generated.go is out of date."
            echo "Run 'make generate-notes' locally and commit the changes."
            exit 1
          else
            echo "✅ Note catalog is up-to-date."
          fi

  validate-code:
    name: Run static checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run go mod tidy
        run: |
          go mod tidy
          if ! git diff --quiet go.mod go.sum; then
            echo "❌ go.mod or go.sum is not tidy. Run 'go mod tidy' locally and commit."
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run gofmt check
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "❌ Some files are not formatted with gofmt. Run 'gofmt -w .' and commit."
            exit 1
          fi

      - name: Run unit tests (no cluster required)
        run: make test-unit

      # - name: Run coverage check (optional)
      #   run: make test-coverage-text