name: Orkestra E2E Test (Deletion Protection)

on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ork-e2e

      # ----------------------------------------------------------------------
      # Setup operator and generate bundle
      # ----------------------------------------------------------------------
      - name: Setup operator, validate katalog and generate bundle
        id: ork
        uses: orkspace/orkestra-action@v0.0.1
        with:
          init: true
          pack: security
          example-subdir: deletion-protection
          validate: true
          generate-bundle: true

      # ----------------------------------------------------------------------
      # Apply CRDs – both protected and unprotected
      # ----------------------------------------------------------------------
      - name: Apply protected CRDs
        run: |
          kubectl apply -f ${{ steps.ork.outputs.example_dir }}/crd-protected.yaml
          kubectl apply -f ${{ steps.ork.outputs.example_dir }}/crd-unprotected.yaml

      # ----------------------------------------------------------------------
      # Apply generated bundle (RBAC + ConfigMap)
      # ----------------------------------------------------------------------
      - name: Apply generated bundle
        run: kubectl apply -f ${{ steps.ork.outputs.bundle_file }}

      # ----------------------------------------------------------------------
      # Install Orkestra Helm chart
      # ----------------------------------------------------------------------
      - name: Install Orkestra Helm chart
        run: |
          helm repo add orkestra https://orkspace.github.io/orkestra
          helm install orkestra orkestra/orkestra \
            --namespace ${{ steps.ork.outputs.namespace }}

      # ----------------------------------------------------------------------
      # Step Summary: Initialize report
      # ----------------------------------------------------------------------
      - name: Initialize summary
        run: |
          echo "# Orkestra E2E Test Report – Deletion Protection" >> $GITHUB_STEP_SUMMARY
          echo "**Pack:** security / deletion-protection" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      # ----------------------------------------------------------------------
      # Verify that deletion protection blocks protected CRD deletion
      # ----------------------------------------------------------------------
      - name: Try to delete a protected CRD (should fail)
        id: delete_protected_crd
        continue-on-error: true
        run: |
          kubectl delete crd apps.security.orkestra.io 2>&1 | tee delete_crd.log
          if grep -q "denied the request" delete_crd.log; then
            echo "✅ Deletion of protected CRD blocked as expected"
            exit 0
          else
            echo "❌ Deletion of protected CRD was allowed – webhook may not be active"
            exit 1
          fi

      - name: Record protected CRD deletion attempt
        if: always()
        run: |
          echo "## 🛡️ Protected CRD deletion (blocked)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat delete_crd.log >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "No log found"
          echo '```' >> $GITHUB_STEP_SUMMARY

      # ----------------------------------------------------------------------
      # Delete the unprotected CRD (should succeed)
      # ----------------------------------------------------------------------
      - name: Delete unprotected CRD (should succeed)
        run: |
          kubectl delete crd logstreams.security.orkestra.io
          echo "✅ Unprotected CRD deleted successfully"

      - name: Record unprotected CRD deletion
        run: |
          echo "## ✅ Unprotected CRD deletion (allowed)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "logstreams.security.orkestra.io deleted" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      # ----------------------------------------------------------------------
      # Try to delete a protected Orkestra resource (namespace)
      # ----------------------------------------------------------------------
      - name: Try to delete Orkestra namespace (should fail)
        id: delete_namespace
        continue-on-error: true
        run: |
          kubectl delete namespace ${{ steps.ork.outputs.namespace }} 2>&1 | tee delete_ns.log
          if grep -q "denied the request" delete_ns.log; then
            echo "✅ Deletion of protected namespace blocked"
            exit 0
          else
            echo "❌ Deletion of protected namespace was allowed"
            exit 1
          fi

      - name: Record namespace deletion attempt
        if: always()
        run: |
          echo "## 🛡️ Protected Orkestra namespace deletion (blocked)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat delete_ns.log >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "No log found"
          echo '```' >> $GITHUB_STEP_SUMMARY

      # ----------------------------------------------------------------------
      # Optional: Webhook self-healing test
      # ----------------------------------------------------------------------
      - name: Delete webhook configuration manually
        run: |
          kubectl delete validatingwebhookconfiguration orkestra-deletion-protection
          sleep 5

      - name: Wait for webhook recreation
        run: |
          for i in {1..6}; do
            if kubectl get validatingwebhookconfiguration orkestra-deletion-protection &>/dev/null; then
              echo "Webhook recreated after $((i*5)) seconds"
              exit 0
            fi
            sleep 5
          done
          echo "Webhook not recreated within 30 seconds – check controller"
          exit 1

      - name: Record self-healing
        run: |
          echo "## 🔄 Webhook self‑healing" >> $GITHUB_STEP_SUMMARY
          echo "The `orkestra-deletion-protection` webhook configuration was automatically recreated after manual deletion." >> $GITHUB_STEP_SUMMARY

      # ----------------------------------------------------------------------
      # Test deletion of unprotected custom resource (not CRD)
      # ----------------------------------------------------------------------
      - name: Apply and delete unprotected custom resource
        run: |
          kubectl apply -f ${{ steps.ork.outputs.example_dir }}/cr-unprotected.yaml
          kubectl delete logstream my-logs
          echo "✅ Unprotected CR deletion succeeded"

      - name: Record unprotected CR deletion
        run: |
          echo "## ✅ Unprotected custom resource deletion (allowed)" >> $GITHUB_STEP_SUMMARY
          echo "The `LogStream` CR is not protected – deletion succeeded." >> $GITHUB_STEP_SUMMARY

      # ----------------------------------------------------------------------
      # Show logs on failure
      # ----------------------------------------------------------------------
      - name: Show logs on failure
        if: failure()
        run: |
          echo "## 🔍 Debug logs (failure)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          kubectl logs -n ${{ steps.ork.outputs.namespace }} deployment/orkestra-runtime --tail=100 || true >> $GITHUB_STEP_SUMMARY
          kubectl logs -n ${{ steps.ork.outputs.namespace }} deployment/orkestra-cc --tail=100 || true >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Show Helm release info
        if: always()
        run: helm list -A