# test/cr-bad-image.yaml
# Test case C: SHOULD BE REJECTED at admission time
#
# Expected with ENABLE_ADMISSION_WEBHOOK=true:
#   Error from server: admission webhook "validate.orkestra.konductor.io" denied the request:
#   [orkestra] validation failed: field "spec.image": image must be from the myorg registry
#   — use myorg/<n>:<tag> (got: "nginx:1.25")
#
# Expected without ENABLE_ADMISSION_WEBHOOK (reconcile-time only):
#   CR is created
#   kubectl describe website bad-image-site shows:
#     Warning  WebsiteValidationDenied  validation failed: field "spec.image": ...
#   Deployment is NOT created
apiVersion: demo.orkestra.io/v1alpha1
kind: Website
metadata:
  name: bad-image-site
  namespace: orkestra
  labels:
    team: platform
spec:
  image: nginx:1.25        # ← WRONG: not from myorg/ registry
  replicas: 2
  port: 8080
  enabled: true
