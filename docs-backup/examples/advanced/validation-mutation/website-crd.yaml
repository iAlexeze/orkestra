# test/website-crd.yaml
# Install this first: kubectl apply -f website-crd.yaml
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: websites.demo.orkestra.io
spec:
  group: demo.orkestra.io
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                image:
                  type: string
                replicas:
                  type: integer
                port:
                  type: integer
                logLevel:
                  type: string
                enabled:
                  type: boolean
  names:
    kind: Website
    plural: websites
    singular: website
  scope: Namespaced
