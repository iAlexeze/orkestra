apiVersion: orkestra.orkspace.io/v1
kind: E2E
metadata:
  name: orkestra-chart-e2e
  description: >
    custom.target: kubernetes — Orkestra Helm chart installed via setup.helm
    with gateway enabled. CRD, bundle, and fixture CR are applied before the
    chart so Orkestra reconciles on first boot. Asserts that all three
    deployments are ready, that conditional templates are not created when their
    flags are off (default values), and that the runtime reconciles the fixture
    CR producing a Deployment and Service.

spec:
  custom:
    target: kubernetes

  cluster:
    provider: kind
    name: ork-chart-e2e
    reuse: false

  setup:
    apply:
      - path: fixtures/crd.yaml
        wait:
          - kind: CustomResourceDefinition
            name: websites.demo.orkestra.io
            timeout: 30s
      - path: fixtures/orkestra-bundle.yaml
        wait:
          - kind: ConfigMap
            name: orkestra-katalog
            namespace: orkestra-system
            timeout: 30s
      - path: fixtures/cr.yaml
        wait:
          - kind: Website
            name: hello-website
            namespace: default
            timeout: 30s
    helm:
      - chart: ./
        release: orkestra
        namespace: orkestra-system
        createNamespace: true
        values:
          gateway.enabled: true
          runtime.image.tag: 5810f0e7
          gateway.image.tag: 5810f0e7
        wait:
          - kind: Deployment
            name: orkestra-runtime
            namespace: orkestra-system
            ready: true
            timeout: 120s
          - kind: Deployment
            name: orkestra-gateway
            namespace: orkestra-system
            ready: true
            timeout: 120s
          - kind: Deployment
            name: orkestra-cc
            namespace: orkestra-system
            ready: true
            timeout: 120s

  expect:
    - name: All three deployments are ready
      after: setup-complete
      timeout: 120s
      resources:
        - kind: Deployment
          name: orkestra-runtime
          namespace: orkestra-system
          ready: true
        - kind: Deployment
          name: orkestra-gateway
          namespace: orkestra-system
          ready: true
        - kind: Deployment
          name: orkestra-cc
          namespace: orkestra-system
          ready: true

    - name: Services created for runtime, gateway, and control center
      after: setup-complete
      timeout: 30s
      resources:
        - kind: Service
          name: orkestra-runtime
          namespace: orkestra-system
        - kind: Service
          name: orkestra-gateway
          namespace: orkestra-system
        - kind: Service
          name: orkestra-cc
          namespace: orkestra-system

    - name: PodDisruptionBudgets created (runtime, gateway, and cc — enabled by default)
      after: setup-complete
      timeout: 30s
      resources:
        - kind: PodDisruptionBudget
          name: orkestra-runtime
          namespace: orkestra-system
        - kind: PodDisruptionBudget
          name: orkestra-gateway
          namespace: orkestra-system
        - kind: PodDisruptionBudget
          name: orkestra-cc
          namespace: orkestra-system

    - name: Ingress not created (controlCenter.ingress.enabled defaults to false)
      after: setup-complete
      timeout: 30s
      resources:
        - kind: Ingress
          namespace: orkestra-system
          count: 0

    - name: NetworkPolicies not created (networkPolicy.enabled defaults to false)
      timeout: 30s
      resources:
        - kind: NetworkPolicy
          namespace: orkestra-system
          count: 0

    - name: Namespace protection webhook registered by gateway
      timeout: 60s
      resources:
        - kind: ValidatingWebhookConfiguration
          name: orkestra-namespace-protection

    - name: Runtime reconciles fixture CR — Deployment and Service created
      timeout: 90s
      resources:
        - kind: Deployment
          name: hello-website
          namespace: default
          ready: true
        - kind: Service
          name: hello-website-svc
          namespace: default

    - name: Fixture CR rendered with correct configuration
      timeout: 30s
      kubectl:
        get:
          - kind: Deployment
            name: hello-website
            namespace: default
            field: spec.replicas
            equals: "1"
          - kind: Service
            name: hello-website-svc
            namespace: default
            field: spec.ports[0].port
            equals: "80"

    - name: Runtime API responds with reconciled service
      timeout: 60s
      kubectl:
        port-forward:
          - namespace: orkestra-system
            leaderElection:
              lease: orkestra-konductor
            port: 8080
            path: /katalog/website/health
            jq: resourceCount
            equals: "1"

          - namespace: orkestra-system
            leaderElection:
              lease: orkestra-konductor
            port: 8080
            path: /katalog/website/health
            jq: healthy
            equals: "true"

          - namespace: orkestra-system
            leaderElection:
              lease: orkestra-konductor
            port: 8080
            path: /katalog/website
            outputContains: "Website CRD, GVK: demo.orkestra.io/v1alpha1, Kind=Website"

    - name: Delete CR
      timeout: 30s
      kubectl:
        delete:
          - file: fixtures/cr.yaml

    - name: Cleanup verified
      timeout: 30s
      resources:
        - kind: Deployment
          name: hello-website
          namespace: default
          count: 0
        - kind: Service
          name: hello-website-svc
          namespace: default
          count: 0
        - kind: Website
          name: hello-website
          namespace: default
          count: 0
