apiVersion: v2
name: orkestra
description: >-
  Declarative Operator Runtime with a built-in Security Gateway.
  Define operators in YAML, generate minimal RBAC, enforce deletion protection and
  namespace protection with admission webhooks, and observe everything in the
  Control Center. Runtime and Gateway deploy independently.
type: application
version: 1.0.0
appVersion: "v1.0.0"

keywords:
  - orkestra
  - operator
  - kubernetes
  - crd
  - declarative
  - controller
  - gateway
  - webhook
  - admission
  - security
  - deletion-protection
  - controlcenter
  - dashboard
  - observability

home: https://github.com/orkspace/orkestra
sources:
  - https://github.com/orkspace/orkestra

maintainers:
  - name: Orkspace
    email: releases@orkspace.io
    url: https://github.com/orkspace/orkestra

icon: https://raw.githubusercontent.com/orkspace/orkestra/main/documentation/assets/logo.png

annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/operator: "true"
  artifacthub.io/operatorCapabilities: Deep Insights
  artifacthub.io/images: |
    - name: runtime
      image: ghcr.io/orkspace/orkestra
    - name: gateway
      image: ghcr.io/orkspace/orkestra-gateway
    - name: control-center
      image: ghcr.io/orkspace/orkestra-cc
  artifacthub.io/links: |
    - name: Documentation
      url: https://docs.orkestra.sh
    - name: Why Orkestra?
      url: https://docs.orkestra.sh/blog/why-orkestra
    - name: Control Center Dashboard
      url: https://cc.orkestra.sh
    - name: Orkestra Registry
      url: https://docs.orkestra.sh/docs/reference/orkestra-registry
  artifacthub.io/screenshots: |
    - title: Orkestra Control Center
      url: https://raw.githubusercontent.com/orkspace/orkestra/main/documentation/assets/controlcenter/control-center-landing.png
    - title: CRD Health View
      url: https://raw.githubusercontent.com/orkspace/orkestra/main/documentation/assets/controlcenter/control-panel-website.png
    - title: Metrics Overview
      url: https://raw.githubusercontent.com/orkspace/orkestra/main/documentation/assets/controlcenter/pv-watcher-workers.png
  artifacthub.io/crds: |
    - kind: Katalog
      version: v1
      name: katalogs.orkestra.orkspace.io
      displayName: Katalog
      description: Declarative operator definition for one or more CRDs
    - kind: Komposer
      version: v1
      name: komposers.orkestra.orkspace.io
      displayName: Komposer
      description: Compose multiple Katalogs from different sources
    - kind: Motif
      version: v1
      name: motifs.orkestra.orkspace.io
      displayName: Motif
      description: A parameterized set of resource declarations. Write once, import from any Katalog.
    - kind: E2E
      version: v1
      name: e2es.orkestra.orkspace.io
      displayName: E2E
      description: Declarative end-to-end testing for Kubernetes operators
  artifacthub.io/changes: |
    - kind: added
      description: "Gateway: standalone admission webhooks, deletion protection, namespace protection, TLS cert lifecycle"
    - kind: added
      description: "Runtime/Gateway split — each deploys independently with its own build tag and image"
    - kind: added
      description: "Configurable cert rotation via security.certManager (autoRotate, rotationThreshold, validFor)"
    - kind: added
      description: "ork run discovers katalog.yaml automatically — no -f flag required"
    - kind: changed
      description: "gateway.endpoint replaces security.gatewayEndpoint (top-level gateway: block)"
    - kind: changed
      description: "ORK_* env prefix replaces ORKESTRA_*"
