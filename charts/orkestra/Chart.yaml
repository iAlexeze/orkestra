apiVersion: v2
name: orkestra
description: >-
  Declarative Operator Runtime with a built-in Security Gateway.
  Define operators in YAML, generate minimal RBAC, enforce deletion protection and
  namespace protection with admission webhooks, and observe everything in the
  Control Center. Runtime and Gateway deploy independently.
type: application
version: 1.7.8
appVersion: "0.7.8"

keywords:
  - orkestra
  - operator
  - kubernetes
  - crd
  - declarative
  - controller
  - gateway
  - webhook
  - admission
  - security
  - deletion-protection
  - controlcenter
  - dashboard
  - observability

home: https://github.com/orkspace/orkestra
sources:
  - https://github.com/orkspace/orkestra

maintainers:
  - name: Orkspace
    email: releases@orkspace.io
    url: https://github.com/orkspace/orkestra

icon: https://raw.githubusercontent.com/orkspace/orkestra/main/documentation/assets/logo.png

annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/operator: "true"
  artifacthub.io/operatorCapabilities: Deep Insights
  artifacthub.io/images: |
    - name: runtime
      image: ghcr.io/orkspace/orkestra
    - name: gateway
      image: ghcr.io/orkspace/orkestra-gateway
    - name: control-center
      image: ghcr.io/orkspace/orkestra-cc
  artifacthub.io/links: |
    - name: Documentation
      url: https://orkestra.sh
    - name: Why Orkestra?
      url: https://orkestra.sh/blog/why-orkestra
    - name: Control Center Dashboard
      url: https://cc.orkestra.sh
    - name: Orkestra Registry
      url: https://orkestra.sh/docs/reference/orkestra-registry
  artifacthub.io/screenshots: |
    - title: Orkestra Control Center
      url: https://raw.githubusercontent.com/orkspace/orkestra/main/documentation/assets/controlcenter/control-center-landing.png
    - title: CRD Health View
      url: https://raw.githubusercontent.com/orkspace/orkestra/main/documentation/assets/controlcenter/control-panel-website.png
    - title: Metrics Overview
      url: https://raw.githubusercontent.com/orkspace/orkestra/main/documentation/assets/controlcenter/pv-watcher-workers.png
  artifacthub.io/changes: |
    - kind: added
      description: "NetworkPolicy, ResourceQuota, LimitRange, ClusterRole, ClusterRoleBinding as first-class resource types"
    - kind: added
      description: "networkpolicy profiles: deny-all, deny-all-ingress, deny-all-egress, allow-same-namespace, allow-dns-egress"
    - kind: added
      description: "resourcequota profiles: small, medium, large, xlarge"
    - kind: added
      description: "gateway PodDisruptionBudget (enabled by default)"
    - kind: added
      description: "ork e2e: per-entry wait on setup.apply and setup.helm entries"
    - kind: added
      description: "ork e2e: setup-complete lifecycle event — assert infrastructure before any CR is applied"
    - kind: fixed
      description: "ork simulate: cross-namespace copy resources auto-skipped with an explanatory note instead of erroring"
    - kind: fixed
      description: "namespace owned by CR now deleted when CR is removed"
