{{- if and .Values.runtime.enabled .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "orkestra.fullname" . }}-runtime
  labels:
    {{- include "orkestra.labels" . | nindent 4 }}
    component: runtime
rules:
  # ────────────────────────────────────────────────────────────────────────────
  #  Orkestra Runtime RBAC
  #
  #  Orkestra dynamically generates RBAC for your operators based on the Katalog.
  #  The Helm chart should NOT ship static RBAC for workloads.
  #
  #  The only permissions Orkestra itself needs are:
  #    • create ClusterRoles
  #    • create RoleBindings
  #
  #  To preview the RBAC Orkestra will generate for your workload:
  #
  #        ork generate rbac -k my-katalog.yaml
  #
  #  If you enable cleanupOnShutdown, Orkestra will also delete the RBAC it
  #  created — in that case, add "delete" to the verbs below.
  # ────────────────────────────────────────────────────────────────────────────

  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings", "roles", "rolebindings"]
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      # - delete   # ← uncomment ONLY if cleanupOnShutdown=true
{{- end }}

  # ────────────────────────────────────────────────────────────────────────────
  #  Managing RBAC Yourself (Optional)
  #
  #  If you'd rather manage RBAC manually instead of letting Orkestra generate it:
  #
  #    1. Disable Orkestra's RBAC generation:
  #         rbac:
  #           enable: false
  #
  #    2. Generate the RBAC manifest for your workload:
  #
  #         ork generate rbac -k my-katalog.yaml -o orkestra-rbac.yaml
  #
  #       (You can also use komposer.yaml or any merged Katalog.)
  #
  #    3. Apply the generated RBAC to your cluster:
  #
  #         kubectl apply -f orkestra-rbac.yaml
  #
  #    4. Start Orkestra normally:
  #
  #         ork run -k my-katalog.yaml
  #
  #  This gives you full control over RBAC while still using Orkestra’s
  #  declarative operator runtime.
  # ────────────────────────────────────────────────────────────────────────────
