{{- if and .Values.runtime.enabled .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "orkestra.fullname" . }}-runtime
  labels:
    {{- include "orkestra.labels" . | nindent 4 }}
    component: runtime
rules:
  # ── CRD discovery ──────────────────────────────────────────────────────────
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]

  # ── Informer — watch arbitrary CRDs ───────────────────────────────────────
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]

  # ── Finalizer management ──────────────────────────────────────────────────
  - apiGroups: ["*"]
    resources: ["*/finalizers"]
    verbs: ["update", "patch"]

  # ── Resource management (Deployments, Services, etc.) ─────────────────────
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  - apiGroups: [""]
    resources: ["services", "configmaps", "secrets", "serviceaccounts", "pods", "events"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # ── Leader election ────────────────────────────────────────────────────────
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # ── Webhook configuration (if admission webhooks enabled) ─────────────────
  {{- if .Values.runtime.webhooks.admission }}
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingwebhookconfigurations", "mutatingwebhookconfigurations"]
    verbs: ["get", "create", "update", "patch", "delete"]
  {{- end }}
{{- end }}