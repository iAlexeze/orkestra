{{- if and .Values.crdConversion.enabled (not .Values.crdConversion.existingSecret) }}
{{- fail "crdConversion.existingSecret must be set when crdConversion.enabled=true" }}
{{- end }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "orkestra.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orkestra.labels" . | nindent 4 }}
  {{- with .Values.podAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "orkestra.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "orkestra.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "orkestra.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}

      containers:
        - name: orkestra
          image: {{ include "orkestra.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}

          args:
            - run
            - --katalog
            - {{ .Values.katalog.mountPath }}/{{ .Values.katalog.configMapKey }}

          env:
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: HEALTH_PORT
              value: {{ .Values.config.healthPort | quote }}
            - name: DEFAULT_WORKERS
              value: {{ .Values.config.defaultWorkers | quote }}
            - name: DEFAULT_RESYNC
              value: {{ .Values.config.defaultResync | quote }}
            - name: MAX_QUEUE_DEPTH
              value: {{ .Values.config.maxQueueDepth | quote }}
            - name: ORK_ENV
              value: {{ .Values.config.environment | quote }}
            - name: DEGRADE_THRESHOLD
              value: {{ .Values.config.degradeThreshold | quote }}
            {{- if .Values.config.watchNamespace }}
            - name: NAMESPACE
              value: {{ .Values.config.watchNamespace | quote }}
            {{- end }}
            {{- if .Values.leaderElection.enabled }}
            - name: LEADER_ELECTION
              value: "true"
            - name: LEADER_ELECTION_NAMESPACE
              value: {{ include "orkestra.leaderElectionNamespace" . | quote }}
            - name: LEASE_DURATION
              value: {{ .Values.leaderElection.leaseDuration | quote }}
            - name: RENEW_DEADLINE
              value: {{ .Values.leaderElection.renewDeadline | quote }}
            - name: RETRY_PERIOD
              value: {{ .Values.leaderElection.retryPeriod | quote }}
            - name: SRV_READ_TIMEOUT
              value: {{ .Values.config.healthServerReadTimeout | quote }}
            - name: SRV_WRITE_TIMEOUT
              value: {{ .Values.config.healthServerWriteTimeout | quote }}
            {{- if .Values.crdConversion.enabled }}
            - name: ENABLE_CONVERSION
              value: "true"
            - name: TLS_CERT_FILE
              value: /tls/{{ .Values.crdConversion.certKey }}
            - name: TLS_KEY_FILE
              value: /tls/{{ .Values.crdConversion.keyKey }}
            {{- end }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}

          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          ports:
            - name: health
              containerPort: {{ .Values.config.healthPort }}
              protocol: TCP

          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}

          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          volumeMounts:
          {{- if .Values.crdConversion.enabled }}
            - name: ork-crd-conversion-tls
              mountPath: /tls
              readOnly: true
            {{- end }}
            - name: katalog
              mountPath: {{ .Values.katalog.mountPath }}
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}

      volumes:
      {{- if .Values.crdConversion.enabled }}
        - name: ork-crd-conversion-tls
          secret:
            secretName: {{ required "crdConversion.existingSecret is required when crdConversion.enabled=true" .Values.crdConversion.existingSecret }}
        {{- end }}
        - name: katalog
          configMap:
            name: {{ include "orkestra.katalogConfigMapName" . }}
        # /tmp is writable even with readOnlyRootFilesystem: true
        - name: tmp
          emptyDir: {}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
