# Runtime Horizontal Pod Autoscaler
{{- if .Values.runtime.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "orkestra.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orkestra.labels" . | nindent 4 }}
    app.kubernetes.io/component: runtime
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "orkestra.fullname" . }}
  minReplicas: {{ .Values.runtime.hpa.minReplicas }}
  maxReplicas: {{ .Values.runtime.hpa.maxReplicas }}
  metrics:
    {{- if .Values.runtime.hpa.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.runtime.hpa.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if .Values.runtime.hpa.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.runtime.hpa.targetMemoryUtilizationPercentage }}
    {{- end }}
{{- end }}

