# Runtime ingress policy
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "orkestra.fullname" . }}-runtime
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orkestra.labels" . | nindent 4 }}
    app.kubernetes.io/component: runtime
spec:
  podSelector:
    matchLabels:
      {{- include "orkestra.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: runtime
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: {{ .Values.runtime.server.port }}
          protocol: TCP
      {{- if .Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
      {{- end }}
  egress:
    # Allow all egress — Orkestra must reach the Kubernetes API server
    # and any remote Katalog sources (URLs, Helm repos)
    - {}
{{- end }}
---
# Control Center ingress policy
{{- if and .Values.networkPolicy.enabled .Values.controlCenter.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "orkestra.fullname" . }}-cc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orkestra.labels" . | nindent 4 }}
    app.kubernetes.io/component: controlcenter
spec:
  podSelector:
    matchLabels:
      {{- include "orkestra.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: controlcenter
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: {{ .Values.controlCenter.config.port }}
          protocol: TCP
      {{- if .Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
      {{- end }}
{{- end }}