{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "orkestra.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orkestra.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "orkestra.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow health, metrics, and Katalog API port
    - ports:
        - port: {{ .Values.config.healthPort }}
          protocol: TCP
      {{- if .Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
      {{- end }}
  egress:
    # Allow all egress — Orkestra must reach the Kubernetes API server
    # and any remote Katalog sources (URLs, Helm repos)
    - {}
{{- end }}
