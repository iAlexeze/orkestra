{{- if .Values.runtime.enabled }}

apiVersion: v1
kind: Service
metadata:
  name: {{ include "orkestra.fullname" . }}-runtime
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orkestra.labels" . | nindent 4 }}
    component: runtime
  {{- with .Values.runtime.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.runtime.service.type }}
  selector:
    {{- include "orkestra.selectorLabels" . | nindent 4 }}
    component: runtime
  ports:
    - name: health
      port: {{ .Values.runtime.service.port }}
      targetPort: health
      protocol: TCP

{{- end }}