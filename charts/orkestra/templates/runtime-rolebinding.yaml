{{- if and .Values.runtime.enabled .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "orkestra.fullname" . }}-runtime
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orkestra.labels" . | nindent 4 }}
    component: runtime
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "orkestra.fullname" . }}-runtime
subjects:
  - kind: ServiceAccount
    name: {{ include "orkestra.runtimeServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}