{{- if and .Values.controlCenter.enabled .Values.controlCenter.ingress.enabled }}

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "orkestra.fullname" . }}-cc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orkestra.labels" . | nindent 4 }}
    app.kubernetes.io/component: controlcenter
  {{- with .Values.controlCenter.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.controlCenter.ingress.className }}
  ingressClassName: {{ .Values.controlCenter.ingress.className }}
  {{- end }}
  {{- if .Values.controlCenter.ingress.tls }}
  tls:
    {{- toYaml .Values.controlCenter.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.controlCenter.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "orkestra.fullname" $ }}-cc
                port:
                  number: {{ $.Values.controlCenter.service.port }}
          {{- end }}
    {{- end }}

{{- end }}