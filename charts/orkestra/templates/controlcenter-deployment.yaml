{{- if .Values.controlCenter.enabled }}

{{- $orkestraURLs := .Values.controlCenter.config.orkestraURLs }}
{{- $urlString := "" }}

{{- if or (not $orkestraURLs) (eq (len $orkestraURLs) 0) }}
  {{- if .Values.controlCenter.config.orkestraURLs }}
    {{- $orkestraURLs = list .Values.controlCenter.config.orkestraURLs }}
  {{- else }}
    {{- $orkestraURLs = list (printf "http://%s-runtime:8080" (include "orkestra.fullname" .)) }}
  {{- end }}
{{- end }}

{{- $urlString = join "," $orkestraURLs }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "orkestra.fullname" . }}-cc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orkestra.labels" . | nindent 4 }}
    app.kubernetes.io/component: controlcenter
    orkestra.orkspace.io/komponent: control-center
spec:
  replicas: {{ .Values.controlCenter.replicaCount }}
  selector:
    matchLabels:
      {{- include "orkestra.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: controlcenter
  template:
    metadata:
      labels:
        {{- include "orkestra.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: controlcenter
        {{- with .Values.controlCenter.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.controlCenter.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.controlCenter.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ .Values.controlCenter.serviceAccount | default "orkestra-cc" }}
      securityContext:
        {{- toYaml .Values.controlCenter.podSecurityContext | nindent 8 }}

      containers:
        - name: controlcenter
          image: {{ include "orkestra.ccImage" . }}
          imagePullPolicy: {{ .Values.controlCenter.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.controlCenter.securityContext | nindent 12 }}

          args:
            - -u
            - {{ $urlString | quote }}
            - -p
            - {{ .Values.controlCenter.config.port | default 8081 | quote }}
            - --log-level
            - {{ .Values.controlCenter.config.logLevel | default "info" | quote }}
            - --refresh
            - {{ .Values.controlCenter.config.refreshInterval | default "10s" | quote }}

          env:
            - name: LOG_LEVEL
              value: {{ .Values.controlCenter.config.logLevel | default "info" | quote }}
            {{- if .Values.controlCenter.gatewayToken.secretRef.name }}
            - name: GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.controlCenter.gatewayToken.secretRef.name | quote }}
                  key: {{ .Values.controlCenter.gatewayToken.secretRef.key | default "token" | quote }}
            {{- end }}
            {{- with .Values.controlCenter.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}

          {{- with .Values.controlCenter.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          ports:
            - name: http
              containerPort: {{ .Values.controlCenter.config.port | default 8081 }}
              protocol: TCP

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.controlCenter.livenessProbe.initialDelaySeconds | default 10 }}
            periodSeconds: {{ .Values.controlCenter.livenessProbe.periodSeconds | default 10 }}
            failureThreshold: {{ .Values.controlCenter.livenessProbe.failureThreshold | default 3 }}
            timeoutSeconds: {{ .Values.controlCenter.livenessProbe.timeoutSeconds | default 1 }}

          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: {{ .Values.controlCenter.readinessProbe.initialDelaySeconds | default 5 }}
            periodSeconds: {{ .Values.controlCenter.readinessProbe.periodSeconds | default 5 }}
            failureThreshold: {{ .Values.controlCenter.readinessProbe.failureThreshold | default 3 }}
            timeoutSeconds: {{ .Values.controlCenter.readinessProbe.timeoutSeconds | default 1 }}

          resources:
            {{- toYaml .Values.controlCenter.resources | nindent 12 }}

          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- with .Values.controlCenter.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}

      volumes:
        - name: tmp
          emptyDir: {}
        {{- with .Values.controlCenter.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}

      {{- with .Values.controlCenter.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.controlCenter.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.controlCenter.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.controlCenter.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}

{{- end }}
