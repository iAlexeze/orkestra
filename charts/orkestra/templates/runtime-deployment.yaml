{{- if .Values.runtime.enabled }}

{{- $webhooks := .Values.runtime.webhooks }}
{{- $tlsEnabled := and $webhooks.enabled (or $webhooks.admission $webhooks.conversion) }}

{{- if and $tlsEnabled (not $webhooks.existingSecret) }}
{{- fail "runtime.webhooks.existingSecret required when webhooks.enabled=true and admission or conversion is true" }}
{{- end }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "orkestra.fullname" . }}-runtime
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orkestra.labels" . | nindent 4 }}
    app.kubernetes.io/component: runtime
spec:
  replicas: {{ .Values.runtime.replicaCount }}
  selector:
    matchLabels:
      {{- include "orkestra.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: runtime
  template:
    metadata:
      labels:
        {{- include "orkestra.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: runtime
        {{- with .Values.runtime.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.runtime.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.runtime.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ .Values.runtime.serviceAccount | default "orkestra" }}
      securityContext:
        {{- toYaml .Values.runtime.podSecurityContext | nindent 8 }}

      containers:
        - name: orkestra
          image: {{ include "orkestra.runtimeImage" . }}
          imagePullPolicy: {{ .Values.runtime.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.runtime.securityContext | nindent 12 }}

          args:
            - run
            - --file
            - {{ .Values.runtime.katalog.mountPath }}/{{ .Values.runtime.katalog.configMapKey }}

          env:
            - name: LOG_LEVEL
              value: {{ .Values.runtime.config.logLevel | quote }}
            - name: ORKESTRA_PORT
              value: {{ .Values.runtime.server.httpPort | quote }}
            - name: DEFAULT_WORKERS
              value: {{ .Values.runtime.config.defaultWorkers | quote }}
            - name: DEFAULT_RESYNC
              value: {{ .Values.runtime.config.defaultResync | quote }}
            - name: MAX_QUEUE_DEPTH
              value: {{ .Values.runtime.config.maxQueueDepth | quote }}
            - name: ORKESTRA_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: ORKESTRA_ENV
              value: {{ .Values.runtime.config.environment | quote }}
            - name: DEGRADE_THRESHOLD
              value: {{ .Values.runtime.config.degradeThreshold | quote }}
            - name: ORKESTRA_REGISTRY
              value: {{ .Values.runtime.registry.url | quote }}
            {{- if .Values.runtime.leaderElection.enabled }}
            - name: LEADER_ELECTION
              value: "true"
            - name: LEASE_DURATION
              value: {{ .Values.runtime.leaderElection.leaseDuration | quote }}
            - name: RENEW_DEADLINE
              value: {{ .Values.runtime.leaderElection.renewDeadline | quote }}
            - name: RETRY_PERIOD
              value: {{ .Values.runtime.leaderElection.retryPeriod | quote }}
            - name: SRV_READ_TIMEOUT
              value: {{ .Values.runtime.server.readTimeout | quote }}
            - name: SRV_WRITE_TIMEOUT
              value: {{ .Values.runtime.server.writeTimeout | quote }}
            {{- end }}
            {{- if $webhooks.admission }}
            - name: ENABLE_ADMISSION_WEBHOOK
              value: "true"
            {{- end }}
            {{- if $webhooks.conversion }}
            - name: ENABLE_CONVERSION
              value: "true"
            {{- end }}
            {{- if $tlsEnabled }}
            - name: TLS_CERT_FILE
              value: /tls/{{ $webhooks.certKey }}
            - name: TLS_KEY_FILE
              value: /tls/{{ $webhooks.keyKey }}
            {{- end }}
            {{- with .Values.runtime.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}

          {{- with .Values.runtime.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          ports:
            - name: http
              containerPort: {{ .Values.runtime.server.httpPort }}
              protocol: TCP
            - name: https
              containerPort: {{ .Values.runtime.server.httpsPort }}
              protocol: TCP

          startupProbe:
            httpGet:
              path: /startup
              port: http
            initialDelaySeconds: {{ .Values.runtime.startupProbe.initialDelaySeconds | default 10 }}
            periodSeconds: {{ .Values.runtime.startupProbe.periodSeconds | default 10 }}
            failureThreshold: {{ .Values.runtime.startupProbe.failureThreshold | default 3 }}
            timeoutSeconds: {{ .Values.runtime.startupProbe.timeoutSeconds | default 1 }}

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.runtime.livenessProbe.initialDelaySeconds | default 10 }}
            periodSeconds: {{ .Values.runtime.livenessProbe.periodSeconds | default 10 }}
            failureThreshold: {{ .Values.runtime.livenessProbe.failureThreshold | default 3 }}
            timeoutSeconds: {{ .Values.runtime.livenessProbe.timeoutSeconds | default 1 }}

          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: {{ .Values.runtime.readinessProbe.initialDelaySeconds | default 5 }}
            periodSeconds: {{ .Values.runtime.readinessProbe.periodSeconds | default 5 }}
            failureThreshold: {{ .Values.runtime.readinessProbe.failureThreshold | default 3 }}
            timeoutSeconds: {{ .Values.runtime.readinessProbe.timeoutSeconds | default 1 }}

          resources:
            {{- toYaml .Values.runtime.resources | nindent 12 }}

          volumeMounts:
            {{- if $tlsEnabled }}
            - name: orkestra-tls
              mountPath: /tls
              readOnly: true
            {{- end }}
            - name: katalog
              mountPath: {{ .Values.runtime.katalog.mountPath }}
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- with .Values.runtime.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}

      volumes:
        {{- if $tlsEnabled }}
        - name: orkestra-tls
          secret:
            secretName: {{ $webhooks.existingSecret }}
        {{- end }}
        - name: katalog
          configMap:
            name: {{ include "orkestra.katalogConfigMapName" . }}
        - name: tmp
          emptyDir: {}
        {{- with .Values.runtime.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}

      {{- with .Values.runtime.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.runtime.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.runtime.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.runtime.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}

{{- end }}
