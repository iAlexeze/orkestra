apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: hello-website
  version: 0.1.0
  description: Fixture katalog for chart e2e — one CRD, one Deployment, one Service.

security:
  namespaceProtection:
    enabled: true
    cleanupOnShutdown: true

gateway:
  enabled: true

spec:
  crds:
    website:
      apiTypes:
          group: demo.orkestra.io
          version: v1alpha1
          kind: Website
          plural: websites
      allowedNamespaces:
        - default

      operatorBox:
        status:
          fields:
            - path: phase
              value: "Running"

        onCreate:
          deployments:
            - name: "{{ .metadata.name }}"
              image: "{{ .spec.image }}"
              replicas: "{{ .spec.replicas }}"
              port: "{{ .spec.port }}"
              reconcile: true

          services:
            - name: "{{ .metadata.name }}-svc"
              port: "80"
              targetPort: "{{ .spec.port }}"
              reconcile: true
