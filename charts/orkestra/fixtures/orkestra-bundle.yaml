---
apiVersion: v1
data:
  katalog.yaml: |
    apiVersion: orkestra.orkspace.io/v1
    kind: Katalog
    metadata:
        name: hello-website
        description: Fixture katalog for chart e2e — one CRD, one Deployment, one Service.
        version: 0.1.0
    spec:
        crds:
            website:
                katalogName: hello-website
                katalogNamespace: default
                katalogDescription: Fixture katalog for chart e2e — one CRD, one Deployment, one Service.
                katalogVersion: 0.1.0
                description: 'Website CRD, GVK: demo.orkestra.io/v1alpha1, Kind=Website'
                mode: dynamic
                apiTypes:
                    group: demo.orkestra.io
                    version: v1alpha1
                    kind: Website
                    plural: websites
                    apiPath: /apis
                workers: 3
                resync: 15s
                operatorBox:
                    onCreate:
                        deployments:
                            - name: '{{ .metadata.name }}'
                              image: '{{ .spec.image }}'
                              replicas: '{{ .spec.replicas }}'
                              port: '{{ .spec.port }}'
                              reconcile: true
                        services:
                            - name: '{{ .metadata.name }}-svc'
                              port: "80"
                              targetPort: '{{ .spec.port }}'
                              reconcile: true
                    status:
                        fields:
                            - path: phase
                              value: Running
                queue:
                    maxDepth: 100
                    failureThreshold: 100
                allowedNamespaces:
                    - default
                warnings: []
    security:
        namespaceProtection:
            enabled: true
            cleanupOnShutdown: true
    gateway:
        enabled: true
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/name: orkestra
    app.kubernetes.io/tag: orkestra-internal
    orkestra.io/deletion-protection: "true"
  name: orkestra-katalog
  namespace: orkestra-system

