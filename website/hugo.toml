baseURL = "https://orkestra.sh/"
languageCode = "en-us"
title = "Orkestra"
enableGitInfo = true

[markup]
  [markup.highlight]
    style = "dracula"
    lineNos = false
    codeFences = true
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    endLevel = 3
    startLevel = 2

[params]
  description = "The declarative control plane for Kubernetes operators"
  github = "https://github.com/orkspace/orkestra"
  controlcenter = "https://cc.orkestra.sh"
  version = "v1"

  [params.algolia]
    appId = "A02GA3BY6Z"
    searchKey = "0f161493898bb4fce74c16b56da29909"
    indexName = "orkestra"


[menu]
  [[menu.main]]
    name = "Docs"
    url = "/docs/"
    weight = 1
  [[menu.main]]
    name = "Reference"
    url = "/docs/reference/"
    weight = 2
  [[menu.main]]
    name = "Blog"
    url = "/blog/"
    weight = 3
  [[menu.main]]
    name = "Publications"
    url = "/publications/"
    weight = 4
[caches]
  [caches.images]
    dir = ':cacheDir/images'