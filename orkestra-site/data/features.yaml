- icon: "⚡"
  title: "Zero-code operators"
  description: "Write a Katalog YAML — Orkestra runs the full operator. No reconcile loops, no client-go, no controller-runtime wiring."

- icon: "🔀"
  title: "One runtime, many CRDs"
  description: "Register hundreds of CRDs in a single binary. Each gets its own informer, worker pool, queue, health state, and metrics."

- icon: "✅"
  title: "Declarative validation"
  description: "Enforce field constraints in YAML. Applied at admission time (webhook) and at every reconcile — declared once, enforced everywhere."

- icon: "🔧"
  title: "Declarative mutation"
  description: "Set defaults and overrides in the Katalog. Applied at admission and corrected every reconcile without writing Go."

- icon: "🔄"
  title: "Multi-version CRDs"
  description: "Declare conversion webhooks in the Katalog. Orkestra handles version negotiation between v1alpha1, v1beta1, and v1."

- icon: "📦"
  title: "Dependency ordering"
  description: "CRDs declare dependsOn. Orkestra resolves the graph, starts workers in topological order, and detects cycles at validation time."

- icon: "🩺"
  title: "Built-in health API"
  description: "Every operator exposes /health and /katalog/{crd} endpoints out of the box. No instrumentation required."

- icon: "🪝"
  title: "Go hooks when you need them"
  description: "Need custom logic? Register typed Go hooks alongside your Katalog. Called at the right lifecycle point — no framework to fight."

- icon: "👁"
  title: "Control Center"
  description: "Unified observability across multiple Orkestra instances. Live CRD health, worker visualization, reconcile rates — zero config."
