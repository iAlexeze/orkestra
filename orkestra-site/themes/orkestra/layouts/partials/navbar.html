<nav class="navbar" id="navbar">
  <div class="navbar-inner">
    <!-- Logo -->
    <a class="navbar-brand" href="/">
      <img src="/img/fav.png" alt="Orkestra" class="navbar-logo">
      <span class="navbar-title">Orkestra</span>
    </a>

    <!-- Desktop nav links -->
    <ul class="navbar-links">
      {{ range .Site.Menus.main }}
        {{ if .Params.icon }}
          <li>
            <a href="{{ .URL }}" class="navbar-icon-link{{ if $.IsHome }} is-home{{ end }}"
              {{ if .Params.external }}target="_blank" rel="noopener"{{ end }}
              aria-label="{{ .Name }}">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61-.546-1.387-1.333-1.757-1.333-1.757-1.089-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.418-1.305.762-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/>
              </svg>
            </a>
          </li>
        {{ else }}
          <li>
            <a href="{{ .URL }}"
              class="navbar-link{{ if (eq $.RelPermalink .URL) }} active{{ end }}"
              {{ if .Params.external }}target="_blank" rel="noopener"{{ end }}>
              {{ .Name }}
            </a>
          </li>
        {{ end }}
      {{ end }}
    </ul>

    <!-- Right controls -->
    <div class="navbar-controls">
      <!-- Search trigger -->
      <button class="search-trigger" id="searchTrigger" aria-label="Search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <span class="search-hint">Search</span>
        <kbd>⌘K</kbd>
      </button>

      <!-- Theme toggle -->
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>

      <!-- Mobile hamburger -->
      <button class="hamburger" id="hamburger" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>

  <!-- Mobile menu -->
  <div class="mobile-menu" id="mobileMenu">
    <ul>
      {{ range .Site.Menus.main }}
        <li>
          <a href="{{ .URL }}"
            {{ if .Params.external }}target="_blank" rel="noopener"{{ end }}>
            {{ .Name }}
          </a>
        </li>
      {{ end }}
    </ul>
  </div>
</nav>

<!-- Search modal -->
<div class="search-modal" id="searchModal" role="dialog" aria-modal="true" aria-label="Search">
  <div class="search-backdrop" id="searchBackdrop"></div>
  <div class="search-box">
    <div class="search-input-row">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input type="text" id="searchInput" placeholder="Search documentation…" autocomplete="off" spellcheck="false">
      <kbd class="search-close-key" id="searchClose">Esc</kbd>
    </div>
    <div class="search-results" id="searchResults">
      <p class="search-hint-text">Start typing to search…</p>
    </div>
  </div>
</div>
