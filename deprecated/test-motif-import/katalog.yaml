# Test katalog — imports deployment-stack motif via file: path.
# Run from the repository root:
#   ork validate --file unknown/test-motif-import/katalog.yaml
#   ork generate bundle --file unknown/test-motif-import/katalog.yaml

apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: test-motif-import
  version: latest
  createdBy: orkdoctor
  description: "Test katalog for deployment-stack motif file: import"

security:
  deletionProtection:
    enabled: false

spec:
  crds:
    test-app:
      apiTypes:
        kind: ConfigMap
      labelSelector:
        ork.io/app: test-app-orkestra
      allowedNamespaces: ["test-app-orkestra-ns"]

      operatorBox:
        imports:
          - motif: ./pkg/motif/orkestra-motifs/deployment-stack/motif.yaml
            with:
              name:      "{{ .metadata.name }}"
              namespace: "{{ .metadata.namespace }}"
              image:     "{{ .data.image }}"
              port:      "{{ .data.port }}"
              replicas:  "{{ .data.replicas }}"
              maxReplicas: "{{ .data.maxReplicas }}"
              resourceProfile: "{{ .data.resourceProfile }}"
              host:      "{{ .data.host }}"

        status:
          fields:
            - path: phase
              value: "Pending"
              when:
                - field: data.image
                  notExists: true

            - path: phase
              value: "Deploying"
              when:
                - field: data.image
                  exists: true
                - field: "{{ replicasReady .children.deployment }}"
                  equals: "false"

            - path: phase
              value: "Ready"
              when:
                - field: "{{ replicasReady .children.deployment }}"
                  equals: "true"

            - path: url
              value: "https://{{ .data.host }}"
              when:
                - field: data.host
                  exists: true

            - path: image
              value: "{{ .data.image }}"
