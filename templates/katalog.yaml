apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: <operator-name>
  author: <your-name>
  version: 0.1.0
  description: <what this operator does>
  tags:
    - <tag>

spec:
  crds:
    <crd-name>:
      crdFile: ./crd.yaml          # Orkestra applies the CRD at startup

      # allowedNamespaces:         # omit to watch all namespaces
      #   - default

      operatorBox:
        default: true

        # ── On Create ────────────────────────────────────────────────────
        onCreate:
          deployments:
            - name: "{{ .metadata.name }}"
              image: "{{ .spec.image }}"
              replicas: "{{ .spec.replicas }}"
              reconcile: true      # re-apply on every reconcile (drift correction)

          services:
            - name: "{{ .metadata.name }}-svc"
              port: "80"
              targetPort: "{{ .spec.port }}"
              reconcile: true

        # ── Status ───────────────────────────────────────────────────────
        # status:
        #   fields:
        #     - path: phase
        #       value: "Running"
        #     - path: observedReplicas
        #       value: "{{ .spec.replicas }}"
