apiVersion: orkestra.orkspace.io/v1
kind: E2E
metadata:
  name: <test-name>
  description: <short description of what this E2E verifies>

spec:
  # --- Inputs ---------------------------------------------------------------
  katalog: ./katalog.yaml
  crd: ./crd.yaml
  cr: ./cr.yaml

  # --- Cluster Setup --------------------------------------------------------
  cluster:
    provider: kind
    name: ork-e2e
    reuse: false

  # --- Expectations ---------------------------------------------------------
  expect:
    # 1. Verify the CR itself was created (confirms the CRD is registered and working)
    - name: CR created
      after: cr-applied
      timeout: 60s
      resources:
        - kind: <CR Kind>
          name: <cr-name>
          namespace: <namespace>

    # 2. Verify all child resources created by the operator
    - name: Resources created
      after: cr-applied
      timeout: 60s
      resources:
        - kind: Deployment
          name: <resource-name>
          namespace: <namespace>
          ready: true
        # - kind: Service
        #   name: <resource-name>
        #   namespace: <namespace>

    # 3. Verify full cleanup after CR deletion
    - name: Cleanup verified
      after: cr-deleted
      timeout: 30s
      resources:
        - kind: Deployment
          name: <resource-name>
          namespace: <namespace>
          count: 0
        - kind: <CR Kind>
          name: <cr-name>
          namespace: <namespace>
          count: 0
