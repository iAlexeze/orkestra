apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: platformnamespaces.platform.example.io
spec:
  group: platform.example.io
  scope: Cluster
  names:
    plural: platformnamespaces
    singular: platformnamespace
    kind: PlatformNamespace
    shortNames:
      - pns
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - targetNamespace
                - environment
                - region
                - logLevel
              properties:
                targetNamespace:
                  type: string
                  description: "Namespace Orkestra should create and manage"
                environment:
                  type: string
                  description: "Environment name (dev, staging, prod)"
                region:
                  type: string
                  description: "Deployment region"
                logLevel:
                  type: string
                  description: "Application log level override"
      subresources:
        status: {}
