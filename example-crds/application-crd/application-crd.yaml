apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: orkapps.orkestra.konduktor.io
spec:
  group: orkestra.konduktor.io
  scope: Namespaced
  names:
    plural: orkapps
    singular: orkapp
    kind: OrkApp
    listKind: OrkAppList

  versions:
    - name: v1alpha1
      served: true
      storage: true

      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: ["image"]
              properties:
                image:
                  type: string
                  description: Container image for the application workload
                replicas:
                  type: integer
                  minimum: 1
                  default: 1
                  description: Number of desired replicas
                serviceType:
                  type: string
                  default: ClusterIP
                  enum: ["ClusterIP", "NodePort", "LoadBalancer"]
                  description: Kubernetes Service type
                port:
                  type: integer
                  default: 8080
                  description: Container port exposed by the application

            status:
              type: object
              properties:
                phase:
                  type: string
                message:
                  type: string

      subresources:
        status: {}

      additionalPrinterColumns:
        - name: Image
          type: string
          jsonPath: .spec.image
        - name: Replicas
          type: integer
          jsonPath: .spec.replicas
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
