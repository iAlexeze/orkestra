apiVersion: controller.orkestra.io/v1
kind: Katalog
metadata:
  name: demo-katalog
  description: >-
    Demo Katalog — manages the Website CRD.
    No Go code required. Orkestra handles the full lifecycle
    from this file alone.

spec:
  finalizers:
    - finalizer.demo.orkestra.io/website

  crds:

    # ── WEBSITE ───────────────────────────────────────────────────────────────
    # Unstructured mode — no compiled types, no code generation.
    # Orkestra watches Website CRs and creates a Deployment + Service
    # for each one using values from the CR spec.
    #
    # Apply the CRD:  kubectl apply -f website-crd.yaml
    # Apply a CR:     kubectl apply -f website-cr.yaml
    # Run Orkestra:   ork run
    #
    # What Orkestra does automatically for every Website CR:
    #   onCreate    → creates a Deployment and a ClusterIP/NodePort/LB Service
    #   onReconcile → corrects drift if replicas or image change on the Deployment
    #   onDelete    → owner references clean up Deployment + Service automatically

    - name: website
      enabled: true
      critical: false
      workers: 2
      resync: 30s
      dependsOn:
      - orkapp
      namespaced: true
      namespace: orkestra   # where this operator should be deployed on if namespaced

      apiTypes:
        # location omitted → unstructured mode auto-detected
        group: demo.orkestra.io
        version: v1alpha1
        kind: Website
        plural: websites

      reconciler:
        default: true
        mode: unstructured

        finalizers:
          - finalizer.demo.orkestra.io/website

        # ── onCreate ─────────────────────────────────────────────────────────
        # Runs on every reconcile. Create is idempotent — skipped if exists.
        # Creates a Deployment and a Service owned by the Website CR.
        # When the CR is deleted, both are garbage collected automatically.

        onCreate:
          deployments:
            - name: "{{ .metadata.name }}"          # Deployment name = CR name
              image: "{{ .spec.image }}"            # from spec.image
              replicas: "{{ .spec.replicas }}"      # from spec.replicas (default: 1)
              port: "{{ .spec.port }}"              # from spec.port (default: 80)
              namespace: "{{ .metadata.namespace }}"
              reconcile: true     # ← also apply as drift correction, no need to write it again
              labels:
                - key: app
                  value: "{{ .metadata.name }}"
                - key: managed-by
                  value: orkestra
                - key: crd
                  value: website

          services:
            - name: "{{ .metadata.name }}-svc"      # Service name = CR name + -svc
              type: "{{ .spec.serviceType }}"       # ClusterIP / NodePort / LoadBalancer
              port: "80"                            # Service always on 80
              targetPort: "{{ .spec.port }}"        # routes to container port
              namespace: "{{ .metadata.namespace }}"
              reconcile: true     # ← also apply as drift correction, no need to write it again
              labels:
                - key: app
                  value: "{{ .metadata.name }}"
                - key: managed-by
                  value: orkestra

        # ── onReconcile ───────────────────────────────────────────────────────
        # Drift correction — re-applies desired state when the Deployment has
        # been manually modified (wrong replicas, wrong image, etc.)
        # Only needs to declare the fields that can drift.

        # Skip this is onCreate.reconcile = true

        # onReconcile:
        #   deployments:
        #     - name: "{{ .metadata.name }}"
        #       image: "{{ .spec.image }}"
        #       replicas: "{{ .spec.replicas }}"
        #       namespace: "{{ .metadata.namespace }}"

        # ── onDelete ──────────────────────────────────────────────────────────
        # Owner references handle Deployment + Service cleanup automatically.
        # No explicit onDelete needed for this CRD.
        #
        # If you needed a cleanup Job you would add:
        # onDelete:
        #   jobs:
        #     - name: "{{ .metadata.name }}-cleanup"
        #       image: busybox
        #       command: ["sh", "-c", "echo {{ .metadata.name }} deleted"]

      queue:
        maxQueueDepth: 500

      description: >-
        Manages a web application Deployment and Service pair.
        Declare what you want in the Website CR spec — Orkestra handles the rest.
    
    # ── APPLICATION (dynamic, declarative templates) ─────────────────────
    # dynamic mode — no compiled types needed.
    # Declarative hook templates — ork generate emits hook implementations
    # from OrkestraRegistry. Zero Go code required.
    #
    # Field values support Go text/template expressions:
    #   Static:  replicas: 3
    #   Dynamic: replicas: "{{ .spec.replicas }}"
    #            name:     "{{ .metadata.name }}-app"
    #            namespace:"{{ .metadata.namespace }}"
    #
    # All created resources are owned by the CR — cascade deletion is automatic.
    - name: orkapp
      enabled: true
      workers: 3
      resync: 15s
      namespace: orkestra
      namespaced: true

      apiTypes:
        # location not required in dynamic mode —
        # but group/version/kind/plural still needed for informer registration
        group: orkestra.konduktor.io
        version: v1alpha1
        kind: OrkApp
        plural: orkapps

      reconciler:
        default: true
        mode: dynamic                                                 # no compiled types needed

        finalizers:
          - test-finalizer/application

        # onCreate — resources created when the CR is first reconciled.
        # Orkestra checks existence before creating — always idempotent.
        onCreate:
          deployments:
            - name: "{{ .metadata.name }}-app"                           # dynamic — from CR metadata
              replicas: "{{ .spec.replicas }}"                           # dynamic — from CR spec
              image: "{{ .spec.image }}"                                 # dynamic — from CR spec
              port: 8080
              namespace: "{{ .metadata.namespace }}"
              labels:
                - key: app
                  value: "{{ .metadata.name }}"
                - key: managed-by
                  value: orkestra
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi

          services:
            - name: "{{ .metadata.name }}-svc"
              type: ClusterIP
              port: 80
              targetPort: 8080
              namespace: "{{ .metadata.namespace }}"
              labels:
                - key: app
                  value: "{{ .metadata.name }}"

        # onReconcile — drift correction on every reconcile loop.
        # Orkestra detects if child resources have been modified or deleted
        # and reconciles them back to the declared state.
        # Leave empty if onCreate is sufficient (Orkestra handles basic drift).
        onReconcile:
          deployments:
            - name: "{{ .metadata.name }}-app"
              replicas: "{{ .spec.replicas }}"                           # re-applies if someone manually changed replicas
              image: "{{ .spec.image }}"

        # onDelete — cleanup before finalizer removal.
        # Most resources are cleaned up automatically via owner references.
        # Declare here only for resources that need special handling —
        # e.g. external resources, Jobs that must complete before deletion.
        # onDelete:
        #   jobs:
        #     - name: "{{ .metadata.name }}-cleanup"
        #       image: busybox
        #       command: ["sh", "-c", "echo cleaning up {{ .metadata.name }}"]
        #       backoffLimit: 3
        #       namespace: "{{ .metadata.namespace }}"

      queue:
        default: true
        maxQueueDepth: 1500

      description: >-
        Represents a deployable application workload managed by Orkestra.
