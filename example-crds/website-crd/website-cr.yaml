# A simple website running nginx
apiVersion: demo.orkestra.io/v1alpha1
kind: Website
metadata:
  name: my-blog
  namespace: orkestra
spec:
  image: nginx:1.25
  replicas: 2
  port: 80
  serviceType: ClusterIP

---
# A website with a custom image pulled from spec
# Orkestra creates a Deployment and Service from these values
apiVersion: demo.orkestra.io/v1alpha1
kind: Website
metadata:
  name: my-api
  namespace: orkestra
spec:
  image: myorg/api-server:v1.2.0
  replicas: 3
  port: 8080
  serviceType: LoadBalancer

---
# Minimal — only image required, everything else defaults
apiVersion: demo.orkestra.io/v1alpha1
kind: Website
metadata:
  name: landing-page
  namespace: orkestra
spec:
  image: nginx:alpine