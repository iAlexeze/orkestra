apiVersion: orkestra.konductor.io/v1Alpha
kind: Katalog
metadata:
  name: orkspace-fanout
  author: orkspace
  version: 0.1.0
  description: >
    A scalable Orkestra-native workload. Demonstrates how a CRD exposing the
    Kubernetes /scale subresource can be autoscaled directly by HPA, with
    Orkestra reconciling the underlying ReplicaSet.

spec:
  crds:
    orkspace-fanout:
      apiTypes:
        group: orkspace.io
        version: v1alpha1
        kind: OrkspaceFanOut
        plural: orkspacefanouts

      workers: 2
      resync: 30s

      operatorBox:
        onCreate:
          deployments:
            - name: "{{ .metadata.name }}"
              image: "{{ .spec.image }}"
              replicas: "{{ .spec.replicas }}"
          replicaSets:
            - name: "{{ .metadata.name }}"
              image: "{{ .spec.image }}"
              replicas: "{{ .spec.replicas }}"
              labels:
                - key: app
                  value: "{{ .metadata.name }}"
              reconcile: true
          pdb:
            - name: "{{ .metadata.name }}-pdb"
              minAvailable: 2
              selector:
                app: "{{ .metadata.name }}"
          hpa:
            - name: "{{ .metadata.name }}-hpa"
              minReplicas: 1
              maxReplicas: 10
              targetCPUUtilizationPercentage: 50
              scaleTargetRef:
                apiVersion: apps/v1
                kind: ReplicaSet
                name: "{{ .metadata.name }}"
              reconcile: true

        status:
          fields:
            - path: phase
              value: "FanOutComplete"
              when:
                - field: children.deployment.status.readyReplicas
                  operator: exists
              # when:
              #   - field: "{{ .children.replicaset.status.readyReplicas }}"
              #     equals: "{{ .spec.replicas }}"

            - path: observedReplicas
              value: "{{ .spec.replicas }}"
            - path: replicas
              type: int
              value: "{{ .spec.replicas }}"
            - path: selector
              value: "{{ .metadata.name }}"