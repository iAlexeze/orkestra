apiVersion: orkestra.orkspace.io/v1
kind: Motif
metadata:
  name: pipeline-admission
  description: Basic admission rules for a pipeline CRD.
inputs:
  - name: imageRequiredMessage
    default: "spec.image is required"
  - name: stepsRequiredMessage
    default: "spec.steps is required"
admission:
  validation:
    rules:
      - field: spec.image
        operator: exists
        message: "{{ inputs.imageRequiredMessage }}"
        action: deny
      - field: spec.steps
        operator: exists
        message: "{{ inputs.stepsRequiredMessage }}"
        action: deny