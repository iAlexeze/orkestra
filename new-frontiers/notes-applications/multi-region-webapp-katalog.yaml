apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: multi-region-webapp
  author: orkspace
  version: 0.1.0

spec:
  crds:
    webapp:
      apiTypes:
        group: apps.example.io
        version: v1alpha1
        kind: WebApp
        plural: webapps
      workers: 2
      resync: 20s

      validation:
        rules:
          - field: spec.image
            operator: exists
            action: deny
          - field: spec.regions
            operator: exists
            action: deny

      mutation:
        rules:
          - field: spec.replicas
            default: 2
          - field: spec.env
            default: {}

      operatorBox:
        default: true

        onReconcile:
          deployments:
            - name: "{{ .metadata.name }}-{{ .item }}"
              image: "{{ getStringOr .spec.image \"nginx:latest\" }}"
              replicas: "{{ getIntOr .spec.replicas 2 }}"
              forEach:
                field: spec.regions
                as: item
              env:
                REGION:
                  value: "{{ .item }}"
                APP_ENV:
                  value: "{{ mapGet .spec.env \"APP_ENV\" }}"
                DEBUG:
                  value: "{{ getBoolOr (mapGet .spec.env \"DEBUG\") false }}"

          configMaps:
            - name: "{{ .metadata.name }}-config"
              data:
                regions: "{{ listLen .spec.regions }}"
                primaryRegion: "{{ listGet .spec.regions 0 }}"
                allRegions: "{{ joinList .spec.regions \",\" }}"

        status:
          fields:
            - path: phase
              value: "Pending"
              when:
                - field: children.deployment
                  operator: notExists

            - path: phase
              value: "Degraded"
              when:
                - field: children.deployment.status.readyReplicas
                  operator: notExists

            - path: phase
              value: "Ready"
              when:
                - field: children.deployment.status.readyReplicas
                  operator: exists

            - path: deployedImages
              value: "{{ containerImage .children.deployment 0 }}"

            - path: httpPortExposed
              value: "{{ containerPort .children.deployment 0 80 }}"

            - path: appEnv
              value: "{{ containerEnv .children.deployment 0 \"APP_ENV\" }}"

            - path: regionCount
              value: "{{ listLen .spec.regions }}"

            - path: primaryRegion
              value: "{{ listGet .spec.regions 0 }}"
