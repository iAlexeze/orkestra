---
# MultiRegionApp — demonstrates forEach expansion over a list or map
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: multiregionapps.advanced.orkestra.io
spec:
  group: advanced.orkestra.io
  scope: Namespaced
  names:
    plural: multiregionapps
    singular: multiregionapp
    kind: MultiRegionApp
    shortNames: [mra]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Regions
          type: string
          jsonPath: .status.regionsDeployed
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [image, regions]
              properties:
                image:
                  type: string
                  description: Container image deployed in every region.

                # List shape (uniform config):
                #   regions: [us-east-1, eu-west-1]
                #   Uses defaultReplicas / defaultPort for all regions.
                #
                # Map shape (per-region config):
                #   regions:
                #     us-east-1: {replicas: 3, port: 8080}
                #     eu-west-1: {replicas: 1, port: 8081}
                #   .value.replicas / .value.port override the defaults per region.
                regions:
                  x-kubernetes-preserve-unknown-fields: true
                  description: >
                    Region definitions. Either a list of region name strings
                    (uniform config) or a map of region name → {replicas, port}
                    (per-region config).

                defaultReplicas:
                  type: integer
                  default: 1
                  minimum: 1
                  maximum: 20
                  description: Replica count used for any region that does not declare its own.

                defaultPort:
                  type: integer
                  default: 8080
                  minimum: 1
                  maximum: 65535
                  description: Container port used for any region that does not declare its own.

            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
