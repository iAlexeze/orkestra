# Advanced usecases — example CRs
# Apply in order: kubectl apply -f cr.yaml
# Then open http://localhost:9090/controlcenter

---
# 01 — forEach: N deployments from a list
apiVersion: advanced.orkestra.io/v1alpha1
kind: MultiRegionApp
metadata:
  name: my-multi-region
  namespace: default
spec:
  image: nginx:1.25
  regions:
    - us-east-1
    - eu-west-1
    - ap-southeast-1
  replicasPerRegion: 1

---
# 02 — external: health gate
# Change spec.serviceUrl to a URL that returns 200 to unblock the Deployment
apiVersion: advanced.orkestra.io/v1alpha1
kind: GatedApp
metadata:
  name: my-gated-app
  namespace: default
spec:
  image: nginx:1.25
  serviceUrl: "http://httpbin.org"   # replace with your service

---
# 03a — cross: database side (create this first)
apiVersion: advanced.orkestra.io/v1alpha1
kind: ManagedDatabase
metadata:
  name: my-app-db
  namespace: default
spec: {}

---
# 03b — cross: application side (observes my-app-db)
apiVersion: advanced.orkestra.io/v1alpha1
kind: DatabaseBackedApp
metadata:
  name: my-app
  namespace: default
spec:
  image: nginx:1.25

---
# 04 — once: idempotent secret generation
apiVersion: advanced.orkestra.io/v1alpha1
kind: SecureApp
metadata:
  name: my-secure-app
  namespace: default
spec:
  image: nginx:1.25

---
# 05 — anyOf: OR conditions
apiVersion: advanced.orkestra.io/v1alpha1
kind: FlexApp
metadata:
  name: my-flex-app
  namespace: default
spec:
  image: nginx:1.25
  notify: "true"

---
# 06 — full stack (apply 03a first so database is available)
apiVersion: advanced.orkestra.io/v1alpha1
kind: FullStackApp
metadata:
  name: my-full-stack
  namespace: default
spec:
  image: nginx:1.25
  regions:
    - us-east-1
    - eu-west-1
    - ap-southeast-1
  replicasPerRegion: 1
  serviceUrl: "http://httpbin.org"   # replace with your service
  environment: "production"
  notify: "true"