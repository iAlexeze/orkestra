apiVersion: orkestra.konductor.io/v1Alpha
kind: Katalog
metadata:
  name: advanced-usecases
  author: orkspace
  version: 0.2.0
  description: >
    Advanced Orkestra patterns — forEach, external:, cross:, once:, anyOf:.
    Each CRD demonstrates one pattern that previously required custom Go code.

spec:
  crds:
    # ── 01. forEach — N resources from a list ──────────────────────────────────
    multi-region-app:
      apiTypes:
        group: advanced.orkestra.io
        version: v1alpha1
        kind: MultiRegionApp
        plural: multiregionapps
      workers: 2
      resync: 30s

      validation:
        rules:
          - field: spec.image
            operator: exists
            message: "spec.image is required"
            action: deny
          - field: spec.regions
            operator: exists
            message: "spec.regions is required"
            action: deny

      mutation:
        rules:
          - field: spec.replicasPerRegion
            default: 1

      operatorBox:
        default: true
        onReconcile:
          deployments:
            - name: "{{ .metadata.name }}-{{ .item }}"
              image: "{{ .spec.image }}"
              replicas: "{{ .spec.replicasPerRegion }}"
              forEach:
                field: spec.regions
                as: item

        status:
          fields:
            - path: phase
              value: "Pending"
              when:
                - field: status.phase
                  operator: notExists

            # NOTE: children.deployment captures one deployment (last in list).
            # Until ReadChildren aggregates forEach-created resources, use exists.
            # The aggregation fix is tracked — once merged, change to gt/value: "0"
            - path: phase
              value: "Ready"
              when:
                - field: children.deployment.status.readyReplicas
                  operator: exists

            - path: regionsDeployed
              value: "{{ len .spec.regions }}"

    # ── 02. external: — gate resources on HTTP call ────────────────────────────
    # IMPORTANT: external call names must be valid Go identifiers — no hyphens.
    # Use camelCase: healthCheck not health-check. Template access: {{ .external.healthCheck.status }}
    gated-app:
      apiTypes:
        group: advanced.orkestra.io
        version: v1alpha1
        kind: GatedApp
        plural: gatedapps
      workers: 2
      resync: 30s

      validation:
        rules:
          - field: spec.image
            operator: exists
            action: deny
          - field: spec.serviceUrl
            operator: exists
            message: "spec.serviceUrl required for health check"
            action: deny

      operatorBox:
        default: true
        onReconcile:
          external:
            - name: healthCheck               # camelCase — valid Go identifier
              url: "{{ .spec.serviceUrl }}/health"
              method: GET
              expectedStatus: 200
              continueOnError: false
              timeout: 5s

            - name: featureFlags             # camelCase
              url: "{{ .spec.serviceUrl }}/flags/{{ .metadata.name }}"
              method: GET
              continueOnError: true
              timeout: 3s

          deployments:
            - name: "{{ .metadata.name }}"
              image: "{{ .spec.image }}"
              when:
                - field: external.healthCheck.status   # dot access works — no hyphens
                  equals: "200"

          configMaps:
            - name: "{{ .metadata.name }}-flags"
              data:
                flags: "{{ .external.featureFlags.body }}"
              when:
                - field: external.featureFlags.called
                  equals: "true"
                - field: external.featureFlags.error
                  operator: notExists

        status:
          fields:
            - path: phase
              value: "Pending"
              when:
                - field: status.phase
                  operator: notExists
            - path: phase
              value: "Waiting"
              when:
                - field: external.healthCheck.status
                  operator: notExists
            - path: phase
              value: "Degraded"
              when:
                - field: external.healthCheck.status
                  operator: exists
                - field: external.healthCheck.status
                  notEquals: "200"
            - path: phase
              value: "Ready"
              when:
                - field: children.deployment.status.readyReplicas
                  operator: exists
            - path: lastHealthCheck
              value: "{{ .external.healthCheck.status }}"  # works — no hyphen

    # ── 03. cross: — observe another CRD's CR ──────────────────────────────────
    managed-database:
      apiTypes:
        group: advanced.orkestra.io
        version: v1alpha1
        kind: ManagedDatabase
        plural: manageddatabases
      workers: 2
      resync: 30s

      operatorBox:
        default: true
        onCreate:
          deployments:
            - name: "{{ .metadata.name }}-postgres"
              image: "postgres:15"
          services:
            - name: "{{ .metadata.name }}-postgres"
              port: "5432"

        status:
          fields:
            - path: phase
              value: "Pending"
              when:
                - field: status.phase
                  operator: notExists
            - path: phase
              value: "Ready"
              when:
                - field: children.deployment.status.readyReplicas
                  operator: exists
            - path: endpoint
              value: "{{ .metadata.name }}-postgres.{{ .metadata.namespace }}.svc.cluster.local:5432"

    database-backed-app:
      apiTypes:
        group: advanced.orkestra.io
        version: v1alpha1
        kind: DatabaseBackedApp
        plural: databasebackedapps
      workers: 2
      resync: 30s
      dependsOn:
        managed-database: healthy

      validation:
        rules:
          - field: spec.image
            operator: exists
            action: deny

      operatorBox:
        default: true
        cross:
          - kind: managed-database
            selector:
              name: "{{ .metadata.name }}-db"
              namespace: "{{ .metadata.namespace }}"
            as: db

        onReconcile:
          deployments:
            - name: "{{ .metadata.name }}"
              image: "{{ .spec.image }}"
              when:
                - field: cross.db.status.phase
                  equals: "Ready"

          configMaps:
            - name: "{{ .metadata.name }}-config"
              data:
                DB_HOST: "{{ .cross.db.status.endpoint }}"
                DB_PORT: "5432"
              when:
                - field: cross.db.found
                  equals: "true"

        status:
          fields:
            - path: phase
              value: "WaitingForDatabase"
              when:
                - field: cross.db.found
                  equals: "false"
            - path: phase
              value: "WaitingForDatabase"
              when:
                - field: cross.db.status.phase
                  operator: notExists
            - path: phase
              value: "WaitingForDatabase"
              when:
                - field: cross.db.status.phase
                  notEquals: "Ready"
            - path: phase
              value: "Ready"
              when:
                - field: cross.db.status.phase
                  equals: "Ready"
                - field: children.deployment.status.readyReplicas
                  operator: exists
            - path: databaseEndpoint
              value: "{{ .cross.db.status.endpoint }}"
              when:
                - field: cross.db.found
                  equals: "true"

    # ── 04. once: — idempotent secret generation ───────────────────────────────
    secure-app:
      apiTypes:
        group: advanced.orkestra.io
        version: v1alpha1
        kind: SecureApp
        plural: secureapps
      workers: 2
      resync: 30s

      validation:
        rules:
          - field: spec.image
            operator: exists
            action: deny

      operatorBox:
        default: true
        onCreate:
          secrets:
            - name: "{{ .metadata.name }}-credentials"
              once: true
              data:
                password:  "{{ randomAlphanumeric 32 }}"
                apiKey:    "{{ randomHex 16 }}"
                jwtSecret: "{{ randomBase64 32 }}"
          deployments:
            - name: "{{ .metadata.name }}"
              image: "{{ .spec.image }}"

        status:
          fields:
            - path: phase
              value: "Pending"
              when:
                - field: status.phase
                  operator: notExists
            - path: phase
              value: "Ready"
              when:
                - field: children.deployment.status.readyReplicas
                  operator: exists
            - path: credentialsSecret
              value: "{{ .metadata.name }}-credentials"

    # ── 05. anyOf: — OR condition logic ────────────────────────────────────────
    flex-app:
      apiTypes:
        group: advanced.orkestra.io
        version: v1alpha1
        kind: FlexApp
        plural: flexapps
      workers: 2
      resync: 30s

      operatorBox:
        default: true
        onCreate:
          deployments:
            - name: "{{ .metadata.name }}"
              image: "{{ .spec.image }}"

        onReconcile:
          jobs:
            - name: "{{ .metadata.name }}-cleanup"
              image: alpine:3.19
              command: ["/bin/sh", "-c", "echo 'cleanup complete'"]
              anyOf:
                - field: status.phase
                  equals: "Failed"
                - field: status.phase
                  equals: "Succeeded"

            - name: "{{ .metadata.name }}-notify"
              image: alpine:3.19
              command: ["/bin/sh", "-c", "echo 'notification sent'"]
              when:
                - field: spec.notify
                  equals: "true"
              anyOf:
                - field: status.phase
                  equals: "Failed"
                - field: status.phase
                  equals: "Succeeded"

        status:
          fields:
            - path: phase
              value: "Running"
              when:
                - field: status.phase
                  operator: notExists
            - path: phase
              value: "Succeeded"
              when:
                - field: children.job.status.succeeded
                  operator: gt
                  value: "0"

    # ── 06. Full stack — all patterns combined ──────────────────────────────────
    full-stack-app:
      apiTypes:
        group: advanced.orkestra.io
        version: v1alpha1
        kind: FullStackApp
        plural: fullstackapps
      workers: 2
      resync: 30s
      dependsOn:
        managed-database: healthy

      validation:
        rules:
          - field: spec.image
            operator: exists
            action: deny
          - field: spec.regions
            operator: exists
            action: deny
          - field: spec.serviceUrl
            operator: exists
            action: deny

      mutation:
        rules:
          - field: spec.replicasPerRegion
            default: 1
          - field: spec.notify
            default: "false"

      operatorBox:
        default: true
        cross:
          - kind: managed-database
            selector:
              name: "{{ .metadata.name }}-db"
              namespace: "{{ .metadata.namespace }}"
            as: db

        onCreate:
          secrets:
            # Generated once — credential stays stable across reconciles
            - name: "{{ .metadata.name }}-creds"
              once: true
              rotateAfter: 30s
              data:
                password: "{{ randomAlphanumeric 32 }}"

        onReconcile:
          external:
            - name: healthCheck
              url: "{{ .spec.serviceUrl }}/health"
              expectedStatus: 200
              continueOnError: false
              timeout: 5s

          deployments:
            - name: "{{ .metadata.name }}-{{ .item }}"
              image: "{{ .spec.image }}"
              replicas: "{{ .spec.replicasPerRegion }}"
              forEach:
                field: spec.regions
                as: item
              when:
                - field: external.healthCheck.status
                  equals: "200"
                - field: cross.db.status.phase
                  equals: "Ready"

          configMaps:
            - name: "{{ .metadata.name }}-config"
              data:
                DB_HOST: "{{ .cross.db.status.endpoint }}"
                APP_ENV: "{{ .spec.environment }}"
              when:
                - field: cross.db.found
                  equals: "true"

          jobs:
            - name: "{{ .metadata.name }}-cleanup"
              image: alpine:3.19
              command: ["/bin/sh", "-c", "echo cleanup"]
              anyOf:
                - field: status.phase
                  equals: "Failed"
                - field: status.phase
                  equals: "Succeeded"

        status:
          fields:
            - path: phase
              value: "Pending"
              when:
                - field: status.phase
                  operator: notExists
            - path: phase
              value: "WaitingForDatabase"
              when:
                - field: cross.db.status.phase
                  notEquals: "Ready"
            - path: phase
              value: "HealthCheckFailed"
              when:
                - field: external.healthCheck.status
                  operator: exists
                - field: external.healthCheck.status
                  notEquals: "200"
            - path: phase
              value: "Ready"
              when:
                - field: cross.db.status.phase
                  equals: "Ready"
                - field: external.healthCheck.status
                  equals: "200"
                - field: children.deployment.status.readyReplicas
                  operator: exists
            - path: regionsDeployed
              value: "{{ len .spec.regions }}"
            - path: databaseEndpoint
              value: "{{ .cross.db.status.endpoint }}"
              when:
                - field: cross.db.found
                  equals: "true"
            - path: credentialsSecret
              value: "{{ .metadata.name }}-creds"