apiVersion: orkestra.konductor.io/v1Alpha
kind: Katalog
metadata:
  name: advanced-usecases
  author: orkspace
  version: 0.1.0
  description: >
    Advanced Orkestra patterns — forEach, external:, cross:, once:, anyOf:.
    Each CRD in this Katalog demonstrates one pattern that previously required
    custom Go code. Apply any CR and watch the result in the Control Center.

spec:
  crds:
    # ── 01. forEach — N resources from a list ──────────────────────────────
    multi-region-app:
      apiTypes:
        group: advanced.orkestra.io
        version: v1alpha1
        kind: MultiRegionApp
        plural: multiregionapps
      workers: 2
      resync: 30s

      validation:
        rules:
          - field: spec.image
            operator: exists
            message: "spec.image is required"
            action: deny
          - field: spec.regions
            operator: exists
            message: "spec.regions is required (list of region strings)"
            action: deny

      mutation:
        rules:
          - field: spec.replicasPerRegion
            default: 1

      reconciler:
        default: true
        onReconcile:
          deployments:
            - name: "{{ .metadata.name }}-{{ .item }}"
              image: "{{ .spec.image }}"
              replicas: "{{ .spec.replicasPerRegion }}"
              forEach:
                field: spec.regions
                as: item
        status:
          fields:
            - path: phase
              value: "Pending"
              when:
                - field: status.phase
                  operator: notExists
            - path: phase
              value: "Ready"
              when:
                - field: children.deployment.status.readyReplicas
                  operator: gt
                  value: "0"
            - path: regionsDeployed
              value: "{{ len .spec.regions }}"

    # ── 02. external: — gate resources on HTTP call ────────────────────────
    gated-app:
      apiTypes:
        group: advanced.orkestra.io
        version: v1alpha1
        kind: GatedApp
        plural: gatedapps
      workers: 2
      resync: 30s

      validation:
        rules:
          - field: spec.image
            operator: exists
            action: deny
          - field: spec.serviceUrl
            operator: exists
            message: "spec.serviceUrl required for health check"
            action: deny

      reconciler:
        default: true
        onReconcile:
          external:
            - name: health-check
              url: "{{ .spec.serviceUrl }}/health"
              method: GET
              expectedStatus: 200
              continueOnError: false   # deployment blocked until healthy
              timeout: 5s

            - name: feature-flags
              url: "{{ .spec.serviceUrl }}/flags/{{ .metadata.name }}"
              method: GET
              continueOnError: true    # missing flags don't block deploy
              timeout: 3s

          deployments:
            - name: "{{ .metadata.name }}"
              image: "{{ .spec.image }}"
              when:
                - field: external.health-check.status
                  equals: "200"

          configMaps:
            - name: "{{ .metadata.name }}-flags"
              data:
                flags: "{{ .external.feature-flags.body }}"
              when:
                - field: external.feature-flags.called
                  equals: "true"
                - field: external.feature-flags.error
                  operator: notExists

        status:
          fields:
            - path: phase
              value: "Pending"
              when:
                - field: status.phase
                  operator: notExists
            - path: phase
              value: "Waiting"
              when:
                - field: external.health-check.status
                  operator: notExists
            - path: phase
              value: "Degraded"
              when:
                - field: external.health-check.status
                  operator: exists
                - field: external.health-check.status
                  notEquals: "200"
            - path: phase
              value: "Ready"
              when:
                - field: children.deployment.status.readyReplicas
                  operator: gt
                  value: "0"
            - path: lastHealthCheck
              value: "{{ .external.health-check.status }}"

    # ── 03. cross: — observe another CRD's CR ─────────────────────────────
    managed-database:
      apiTypes:
        group: advanced.orkestra.io
        version: v1alpha1
        kind: ManagedDatabase
        plural: manageddatabases
      workers: 2
      resync: 30s

      reconciler:
        default: true
        onCreate:
          deployments:
            - name: "{{ .metadata.name }}-postgres"
              image: "postgres:15"
          services:
            - name: "{{ .metadata.name }}-postgres"
              port: "5432"
        status:
          fields:
            - path: phase
              value: "Pending"
              when:
                - field: status.phase
                  operator: notExists
            - path: phase
              value: "Ready"
              when:
                - field: children.deployment.status.readyReplicas
                  operator: gt
                  value: "0"
            - path: endpoint
              value: "{{ .metadata.name }}-postgres.{{ .metadata.namespace }}.svc.cluster.local:5432"

    database-backed-app:
      apiTypes:
        group: advanced.orkestra.io
        version: v1alpha1
        kind: DatabaseBackedApp
        plural: databasebackedapps
      workers: 2
      resync: 30s
      dependsOn:
        managed-database: healthy  # workers start only after managed-database CRD is healthy

      validation:
        rules:
          - field: spec.image
            operator: exists
            action: deny

      reconciler:
        default: true

        # Observe the ManagedDatabase CR with the same name
        # This reads from the managed-database informer cache — zero API calls
        cross:
          - kind: managed-database
            selector:
              name: "{{ .metadata.name }}-db"
              namespace: "{{ .metadata.namespace }}"
            as: db

        onReconcile:
          deployments:
            - name: "{{ .metadata.name }}"
              image: "{{ .spec.image }}"
              when:
                - field: cross.db.status.phase
                  equals: "Ready"

          configMaps:
            - name: "{{ .metadata.name }}-config"
              data:
                DB_HOST: "{{ .cross.db.status.endpoint }}"
                DB_PORT: "5432"
              when:
                - field: cross.db.found
                  equals: "true"

        status:
          fields:
            - path: phase
              value: "WaitingForDatabase"
              when:
                - field: cross.db.found
                  equals: "false"
            - path: phase
              value: "WaitingForDatabase"
              when:
                - field: cross.db.status.phase
                  notEquals: "Ready"
            - path: phase
              value: "Ready"
              when:
                - field: cross.db.status.phase
                  equals: "Ready"
                - field: children.deployment.status.readyReplicas
                  operator: gt
                  value: "0"
            - path: databaseEndpoint
              value: "{{ .cross.db.status.endpoint }}"
              when:
                - field: cross.db.found
                  equals: "true"

    # ── 04. once: — idempotent secret generation ───────────────────────────
    secure-app:
      apiTypes:
        group: advanced.orkestra.io
        version: v1alpha1
        kind: SecureApp
        plural: secureapps
      workers: 2
      resync: 30s

      validation:
        rules:
          - field: spec.image
            operator: exists
            action: deny

      reconciler:
        default: true
        onCreate:
          secrets:
            # Generated once — randomAlphanumeric is called only when the
            # Secret does not exist. Every subsequent reconcile skips this.
            - name: "{{ .metadata.name }}-credentials"
              once: true
              data:
                password:  "{{ randomAlphanumeric 32 }}"
                apiKey:    "{{ randomHex 16 }}"
                jwtSecret: "{{ randomBase64 32 }}"

          deployments:
            - name: "{{ .metadata.name }}"
              image: "{{ .spec.image }}"

        status:
          fields:
            - path: phase
              value: "Pending"
              when:
                - field: status.phase
                  operator: notExists
            - path: phase
              value: "Ready"
              when:
                - field: children.deployment.status.readyReplicas
                  operator: gt
                  value: "0"
            - path: credentialsSecret
              value: "{{ .metadata.name }}-credentials"

    # ── 05. anyOf: — OR condition logic ────────────────────────────────────
    flex-app:
      apiTypes:
        group: advanced.orkestra.io
        version: v1alpha1
        kind: FlexApp
        plural: flexapps
      workers: 2
      resync: 30s

      reconciler:
        default: true
        onCreate:
          deployments:
            - name: "{{ .metadata.name }}"
              image: "{{ .spec.image }}"

        onReconcile:
          jobs:
            # Cleanup job — runs when phase is Failed OR Succeeded (OR logic)
            - name: "{{ .metadata.name }}-cleanup"
              image: alpine:3.19
              command: ["/bin/sh", "-c", "echo 'cleanup complete'"]
              anyOf:
                - field: status.phase
                  equals: "Failed"
                - field: status.phase
                  equals: "Succeeded"

            # Notification — requires notify=true AND (Failed OR Succeeded)
            - name: "{{ .metadata.name }}-notify"
              image: alpine:3.19
              command: ["/bin/sh", "-c", "echo 'notification sent'"]
              when:
                - field: spec.notify
                  equals: "true"
              anyOf:
                - field: status.phase
                  equals: "Failed"
                - field: status.phase
                  equals: "Succeeded"

        status:
          fields:
            - path: phase
              value: "Running"
              when:
                - field: status.phase
                  operator: notExists
            - path: phase
              value: "Succeeded"
              when:
                - field: children.job.status.succeeded
                  operator: gt
                  value: "0"

    # ── 06. Full stack — all patterns combined ─────────────────────────────
    full-stack-app:
      apiTypes:
        group: advanced.orkestra.io
        version: v1alpha1
        kind: FullStackApp
        plural: fullstackapps
      workers: 2
      resync: 30s
      dependsOn:
        managed-database: healthy

      validation:
        rules:
          - field: spec.image
            operator: exists
            action: deny
          - field: spec.regions
            operator: exists
            action: deny
          - field: spec.serviceUrl
            operator: exists
            action: deny

      mutation:
        rules:
          - field: spec.replicasPerRegion
            default: 1
          - field: spec.notify
            default: "false"

      reconciler:
        default: true

        # Cross-CRD: observe a matching ManagedDatabase CR
        cross:
          - kind: managed-database
            selector:
              name: "{{ .metadata.name }}-db"
              namespace: "{{ .metadata.namespace }}"
            as: db

        onCreate:
          secrets:
            # Generated once — credential stays stable across reconciles
            - name: "{{ .metadata.name }}-creds"
              once: true
              data:
                password: "{{ randomAlphanumeric 32 }}"

        onReconcile:
          # External health check before creating deployments
          external:
            - name: health-check
              url: "{{ .spec.serviceUrl }}/health"
              expectedStatus: 200
              continueOnError: false
              timeout: 5s

          # N regional deployments — one per spec.regions entry
          deployments:
            - name: "{{ .metadata.name }}-{{ .item }}"
              image: "{{ .spec.image }}"
              replicas: "{{ .spec.replicasPerRegion }}"
              forEach:
                field: spec.regions
                as: item
              when:
                - field: external.health-check.status
                  equals: "200"
                - field: cross.db.status.phase
                  equals: "Ready"

          configMaps:
            - name: "{{ .metadata.name }}-config"
              data:
                DB_HOST: "{{ .cross.db.status.endpoint }}"
                APP_ENV: "{{ .spec.environment }}"
              when:
                - field: cross.db.found
                  equals: "true"

          jobs:
            # Cleanup — anyOf: Failed OR Succeeded
            - name: "{{ .metadata.name }}-cleanup"
              image: alpine:3.19
              command: ["/bin/sh", "-c", "echo cleanup"]
              anyOf:
                - field: status.phase
                  equals: "Failed"
                - field: status.phase
                  equals: "Succeeded"

        status:
          fields:
            - path: phase
              value: "Pending"
              when:
                - field: status.phase
                  operator: notExists
            - path: phase
              value: "WaitingForDatabase"
              when:
                - field: cross.db.status.phase
                  notEquals: "Ready"
            - path: phase
              value: "HealthCheckFailed"
              when:
                - field: external.health-check.status
                  operator: exists
                - field: external.health-check.status
                  notEquals: "200"
            - path: phase
              value: "Ready"
              when:
                - field: cross.db.status.phase
                  equals: "Ready"
                - field: external.health-check.status
                  equals: "200"
                - field: children.deployment.status.readyReplicas
                  operator: gt
                  value: "0"
            - path: regionsDeployed
              value: "{{ len .spec.regions }}"
            - path: databaseEndpoint
              value: "{{ .cross.db.status.endpoint }}"
              when:
                - field: cross.db.found
                  equals: "true"
            - path: credentialsSecret
              value: "{{ .metadata.name }}-creds"