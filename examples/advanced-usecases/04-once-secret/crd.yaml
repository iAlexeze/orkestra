---
# SecureApp — demonstrates once: idempotent secret generation
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: secureapps.advanced.orkestra.io
spec:
  group: advanced.orkestra.io
  scope: Namespaced
  names:
    plural: secureapps
    singular: secureapp
    kind: SecureApp
    shortNames: [sa]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: CredentialsSecret
          type: string
          jsonPath: .status.credentialsSecret
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [image]
              properties:
                image:
                  type: string
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
