apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: webapps.apps.example.io
spec:
  group: apps.example.io
  scope: Namespaced
  names:
    kind: WebApp
    plural: webapps
    singular: webapp
    shortNames:
      - wapp
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                image:
                  type: string
                replicas:
                  type: integer
                  format: int32
                region:
                  type: string
                env:
                  type: object
                  additionalProperties:
                    type: string
                database:
                  type: object
                  properties:
                    secretName:
                      type: string
                    userKey:
                      type: string
                    passwordKey:
                      type: string
                config:
                  type: object
                  properties:
                    configMapName:
                      type: string
                    flagsKey:
                      type: string
                envFrom:
                  type: object
                  properties:
                    configMapRef:
                      type: string
                    secretRef:
                      type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                image:
                  type: string
                region:
                  type: string
                dbUser:
                  type: string
                flagsLoaded:
                  type: string
      subresources:
        status: {}
