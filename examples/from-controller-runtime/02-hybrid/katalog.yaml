# Schema reference: https://orkestra.sh/docs/reference/schema/katalog/
apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: webapp-hooks
  author: myorg
  version: 1.0.0
  description: >
    The WebApp operator in hybrid mode. The Deployment is declared in the Katalog.
    The Service is created by a Go hook. Both run inside the same Orkestra reconcile loop.
  tags:
    - migration
    - hooks
    - typed

spec:
  crds:
    hybridApp:
      apiTypes:
        group: migration.demo.orkestra.io
        version: v1alpha1
        kind: WebApp
        plural: webapps
        object: WebApp
        objectList: WebAppList
        location: github.com/orkspace/from-controller-runtime-demo/api/v1alpha1
        alias: demov1alpha1

      allowedNamespaces:
        - default

      operatorBox:
        default: true   # GenericReconciler still runs — hook is additive

        # Declared resources — Orkestra creates and drift-corrects these.
        # The hook references the ServiceAccount by the same naming convention.
        onCreate:
          serviceAccounts:
            - name: "{{ .metadata.name }}-sa"
          deployments:
            - name: "{{ .metadata.name }}"
              image: "{{ .spec.image }}"
              replicas: "{{ .spec.replicas }}"
              port: "{{ .spec.port }}"
              serviceAccountName: "{{ .metadata.name }}-sa"
              reconcile: true

        # The hook creates the Service with type-safe access to obj.Spec.Port.
        hooks:
          location: github.com/orkspace/from-controller-runtime-demo/hooks
          function: WebAppHooks
          alias: webhooks
          runHooksFirst: true
          resources:
            - kind: Service

        status:
          fields:
            - path: phase
              value: "Running"
            - path: endpoint
              value: "{{ .metadata.name }}-svc.{{ .metadata.namespace }}.svc.cluster.local"
            - path: replicas
              value: "{{ .spec.replicas }}"
