apiVersion: orkestra.orkspace.io/v1
kind: Simulate
metadata:
  name: admission-protection-bad-sim
  description: >
    Bad CR — image from public registry fails the myorg/ prefix validation rule.
    The reconciler errors on every cycle; no StatefulSet or Service is created.

spec:
  katalog: ./katalog.yaml
  cr: ./cr-bad.yaml
  cycles: 5

  expect:
    steady: false
    noErrors: false
