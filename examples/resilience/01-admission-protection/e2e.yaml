apiVersion: orkestra.orkspace.io/v1
kind: E2E
metadata:
  name: admission-protection-e2e
  description: >
    Verify that the runtime admission layer catches invalid CRs on every reconcile,
    degrades the operator after failureThreshold is exceeded, and recovers
    automatically when a valid CR is applied.

spec:
  katalog: ./katalog.yaml
  crd: ./crd.yaml
  cr: ./cr-bad.yaml

  cluster:
    provider: kind
    name: ork-e2e-admission
    reuse: false

  expect:
    - name: Bad CR causes consecutive failures and operator degrades
      after: cr-applied
      wait: 30s
      timeout: 120s
      kubectl:
        port-forward:
          - namespace: orkestra-system
            port: 8080
            path: /katalog/blockchainapp/health
            leaderElection:
              lease: orkestra-konductor
            jq: healthy
            equals: "false"
          - namespace: orkestra-system
            port: 8080
            path: /katalog/blockchainapp/health
            leaderElection:
              lease: orkestra-konductor
            jq: state
            equals: "degraded"

    - name: Consecutive failures exceed threshold
      after: cr-applied
      timeout: 30s
      kubectl:
        port-forward:
          - namespace: orkestra-system
            port: 8080
            path: /katalog/blockchainapp/health
            leaderElection:
              lease: orkestra-konductor
            jq: consecutiveFails
            greaterThan: "2"

    - name: Last error contains the validation message
      after: cr-applied
      timeout: 30s
      kubectl:
        port-forward:
          - namespace: orkestra-system
            port: 8080
            path: /katalog/blockchainapp/health
            leaderElection:
              lease: orkestra-konductor
            jq: lastError
            outputContains: "images must come from the internal registry"

    - name: Katalog is degraded but runtime is still operational
      after: cr-applied
      timeout: 30s
      kubectl:
        port-forward:
          - namespace: orkestra-system
            port: 8080
            path: /katalog
            leaderElection:
              lease: orkestra-konductor
            jq: .OrkReady
            equals: "true"
          - namespace: orkestra-system
            port: 8080
            path: /katalog
            leaderElection:
              lease: orkestra-konductor
            jq: .healthy
            equals: "false"
          - namespace: orkestra-system
            port: 8080
            path: /katalog
            leaderElection:
              lease: orkestra-konductor
            jq: .degradedReason
            outputContains: "degraded"

    - name: No StatefulSet created — bad CR never reached the operatorBox
      after: cr-applied
      timeout: 30s
      resources:
        - kind: StatefulSet
          name: my-chain
          namespace: default
          count: 0

    - name: Patch CR to valid image
      after: cr-applied
      timeout: 30s
      kubectl:
        patch:
          - kind: BlockchainApp
            name: my-chain
            namespace: default
            patch: '{"spec":{"image":"myorg/blockchain-node:v1.0.0"}}'
        get:
          - kind: BlockchainApp
            name: my-chain
            namespace: default
            field: spec.image
            equals: "myorg/blockchain-node:v1.0.0"

    - name: Operator recovers — state is healthy
      after: cr-applied
      timeout: 120s
      kubectl:
        port-forward:
          - namespace: orkestra-system
            port: 8080
            path: /katalog/blockchainapp/health
            leaderElection:
              lease: orkestra-konductor
            jq: state
            equals: "healthy"

    - name: Consecutive failures reset to zero
      after: cr-applied
      timeout: 30s
      kubectl:
        port-forward:
          - namespace: orkestra-system
            port: 8080
            path: /katalog/blockchainapp/health
            leaderElection:
              lease: orkestra-konductor
            jq: consecutiveFails
            equals: "0"

    - name: Last error preserved for audit trail after recovery
      after: cr-applied
      timeout: 30s
      kubectl:
        port-forward:
          - namespace: orkestra-system
            port: 8080
            path: /katalog/blockchainapp/health
            leaderElection:
              lease: orkestra-konductor
            jq: lastError
            outputContains: "images must come from the internal registry"

    - name: StatefulSet and Service created after valid CR
      after: cr-applied
      timeout: 60s
      resources:
        - kind: StatefulSet
          name: my-chain
          namespace: default
        - kind: Service
          name: my-chain-rpc
          namespace: default

    - name: Cleanup
      after: cr-deleted
      timeout: 60s
      resources:
        - kind: StatefulSet
          name: my-chain
          namespace: default
          count: 0
        - kind: Service
          name: my-chain-rpc
          namespace: default
          count: 0
