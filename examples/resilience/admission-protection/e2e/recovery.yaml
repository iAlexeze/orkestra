expect:
  - name: Patch CR to valid image
    after: cr-applied
    timeout: 30s
    kubectl:
      patch:
        - kind: BlockchainApp
          name: my-chain
          namespace: default
          patch: '{"spec":{"image":"myorg/blockchain-node:v1.0.0"}}'
      get:
        - kind: BlockchainApp
          name: my-chain
          namespace: default
          field: spec.image
          equals: "myorg/blockchain-node:v1.0.0"

  - name: Operator recovers — state is healthy
    after: cr-applied
    timeout: 120s
    kubectl:
      port-forward:
        - namespace: orkestra-system
          port: 8080
          path: /katalog/blockchainapp/health
          leaderElection:
            lease: orkestra-konductor
          jq: state
          equals: "healthy"

  - name: Consecutive failures reset to zero
    after: cr-applied
    timeout: 30s
    kubectl:
      port-forward:
        - namespace: orkestra-system
          port: 8080
          path: /katalog/blockchainapp/health
          leaderElection:
            lease: orkestra-konductor
          jq: consecutiveFails
          equals: "0"

  - name: Last error preserved for audit trail after recovery
    after: cr-applied
    timeout: 30s
    kubectl:
      port-forward:
        - namespace: orkestra-system
          port: 8080
          path: /katalog/blockchainapp/health
          leaderElection:
            lease: orkestra-konductor
          jq: lastError
          outputContains: "images must come from the internal registry"

  - name: StatefulSet and Service created after valid CR
    after: cr-applied
    timeout: 60s
    resources:
      - kind: StatefulSet
        name: my-chain
        namespace: default
      - kind: Service
        name: my-chain-rpc
        namespace: default
