expect:
  - name: Bad CR causes consecutive failures and operator degrades
    after: cr-applied
    wait: 30s
    timeout: 120s
    kubectl:
      port-forward:
        - namespace: orkestra-system
          port: 8080
          path: /katalog/blockchainapp/health
          leaderElection:
            lease: orkestra-konductor
          jq: healthy
          equals: "false"
        - namespace: orkestra-system
          port: 8080
          path: /katalog/blockchainapp/health
          leaderElection:
            lease: orkestra-konductor
          jq: state
          equals: "degraded"

  - name: Consecutive failures exceed threshold
    after: cr-applied
    timeout: 30s
    kubectl:
      port-forward:
        - namespace: orkestra-system
          port: 8080
          path: /katalog/blockchainapp/health
          leaderElection:
            lease: orkestra-konductor
          jq: consecutiveFails
          greaterThan: "2"

  - name: Last error contains the validation message
    after: cr-applied
    timeout: 30s
    kubectl:
      port-forward:
        - namespace: orkestra-system
          port: 8080
          path: /katalog/blockchainapp/health
          leaderElection:
            lease: orkestra-konductor
          jq: lastError
          outputContains: "images must come from the internal registry"

  - name: Katalog is degraded but runtime is still operational
    after: cr-applied
    timeout: 30s
    kubectl:
      port-forward:
        - namespace: orkestra-system
          port: 8080
          path: /katalog
          leaderElection:
            lease: orkestra-konductor
          jq: .OrkReady
          equals: "true"
        - namespace: orkestra-system
          port: 8080
          path: /katalog
          leaderElection:
            lease: orkestra-konductor
          jq: .healthy
          equals: "false"
        - namespace: orkestra-system
          port: 8080
          path: /katalog
          leaderElection:
            lease: orkestra-konductor
          jq: .degradedReason
          outputContains: "degraded"

  - name: No StatefulSet created — bad CR never reached the operatorBox
    after: cr-applied
    timeout: 30s
    resources:
      - kind: StatefulSet
        name: my-chain
        namespace: default
        count: 0
