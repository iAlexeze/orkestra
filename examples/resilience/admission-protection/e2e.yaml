apiVersion: orkestra.orkspace.io/v1
kind: E2E
metadata:
  name: admission-protection-e2e
  description: >
    Verify that the runtime admission layer catches invalid CRs on every reconcile,
    degrades the operator after failureThreshold is exceeded, and recovers
    automatically when a valid CR is applied.

spec:
  katalog: ./katalog.yaml
  crd: ./crd.yaml
  cr: ./cr-bad.yaml

  cluster:
    provider: kind
    name: ork-e2e-admission
    reuse: false

  expect:
    - include: ./e2e/degraded.yaml
    - include: ./e2e/recovery.yaml
    - include: ./e2e/cleanup.yaml
