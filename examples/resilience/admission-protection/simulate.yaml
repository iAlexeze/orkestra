apiVersion: orkestra.orkspace.io/v1
kind: Simulate
metadata:
  name: admission-protection-sim
  description: >
    Happy path — valid CR passes runtime validation and the operator creates
    the StatefulSet and Service in cycle 1. Steady state at cycle 2.

spec:
  katalog: ./katalog.yaml
  cr: ./cr-good.yaml
  cycles: 5

  expect:
    steady: true
    noErrors: true
    ops:
      - cycle: 1
        verb: create
        resource: statefulsets
        name: my-chain
      - cycle: 1
        verb: create
        resource: services
        name: my-chain-rpc
