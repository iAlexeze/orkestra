apiVersion: safe.demo.orkestra.io/v1alpha1
kind: App
metadata:
  name: my-app
  namespace: default
spec:
  image: nginx:1.25
  replicas: 1
  # config is deliberately omitted — it is an optional pointer field.
  # The hook dereferences obj.Spec.Config.Endpoint without a nil check.
  # This panics. safeReconcile catches it and keeps the operator running.
