apiVersion: orkestra.orkspace.io/v1
kind: E2E
metadata:
  name: safe-reconcile-e2e
  description: >
    Verify that a panicking typed hook does not crash the operator.
    Monitor and Queue (declarative) keep reconciling. The operator pod stays running.

spec:
  katalog: ./katalog.yaml
  crd: ./crd-typed.yaml
  cr: ./cr-app.yaml
  valuesFiles:
    - ./values.yaml


  cluster:
    provider: kind
    name: ork-e2e
    reuse: false

  setup:
    - ./crd-declarative.yaml
    - ./cr-monitor.yaml
    - ./cr-queue.yaml

  expect:
    - name: Monitor ConfigMap created
      after: cr-applied
      timeout: 60s
      resources:
        - kind: ConfigMap
          name: my-monitor-monitor-config
          namespace: default

    - name: Queue ConfigMap created
      after: cr-applied
      timeout: 60s
      resources:
        - kind: ConfigMap
          name: my-queue-queue-config
          namespace: default

    - name: Operator stays running despite App panic
      after: cr-applied
      timeout: 30s
      commands:
        - run: kubectl get pod -l app.kubernetes.io/name=orkestra -n orkestra-system -o jsonpath='{.items[0].status.phase}'
          outputContains: Running

    - name: Panic logged and recovered
      after: cr-applied
      timeout: 30s
      commands:
        - run: kubectl logs -l app.kubernetes.io/name=orkestra -n orkestra-system --tail=200
          outputContains: "reconciler panic recovered"

    - name: Delete Queue and Monitor CRs
      after: cr-applied
      timeout: 30s
      commands:
        - run: kubectl delete -f ./cr-monitor.yaml
        - run: kubectl delete -f ./cr-queue.yaml

    - name: Monitor and Queue CRs removed
      after: cr-deleted
      timeout: 30s
      resources:
        - kind: Monitor
          name: my-monitor
          namespace: default
          count: 0
        - kind: Queue
          name: my-queue
          namespace: default
          count: 0

    - name: Monitor ConfigMap removed on delete
      after: cr-deleted
      timeout: 30s
      resources:
        - kind: ConfigMap
          name: my-monitor-monitor-config
          namespace: default
          count: 0

    - name: Queue ConfigMap removed on delete
      after: cr-deleted
      timeout: 30s
      resources:
        - kind: ConfigMap
          name: my-queue-queue-config
          namespace: default
          count: 0
