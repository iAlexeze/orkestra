apiVersion: orkestra.orkspace.io/v1
kind: Simulate
metadata:
  name: safe-reconcile-monitor-sim
  description: Monitor declarative CRD creates a ConfigMap and reaches steady state

spec:
  katalog: ./katalog.yaml
  cr: ./cr-monitor.yaml
  cycles: 3

  expect:
    steady: true
    noErrors: true
    ops:
      - cycle: 1
        verb: create
        resource: configmaps
        name: my-monitor-monitor-config
