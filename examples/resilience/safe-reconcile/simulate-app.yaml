apiVersion: orkestra.orkspace.io/v1
kind: Simulate
metadata:
  name: safe-reconcile-app-sim
  description: >
    App typed CRD panics on every reconcile — safeReconcile catches it.
    Errors are expected. The simulate verifies the panic is recovered and
    does not affect the simulate runner.

spec:
  katalog: ./katalog.yaml
  cr: ./cr-app.yaml
  cycles: 3

  expect:
    steady: false
    noErrors: true
