apiVersion: orkestra.orkspace.io/v1
kind: Simulate
metadata:
  name: safe-reconcile-queue-sim
  description: Queue declarative CRD creates a ConfigMap and reaches steady state

spec:
  katalog: ./katalog.yaml
  cr: ./cr-queue.yaml
  cycles: 3

  expect:
    steady: true
    noErrors: true
    ops:
      - cycle: 1
        verb: apply
        resource: configmaps
        name: my-queue-queue-config
