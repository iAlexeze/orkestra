apiVersion: orkestra.orkspace.io/v1
kind: E2E
metadata:
  name: crd-missing-recovery-e2e
  description: >
    Verify that Orkestra detects a CRD deleted at runtime, degrades the operator,
    retries in a loop, and recovers automatically when the CRD and CR are restored.

spec:
  katalog: ./katalog.yaml
  crd: ./crd.yaml
  cr: ./cr.yaml

  cluster:
    provider: kind
    name: ork-e2e-crd-recovery
    reuse: false

  expect:
    - include: ./e2e/health-check.yaml
    - include: ./e2e/crd-loss.yaml
    - include: ./e2e/recovery.yaml
    - include: ./e2e/cleanup.yaml
