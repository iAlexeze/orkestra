apiVersion: orkestra.orkspace.io/v1
kind: E2E
metadata:
  name: crd-missing-recovery-e2e
  description: >
    Verify that Orkestra detects a CRD deleted at runtime, degrades the operator,
    retries in a loop, and recovers automatically when the CRD and CR are restored.

spec:
  katalog: ./katalog.yaml
  crd: ./crd.yaml
  cr: ./cr.yaml

  cluster:
    provider: kind
    name: ork-e2e-crd-recovery
    reuse: false

  expect:
    - name: Operator starts healthy
      after: cr-applied
      timeout: 60s
      kubectl:
        port-forward:
          - namespace: orkestra-system
            port: 8080
            path: /katalog/blockchainapp/health
            leaderElection:
              lease: orkestra-konductor
            jq: state
            equals: "healthy"

    - name: Delete CRD — simulate runtime CRD loss
      after: cr-applied
      timeout: 30s
      commands:
        - run: kubectl delete -f ./crd.yaml
          exitCode: 0

    - name: Operator detects missing CRD and degrades
      after: cr-applied
      # 120s: the in-cluster CRD check loop runs every 90s — timeout must exceed one full tick
      timeout: 120s
      kubectl:
        port-forward:
          - namespace: orkestra-system
            port: 8080
            path: /katalog/blockchainapp/health
            leaderElection:
              lease: orkestra-konductor
            jq: state
            equals: "degraded"
          - namespace: orkestra-system
            port: 8080
            path: /katalog/blockchainapp/health
            leaderElection:
              lease: orkestra-konductor
            jq: lastError
            outputContains: "CRD missing at runtime"

    - name: Katalog is degraded but runtime is still operational
      after: cr-applied
      timeout: 30s
      kubectl:
        port-forward:
          - namespace: orkestra-system
            port: 8080
            path: /katalog
            leaderElection:
              lease: orkestra-konductor
            jq: .OrkReady
            equals: "true"
          - namespace: orkestra-system
            port: 8080
            path: /katalog
            leaderElection:
              lease: orkestra-konductor
            jq: .healthy
            equals: "false"

    - name: Re-apply CRD — operator flips to pending
      after: cr-applied
      # 120s: re-activation also runs on the 90s in-cluster loop
      timeout: 120s
      kubectl:
        apply:
          - file: ./crd.yaml
        port-forward:
          - namespace: orkestra-system
            port: 8080
            path: /katalog/blockchainapp/health
            leaderElection:
              lease: orkestra-konductor
            jq: state
            equals: "pending"

    - name: Re-apply CR — full recovery
      after: cr-applied
      timeout: 60s
      kubectl:
        apply:
          - file: ./cr.yaml
        port-forward:
          - namespace: orkestra-system
            port: 8080
            path: /katalog/blockchainapp/health
            leaderElection:
              lease: orkestra-konductor
            jq: state
            equals: "healthy"
          - namespace: orkestra-system
            port: 8080
            path: /katalog/blockchainapp/health
            leaderElection:
              lease: orkestra-konductor
            jq: consecutiveFails
            equals: "0"

    - name: StatefulSet and Service created after recovery
      after: cr-applied
      timeout: 60s
      resources:
        - kind: StatefulSet
          name: my-chain
          namespace: default
        - kind: Service
          name: my-chain-rpc
          namespace: default

    - name: Last error preserved as audit trail
      after: cr-applied
      timeout: 30s
      kubectl:
        port-forward:
          - namespace: orkestra-system
            port: 8080
            path: /katalog/blockchainapp/health
            leaderElection:
              lease: orkestra-konductor
            jq: lastError
            outputContains: "CRD missing at runtime"

    - name: Cleanup
      after: cr-deleted
      timeout: 60s
      commands:
        - run: kubectl delete -f ./cr.yaml --ignore-not-found
          exitCode: 0
      resources:
        - kind: StatefulSet
          name: my-chain
          namespace: default
          count: 0
        - kind: Service
          name: my-chain-rpc
          namespace: default
          count: 0
