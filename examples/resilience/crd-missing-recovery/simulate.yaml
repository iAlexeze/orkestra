apiVersion: orkestra.orkspace.io/v1
kind: Simulate
metadata:
  name: crd-missing-recovery-sim
  description: >
    Happy path — operator reconciles a valid CR and creates the StatefulSet
    and Service in cycle 1. CRD deletion requires a live cluster; use ork e2e
    for the full degradation and recovery arc.

spec:
  katalog: ./katalog.yaml
  cr: ./cr.yaml
  cycles: 5

  expect:
    steady: true
    noErrors: true
    ops:
      - cycle: 1
        verb: apply
        resource: statefulsets
        name: my-chain
      - cycle: 1
        verb: apply
        resource: services
        name: my-chain-rpc
