expect:
  - name: Delete CRD — simulate runtime CRD loss
    after: cr-applied
    timeout: 30s
    kubectl:
      delete:
        - file: ./crd.yaml

  - name: Operator detects missing CRD and degrades
    after: cr-applied
    # 120s: the in-cluster CRD check loop runs every 90s — timeout must exceed one full tick
    timeout: 120s
    kubectl:
      port-forward:
        - namespace: orkestra-system
          port: 8080
          path: /katalog/blockchainapp/health
          leaderElection:
            lease: orkestra-konductor
          jq: state
          equals: "degraded"
        - namespace: orkestra-system
          port: 8080
          path: /katalog/blockchainapp/health
          leaderElection:
            lease: orkestra-konductor
          jq: lastError
          outputContains: "CRD missing at runtime"

  - name: Katalog is degraded but runtime is still operational
    after: cr-applied
    timeout: 30s
    kubectl:
      port-forward:
        - namespace: orkestra-system
          port: 8080
          path: /katalog
          leaderElection:
            lease: orkestra-konductor
          jq: .OrkReady
          equals: "true"
        - namespace: orkestra-system
          port: 8080
          path: /katalog
          leaderElection:
            lease: orkestra-konductor
          jq: .healthy
          equals: "false"
