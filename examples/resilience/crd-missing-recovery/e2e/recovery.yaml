expect:
  - name: Re-apply CRD — operator flips to pending
    after: cr-applied
    # 120s: re-activation also runs on the 90s in-cluster loop
    timeout: 120s
    kubectl:
      apply:
        - file: ./crd.yaml
      port-forward:
        - namespace: orkestra-system
          port: 8080
          path: /katalog/blockchainapp/health
          leaderElection:
            lease: orkestra-konductor
          jq: state
          equals: "pending"

  - name: Re-apply CR — full recovery
    after: cr-applied
    timeout: 60s
    kubectl:
      apply:
        - file: ./cr.yaml
      port-forward:
        - namespace: orkestra-system
          port: 8080
          path: /katalog/blockchainapp/health
          leaderElection:
            lease: orkestra-konductor
          jq: state
          equals: "healthy"
        - namespace: orkestra-system
          port: 8080
          path: /katalog/blockchainapp/health
          leaderElection:
            lease: orkestra-konductor
          jq: consecutiveFails
          equals: "0"

  - name: StatefulSet and Service created after recovery
    after: cr-applied
    timeout: 60s
    resources:
      - kind: StatefulSet
        name: my-chain
        namespace: default
      - kind: Service
        name: my-chain-rpc
        namespace: default

  - name: Last error preserved as audit trail
    after: cr-applied
    timeout: 30s
    kubectl:
      port-forward:
        - namespace: orkestra-system
          port: 8080
          path: /katalog/blockchainapp/health
          leaderElection:
            lease: orkestra-konductor
          jq: lastError
          outputContains: "CRD missing at runtime"
