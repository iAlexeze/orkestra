expect:
  - name: Cleanup
    after: cr-deleted
    timeout: 60s
    kubectl:
      delete:
        - file: ./cr.yaml
          ignoreNotFound: true
    resources:
      - kind: StatefulSet
        name: my-chain
        namespace: default
        count: 0
      - kind: Service
        name: my-chain-rpc
        namespace: default
        count: 0
