apiVersion: orkestra.orkspace.io/v1
kind: Simulate
metadata:
  name: leader-failover-sim
  description: >
    Happy path — operator reconciles a valid CR and creates the StatefulSet
    and Service in cycle 1. Leader election requires a live multi-replica
    deployment; use ork e2e for the full failover arc.

spec:
  katalog: ./katalog.yaml
  cr: ./cr.yaml
  cycles: 5

  expect:
    steady: true
    noErrors: true
    ops:
      - cycle: 1
        verb: create
        resource: statefulsets
        name: my-chain
      - cycle: 1
        verb: create
        resource: services
        name: my-chain-rpc
