expect:
  - name: Kill the konductor pod
    after: setup-complete
    timeout: 30s
    kubectl:
      delete:
        - leaderElection:
            lease: orkestra-konductor
            namespace: orkestra-system

  - name: New leader elected — lease transitions increment
    after: setup-complete
    timeout: 60s
    kubectl:
      get:
        - kind: Lease
          name: orkestra-konductor
          namespace: orkestra-system
          field: .spec.leaseTransitions
          equals: "1"

  - name: New leader serves authoritative state
    after: setup-complete
    timeout: 60s
    kubectl:
      port-forward:
        - namespace: orkestra-system
          port: 8080
          path: /katalog/blockchainapp/health
          leaderElection:
            lease: orkestra-konductor
          jq: state
          equals: "healthy"

  - name: New leader log confirms election
    after: setup-complete
    timeout: 30s
    kubectl:
      logs:
        - leaderElection:
            lease: orkestra-konductor
            namespace: orkestra-system
          namespace: orkestra-system
          outputContains: "became konductor"

  - name: Resources intact after failover
    after: setup-complete
    timeout: 30s
    resources:
      - kind: StatefulSet
        name: my-chain
        namespace: default
      - kind: Service
        name: my-chain-rpc
        namespace: default
