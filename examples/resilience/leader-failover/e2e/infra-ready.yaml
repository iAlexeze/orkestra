expect:
  - name: Leader elected — konductor log emitted
    after: setup-complete
    timeout: 60s
    kubectl:
      logs:
        - leaderElection:
            lease: orkestra-konductor
            namespace: orkestra-system
          namespace: orkestra-system
          outputContains: "became konductor"

  - name: Apply CR and verify operator reconciles
    after: setup-complete
    timeout: 60s
    kubectl:
      apply:
        - file: ./cr.yaml
      port-forward:
        - namespace: orkestra-system
          port: 8080
          path: /katalog/blockchainapp/health
          leaderElection:
            lease: orkestra-konductor
          jq: state
          equals: "healthy"

  - name: StatefulSet and Service created by leader
    after: setup-complete
    timeout: 60s
    resources:
      - kind: StatefulSet
        name: my-chain
        namespace: default
      - kind: Service
        name: my-chain-rpc
        namespace: default
