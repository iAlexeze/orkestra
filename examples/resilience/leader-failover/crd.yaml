apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: blockchainapps.resilience.demo.orkestra.io
spec:
  group: resilience.demo.orkestra.io
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                replicas:
                  type: integer
                  default: 1
                port:
                  type: integer
                  default: 8545
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
  names:
    kind: BlockchainApp
    plural: blockchainapps
    singular: blockchainapp
  scope: Namespaced
