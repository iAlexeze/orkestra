runtime.image:
  replicaCount: 2

  # Leader election configuration.
  # leaseDuration — how long a follower waits before declaring the leader lost (seconds)
  # renewDeadline — how long the leader tries to renew before giving up (seconds)
  # retryPeriod   — how often followers retry acquiring the lease (seconds)
  #
  # Defaults match the values below. A follower is elected within leaseDuration
  # of the leader pod disappearing.
  leaderElection:
    enabled: true
    leaseDuration: 15
    renewDeadline: 10
    retryPeriod: 5

controlCenter:
  enabled: false
