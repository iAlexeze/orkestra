apiVersion: orkestra.orkspace.io/v1
kind: E2E
metadata:
  name: leader-failover-e2e
  description: >
    Verify that when the konductor pod is killed, a follower is elected within
    leaseDuration and reconciliation continues. Uses a helm-deployed runtime
    with replicaCount: 2 so a follower is always ready.

spec:
  custom:
    target: kubernetes

  cluster:
    provider: kind
    name: ork-e2e-leader-failover
    reuse: false

  setup:
    apply:
      - path: ./crd.yaml
        wait:
          - kind: CustomResourceDefinition
            name: blockchainapps.resilience.demo.orkestra.io
            timeout: 30s
      - path: ./bundle.yaml
        wait:
          - kind: ConfigMap
            name: orkestra-katalog
            namespace: orkestra-system
            timeout: 30s
    helm:
      - repo: https://orkspace.github.io/orkestra
        chart: orkestra
        release: orkestra
        namespace: orkestra-system
        createNamespace: true
        values:
          runtime.replicaCount: 2
          controlCenter.enabled: false
        wait:
          - kind: Deployment
            name: orkestra-runtime
            namespace: orkestra-system
            ready: true
            timeout: 120s

  expect:
    - include: ./e2e/infra-ready.yaml
    - include: ./e2e/failover.yaml
    - include: ./e2e/cleanup.yaml
