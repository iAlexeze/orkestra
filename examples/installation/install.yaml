# Orkestra runtime Deployment.
# The Katalog is mounted from the 'orkestra-katalog' ConfigMap.
# Replace the ConfigMap data with your Katalog YAML before applying.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orkestra-runtime
  namespace: orkestra-system
  labels:
    app.kubernetes.io/name: orkestra
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: orkestra
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orkestra
    spec:
      serviceAccountName: orkestra
      containers:
        - name: orkestra
          image: ghcr.io/orkspace/orkestra:rc.0.0.1
          imagePullPolicy: Always
          args:
            - run
            - --katalog=/etc/orkestra/katalog.yaml
          env:
            - name: HEALTH_PORT
              value: "8080"
            - name: LOG_LEVEL
              value: "info"
            - name: DEFAULT_WORKERS
              value: "3"
            - name: DEFAULT_RESYNC
              value: "15s"
            - name: SHUTDOWN_TIMEOUT
              value: "30s"
            - name: SHUTDOWN_GRACE
              value: "10s"
            - name: ORKESTRA_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: health
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: katalog
              mountPath: /etc/orkestra
              readOnly: true
      volumes:
        - name: katalog
          configMap:
            name: orkestra-katalog

---
# Service for health checks
apiVersion: v1
kind: Service
metadata:
  name: orkestra
  namespace: orkestra-system
  labels:
    app.kubernetes.io/name: orkestra
spec:
  selector:
    app.kubernetes.io/name: orkestra
  ports:
    - name: health
      port: 8080
      targetPort: health
      protocol: TCP