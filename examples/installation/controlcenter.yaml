---
# ─────────────────────────────────────────────────────────────────────────────
# Orkestra Control Center Deployment
# Provides web UI for monitoring multiple Orkestra runtimes
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orkestra-cc-rc
  namespace: orkestra-system
  labels:
    app.kubernetes.io/name: orkestra
    app.kubernetes.io/component: control-center-rc
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: orkestra
      app.kubernetes.io/component: control-center-rc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orkestra
        app.kubernetes.io/component: control-center-rc
    spec:
      serviceAccountName: orkestra-cc
      containers:
        - name: control-center
          image: ialexeze/ork:controlcenter.0.11rc
          imagePullPolicy: Always
          args:
            - -u
            - "http://orkestra:8080"
            - -p
            - "8090"
            - --refresh
            - "10s"
            - --log-level
            - "info"
          env:
            - name: LOG_LEVEL
              value: "info"
          ports:
            - name: http
              containerPort: 8090
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /controlcenter/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /controlcenter/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
            capabilities:
              drop:
                - ALL
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001

---
# Control Center Service
apiVersion: v1
kind: Service
metadata:
  name: orkestra-cc-rc
  namespace: orkestra-system
  labels:
    app.kubernetes.io/name: orkestra
    app.kubernetes.io/component: control-center-rc
spec:
  selector:
    app.kubernetes.io/name: orkestra
    app.kubernetes.io/component: control-center-rc
  ports:
    - name: http
      port: 8090
      targetPort: http
      protocol: TCP
  type: ClusterIP

---
# Optional: Control Center Ingress (expose to outside)
# Uncomment to expose the Control Center externally
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: orkestra-cc-rc
  namespace: orkestra-system
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
spec:
  ingressClassName: nginx
  rules:
  - host: cc.orkestra.sh
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: orkestra-cc-rc
            port:
              number: 8090
