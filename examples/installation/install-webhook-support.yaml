# Orkestra runtime Deployment.
# The Katalog is mounted from the 'orkestra-katalog' ConfigMap.
# Replace the ConfigMap data with your Katalog YAML before applying.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orkestra-runtime
  namespace: orkestra-system
  labels:
    # Deletion protection labels 
    app.kubernetes.io/name: orkestra
    app.kubernetes.io/component: orkestra-internal
spec:
  replicas: 2
  selector:
    matchLabels:
      # Deletion protection labels 
      app.kubernetes.io/name: orkestra
      app.kubernetes.io/component: orkestra-internal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orkestra
        app.kubernetes.io/component: orkestra-internal
    spec:
      serviceAccountName: orkestra
      containers:
        - name: orkestra
          image: ghcr.io/ialexeze/orkestra:0.1.3
          imagePullPolicy: Always
          args:
            - run
            - --katalog=/etc/orkestra/katalog.yaml
          env:
            - name: ORK_PORT
              value: "8080"
            - name: LOG_LEVEL
              value: "info"
            - name: DEFAULT_WORKERS
              value: "3"
            - name: DEFAULT_RESYNC
              value: "15s"
            - name: SHUTDOWN_TIMEOUT
              value: "30s"
            - name: SHUTDOWN_GRACE
              value: "10s"
            - name: ORKESTRA_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: ENABLE_ADMISSION_WEBHOOK
              value: "false"
            - name: ENABLE_CONVERSION
              value: "true"
            - name: TLS_CERT
              value: "/tls/tls.crt"
            - name: TLS_KEY
              value: "/tls/tls.key"
          ports:
            - name: health
              containerPort: 8080
              protocol: TCP
            - name: webhook
              containerPort: 8443
              protocol: TCP
          startupProbe:
            httpGet:
              path: /startup
              port: health
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: katalog
              mountPath: /etc/orkestra
              readOnly: true
            - name: tls
              mountPath: /tls
              readOnly: true
      volumes:
        - name: katalog
          configMap:
            name: orkestra-katalog
        - name: tls
          secret:
            secretName: orkestra-tls

---
# Service for health checks and webhook endpoints
apiVersion: v1
kind: Service
metadata:
  name: orkestra
  namespace: orkestra-system
  labels:
    # Deletion protection labels 
    app.kubernetes.io/name: orkestra
    app.kubernetes.io/component: orkestra-internal
spec:
  selector:
    # Deletion protection labels 
    app.kubernetes.io/name: orkestra
    app.kubernetes.io/component: orkestra-internal
  ports:
    - name: health
      port: 8080
      targetPort: 8080
    - name: webhook
      port: 8443
      targetPort: 8443

---
# Orkestra Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: orkestra
  namespace: orkestra-system
  labels:
    # Deletion protection labels 
    app.kubernetes.io/name: orkestra
    app.kubernetes.io/component: orkestra-internal
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
spec:
  ingressClassName: nginx
  rules:
  - host: o.orkestra.sh
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: orkestra
            port:
              number: 8080
