apiVersion: orkestra.konductor.io/v1Alpha
kind: Katalog
metadata:
  name: website-katalog
  description: >-
    Manages the Website CRD.
    For every Website CR, Orkestra creates a Deployment and a Service.
    No Go code required.

spec:
  finalizers:
    - finalizer.demo.orkestra.io/website

  crds:
    - name: pod-governance
      apiTypes:
        kind: Pod          # built-in — Kubernetes knows the rest
      reconciler:
        default: true
    - name: deployment-watcher
      apiTypes:
        kind: Deployment
      reconciler:
        default: true
    - name: secrets-manager
      apiTypes:
        kind: Secret
      reconciler:
        default: true

      # validation:
      #   - field: metadata.ownerReferences
      #     operator: exists
      #     message: "orphaned pods are not permitted — all pods must have an owner"
      #     action: cleanup
      #     gracePeriodSeconds: 0    # immediate
      #     dryRun: false            # when you are confident. Start with true.

      # restrictedNamespaces:
      #   - kube-system              # never clean up system pods
      #   - cert-manager

    - name: backend
      apiTypes:
        group: orkestra.konduktor.io
        version: v1alpha1
        kind: OrkApp
        plural: orkapps
      reconciler:
        default: true

    - name: frontend
      enabled: true     # Default
      namespaced: true  # Default
      workers: 2
      resync: 30s
      dependsOn:
        - backend

      apiTypes:
        group: demo.orkestra.io
        version: v1alpha1
        kind: Website
        plural: websites
        # location omitted — no compiled types needed
        # Orkestra uses *unstructured.Unstructured automatically

      reconciler:
        default: true
        # validation:
        #   - field: spec.replicas
        #     max: 10
        #     message: "replicas cannot exceed 10"
        #   - field: spec.image
        #     prefix: "myorg/"
        #     message: "image must be from myorg registry"
        # mutation:
        #   - field: spec.replicas
        #     default: "1"
        #   - field: spec.logLevel
        #     default: "info"

        finalizers:
          - finalizer.demo.orkestra.io/website

        # ── onCreate ──────────────────────────────────────────────────────
        # Runs on every reconcile. Create is idempotent — skipped if exists.
        # reconcile: true means also apply as drift correction — no need to
        # declare the same resource again under onReconcile.

        onCreate:
          deployments:
            - name: "{{ .metadata.name }}"
              image: "{{ .spec.image }}"
              replicas: "{{ .spec.replicas }}"
              port: "{{ .spec.port }}"
              namespace: "{{ .metadata.namespace }}"
              reconcile: true
              labels:
                - key: app
                  value: "{{ .metadata.name }}"
                - key: managed-by
                  value: orkestra

          services:
            - name: "{{ .metadata.name }}-svc"
              type: "{{ .spec.serviceType }}"
              port: "80"
              targetPort: "{{ .spec.port }}"
              namespace: "{{ .metadata.namespace }}"
              reconcile: true
              # when:
              #   - field: spec.exposePublicly
              #     eqauls: "true"
              labels:
                - key: app
                  value: "{{ .metadata.name }}"
                - key: managed-by
                  value: orkestra

        # onDelete — owner references handle Deployment + Service cleanup
        # automatically. No explicit onDelete needed.

      queue:
        maxQueueDepth: 500

      description: >-
        Manages a web application Deployment and Service pair.
        Declare what you want in the Website CR spec — Orkestra handles the rest.