apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: websites.demo.orkestra.io
spec:
  group: demo.orkestra.io
  scope: Namespaced
  names:
    plural: websites
    singular: website
    kind: Website
    listKind: WebsiteList
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - image
              properties:
                image:
                  type: string
                  description: Container image to run.
                  example: nginx:1.25
                replicas:
                  type: integer
                  default: 1
                  minimum: 1
                  maximum: 20
                  description: Number of pod replicas.
                port:
                  type: integer
                  default: 80
                  minimum: 1
                  maximum: 65535
                  description: Port the container listens on.
                serviceType:
                  type: string
                  default: ClusterIP
                  enum:
                    - ClusterIP
                    - NodePort
                    - LoadBalancer
                  description: Kubernetes Service type.
            status:
              type: object
              properties:
                phase:
                  type: string
                message:
                  type: string
                readyReplicas:
                  type: integer
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Image
          type: string
          jsonPath: .spec.image
        - name: Replicas
          type: integer
          jsonPath: .spec.replicas
        - name: Type
          type: string
          jsonPath: .spec.serviceType
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp