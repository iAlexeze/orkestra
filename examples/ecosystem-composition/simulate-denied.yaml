apiVersion: orkestra.orkspace.io/v1
kind: Simulate
metadata:
  name: ecosystem-composition-denied-sim
  description: >
    Soft-failure suite for the ecosystem-composition pack.
    Aggregates scenarios that exercise enforcement WITHOUT halting the reconcile:
      - prometheus (warn path): resources created despite missing fields
      - crossplane (gate path): reconcile skips PostgreSQLInstance when unapproved

    Hard-deny scenarios (argocd, cert-manager) halt the reconcile loop and produce
    cycle errors — they exit 1 by design. Run them individually to observe the output:
      ork simulate -f 00-argocd/katalog.yaml --cr 00-argocd/cr-denied.yaml 00-argocd/simulate-denied.yaml
      ork simulate -f 01-cert-manager/katalog.yaml --cr 01-cert-manager/cr-denied.yaml 01-cert-manager/simulate-denied.yaml

imports:
  - ./02-prometheus/simulate-denied.yaml
  - ./03-crossplane/simulate-denied.yaml
