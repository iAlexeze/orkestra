# Schema reference: https://orkestra.sh/docs/reference/schema/simulate/
apiVersion: orkestra.orkspace.io/v1
kind: Simulate
metadata:
  name: app-operator-sim
  description: >
    Verify the App operator creates an ArgoCD Application in cycle 1.
    Admission is validated — the cr.yaml must have spec.labels.team set.

spec:
  katalog: ./katalog.yaml
  cr: ./cr.yaml
  cycles: 3

  expect:
    steady: true
    noErrors: true
    ops:
      - cycle: 1
        verb: create
        resource: applications
