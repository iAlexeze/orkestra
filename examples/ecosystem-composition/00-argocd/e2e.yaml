# Schema reference: https://orkestra.sh/docs/reference/schema/e2e/
apiVersion: orkestra.orkspace.io/v1
kind: E2E
metadata:
  name: app-operator-e2e
  description: >
    App operator e2e — ArgoCD installed via setup.helm.
    Verifies an App CR creates an ArgoCD Application. Does not assert sync —
    syncing requires a real reachable repo. The Application CR existing is the contract.

spec:
  katalog: ./katalog.yaml
  crd: ./crd.yaml
  cr: ./cr.yaml

  cluster:
    provider: kind
    name: ork-e2e
    reuse: false

  setup:
    helm:
      - repo: https://argoproj.github.io/argo-helm
        chart: argo-cd
        namespace: argocd
        createNamespace: true
        version: "7.3.11"
    wait:
      - kind: Deployment
        name: argo-cd-argocd-server
        namespace: argocd
        ready: true
        timeout: 180s

  expect:
    - name: App CR created
      after: cr-applied
      timeout: 30s
      resources:
        - kind: App
          name: my-webapp
          namespace: default

    - name: ArgoCD Application created
      after: cr-applied
      timeout: 60s
      commands:
        - run: kubectl get application my-webapp -n argocd -o jsonpath='{.metadata.name}'
          outputContains: my-webapp

    - name: Denied CR blocked by team label rule
      after: cr-applied
      timeout: 30s
      commands:
        - run: kubectl apply -f cr-denied.yaml
        - run: |
            sleep 5
            kubectl get application bad-app -n argocd --ignore-not-found -o jsonpath='{.metadata.name}'
          outputContains: ""
        - run: kubectl delete -f cr-denied.yaml --ignore-not-found

    - name: Cleanup verified
      after: cr-deleted
      timeout: 30s
      resources:
        - kind: App
          name: my-webapp
          namespace: default
          count: 0
      commands:
        - run: kubectl get application my-webapp -n argocd --ignore-not-found -o jsonpath='{.metadata.name}'
          outputContains: ""
