# Schema reference: https://orkestra.sh/docs/reference/schema/simulate/
apiVersion: orkestra.orkspace.io/v1
kind: Simulate
metadata:
  name: app-operator-denied-sim
  description: >
    Denial path: cr-denied.yaml is missing metadata.labels.team.
    The "operator: exists" rule fires at every reconcile cycle and halts
    the operator — no ArgoCD Application is ever created.

spec:
  katalog: ./katalog.yaml
  cr: ./cr-denied.yaml
  cycles: 3

  expect:
    steady: true
    noErrors: false
    absent:
      - verb: create
        resource: applications
