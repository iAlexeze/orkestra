apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: monitoringconfigs.ecosystem.demo.orkestra.io
spec:
  group: ecosystem.demo.orkestra.io
  names:
    kind: MonitoringConfig
    plural: monitoringconfigs
    singular: monitoringconfig
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [targetDeployment, port, team]
              properties:
                targetDeployment:
                  type: string
                  description: Name of the Deployment to scrape metrics from
                port:
                  type: string
                  description: Named port on the Deployment's pods to scrape (e.g. "http", "metrics")
                team:
                  type: string
                  description: Team that owns this monitoring configuration
                errorRateThreshold:
                  type: string
                  description: HTTP error rate that triggers an alert (0.0–1.0, default 5%)
                scrapeInterval:
                  type: string
                  description: How often Prometheus scrapes the target (default 30s)
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
