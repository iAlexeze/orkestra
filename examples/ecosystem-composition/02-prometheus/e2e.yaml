# https://orkestra.sh/docs/reference/schema/e2e/
apiVersion: orkestra.orkspace.io/v1
kind: E2E
metadata:
  name: monitoring-operator-e2e
  description: >
    MonitoringConfig operator e2e — kube-prometheus-stack installed via setup.helm.
    Verifies a MonitoringConfig CR creates a ServiceMonitor and a PrometheusRule.

spec:
  katalog: ./katalog.yaml
  crd: ./crd.yaml
  cr: ./cr.yaml

  cluster:
    provider: kind
    name: ork-e2e
    reuse: false

  setup:
    helm:
      - repo: https://prometheus-community.github.io/helm-charts
        chart: kube-prometheus-stack
        namespace: monitoring
        createNamespace: true
        version: "61.3.2"
        values:
          grafana.enabled: "false"
          alertmanager.enabled: "false"
          nodeExporter.enabled: "false"
          kubeStateMetrics.enabled: "false"
          prometheus.enabled: "false"
          prometheusOperator.admissionWebhooks.enabled: "false"
    wait:
      - kind: Deployment
        name: kube-prometheus-stack-operator
        namespace: monitoring
        ready: true
        timeout: 180s

  expect:
    - name: MonitoringConfig CR created
      after: cr-applied
      timeout: 30s
      resources:
        - kind: MonitoringConfig
          name: webapp-monitoring
          namespace: default

    - name: ServiceMonitor created
      after: cr-applied
      timeout: 60s
      resources:
        - kind: ServiceMonitor
          name: webapp-monitoring
          namespace: default

    - name: PrometheusRule created
      after: cr-applied
      timeout: 60s
      resources:
        - kind: PrometheusRule
          name: webapp-monitoring
          namespace: default

    - name: Warn-path CR still creates resources (soft-fail)
      after: cr-applied
      timeout: 60s
      commands:
        - run: kubectl apply -f cr-denied.yaml
        - run: |
            sleep 10
            kubectl get servicemonitor noisy-monitoring -n default -o jsonpath='{.metadata.name}'
          outputContains: noisy-monitoring
        - run: kubectl delete -f cr-denied.yaml --ignore-not-found

    - name: Cleanup verified
      after: cr-deleted
      timeout: 30s
      resources:
        - kind: MonitoringConfig
          name: webapp-monitoring
          namespace: default
          count: 0
        - kind: ServiceMonitor
          name: webapp-monitoring
          namespace: default
          count: 0
        - kind: PrometheusRule
          name: webapp-monitoring
          namespace: default
          count: 0
