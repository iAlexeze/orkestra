# CR that triggers advisory warnings — scrapeInterval and errorRateThreshold absent.
# Warnings do not halt reconcile; resources are still created.
# The ServiceMonitor and PrometheusRule must NOT appear when the team is unset
# (spec.team is required by the CRD schema and will be rejected at the API level).
#
# This CR exercises the warn path: resources are created but warnings are recorded.
apiVersion: ecosystem.demo.orkestra.io/v1alpha1
kind: MonitoringConfig
metadata:
  name: noisy-monitoring
  namespace: default
spec:
  targetDeployment: "webapp"
  port: "noisy-http"
  team: "platform"
  # scrapeInterval intentionally absent — warns: declare explicitly
  # errorRateThreshold intentionally absent — warns: declare explicitly
