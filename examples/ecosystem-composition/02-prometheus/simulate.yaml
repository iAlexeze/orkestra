# Schema reference: https://orkestra.sh/docs/reference/schema/simulate/
apiVersion: orkestra.orkspace.io/v1
kind: Simulate
metadata:
  name: monitoring-operator-sim
  description: >
    Verify the MonitoringConfig operator creates a ServiceMonitor and a
    PrometheusRule in cycle 1.

spec:
  katalog: ./katalog.yaml
  cr: ./cr.yaml
  cycles: 3

  expect:
    steady: true
    noErrors: true
    ops:
      - cycle: 1
        verb: create
        resource: servicemonitors
      - cycle: 1
        verb: create
        resource: prometheusrules
