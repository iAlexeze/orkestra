# Schema reference: https://orkestra.sh/docs/reference/schema/simulate/
apiVersion: orkestra.orkspace.io/v1
kind: Simulate
metadata:
  name: monitoring-operator-warn-sim
  description: >
    Warn path: cr-denied.yaml omits scrapeInterval and errorRateThreshold.
    Both rules are "action: warn" — they fire advisory messages but do NOT
    halt the operator. Resources are still created; warns surface via gateway
    webhook response headers and operator logs only.
    This shows that "warn" is soft-fail: the ServiceMonitor and PrometheusRule
    are created even though the fields are missing.

spec:
  katalog: ./katalog.yaml
  cr: ./cr-denied.yaml
  cycles: 3

  expect:
    steady: true
    noErrors: true
    ops:
      - cycle: 1
        verb: create
        resource: servicemonitors
      - cycle: 1
        verb: create
        resource: prometheusrules
