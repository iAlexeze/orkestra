# Schema reference: https://orkestra.sh/docs/reference/schema/simulate/
apiVersion: orkestra.orkspace.io/v1
kind: Simulate
metadata:
  name: infra-operator-gated-sim
  description: >
    Reconcile-time gate: cr.yaml has spec.approved: false.
    The "when: spec.approved == true" condition is not met, so the operator
    skips creating the Crossplane PostgreSQLInstance. The reconcile succeeds
    (no error) but no DB claim is issued — the operator waits for approval.
    Approve with: kubectl patch infra webapp-db --type=merge -p '{"spec":{"approved":true}}'

spec:
  katalog: ./katalog.yaml
  cr: ./cr.yaml
  cycles: 3

  expect:
    steady: true
    noErrors: true
    absent:
      - verb: create
        resource: postgresqlinstances
