# Schema reference: https://orkestra.sh/docs/reference/schema/e2e/
apiVersion: orkestra.orkspace.io/v1
kind: E2E
metadata:
  name: infra-operator-e2e
  description: >
    Infra operator e2e — Crossplane installed via setup.helm with a mock
    PostgreSQLInstance CRD. Verifies two enforcement points:
      1. Reconcile-time gate  — spec.approved: false blocks DB provisioning.
      2. Happy path           — spec.approved: true creates the PostgreSQLInstance.

spec:
  katalog: ./katalog.yaml
  crd: ./crd.yaml
  cr: ./cr-approved.yaml

  cluster:
    provider: kind
    name: ork-e2e
    reuse: false

  setup:
    apply:
      # Mock CRD — stands in for a real Crossplane provider's composite type.
      - ./mock-crd.yaml
    helm:
      - repo: https://charts.crossplane.io/stable
        chart: crossplane
        namespace: crossplane-system
        createNamespace: true
        version: "1.16.0"
    wait:
      - kind: Deployment
        name: crossplane
        namespace: crossplane-system
        ready: true
        timeout: 120s

  expect:
    - name: Infra CR created
      after: cr-applied
      timeout: 30s
      resources:
        - kind: Infra
          name: webapp-db
          namespace: default

    - name: PostgreSQLInstance created when approved
      after: cr-applied
      timeout: 60s
      resources:
        - kind: PostgreSQLInstance
          name: webapp-db
          namespace: default

    - name: Reconcile-time gate blocks unapproved DB
      after: cr-applied
      timeout: 60s
      commands:
        - run: kubectl apply -f cr.yaml
        - run: |
            sleep 5
            kubectl get postgresqlinstance webapp-db -n default --ignore-not-found -o jsonpath='{.metadata.name}'
          outputContains: ""

    - name: Cleanup verified
      after: cr-deleted
      timeout: 30s
      resources:
        - kind: Infra
          name: webapp-db
          namespace: default
          count: 0
        - kind: PostgreSQLInstance
          name: webapp-db
          namespace: default
          count: 0
