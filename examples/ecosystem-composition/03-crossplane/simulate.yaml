# Schema reference: https://orkestra.sh/docs/reference/schema/simulate/
apiVersion: orkestra.orkspace.io/v1
kind: Simulate
metadata:
  name: infra-operator-sim
  description: >
    Verify the Infra operator creates a Crossplane Composite Claim in cycle 1.
    The size → storageGB mapping is exercised: medium → 50GB.

spec:
  katalog: ./katalog.yaml
  cr: ./cr-approved.yaml
  cycles: 3

  expect:
    steady: true
    noErrors: true
    ops:
      - cycle: 1
        verb: create
        resource: postgresqlinstances
