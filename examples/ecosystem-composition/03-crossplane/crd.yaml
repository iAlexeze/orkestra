apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: infras.ecosystem.demo.orkestra.io
spec:
  group: ecosystem.demo.orkestra.io
  names:
    kind: Infra
    plural: infras
    singular: infra
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [type, size, region, team]
              properties:
                type:
                  type: string
                  enum: [postgres, redis, kafka]
                  description: Type of infrastructure to provision
                size:
                  type: string
                  enum: [small, medium, large]
                  description: "Size class: small=20GB, medium=50GB, large=100GB"
                region:
                  type: string
                  description: Cloud region to provision into
                team:
                  type: string
                  description: Team that owns this infrastructure
                approved:
                  type: boolean
                  default: false
                  description: Set to true to trigger provisioning. CR can be created without this — provisioning is gated.
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
