apiVersion: orkestra.orkspace.io/v1
kind: Simulate
metadata:
  name: ecosystem-composition-sim
  description: >
    Happy-path suite for the ecosystem-composition pack.
    Runs simulate for all four ecosystem tools — ArgoCD, cert-manager,
    Prometheus, and Crossplane. Each must create its custom resource in
    cycle 1 and reach steady state.

imports:
  - ./00-argocd/simulate.yaml
  - ./01-cert-manager/simulate.yaml
  - ./02-prometheus/simulate.yaml
  - ./03-crossplane/simulate.yaml
