# Schema reference: https://orkestra.sh/docs/reference/schema/e2e/
apiVersion: orkestra.orkspace.io/v1
kind: E2E
metadata:
  name: security-operator-e2e
  description: >
    SecurityConfig operator e2e — cert-manager installed via setup.helm.
    Verifies a SecurityConfig CR creates a self-signed Issuer and Certificate,
    and the resulting TLS Secret is issued.

spec:
  katalog: ./katalog.yaml
  crd: ./crd.yaml
  cr: ./cr.yaml

  cluster:
    provider: kind
    name: ork-e2e
    reuse: false

  setup:
    helm:
      - repo: https://charts.jetstack.io
        chart: cert-manager
        namespace: cert-manager
        createNamespace: true
        version: v1.14.5            # You can test with any other version: v1.13.6
        values:
          installCRDs: true
    wait:
      - kind: Deployment
        name: cert-manager-webhook
        namespace: cert-manager
        ready: true
        timeout: 120s

  expect:
    - name: SecurityConfig CR created
      after: cr-applied
      timeout: 30s
      resources:
        - kind: SecurityConfig
          name: webapp-cert
          namespace: default

    - name: Issuer created
      after: cr-applied
      timeout: 60s
      resources:
        - kind: Issuer
          name: webapp-cert-issuer
          namespace: default
    
    - name: Certificate created
      after: cr-applied
      timeout: 60s
      resources:
        - kind: Certificate
          name: webapp-cert-cert
          namespace: default

    - name: TLS Secret issued
      after: cr-applied
      timeout: 90s
      resources:
        - kind: Secret
          name: webapp-cert-tls
          namespace: default

    - name: Denied CR blocked by domain required rule
      after: cr-applied
      timeout: 30s
      commands:
        - run: kubectl apply -f cr-denied.yaml
        - run: |
            sleep 5
            kubectl get securityconfig bad-cert -o yaml | grep -A6 "conditions:"
          outputContains: "validation denied"
        - run: kubectl delete -f cr-denied.yaml --ignore-not-found

    - name: Cleanup verified
      after: cr-deleted
      timeout: 30s
      commands:
        - run: kubectl delete secret webapp-cert-tls -n default --ignore-not-found
          exitCode: 0
      resources:
        - kind: Secret
          name: webapp-cert-tls
          namespace: default
          count: 0
        - kind: SecurityConfig
          name: webapp-cert
          namespace: default
          count: 0
