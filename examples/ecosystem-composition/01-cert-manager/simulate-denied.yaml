# Schema reference: https://orkestra.sh/docs/reference/schema/simulate/
apiVersion: orkestra.orkspace.io/v1
kind: Simulate
metadata:
  name: security-operator-denied-sim
  description: >
    Denial path: cr-denied.yaml uses issuer "unknown-ca" which does not
    start with the "myorg-" prefix. The prefix rule fires at every reconcile
    cycle and halts the operator — no cert-manager Certificate is ever created.

spec:
  katalog: ./katalog.yaml
  cr: ./cr-denied.yaml
  cycles: 3

  expect:
    steady: true
    noErrors: false
    absent:
      - verb: create
        resource: certificates
