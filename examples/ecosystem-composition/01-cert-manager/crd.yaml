apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: securityconfigs.ecosystem.demo.orkestra.io
spec:
  group: ecosystem.demo.orkestra.io
  names:
    kind: SecurityConfig
    plural: securityconfigs
    singular: securityconfig
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                domain:
                  type: string
                  description: Primary domain for the certificate
                renewBefore:
                  type: string
                  default: "720h"
                  description: How long before expiry to renew (e.g. 720h)
                dnsNames:
                  type: array
                  items:
                    type: string
                  description: Additional DNS names. The primary domain is always included.
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
