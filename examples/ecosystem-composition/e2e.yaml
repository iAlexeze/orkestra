apiVersion: orkestra.orkspace.io/v1
kind: E2E
metadata:
  name: ecosystem-composition-suite
  description: >
    Suite for the ecosystem-composition pack — ArgoCD, cert-manager, Prometheus,
    and Crossplane wrapped by internal CRDs. Each example installs its own
    ecosystem tool via setup.helm.

imports:
  - path: ./00-argocd/e2e.yaml
    wait: 5s
  - path: ./01-cert-manager/e2e.yaml
    wait: 10s
  - path: ./02-prometheus/e2e.yaml
    wait: 10s
  - path: ./03-crossplane/e2e.yaml
    wait: 10s
