apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: platformresources.ecosystem.demo.orkestra.io
spec:
  group: ecosystem.demo.orkestra.io
  names:
    kind: PlatformResource
    plural: platformresources
    singular: platformresource
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [workloadType, team]
              properties:
                workloadType:
                  type: string
                  description: "One of: app, cert, monitoring, infra"
                  enum: [app, cert, monitoring, infra]
                team:
                  type: string
                  description: Team that owns this resource

                # app fields
                repo:
                  type: string
                path:
                  type: string
                branch:
                  type: string
                targetNamespace:
                  type: string

                # cert fields
                domain:
                  type: string
                issuer:
                  type: string

                # monitoring fields
                serviceSelector:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                alertThresholds:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true

                # infra fields
                provider:
                  type: string
                region:
                  type: string
                class:
                  type: string

            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
