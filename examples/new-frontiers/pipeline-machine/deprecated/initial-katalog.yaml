apiVersion: orkestra.konductor.io/v1Alpha
kind: Katalog
metadata:
  name: pipeline-engine
  description: |
    Declarative CI/CD engine for Orkestra.

    This Katalog defines a complete Git-driven build, test, and deployment
    pipeline that runs entirely inside the Kubernetes reconcile loop. It
    standardizes CI/CD across multiple repositories using Git hooks, Docker
    build/push hooks, language-aware test jobs, and deployment orchestration.
spec:
  crds:
    pipeline:
      apiTypes:
        group: cicd.orkestra.io
        version: v1alpha1
        kind: Pipeline
        plural: pipelines

      operatorBox:
        default: true

        # ── onReconcile: full pipeline ──────────────────────────────────────
        onReconcile:
          git:
            repo: "{{ .spec.git.repo }}"
            branch: "{{ .spec.git.branch }}"
            path: "/var/lib/orkestra/git/{{ .metadata.name }}"
            reconcile: true

          docker:
            image: "{{ .spec.imageRegistry }}:{{ .git.commit }}"
            workingDirectory: "{{ .git.path }}"
            dockerfile: "{{ getStringOr .spec.build.dockerfile \"Dockerfile\" }}"
            push: true
            reconcile: true

          jobs:
            # Test job — language-aware
            - name: "{{ .metadata.name }}-test-go"
              image: "golang:1.22"
              workingDirectory: "{{ .git.path }}"
              command:
                - "bash"
                - "-c"
                - "go test ./..."
              when:
                - field: spec.language
                  equals: "go"
                - field: git.changed
                  equals: "true"

            - name: "{{ .metadata.name }}-test-java"
              image: "maven:3.9-eclipse-temurin-21"
              workingDirectory: "{{ .git.path }}"
              command:
                - "bash"
                - "-c"
                - "mvn test"
              when:
                - field: spec.language
                  equals: "java"
                - field: git.changed
                  equals: "true"

            - name: "{{ .metadata.name }}-test-node"
              image: "node:22"
              workingDirectory: "{{ .git.path }}"
              command:
                - "bash"
                - "-c"
                - "npm test"
              when:
                - field: spec.language
                  equals: "node"
                - field: git.changed
                  equals: "true"

          deployments:
            - name: "{{ .metadata.name }}"
              image: "{{ .docker.image }}"
              replicas: 2
              workingDirectory: ""
              env:
                REGION:
                  value: "{{ .spec.region }}"
                COMMIT:
                  value: "{{ .git.commit }}"
              when:
                - field: spec.deploy.enabled
                  equals: "true"
                - field: docker.buildSucceeded
                  equals: "true"

        # ── status: pipeline state machine ───────────────────────────────────
        status:
          fields:
            # ───────────────────────────────────────────────────────────────
            # Phase: Pending
            # Before Git runs OR when Git detects a new commit
            # ───────────────────────────────────────────────────────────────
            - path: phase
              value: "Pending"
              anyOf:
                - field: git.called
                  equals: "true"
                - field: git.changed
                  equals: "true"

            # ───────────────────────────────────────────────────────────────
            # Phase: Building
            # Git has run, Docker has started, but build not yet succeeded
            # ───────────────────────────────────────────────────────────────
            - path: phase
              value: "Building"
              when:
                - field: docker.called
                  equals: "true"
                - field: docker.buildSucceeded
                  equals: "false"

            # ───────────────────────────────────────────────────────────────
            # Phase: Deploying
            # Build succeeded, deployment not yet ready
            # ───────────────────────────────────────────────────────────────
            - path: phase
              value: "Deploying"
              when:
                - field: docker.buildSucceeded
                  equals: "true"
                - field: children.deployment.status.readyReplicas
                  operator: notExists

            # ───────────────────────────────────────────────────────────────
            # Phase: Ready
            # Deployment is fully ready
            # ───────────────────────────────────────────────────────────────
            - path: phase
              value: "Ready"
              when:
                - field: children.deployment.status.readyReplicas
                  operator: exists

            # ───────────────────────────────────────────────────────────────
            # lastCommit — only resolve when Git has run
            # ───────────────────────────────────────────────────────────────
            - path: lastCommit
              value: "{{ .git.commit }}"
              when:
                - field: git.called
                  equals: "true"

            # ───────────────────────────────────────────────────────────────
            # image — only resolve when Docker has run
            # ───────────────────────────────────────────────────────────────
            - path: image
              value: "{{ .docker.image }}"
              when:
                - field: docker.called
                  equals: "true"

            # ───────────────────────────────────────────────────────────────
            # lastError — only resolve when Docker has run
            # ───────────────────────────────────────────────────────────────
            - path: lastError
              value: "{{ ternary (eq .docker.buildSucceeded \"false\") \"docker build failed\" \"\" }}"
              when:
                - field: docker.called
                  equals: "true"
