apiVersion: orkestra.konductor.io/v1Alpha
kind: Katalog
metadata:
  name: pipeline-engine
  description: |
    Declarative CI/CD engine for Orkestra.

    This Katalog defines a complete Git-driven build, test, and deployment
    pipeline that runs entirely inside the Kubernetes reconcile loop. It
    standardizes CI/CD across multiple repositories using Git hooks, Docker
    build/push hooks, language-aware test jobs, and deployment orchestration.
spec:
  crds:
    pipeline:
      apiTypes:
        group: cicd.orkestra.io
        version: v1alpha1
        kind: Pipeline
        plural: pipelines

      reconciler:
        default: true

        # ── onReconcile: full pipeline ──────────────────────────────────────
        onReconcile:
          # Check out repository 
          git:
            repo: "{{ .spec.git.repo }}"
            branch: "{{ .spec.git.branch }}"
            path: "/tmp/orkestra/git/{{ .metadata.name }}"
            reconcile: true

          jobs:
            # Test job — language-aware
            - name: "{{ .metadata.name }}-test-go"
              image: "golang:1.22"
              workingDirectory: "{{ .git.path }}"
              command:
                - "bash"
                - "-c"
                - "go test ./..."
              when:
                - field: spec.language
                  equals: "go"
                - field: git.changed
                  equals: "true"

            - name: "{{ .metadata.name }}-test-java"
              image: "maven:3.9-eclipse-temurin-21"
              workingDirectory: "{{ .git.path }}"
              command:
                - "bash"
                - "-c"
                - "mvn test"
              when:
                - field: spec.language
                  equals: "java"
                - field: git.changed
                  equals: "true"

            - name: "{{ .metadata.name }}-test-node"
              image: "node:22"
              workingDirectory: "{{ .git.path }}"
              command:
                - "bash"
                - "-c"
                - "npm test"
              when:
                - field: spec.language
                  equals: "node"
                - field: git.changed
                  equals: "true"

          # Build docker image
          docker:
            image: "{{ .spec.imageRegistry }}:{{ .git.commit }}"
            workingDirectory: "{{ .git.path }}"
            dockerfile: "{{ getStringOr .spec.build.dockerfile \"Dockerfile\" }}"
            push: true
            reconcile: true
            when:
              - field: git.changed
                equals: "true"
              - field: git.withError
                equals: "false"

          # Deploy build image
          deployments:
            - name: "{{ .metadata.name }}"
              image: "{{ .docker.image }}"
              replicas: 2
              workingDirectory: ""
              env:
                REGION:
                  value: "{{ .spec.region }}"
                COMMIT:
                  value: "{{ .git.commit }}"
              when:
                - field: spec.deploy.enabled
                  equals: "true"
                - field: docker.buildSucceeded
                  equals: "true"

        # ── status: pipeline state machine ───────────────────────────────────
        status:
          fields:
            - path: phase
              value: "Pending"
              when:
                - field: git.called
                  equals: "false"

            - path: phase
              value: "Testing"
              when:
                - field: git.changed
                  equals: "true"

            - path: phase
              value: "Building"
              when:
                - field: docker.called
                  equals: "true"
                - field: docker.buildSucceeded
                  equals: "false"

            - path: phase
              value: "Deploying"
              when:
                - field: docker.buildSucceeded
                  equals: "true"
                - field: children.deployment.status.readyReplicas
                  operator: notExists

            - path: phase
              value: "Ready"
              when:
                - field: children.deployment.status.readyReplicas
                  operator: exists

            - path: lastCommit
              value: "{{ .git.commit }}"

            - path: image
              value: "{{ .docker.image }}"

            - path: lastError
              value: "{{ ternary (eq .docker.buildSucceeded \"false\") \"docker build failed\" \"\" }}"
