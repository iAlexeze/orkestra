apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: pipelines.cicd.orkestra.io
  annotations:
    description: |
      Declarative CI/CD Pipeline resource for Orkestra.

      A Pipeline defines a complete build–test–deploy workflow using Orkestra’s
      reconcile engine. Pipelines are fully declarative and run entirely inside
      the Kubernetes cluster, powered by Git hooks, Docker build/push hooks,
      language-aware test jobs, and deployment orchestration.

      The Pipeline CRD enables Git-driven automation without external CI systems.
      Each reconcile cycle can:
        • detect Git changes
        • run language-specific test jobs
        • build and push container images
        • deploy updated workloads
        • update status fields to reflect pipeline phase and results

      Pipelines allow platform teams to standardize build and deployment logic
      across many repositories using a single Katalog, while keeping all logic
      in YAML and inside the cluster.
spec:
  group: cicd.orkestra.io
  scope: Namespaced
  names:
    kind: Pipeline
    plural: pipelines
    singular: pipeline
    shortNames:
      - pl
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                git:
                  type: object
                  properties:
                    repo:
                      type: string
                    branch:
                      type: string
                    path:
                      type: string
                language:
                  type: string
                  description: "Language/runtime: go, java, node, etc."
                build:
                  type: object
                  properties:
                    dockerfile:
                      type: string
                deploy:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                region:
                  type: string
                imageRegistry:
                  type: string
                  description: "Base registry, e.g. registry.example.com/webapp"
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true  # accepts any status fields
              properties:
                phase:
                  type: string
                  description: "Pipeline phase: Pending, Testing, Building, Deploying, Ready, Failed"
                lastCommit:
                  type: string
                image:
                  type: string
                lastError:
                  type: string
      subresources:
        status: {}
