apiVersion: orkestra.orkspace.io/v1
kind: E2E
metadata:
  name: deletion-protection-e2e
  description: Verify that protected CRDs cannot be deleted while the operator is running

spec:
  katalog: ./katalog.yaml
  crd: ./crd-protected.yaml
  cr: ./cr-app.yaml

  cluster:
    provider: kind
    name: ork-e2e
    reuse: false

  setup:
    - ./crd-unprotected.yaml   # LogStream CRD — not protected, included to test contrast

  expect:
    - name: App deployment created
      after: cr-applied
      timeout: 90s
      resources:
        - kind: Deployment
          name: my-app-app
          namespace: default
          ready: true

    - name: Protected CRD deletion blocked by webhook
      after: cr-applied
      timeout: 30s
      commands:
        - run: kubectl delete crd apps.security.orkestra.io
          exitCode: 1
          outputContains: "denied the request"

    - name: Unprotected CRD can be deleted freely
      after: cr-applied
      timeout: 30s
      commands:
        - run: kubectl delete crd logstreams.security.orkestra.io --ignore-not-found
          exitCode: 0

    - name: App deployment removed on delete
      after: cr-deleted
      timeout: 30s
      resources:
        - kind: Deployment
          name: my-app-app
          namespace: default
          count: 0
