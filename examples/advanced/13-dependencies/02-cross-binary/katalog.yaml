apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: dependencies-cross-binary
  description: >
    Startup ordering across two separate Orkestra deployments in the same
    cluster (different namespaces).

    Database runs in a hardened namespace (db-system) under a dedicated
    Orkestra deployment with tight RBAC. App runs in app-system under a
    separate Orkestra deployment.

    App declares dependsOn: database: healthy. Orkestra resolves the
    condition by calling the Database Orkestra's health API at:
      http://orkestra.db-system:8080/katalog/database/cr/<ns>/<name>/health

    Once the Database CR reaches healthy, App's reconcile loop begins.
    The cross block then reads the endpoint for injection.

    Deploy order:
      1. kubectl apply -f katalog.yaml -n db-system   (Database deployment)
      2. kubectl apply -f katalog.yaml -n app-system  (App deployment)

spec:
  crds:
    # ── Database (db-system deployment) ───────────────────────────────────────
    database:
      apiTypes:
        group: deps.orkestra.io
        version: v1alpha1
        kind: Database
        plural: databases

      workers: 2
      resync: 30s

      operatorBox:
        status:
          fields:
            - path: phase
              value: "Running"
            - path: endpoint
              value: "{{ .metadata.name }}.db-system.svc:5432"
            - path: ready
              value: '{{ get .children.statefulset "status" "readyReplicas" }}'

        onCreate:
          statefulSets:
            - image: "{{ .spec.image }}"
              replicas: "{{ .spec.replicas }}"
              port: 5432
              reconcile: true
          services:
            - port: "5432"
              reconcile: true

    # ── App (app-system deployment) ────────────────────────────────────────────
    # dependsOn uses the cross source.endpoint to resolve the condition
    # from the remote Orkestra deployment.
    app:
      apiTypes:
        group: deps.orkestra.io
        version: v1alpha1
        kind: App
        plural: apps

      workers: 3
      resync: 30s

      dependsOn:
        database: healthy

      operatorBox:
        cross:
          - crd: database
            selector:
              name: "{{ .metadata.name }}"
              namespace: "{{ .metadata.namespace }}"
            as: database
            source:
              endpoint: "http://orkestra.db-system:8080/katalog/database/cr/{{ .metadata.namespace }}/{{ .metadata.name }}"
              cacheFor: 15s

        status:
          fields:
            - path: phase
              value: "Running"
            - path: dbEndpoint
              value: "{{ .cross.database.status.endpoint }}"

        onCreate:
          deployments:
            - image: "{{ .spec.image }}"
              replicas: "{{ .spec.replicas }}"
              port: 8080
              env:
                DB_HOST:
                  value: "{{ .cross.database.status.endpoint }}"
              reconcile: true
          services:
            - port: "80"
              targetPort: "8080"
