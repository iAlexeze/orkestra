apiVersion: v1
kind: ConfigMap
metadata:
  name: orkestra-katalog
  namespace: orkestra-system
data:
  katalog.yaml: |

  
    apiVersion: orkestra.orkspace.io/v1
    kind: Komposer
    metadata:
      name: platform-full
      description: >
        Multi-source Komposer: OCI registry pattern + local Katalog + Helm chart.
        Shows the full composition model for a platform team.

    # ── Sources ────────────────────────────────────────────────────────────────

    imports:
      # OCI registry pattern — versioned, immutable
      # Pull a published operator pattern from the Orkestra registry
      registry:
        - url: ghcr.io/orkspace/patterns/postgres@v1.0.0
          oci: true
          # version is pinned via @v14.2.0 — immutable, safe for production

      # Local Katalog — your team's custom CRD
      files:
        - ./website-katalog.yaml

      # Helm chart source — pulls CRD behavior definitions from a chart
      helm:
        - repo: https://github.com/orkspace/charts.git
          chart: orkestra-katalog-example
          path: katalog-example
          version: v0.1.0     # ignore to use main branch or add branch name instead
          # auth:
          #   type: bearer
          #   fromEnv: HELM_REPO_TOKEN

    # ── Overrides ──────────────────────────────────────────────────────────────
    # Environment-specific tuning. Wins over all sources.

    spec:
      crds:
        # Override the postgres pattern for production
        postgres:
          # All other postgres behavior inherited from the OCI pattern
          operatorBox:
            reconciler:
              workers: 8
              resync: 30s

        # Override the website operator for production
        website:
          # All other website behavior inherited from the local Katalog
          operatorBox:
            reconciler:
              workers: 6
              resync: 15s
        
        # Disable the database operator since we now have Postrgres
        database:
          enabled: false
