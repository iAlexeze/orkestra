apiVersion: orkestra.konductor.io/v1Alpha
kind: Katalog
metadata:
  name: website-production
  description: Production website operator with full policy

spec:
  crds:
    - name: website
      apiTypes:
        group: demo.orkestra.io
        version: v1alpha1
        kind: Website
        plural: websites

      validation:
        - field: spec.image
          prefix: "myorg/"
          message: "images must come from the internal registry"
          action: deny
        - field: spec.replicas
          operator: gt
          value: "0"
          message: "replicas must be at least 1"
          action: deny

      mutation:
        mutateFirst: true
        rules:
          - field: spec.replicas
            default: "2"
          - field: spec.port
            default: "8080"

      reconciler:
        default: true
        status:
          fields:
            - path: phase
              value: "Running"
            - path: readyReplicas
              value: "{{ .children.deployment.status.readyReplicas }}"
        onCreate:
          deployments:
            - image: "{{ .spec.image }}"
              replicas: "{{ .spec.replicas }}"
              reconcile: true
          services:
            - port: "80"
              targetPort: "{{ .spec.port }}"
              reconcile: true
