# ---------------------------------------------------------
# Website
# ---------------------------------------------------------
apiVersion: demo.orkestra.io/v1alpha1
kind: Website
metadata:
  name: example-website
spec:
  image: nginx:latest

---
# ---------------------------------------------------------
# Postgres (from OCI pattern)
# ---------------------------------------------------------
apiVersion: postgres.orkestra.io/v1
kind: Postgres
metadata:
  name: example-postgres
spec:
  version: "14"
  database: appdb
  user: appuser

---
# ---------------------------------------------------------
# Cache (Helm-based source)
# ---------------------------------------------------------
apiVersion: demo.orkestra.io/v1alpha1
kind: Cache
metadata:
  name: example-cache
spec:
  backend: redis
  size: small

---
