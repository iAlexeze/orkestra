apiVersion: orkestra.orkspace.io/v1
kind: E2E
metadata:
  name: hooks-e2e
  description: Exercise typed Go hooks — verify pre/post reconcile hooks fire and the operator deployment comes up

spec:
  katalog: ./katalog.yaml
  crd: ./crd.yaml
  cr: ./cr.yaml

  cluster:
    provider: kind
    name: ork-e2e
    reuse: false

  expect:
    - name: Database deployment created
      after: cr-applied
      timeout: 90s
      resources:
        - kind: Deployment
          namespace: default
          ready: true

    - name: Deployment removed on delete
      after: cr-deleted
      timeout: 30s
      resources:
        - kind: Deployment
          namespace: default
          count: 0
