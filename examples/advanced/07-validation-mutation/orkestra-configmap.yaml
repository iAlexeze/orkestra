# ConfigMap that injects the Katalog into the in-cluster Orkestra deployment.
# Apply this BEFORE the CR so Orkestra is configured before it receives events.
apiVersion: v1
kind: ConfigMap
metadata:
  name: orkestra-katalog
  namespace: orkestra-system
data:
  katalog.yaml: |
    apiVersion: orkestra.konductor.io/v1Alpha
    kind: Katalog
    metadata:
      name: website-with-policy
    spec:
      crds:
        - name: website
          apiTypes:
            group: demo.orkestra.io
            version: v1alpha1
            kind: Website
            plural: websites
          webhooks:
            validation: true
            mutation: true
            operations:
              - CREATE
              - UPDATE

          validation:
            rules:
              - field: spec.image
                prefix: "myorg/"
                message: "images must come from the internal registry (myorg/)"
                action: deny
              - field: spec.replicas
                operator: gt
                value: 0
                message: "replicas must be at least 1"
                action: deny
              - field: spec.environment
                operator: exists
                message: "declare spec.environment for better observability"
                action: warn
          mutation:
            mutateFirst: true
            rules:
              - field: spec.replicas
                default: 2
              - field: spec.port
                default: "8080"
              - field: spec.environment
                default: "development"
          reconciler:
            default: true
            status:
              fields:
                - path: phase
                  value: "Running"
                - path: environment
                  value: "{{ .spec.environment }}"
                - path: observedReplicas
                  value: "{{ .spec.replicas }}"
            onCreate:
              deployments:
                - image: "{{ .spec.image }}"
                  replicas: "{{ .spec.replicas }}"
                  port: "{{ .spec.port }}"
                  reconcile: true
              services:
                - port: "80"
                  targetPort: "{{ .spec.port }}"
                  reconcile: true
