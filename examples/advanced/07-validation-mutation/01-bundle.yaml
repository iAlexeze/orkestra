---
apiVersion: v1
data:
  katalog.yaml: "apiVersion: orkestra.orkspace.io/v1\nkind: Katalog\nmetadata:\n  name:
    website-with-policy\n  author: orkspace\n  version: 0.1.0\n  description: >\n
    \   Validation (deny + warn) and mutation (defaults + overrides).\n    Rules run
    at admission time (when ENABLE_ADMISSION_WEBHOOK=true) and at\n    reconcile time
    on every cycle.\n\nsecurity:\n  webhooks:\n    admission: \n      enabled: true\n
    \   cleanupOnShutdown: true\n\nspec:\n  crds:\n    website:\n      apiTypes:\n
    \       group: demo.orkestra.io\n        version: v1alpha1\n        kind: Website\n
    \       plural: websites\n\n      # ── Validation ────────────────────────────────────────────────────\n
    \     # Rules are evaluated at two points:\n      #   1. Admission time — synchronous,
    during kubectl apply\n      #   2. Reconcile time — every reconcile cycle\n      #\n
    \     # action: deny  → blocks the operation (admission) or halts reconcile\n
    \     # action: warn  → allows through but records a warning\n      validation:\n
    \       rules:\n          # Hard rule — images must come from the internal registry\n
    \         - field: spec.image\n            prefix: \"myorg/\"\n            message:
    \"images must come from the internal registry (myorg/)\"\n            action:
    deny\n\n          # Hard rule — replicas must be at least 1\n          - field:
    spec.replicas\n            greaterThan: 0\n            message: \"replicas must
    be at least 1\"\n            action: deny\n\n          # Advisory — encourage
    environment declaration\n          - field: spec.environment\n            operator:
    exists\n            message: \"declare spec.environment for better observability\"\n
    \           action: warn\n\n      # ── Mutation ──────────────────────────────────────────────────────\n
    \     # Mutation runs BEFORE validation at admission time —\n      # so defaults
    are applied before deny rules check values.\n      # At reconcile time, mutateFirst
    controls the order.\n      #\n      # default:  apply only when the field is absent
    or empty\n      # override: always apply, regardless of current value\n      mutation:\n
    \       mutateFirst: true        # at reconcile time: mutate before validate\n
    \       rules:\n          - field: spec.replicas\n            default: 2           #
    if replicas not declared, default to 2\n\n          - field: spec.port\n            default:
    \"8080\"        # if port not declared, default to 8080\n\n      # ── Reconciler
    ────────────────────────────────────────────────────\n      operatorBox:\n        default:
    true\n\n        status:\n          fields:\n            - path: phase\n              value:
    \"Running\"\n            - path: environment\n              value: \"{{ .spec.environment
    }}\"\n            - path: observedReplicas\n              value: \"{{ .spec.replicas
    }}\"\n            - path: readyReplicas\n              value: '{{ get .children.deployment
    \"status\" \"readyReplicas\" }}'\n\n        onCreate:\n          deployments:\n
    \           - image: \"{{ .spec.image }}\"\n              replicas: \"{{ .spec.replicas
    }}\"\n              port: \"{{ .spec.port }}\"\n              reconcile: true\n
    \         services:\n            - port: \"80\"\n              targetPort: \"{{
    .spec.port }}\"\n              reconcile: true\n"
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/name: orkestra
    app.kubernetes.io/tag: orkestra-internal
    orkestra.io/deletion-protection: "true"
  name: orkestra-katalog
  namespace: plan-test

