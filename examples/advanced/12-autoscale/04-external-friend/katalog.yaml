apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: autoscale-external-friend
  description: >
    Cross-cluster autoscaling — scale based on a metric from another cluster.

    Feeder runs in cluster-a (the source-of-truth cluster).
    Worker runs in cluster-b and autoscales based on Feeder's queue depth,
    fetched from cluster-a's Orkestra REST API over the network.

    This demonstrates Orkestra's ability to make intelligent scaling decisions
    using signals from entirely separate Kubernetes clusters — no shared
    infrastructure, no Prometheus federation required.

    Setup:
      make multi-cluster          # creates cluster-a and cluster-b
      make install CLUSTER=a      # install Orkestra in cluster-a
      make install CLUSTER=b      # install Orkestra in cluster-b
      make apply-feeder           # apply Feeder CRs in cluster-a
      make apply-worker           # apply Worker CRs in cluster-b

    Trigger load:
      make load CLUSTER=a         # creates Feeder CRs to fill cluster-a queue

    Set FEEDER_ORKESTRA_URL in the Makefile to cluster-a's external address.

spec:
  crds:
    # ── Feeder (cluster-a) ────────────────────────────────────────────────────
    # The upstream work source. Its queue depth is the signal that drives
    # Worker's autoscaler in cluster-b.
    feeder:
      apiTypes:
        group: autoscale.orkestra.io
        version: v1alpha1
        kind: Feeder
        plural: feeders

      workers: 4
      resync: 30s

      operatorBox:
        status:
          fields:
            - path: phase
              value: "Running"

        onCreate:
          deployments:
            - image: "{{ .spec.image }}"
              replicas: "{{ .spec.replicas }}"
              port: 8080
              reconcile: true
          services:
            - port: "8080"
              type: NodePort

    # ── Worker (cluster-b) ────────────────────────────────────────────────────
    # Autoscales based on Feeder's queue depth in cluster-a.
    # source.endpoint crosses the cluster boundary — responses are cached
    # for 20 s to tolerate transient network latency.
    worker:
      apiTypes:
        group: autoscale.orkestra.io
        version: v1alpha1
        kind: Worker
        plural: workers

      workers: 2
      resync: 60s

      operatorBox:
        autoscale:
          interval: 30s
          cooldown: 5m
          conditions:
            when:
              - field: cross.feeder.metrics.queueDepth
                greaterThan: "200"
                source:
                  endpoint: "http://$FEEDER_ORKESTRA_URL/katalog/feeder/metrics"
                  cacheFor: 20s
          do:
            workers: 10
            queueDepth: 1000
            resync: 15s

        status:
          fields:
            - path: phase
              value: "Running"
            - path: autoscaleActive
              value: "{{ .metrics.autoscaleActive }}"
            - path: workers
              value: "{{ .metrics.workers }}"

        onCreate:
          deployments:
            - image: "{{ .spec.image }}"
              replicas: "{{ .spec.replicas }}"
              port: 9090
              reconcile: true
          services:
            - port: "9090"
