apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: autoscale-sibling
  description: >
    Cross-CRD autoscaling — two approaches in one binary.

    Loader produces work. Two downstream CRDs consume it:

    Processor  — uses profile: burst. The profile expands into a complete
                 autoscale config (4× workers, 10× queue depth, 5 s evaluation,
                 30 s cooldown). Orkestra derives the trigger from the profile's
                 heuristics. You declare intent; Orkestra computes the parameters.

    Auditor    — uses explicit conditions. Watches Loader's live queue depth
                 via cross.loader.metrics.queueDepth and applies its own
                 manual do: block. You control every parameter directly.

    Together they show the two autoscale styles: profile (preset, concise)
    and explicit (custom, full control).

spec:
  crds:
    # ── Loader ────────────────────────────────────────────────────────────────
    # Produces work for Processor and Auditor to consume.
    # Fixed concurrency — no autoscale on the producer itself.
    loader:
      apiTypes:
        group: autoscale.orkestra.io
        version: v1alpha1
        kind: Loader
        plural: loaders

      workers: 3
      resync: 60s

      operatorBox:
        status:
          fields:
            - path: phase
              value: "Running"

        onCreate:
          deployments:
            - image: "{{ .spec.image }}"
              replicas: "{{ .spec.replicas }}"
              port: 8080
              reconcile: true
          services:
            - port: "8080"

    # ── Processor ────────────────────────────────────────────────────────────
    # Profile-based autoscale. Declare profile: burst and Orkestra does the rest.
    #
    # burst profile expands to:
    #   workers:    baseline × 4   (2 → 8)
    #   queueDepth: baseline × 10  (100 → 1000)
    #   interval:   5s
    #   cooldown:   30s
    #   trigger:    metrics.queueDepth > threshold (computed from baseline)
    #
    # Cannot be combined with interval/cooldown/conditions/do —
    # the profile owns those fields entirely.
    processor:
      apiTypes:
        group: autoscale.orkestra.io
        version: v1alpha1
        kind: Processor
        plural: processors

      workers: 2
      resync: 30s

      operatorBox:
        autoscale:
          profile: burst

        status:
          fields:
            - path: phase
              value: "Running"
            - path: autoscaleActive
              value: "{{ .metrics.autoscaleActive }}"
            - path: workers
              value: "{{ .metrics.workers }}"

        onCreate:
          deployments:
            - image: "{{ .spec.image }}"
              replicas: "{{ .spec.replicas }}"
              port: 9090
              reconcile: true
          services:
            - port: "9090"

    # ── Auditor ───────────────────────────────────────────────────────────────
    # Explicit autoscale. Watches Loader's queue depth directly via the
    # cross.<crd>.metrics.* field path — reads from the sibling CRD's live
    # metrics without any network call (same binary, same runtime).
    auditor:
      apiTypes:
        group: autoscale.orkestra.io
        version: v1alpha1
        kind: Auditor
        plural: auditors

      workers: 1
      resync: 60s

      operatorBox:
        autoscale:
          interval: 30s
          cooldown: 5m
          conditions:
            when:
              - field: cross.loader.metrics.queueDepth
                greaterThan: "150"
          do:
            workers: 4
            resync: 15s

        status:
          fields:
            - path: phase
              value: "Running"
            - path: autoscaleActive
              value: "{{ .metrics.autoscaleActive }}"

        onCreate:
          configMaps:
            - name: "{{ .metadata.name }}-audit-config"
              data:
                AUDIT_MODE: "{{ .spec.auditMode }}"
