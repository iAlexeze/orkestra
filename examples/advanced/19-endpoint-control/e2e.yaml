# https://orkestra.sh/docs/reference/schema/e2e/
apiVersion: orkestra.orkspace.io/v1
kind: E2E
metadata:
  name: endpoint-control-suite
  description: >
    Suite for the endpoint-control pack — selective health disable, full endpoint
    disable, and fully dark (crossAccess + endpoints combined). Runs all three
    examples in sequence.

imports:
  - 01-selective-health/e2e.yaml
  - 02-full-disable/e2e.yaml
  - 03-fully-dark/e2e.yaml
