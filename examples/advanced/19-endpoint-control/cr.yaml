---
# 01-selective-health
apiVersion: endpoint-control.orkestra.io/v1alpha1
kind: Payment
metadata:
  name: checkout
  namespace: default
spec:
  merchant: acme-store
  amount: "99.99"
---
# 02-full-disable
apiVersion: endpoint-control.orkestra.io/v1alpha1
kind: Credential
metadata:
  name: api-creds
  namespace: default
spec:
  service: postgres
---
# 03-fully-dark — keyrotation
apiVersion: endpoint-control.orkestra.io/v1alpha1
kind: KeyRotation
metadata:
  name: platform-key
  namespace: default
spec:
  key: ecdsa-p256-v2
---
# 03-fully-dark — auditlog (same name so cross: selector attempts a match)
apiVersion: endpoint-control.orkestra.io/v1alpha1
kind: AuditLog
metadata:
  name: platform-key
  namespace: default
spec:
  message: "Rotation triggered for platform-key"
