---
apiVersion: endpoint-control.orkestra.io/v1alpha1
kind: KeyRotation
metadata:
  name: platform-key
  namespace: default
spec:
  key: ecdsa-p256-v2
---
apiVersion: endpoint-control.orkestra.io/v1alpha1
kind: AuditLog
metadata:
  name: platform-key   # same name — cross: selector looks up keyrotation/platform-key
  namespace: default
spec:
  message: "Rotation triggered for platform-key"
