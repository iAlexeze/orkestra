# https://orkestra.sh/docs/reference/schema/e2e/
apiVersion: orkestra.orkspace.io/v1
kind: E2E
metadata:
  name: fully-dark-e2e
  description: >
    Verifies the fully dark pattern: crossAccess: false blocks cross: reads from
    auditlog to keyrotation (ConfigMap keyRef resolves to "access-denied"), and
    endpoints.enabled: false suppresses all /katalog/keyrotation HTTP paths.
    auditlog endpoints remain fully accessible for contrast.

spec:
  katalog: ./katalog.yaml
  crd: ./crd.yaml
  cr: ./cr.yaml

  cluster:
    provider: kind
    name: ork-e2e-fully-dark
    reuse: false

  expect:
    - name: KeyRotation and AuditLog CRs created
      after: cr-applied
      timeout: 60s
      resources:
        - kind: KeyRotation
          name: platform-key
          namespace: default

    - name: KeyRotation Secret created — operator reconciles silently
      after: cr-applied
      timeout: 90s
      resources:
        - kind: Secret
          name: platform-key-key
          namespace: default

    - name: AuditLog ConfigMap created
      after: cr-applied
      timeout: 90s
      resources:
        - kind: ConfigMap
          name: platform-key-log
          namespace: default

    - name: Cross read blocked — ConfigMap keyRef is access-denied
      after: cr-applied
      timeout: 60s
      kubectl:
        get:
          - kind: ConfigMap
            name: platform-key-log
            namespace: default
            field: .data.keyRef
            equals: "access-denied"

    - name: keyrotation info endpoint returns 404 — fully dark
      after: cr-applied
      timeout: 60s
      kubectl:
        port-forward:
          - namespace: orkestra-system
            port: 8080
            path: /katalog/keyrotation
            leaderElection:
              lease: orkestra-konductor
            statusCode: 404

    - name: keyrotation health endpoint returns 404 — fully dark
      after: cr-applied
      timeout: 60s
      kubectl:
        port-forward:
          - namespace: orkestra-system
            port: 8080
            path: /katalog/keyrotation/health
            leaderElection:
              lease: orkestra-konductor
            statusCode: 404

    - name: auditlog info endpoint is accessible — contrast with keyrotation
      after: cr-applied
      timeout: 60s
      kubectl:
        port-forward:
          - namespace: orkestra-system
            port: 8080
            path: /katalog/auditlog
            leaderElection:
              lease: orkestra-konductor
            jq: .name
            equals: "auditlog"

    - name: Cleanup verified
      after: cr-deleted
      timeout: 60s
      resources:
        - kind: Secret
          name: platform-key-key
          namespace: default
          count: 0
        - kind: ConfigMap
          name: platform-key-log
          namespace: default
          count: 0
