---
# KeyRotation — fully dark: crossAccess: false + endpoints: enabled: false
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: keyrotations.endpoint-control.orkestra.io
spec:
  group: endpoint-control.orkestra.io
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [key]
              properties:
                key:
                  type: string
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
  names:
    kind: KeyRotation
    plural: keyrotations
    singular: keyrotation
  scope: Namespaced
---
# AuditLog — open endpoints; cross: read on keyrotation returns empty
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: auditlogs.endpoint-control.orkestra.io
spec:
  group: endpoint-control.orkestra.io
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: KeyRef
          type: string
          jsonPath: .status.keyRef
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [message]
              properties:
                message:
                  type: string
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
  names:
    kind: AuditLog
    plural: auditlogs
    singular: auditlog
  scope: Namespaced
