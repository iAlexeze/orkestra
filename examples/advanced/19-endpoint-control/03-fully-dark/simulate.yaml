apiVersion: orkestra.orkspace.io/v1
kind: Simulate
metadata:
  name: fully-dark-sim
  description: >
    Verify both CRDs reconcile correctly. keyrotation creates its Secret on cycle 1
    despite being fully dark. auditlog creates its ConfigMap — cross: read of keyrotation
    resolves to empty (crossAccess: false) and the operator continues normally.

spec:
  katalog: ./katalog.yaml
  cr: ./crs/cr-keyrotation-audit.yaml
  cycles: 3

  expect:
    steady: true
    noErrors: true
    crds:
      keyrotation:
        ops:
          - cycle: 1
            verb: create
            resource: secrets
            name: platform-key-key
      auditlog:
        ops:
          - cycle: 1
            verb: create
            resource: configmaps
            name: platform-key-log
