# https://orkestra.sh/docs/reference/schema/e2e/
apiVersion: orkestra.orkspace.io/v1
kind: E2E
metadata:
  name: full-disable-e2e
  description: >
    Verifies that endpoints.enabled: false suppresses all per-CRD HTTP endpoints
    (/katalog/credential, /katalog/credential/health, /katalog/credential/cr all
    return 404) while the reconciler runs normally and creates the Secret.

spec:
  katalog: ./katalog.yaml
  crd: ./crd.yaml
  cr: ./cr.yaml

  cluster:
    provider: kind
    name: ork-e2e-full-disable
    reuse: false

  expect:
    - name: Credential CR created and operator starts
      after: cr-applied
      timeout: 60s
      resources:
        - kind: Credential
          name: api-creds
          namespace: default

    - name: Secret is created — operator reconciles normally despite disabled endpoints
      after: cr-applied
      timeout: 90s
      resources:
        - kind: Secret
          name: api-creds-token
          namespace: default

    - name: Info endpoint returns 404 — disabled by endpoints.enabled false
      after: cr-applied
      timeout: 60s
      kubectl:
        port-forward:
          - namespace: orkestra-system
            port: 8080
            path: /katalog/credential
            leaderElection:
              lease: orkestra-konductor
            statusCode: 404

    - name: Health endpoint returns 404
      after: cr-applied
      timeout: 60s
      kubectl:
        port-forward:
          - namespace: orkestra-system
            port: 8080
            path: /katalog/credential/health
            leaderElection:
              lease: orkestra-konductor
            statusCode: 404

    - name: Top-level katalog endpoint is still reachable
      after: cr-applied
      timeout: 60s
      kubectl:
        port-forward:
          - namespace: orkestra-system
            port: 8080
            path: /katalog
            leaderElection:
              lease: orkestra-konductor
            jq: .OrkReady
            equals: "true"

    - name: Cleanup verified
      after: cr-deleted
      timeout: 60s
      resources:
        - kind: Secret
          name: api-creds-token
          namespace: default
          count: 0
        - kind: Credential
          name: api-creds
          namespace: default
          count: 0
