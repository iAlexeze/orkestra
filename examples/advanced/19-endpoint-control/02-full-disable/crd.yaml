apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: credentials.endpoint-control.orkestra.io
spec:
  group: endpoint-control.orkestra.io
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Service
          type: string
          jsonPath: .spec.service
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [service]
              properties:
                service:
                  type: string
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
  names:
    kind: Credential
    plural: credentials
    singular: credential
  scope: Namespaced
