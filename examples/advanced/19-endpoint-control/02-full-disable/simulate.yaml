apiVersion: orkestra.orkspace.io/v1
kind: Simulate
metadata:
  name: full-disable-sim
  description: Verify credentials operator creates its Secret on cycle 1 with all endpoints disabled

spec:
  katalog: ./katalog.yaml
  cr: ./cr.yaml
  cycles: 3

  expect:
    noErrors: true
    ops:
      - cycle: 1
        verb: apply
        resource: secrets
        name: api-creds-token
