# https://orkestra.sh/docs/reference/schema/e2e/
apiVersion: orkestra.orkspace.io/v1
kind: E2E
metadata:
  name: selective-health-e2e
  description: >
    Verifies that disabling the health endpoint (endpoints.health: false) returns 404
    on /katalog/payment/health while /katalog/payment (info) and /katalog/payment/cr
    remain accessible. The operator reconciles normally throughout.

spec:
  katalog: ./katalog.yaml
  crd: ./crd.yaml
  cr: ./cr.yaml

  cluster:
    provider: kind
    name: ork-e2e-selective-health
    reuse: false

  expect:
    - name: Payment CR created and operator starts
      after: cr-applied
      timeout: 60s
      resources:
        - kind: Payment
          name: checkout
          namespace: default

    - name: Deployment is created — operator reconciles normally
      after: cr-applied
      timeout: 90s
      resources:
        - kind: Deployment
          name: checkout-processor
          namespace: default
          ready: true

    - name: Info endpoint is still accessible
      after: cr-applied
      timeout: 60s
      kubectl:
        port-forward:
          - namespace: orkestra-system
            port: 8080
            path: /katalog/payment
            leaderElection:
              lease: orkestra-konductor
            jq: .name
            equals: "payment"

    - name: Health endpoint returns 404 — disabled by endpoints.health false
      after: cr-applied
      timeout: 60s
      kubectl:
        port-forward:
          - namespace: orkestra-system
            port: 8080
            path: /katalog/payment/health
            leaderElection:
              lease: orkestra-konductor
            statusCode: 404

    - name: CR list endpoint is still accessible
      after: cr-applied
      timeout: 60s
      kubectl:
        port-forward:
          - namespace: orkestra-system
            port: 8080
            path: /katalog/payment/cr
            leaderElection:
              lease: orkestra-konductor
            jq: .crd
            equals: "payment"

    - name: Cleanup verified
      after: cr-deleted
      timeout: 60s
      resources:
        - kind: Deployment
          name: checkout-processor
          namespace: default
          count: 0
        - kind: Payment
          name: checkout
          namespace: default
          count: 0
