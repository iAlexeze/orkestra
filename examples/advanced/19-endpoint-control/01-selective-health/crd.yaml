apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: payments.endpoint-control.orkestra.io
spec:
  group: endpoint-control.orkestra.io
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Merchant
          type: string
          jsonPath: .spec.merchant
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [merchant, amount]
              properties:
                merchant:
                  type: string
                amount:
                  type: string
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
  names:
    kind: Payment
    plural: payments
    singular: payment
  scope: Namespaced
