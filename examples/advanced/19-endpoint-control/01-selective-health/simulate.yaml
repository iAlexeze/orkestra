apiVersion: orkestra.orkspace.io/v1
kind: Simulate
metadata:
  name: selective-health-sim
  description: Verify payment operator creates its Deployment on cycle 1 with health endpoint disabled

spec:
  katalog: ./katalog.yaml
  cr: ./cr.yaml
  cycles: 3

  expect:
    steady: true
    noErrors: true
    ops:
      - cycle: 1
        verb: create
        resource: deployments
        name: checkout-processor
