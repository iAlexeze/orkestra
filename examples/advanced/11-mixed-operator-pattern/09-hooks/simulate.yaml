apiVersion: orkestra.orkspace.io/v1
kind: Simulate
metadata:
  name: mixed-database-hooks-sim
  description: Verify typed hooks fire in the mixed operator — StatefulSet, Service, CronJob created in cycle 1

spec:
  katalog: ./katalog.yaml
  cr: ./cr.yaml
  cycles: 5

  expect:
    steady: true
    noErrors: true
    ops:
      - cycle: 1
        verb: create
        resource: statefulsets
      - cycle: 1
        verb: create
        resource: services
      - cycle: 1
        verb: create
        resource: cronjobs
        name: my-db-backup
