apiVersion: orkestra.orkspace.io/v1
kind: E2E
metadata:
  name: constructor-e2e
  description: Verify the constructor pattern — operator builds pipeline jobs from a typed Go constructor and they run to completion

spec:
  katalog: ./katalog.yaml
  crd: ./crd.yaml
  cr: ./cr.yaml

  cluster:
    provider: kind
    name: ork-e2e
    reuse: false

  expect:
    - name: Pipeline deployment created
      after: cr-applied
      timeout: 90s
      resources:
        - kind: Deployment
          namespace: default
          ready: true

    - name: Deployment removed on delete
      after: cr-deleted
      timeout: 30s
      resources:
        - kind: Deployment
          namespace: default
          count: 0
