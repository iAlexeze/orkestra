apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: webapps.web.orkestra.io
spec:
  group: web.orkestra.io
  names:
    kind: WebApp
    plural: webapps
    singular: webapp
    shortNames:
      - wa
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - image
              properties:
                image:
                  type: string
                  description: Container image (e.g. nginx:1.25)
                replicas:
                  type: integer
                  minimum: 1
                  maximum: 20
                  default: 2
                  description: Number of replicas
                port:
                  type: integer
                  minimum: 1
                  maximum: 65535
                  default: 80
                  description: Container port
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: ["Pending", "Running", "Failed"]
                readyReplicas:
                  type: integer
              x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
