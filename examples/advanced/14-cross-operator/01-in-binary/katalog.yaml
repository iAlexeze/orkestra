apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: cross-operator-in-binary
  description: >
    Cross-CRD communication within a single Orkestra runtime.

    Producer creates a Deployment and a Service, then writes its
    ClusterIP into status.endpoint.

    Consumer reads Producer's status.endpoint via the cross: block
    (zero API calls — data comes from the informer cache) and injects
    it as DB_HOST into its own Deployment env.

    Both CRDs live in the same binary: one Katalog, one process.

spec:
  crds:
    # ── Producer ──────────────────────────────────────────────────────────────
    # Creates a Deployment + Service and exposes its ClusterIP in status.
    producer:
      apiTypes:
        group: cross.orkestra.io
        version: v1alpha1
        kind: Producer
        plural: producers

      workers: 2
      resync: 30s

      operatorBox:
        status:
          fields:
            - path: phase
              value: "Running"
            - path: endpoint
              value: '{{ get .children.service "spec" "clusterIP" }}:8080'

        onCreate:
          deployments:
            - image: "{{ .spec.image }}"
              replicas: "{{ .spec.replicas }}"
              port: 8080
              reconcile: true
          services:
            - port: "8080"
              reconcile: true

    # ── Consumer ──────────────────────────────────────────────────────────────
    # Reads Producer's status.endpoint via the cross block.
    # cross.producer.found must be "true" and cross.producer.status.endpoint
    # must be non-empty before the Consumer creates its Deployment.
    consumer:
      apiTypes:
        group: cross.orkestra.io
        version: v1alpha1
        kind: Consumer
        plural: consumers

      workers: 2
      resync: 30s

      operatorBox:
        # Declare the cross-CRD observation.
        # Orkestra resolves the Producer CR with the same name in the same
        # namespace and makes it available as .cross.producer.*
        cross:
          - crd: producer
            selector:
              name: "{{ .metadata.name }}"
              namespace: "{{ .metadata.namespace }}"
            as: producer

        status:
          fields:
            - path: phase
              value: "Running"
            - path: producerEndpoint
              value: "{{ .cross.producer.status.endpoint }}"

        onCreate:
          deployments:
            - image: "{{ .spec.image }}"
              replicas: "{{ .spec.replicas }}"
              port: 9090
              env:
                PRODUCER_HOST:
                  value: "{{ .cross.producer.status.endpoint }}"
              reconcile: true
          services:
            - port: "9090"
