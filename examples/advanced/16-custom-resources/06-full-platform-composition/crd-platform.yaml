apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: platforms.infra.example.io
  annotations:
    description: |
      Platform is the top-level composition CRD. Applying a single Platform CR
      provisions a complete infrastructure stack: MessageQueue, ObjectStore, and
      SearchCluster. The operator imports a motif that parameterises the stack
      based on the size field (small, medium, large).
spec:
  group: infra.example.io
  scope: Namespaced
  names:
    kind: Platform
    plural: platforms
    singular: platform
    shortNames:
      - plat
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Size
          type: string
          jsonPath: .spec.size
        - name: Owner
          type: string
          jsonPath: .spec.owner
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [size, owner]
              properties:
                size:
                  type: string
                  description: "Platform sizing tier: small, medium, or large."
                  enum: [small, medium, large]
                owner:
                  type: string
                  description: "Team or person responsible for this platform."
                region:
                  type: string
                  description: "Primary cloud region."
                  default: "us-east-1"
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                phase:
                  type: string
                mqPhase:
                  type: string
                storePhase:
                  type: string
                searchPhase:
                  type: string
