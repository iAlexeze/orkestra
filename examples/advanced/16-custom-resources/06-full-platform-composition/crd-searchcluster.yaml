apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: searchclusters.infra.example.io
  annotations:
    description: |
      SearchCluster provisions an OpenSearch cluster as part of the Platform
      stack. Node count and heap size are derived from the Platform sizing tier
      via the platform-motif.
spec:
  group: infra.example.io
  scope: Namespaced
  names:
    kind: SearchCluster
    plural: searchclusters
    singular: searchcluster
    shortNames:
      - sc
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Nodes
          type: integer
          jsonPath: .spec.nodes
        - name: HeapSize
          type: string
          jsonPath: .spec.heapSize
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [nodes, heapSize]
              properties:
                nodes:
                  type: integer
                  description: "Number of OpenSearch data nodes."
                heapSize:
                  type: string
                  description: "JVM heap size per node, e.g. 1g, 4g."
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                phase:
                  type: string
                endpoint:
                  type: string
