apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: messagequeues.infra.example.io
  annotations:
    description: |
      MessageQueue provisions a message broker (RabbitMQ-based) as part of
      the Platform stack. Parameterised by replicas and storage size derived
      from the Platform sizing tier via the platform-motif.
spec:
  group: infra.example.io
  scope: Namespaced
  names:
    kind: MessageQueue
    plural: messagequeues
    singular: messagequeue
    shortNames:
      - mq
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Replicas
          type: integer
          jsonPath: .spec.replicas
        - name: Storage
          type: string
          jsonPath: .spec.storage
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [replicas, storage]
              properties:
                replicas:
                  type: integer
                storage:
                  type: string
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                phase:
                  type: string
                endpoint:
                  type: string
