apiVersion: orkestra.orkspace.io/v1
kind: Motif
metadata:
  name: platform-stack
  version: 0.1.0
  author: orkspace
  description: >
    Full-stack platform motif. Accepts a size tier (small/medium/large) and
    provisions a MessageQueue, ObjectStore, and SearchCluster with appropriate
    sizing for that tier. Import this motif from any Platform CRD to reuse the
    composition without duplicating the custom resource declarations.

inputs:
  - name: mqReplicas
    description: "Number of MessageQueue replicas."
    required: false
    default: 1
    type: integer

  - name: mqStorage
    description: "MessageQueue storage size."
    required: false
    default: "10Gi"

  - name: storeCapacity
    description: "ObjectStore total storage capacity."
    required: false
    default: "100Gi"

  - name: storeReplicas
    description: "ObjectStore replica count."
    required: false
    default: 1
    type: integer

  - name: searchNodes
    description: "Number of SearchCluster data nodes."
    required: false
    default: 1
    type: integer

  - name: searchHeapSize
    description: "JVM heap size per search node."
    required: false
    default: "1g"

resources:
  custom:

    # ── MessageQueue ─────────────────────────────────────────────────────────
    - apiVersion: infra.example.io/v1alpha1
      kind: MessageQueue
      metadata:
        name: "{{ .metadata.name }}-mq"
        namespace: "{{ .metadata.namespace }}"
        namespaced: true
        labels:
          - key: infra.example.io/platform
            value: "{{ .metadata.name }}"
          - key: infra.example.io/owner
            value: "{{ .spec.owner }}"
      spec:
        replicas: "{{ .inputs.mqReplicas }}"
        storage: "{{ .inputs.mqStorage }}"
      hasStatus: true

    # ── ObjectStore ───────────────────────────────────────────────────────────
    - apiVersion: infra.example.io/v1alpha1
      kind: ObjectStore
      metadata:
        name: "{{ .metadata.name }}-store"
        namespace: "{{ .metadata.namespace }}"
        namespaced: true
        labels:
          - key: infra.example.io/platform
            value: "{{ .metadata.name }}"
          - key: infra.example.io/owner
            value: "{{ .spec.owner }}"
      spec:
        capacity: "{{ .inputs.storeCapacity }}"
        replicas: "{{ .inputs.storeReplicas }}"
      hasStatus: true

    # ── SearchCluster ─────────────────────────────────────────────────────────
    - apiVersion: infra.example.io/v1alpha1
      kind: SearchCluster
      metadata:
        name: "{{ .metadata.name }}-search"
        namespace: "{{ .metadata.namespace }}"
        namespaced: true
        labels:
          - key: infra.example.io/platform
            value: "{{ .metadata.name }}"
          - key: infra.example.io/owner
            value: "{{ .spec.owner }}"
      spec:
        nodes: "{{ .inputs.searchNodes }}"
        heapSize: "{{ .inputs.searchHeapSize }}"
      hasStatus: true
