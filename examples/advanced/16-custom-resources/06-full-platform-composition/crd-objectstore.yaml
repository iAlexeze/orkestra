apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: objectstores.infra.example.io
  annotations:
    description: |
      ObjectStore provisions an S3-compatible object storage system (MinIO-based)
      as part of the Platform stack. Storage capacity is derived from the Platform
      sizing tier via the platform-motif.
spec:
  group: infra.example.io
  scope: Namespaced
  names:
    kind: ObjectStore
    plural: objectstores
    singular: objectstore
    shortNames:
      - os
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Capacity
          type: string
          jsonPath: .spec.capacity
        - name: Replicas
          type: integer
          jsonPath: .spec.replicas
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [capacity]
              properties:
                capacity:
                  type: string
                replicas:
                  type: integer
                  default: 1
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                phase:
                  type: string
                endpoint:
                  type: string
