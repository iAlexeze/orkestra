apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: shardedstores.storage.example.io
  annotations:
    description: |
      ShardedStore represents a horizontally sharded distributed data store.
      The operator uses forEach to fan out over spec.shards and create one
      Shard child CR per entry. Adding or removing entries from spec.shards
      causes the corresponding child CRs to be created or deleted.
spec:
  group: storage.example.io
  scope: Namespaced
  names:
    kind: ShardedStore
    plural: shardedstores
    singular: shardedstore
    shortNames:
      - ss
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Shards
          type: integer
          jsonPath: .status.shardCount
        - name: ReplicationFactor
          type: integer
          jsonPath: .spec.replicationFactor
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [shards, replicationFactor]
              properties:
                replicationFactor:
                  type: integer
                  description: "Number of replicas for each shard."
                  default: 1
                shards:
                  type: array
                  description: "List of shard definitions."
                  items:
                    type: object
                    required: [name, region, size]
                    properties:
                      name:
                        type: string
                        description: "Shard identifier, e.g. shard-eu."
                      region:
                        type: string
                        description: "Cloud region for this shard."
                      size:
                        type: string
                        description: "Storage size, e.g. 100Gi."
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                phase:
                  type: string
                shardCount:
                  type: integer
