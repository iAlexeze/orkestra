apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: shards.storage.example.io
  annotations:
    description: |
      Shard is a single partition of a ShardedStore. Each Shard is created
      by the ShardedStore operator via forEach and represents one independent
      storage unit with its own region placement and replication configuration.
spec:
  group: storage.example.io
  scope: Namespaced
  names:
    kind: Shard
    plural: shards
    singular: shard
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: ShardName
          type: string
          jsonPath: .spec.shardName
        - name: Region
          type: string
          jsonPath: .spec.region
        - name: Size
          type: string
          jsonPath: .spec.size
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [shardName, region, size, replicationFactor]
              properties:
                shardName:
                  type: string
                region:
                  type: string
                size:
                  type: string
                replicationFactor:
                  type: integer
                  default: 1
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                phase:
                  type: string
                endpoint:
                  type: string
