apiVersion: storage.example.io/v1alpha1
kind: ShardedStore
metadata:
  name: global-store
  namespace: default
spec:
  replicationFactor: 2
  shards:
    - name: shard-eu
      region: eu-west-1
      size: 500Gi
    - name: shard-us
      region: us-east-1
      size: 500Gi
    - name: shard-ap
      region: ap-southeast-1
      size: 250Gi
