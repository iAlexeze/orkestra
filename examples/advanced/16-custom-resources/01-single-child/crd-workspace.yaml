apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: workspaces.platform.example.io
  annotations:
    description: |
      Developer Workspace resource for the platform.example.io group.

      A Workspace represents an isolated environment for a development team.
      When created, the Workspace operator automatically provisions a SecretVault
      child CR so that secrets storage is always available alongside the workspace.
spec:
  group: platform.example.io
  scope: Namespaced
  names:
    kind: Workspace
    plural: workspaces
    singular: workspace
    shortNames:
      - ws
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Team
          type: string
          jsonPath: .spec.team
        - name: Encryption
          type: string
          jsonPath: .spec.encryption
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [name, team]
              properties:
                name:
                  type: string
                  description: "Human-readable display name for the workspace."
                team:
                  type: string
                  description: "Team that owns this workspace."
                encryption:
                  type: string
                  description: "Encryption algorithm for secrets: AES256 or AES512."
                  enum: [AES256, AES512]
                  default: AES256
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                phase:
                  type: string
                vaultRef:
                  type: string
