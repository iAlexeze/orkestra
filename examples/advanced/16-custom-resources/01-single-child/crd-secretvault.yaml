apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: secretvaults.platform.example.io
  annotations:
    description: |
      SecretVault manages a dedicated secrets API server for a workspace.
      Each SecretVault is created as a child of a Workspace and runs a
      small HTTP server that stores encrypted key-value pairs.
spec:
  group: platform.example.io
  scope: Namespaced
  names:
    kind: SecretVault
    plural: secretvaults
    singular: secretvault
    shortNames:
      - sv
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Encryption
          type: string
          jsonPath: .spec.encryption
        - name: MaxSecrets
          type: integer
          jsonPath: .spec.maxSecrets
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [workspaceName, encryption]
              properties:
                workspaceName:
                  type: string
                  description: "Name of the parent Workspace."
                encryption:
                  type: string
                  description: "Encryption algorithm: AES256 or AES512."
                  enum: [AES256, AES512]
                maxSecrets:
                  type: integer
                  description: "Maximum number of secrets the vault will store."
                  default: 100
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                phase:
                  type: string
                endpoint:
                  type: string
