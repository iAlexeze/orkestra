apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: connectors.data.example.io
  annotations:
    description: |
      Connector executes a point-to-point data transfer between a source and
      destination system. Each Connector is owned by a DataPipeline and runs a
      Kubernetes Job that performs the actual data movement.
spec:
  group: data.example.io
  scope: Namespaced
  names:
    kind: Connector
    plural: connectors
    singular: connector
    shortNames:
      - conn
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Source
          type: string
          jsonPath: .spec.source
        - name: Format
          type: string
          jsonPath: .spec.format
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [source, destination, format]
              properties:
                source:
                  type: string
                destination:
                  type: string
                format:
                  type: string
                  enum: [json, parquet, csv]
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                phase:
                  type: string
                  description: "Connector phase: Pending, Running, Succeeded, Failed."
                rowsTransferred:
                  type: integer
