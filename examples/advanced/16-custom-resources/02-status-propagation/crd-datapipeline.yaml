apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: datapipelines.data.example.io
  annotations:
    description: |
      DataPipeline orchestrates a data movement workflow between a source and
      destination system. It creates a Connector child CR that handles the
      actual data transfer, then reads the connector's status phase and surfaces
      it in the pipeline's own status.
spec:
  group: data.example.io
  scope: Namespaced
  names:
    kind: DataPipeline
    plural: datapipelines
    singular: datapipeline
    shortNames:
      - dp
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Source
          type: string
          jsonPath: .spec.source
        - name: Destination
          type: string
          jsonPath: .spec.destination
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: ConnectorPhase
          type: string
          jsonPath: .status.connectorPhase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [source, destination, format]
              properties:
                source:
                  type: string
                  description: "Source system identifier (e.g. s3://my-bucket/input)."
                destination:
                  type: string
                  description: "Destination system identifier (e.g. gs://my-bucket/output)."
                format:
                  type: string
                  description: "Data format: json, parquet, or csv."
                  enum: [json, parquet, csv]
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                phase:
                  type: string
                pipelineStatus:
                  type: string
                connectorPhase:
                  type: string
