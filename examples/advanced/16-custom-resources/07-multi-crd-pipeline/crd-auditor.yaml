apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: auditors.autoscale.orkestra.io
spec:
  group: autoscale.orkestra.io
  names:
    kind: Auditor
    plural: auditors
    singular: auditor
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: AuditMode
          type: string
          jsonPath: .spec.auditMode
        - name: Autoscale
          type: string
          jsonPath: .status.autoscaleActive
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                auditMode:
                  type: string
                  nullable: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
