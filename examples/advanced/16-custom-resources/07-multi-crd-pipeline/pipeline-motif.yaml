apiVersion: orkestra.orkspace.io/v1
kind: Motif
metadata:
  name: pipeline
  version: 0.1.0
  author: orkspace
  description: >
    Pipeline orchestrates three autoscale CRDs (Loader, Processor, Auditor)
    by creating them declaratively via onCreate.custom.

inputs:
  - name: image
    description: Global default image for all components
    required: false
    default: "nginx:stable-alpine"

  - name: loaderImage
    description: Override image for Loader
    required: false

  - name: processorImage
    description: Override image for Processor
    required: false

  - name: auditMode
    description: Default audit mode for Auditor CR
    required: false
    default: "Warn"

  - name: replicas
    description: Default replicas for Loader/Processor
    required: false
    default: 1
    type: integer

resources:
  custom:

    # ───────────────────────────────────────────────────────────────
    # 1. Loader
    # ───────────────────────────────────────────────────────────────
    - apiVersion: autoscale.orkestra.io/v1alpha1
      kind: Loader
      metadata:
        name: "{{ .metadata.name }}-loader"
        namespace: "{{ .metadata.namespace }}"
        namespaced: true
        labels:
          ork.io/pipeline: "{{ .metadata.name }}"
      spec:
        image: "{{ default .inputs.loaderImage .inputs.image }}"
        replicas: "{{ .inputs.replicas }}"
      hasStatus: true

    # ───────────────────────────────────────────────────────────────
    # 2. Processor
    # ───────────────────────────────────────────────────────────────
    - apiVersion: autoscale.orkestra.io/v1alpha1
      kind: Processor
      metadata:
        name: "{{ .metadata.name }}-processor"
        namespace: "{{ .metadata.namespace }}"
        namespaced: true
        labels:
          ork.io/pipeline: "{{ .metadata.name }}"
      spec:
        image: "{{ default .inputs.processorImage .inputs.image }}"
        replicas: "{{ .inputs.replicas }}"
      hasStatus: true

    # ───────────────────────────────────────────────────────────────
    # 3. Auditor
    # ───────────────────────────────────────────────────────────────
    - apiVersion: autoscale.orkestra.io/v1alpha1
      kind: Auditor
      metadata:
        name: "{{ .metadata.name }}-auditor"
        namespace: "{{ .metadata.namespace }}"
        namespaced: true
        labels:
          ork.io/pipeline: "{{ .metadata.name }}"
      spec:
        auditMode: "{{ .inputs.auditMode }}"
      hasStatus: true
