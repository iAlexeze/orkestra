apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: databases.storage.example.io
  annotations:
    description: |
      Database represents a managed database instance. When created, it
      automatically provisions a BackupPolicy child CR with reconcile: true,
      meaning the backup policy is enforced on every reconcile cycle and
      cannot be permanently deleted or modified by an operator outside Orkestra.
spec:
  group: storage.example.io
  scope: Namespaced
  names:
    kind: Database
    plural: databases
    singular: database
    shortNames:
      - db
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Engine
          type: string
          jsonPath: .spec.engine
        - name: Version
          type: string
          jsonPath: .spec.version
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [engine, version]
              properties:
                engine:
                  type: string
                  description: "Database engine: postgres or mysql."
                  enum: [postgres, mysql]
                version:
                  type: string
                  description: "Engine version, e.g. '15.4' or '8.0'."
                backup:
                  type: object
                  properties:
                    schedule:
                      type: string
                      description: "Cron schedule for backups, e.g. '0 2 * * *'."
                      default: "0 2 * * *"
                    retention:
                      type: integer
                      description: "Number of days to retain backups."
                      default: 7
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                phase:
                  type: string
                backupPolicyRef:
                  type: string
