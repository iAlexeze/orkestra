apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: database-operator
  author: orkspace
  version: 0.1.0
  description: >
    Database operator: demonstrates reconcile: true on a child CR block.
    The BackupPolicy child is enforced on every reconcile cycle. Manually
    deleting or editing the BackupPolicy triggers Orkestra to recreate or
    correct it within the resync window.

spec:
  crds:

    # ── Database ───────────────────────────────────────────────────────────────
    database:
      apiTypes:
        group: storage.example.io
        version: v1alpha1
        kind: Database
        plural: databases
      workers: 2
      resync: 30s
      operatorBox:
        status:
          fields:
            - path: phase
              value: "Ready"
            - path: backupPolicyRef
              value: "{{ .metadata.name }}-backup"

        # onReconcile.custom — enforced on EVERY reconcile, not just onCreate.
        # reconcile: true on each child means Orkestra will apply (patch) the
        # child's spec on every cycle, correcting any drift introduced manually.
        onReconcile:
          custom:
            - apiVersion: storage.example.io/v1alpha1
              kind: BackupPolicy
              metadata:
                name: "{{ .metadata.name }}-backup"
                namespace: "{{ .metadata.namespace }}"
                namespaced: true
                labels:
                  - key: storage.example.io/database
                    value: "{{ .metadata.name }}"
                  - key: storage.example.io/engine
                    value: "{{ .spec.engine }}"
              spec:
                schedule: "{{ .spec.backup.schedule }}"
                retention: "{{ .spec.backup.retention }}"
                engine: "{{ .spec.engine }}"
              # reconcile: true — on every Database reconcile, Orkestra applies
              # the spec above to the child CR. If someone manually deletes the
              # BackupPolicy, Orkestra recreates it. If someone changes its
              # schedule field, Orkestra resets it back to match the Database spec.
              reconcile: true
              hasStatus: false

    # ── BackupPolicy ───────────────────────────────────────────────────────────
    backuppolicy:
      apiTypes:
        group: storage.example.io
        version: v1alpha1
        kind: BackupPolicy
        plural: backuppolicies
      workers: 1
      resync: 60s
      operatorBox:
        status:
          fields:
            - path: phase
              value: "Active"
        onCreate:
          cronJobs:
            - name: "{{ .metadata.name }}-job"
              schedule: "{{ .spec.schedule }}"
              image: "bitnami/postgresql:15"
              command: ["sh", "-c"]
              args:
                - |
                  echo "Running backup for engine={{ .spec.engine }}, retention={{ .spec.retention }}d"
