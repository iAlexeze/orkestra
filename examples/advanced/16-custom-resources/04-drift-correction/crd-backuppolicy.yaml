apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: backuppolicies.storage.example.io
  annotations:
    description: |
      BackupPolicy defines when and how a database is backed up.
      It is always created as a child of a Database CR. Because the parent
      declares it with reconcile: true, any manual deletion or modification
      of a BackupPolicy is corrected by Orkestra on the next reconcile cycle.
spec:
  group: storage.example.io
  scope: Namespaced
  names:
    kind: BackupPolicy
    plural: backuppolicies
    singular: backuppolicy
    shortNames:
      - bp
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Schedule
          type: string
          jsonPath: .spec.schedule
        - name: Retention
          type: integer
          jsonPath: .spec.retention
        - name: Engine
          type: string
          jsonPath: .spec.engine
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [schedule, retention, engine]
              properties:
                schedule:
                  type: string
                  description: "Cron expression for backup schedule."
                retention:
                  type: integer
                  description: "Retention period in days."
                engine:
                  type: string
                  description: "The database engine this policy applies to."
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                phase:
                  type: string
                lastBackup:
                  type: string
