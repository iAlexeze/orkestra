apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: searchindices.platform.example.io
  annotations:
    description: |
      SearchIndex provisions an Elasticsearch-compatible full-text search index
      for an AppEnvironment. Created as an optional child CR when search.enabled is true.
spec:
  group: platform.example.io
  scope: Namespaced
  names:
    kind: SearchIndex
    plural: searchindices
    singular: searchindex
    shortNames:
      - si
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: IndexName
          type: string
          jsonPath: .spec.indexName
        - name: Replicas
          type: integer
          jsonPath: .spec.replicas
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [indexName]
              properties:
                indexName:
                  type: string
                replicas:
                  type: integer
                  default: 1
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                phase:
                  type: string
                indexSize:
                  type: string
