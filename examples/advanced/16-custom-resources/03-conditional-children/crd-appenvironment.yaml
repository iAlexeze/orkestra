apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: appenvironments.platform.example.io
  annotations:
    description: |
      AppEnvironment provisions a complete application environment for a given tier.
      Depending on the tier and feature flags, it optionally creates CacheCluster
      and SearchIndex child CRs. Dev environments typically run lean; prod
      environments enable all optional components.
spec:
  group: platform.example.io
  scope: Namespaced
  names:
    kind: AppEnvironment
    plural: appenvironments
    singular: appenvironment
    shortNames:
      - ae
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Tier
          type: string
          jsonPath: .spec.tier
        - name: Cache
          type: string
          jsonPath: .spec.cache.enabled
        - name: Search
          type: string
          jsonPath: .spec.search.enabled
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [name, tier]
              properties:
                name:
                  type: string
                tier:
                  type: string
                  description: "Environment tier: dev or prod."
                  enum: [dev, prod]
                cache:
                  type: object
                  properties:
                    enabled:
                      type: string
                      description: "Enable cache cluster: 'true' or 'false'."
                      enum: ["true", "false"]
                    size:
                      type: string
                      description: "Cache size class: small, medium, large."
                      default: small
                    ttl:
                      type: integer
                      description: "Default TTL for cached entries in seconds."
                      default: 3600
                search:
                  type: object
                  properties:
                    enabled:
                      type: string
                      description: "Enable search index: 'true' or 'false'."
                      enum: ["true", "false"]
                    indexName:
                      type: string
                    replicas:
                      type: integer
                      default: 1
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                phase:
                  type: string
                activeComponents:
                  type: string
