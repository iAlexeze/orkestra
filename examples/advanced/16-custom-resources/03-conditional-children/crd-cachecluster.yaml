apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: cacheclusters.platform.example.io
  annotations:
    description: |
      CacheCluster provisions a Redis-compatible in-memory cache for an AppEnvironment.
      It is created as an optional child CR when cache.enabled is true.
spec:
  group: platform.example.io
  scope: Namespaced
  names:
    kind: CacheCluster
    plural: cacheclusters
    singular: cachecluster
    shortNames:
      - cc
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Size
          type: string
          jsonPath: .spec.size
        - name: TTL
          type: integer
          jsonPath: .spec.ttl
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [size]
              properties:
                size:
                  type: string
                  description: "Size class: small, medium, large."
                  enum: [small, medium, large]
                ttl:
                  type: integer
                  description: "Default TTL in seconds."
                  default: 3600
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                phase:
                  type: string
                endpoint:
                  type: string
