apiVersion: platform.example.io/v1alpha1
kind: AppEnvironment
metadata:
  name: prod-env
  namespace: default
spec:
  name: "Production Environment"
  tier: prod
  cache:
    enabled: "true"
    size: large
    ttl: 7200
  search:
    enabled: "true"
    indexName: "prod-main-index"
    replicas: 3
