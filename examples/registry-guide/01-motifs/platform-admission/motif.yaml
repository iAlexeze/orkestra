apiVersion: orkestra.orkspace.io/v1
kind: Motif
metadata:
  name: platform-admission
  version: v1.0.0
  description: >
    Platform admission policies: image registry enforcement, required team label,
    and replica bounds. Import this motif into any katalog to enforce organisation
    standards at admission time and on every reconcile cycle.
    No resources are created — this is a policy-only motif.
  author: myorg
  license: Apache-2.0
  tags:
    - admission
    - policy
    - governance
    - validation
    - mutation
    - platform

inputs:
  - name: allowedRegistry
    description: Image registry prefix all container images must come from
    default: "ghcr.io/orkspace/"

  - name: maxReplicas
    description: Hard ceiling on spec.replicas
    default: "20"

resources: {}

admission:
  validation:
    rules:
      # Enforce internal registry — prevents pulling from public registries
      - field: spec.image
        prefix: "{{ .inputs.allowedRegistry }}"
        message: "image must be pulled from the internal registry ({{ .inputs.allowedRegistry }})"
        action: deny

      # Replica hard ceiling — prevents runaway scale during incidents
      - field: spec.replicas
        max: "{{ .inputs.maxReplicas }}"
        message: "spec.replicas cannot exceed {{ .inputs.maxReplicas }}"
        action: deny

      # Advisory — team ownership enables cost attribution and alerts routing
      - field: metadata.labels.team
        operator: exists
        message: "declare metadata.labels.team for cost attribution and alert routing"
        action: warn

  mutation:
    mutateFirst: true
    rules:
      # Ensure replicas is always set before the deny rule above runs
      - field: spec.replicas
        default: "1"