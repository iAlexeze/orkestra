apiVersion: orkestra.orkspace.io/v1
kind: Motif
metadata:
  name: data-store
  version: v1.0.0
  description: >
    StatefulSet + PVC + headless Service + client Service for a stateful data workload.
    Credentials are auto-generated once on first creation and rotated automatically.
    Import this motif when you need persistent, stateful storage in a katalog.
  author: myorg
  license: Apache-2.0
  tags:
    - statefulset
    - storage
    - database
    - secret
    - stateful
    - credentials

inputs:
  - name: image
    description: Container image (e.g. redis:7)
    required: true

  - name: port
    description: Container port the data service listens on
    required: true

  - name: storageSize
    description: PVC size (e.g. 10Gi)
    default: "10Gi"

  - name: storageClass
    description: StorageClass for dynamic PVC provisioning
    default: "standard"

  - name: replicas
    description: Number of replicas
    default: "1"

  - name: resourceProfile
    description: CPU/memory profile (small, standard, compute-heavy)
    default: "standard"

  - name: passwordRotation
    description: How often to rotate the generated password (e.g. 30d, 90d, never)
    default: "30d"

resources:
  # Secrets are declared under onCreate so they are created once at first
  # reconcile and never drift-corrected on subsequent reconciles. Without
  # onCreate, Orkestra would attempt to update the secret on every reconcile
  # cycle, which would rotate a randomAlphanumeric value on every loop.
  onCreate:
    secrets:
      - name: "{{ .metadata.name }}-creds"
        once: true
        rotateAfter: "{{ .inputs.passwordRotation }}"
        data:
          password: "{{ randomAlphanumeric 24 }}"

  statefulSets:
    - name: "{{ .metadata.name }}"
      image: "{{ .inputs.image }}"
      replicas: "{{ .inputs.replicas }}"
      serviceName: "{{ .metadata.name }}-headless"
      port: "{{ .inputs.port }}"
      resources:
        profile: "{{ .inputs.resourceProfile }}"
      volumeClaimTemplates:
        - name: data
          storageClass: "{{ .inputs.storageClass }}"
          storageSize: "{{ .inputs.storageSize }}"
          mountPath: /data
      reconcile: true

  services:
    - name: "{{ .metadata.name }}-headless"
      headless: true
      port: "{{ .inputs.port }}"
      targetPort: "{{ .inputs.port }}"

    - name: "{{ .metadata.name }}-svc"
      port: "{{ .inputs.port }}"
      targetPort: "{{ .inputs.port }}"
      reconcile: true

status:
  fields:
    - path: ready
      value: "{{ allReplicasReady .children.statefulset }}"
    - path: connectionSecret
      value: "{{ .metadata.name }}-creds"
    - path: endpoint
      value: "{{ .metadata.name }}-svc.{{ .metadata.namespace }}.svc.cluster.local:{{ .inputs.port }}"