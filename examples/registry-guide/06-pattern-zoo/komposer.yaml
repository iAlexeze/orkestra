apiVersion: orkestra.orkspace.io/v1
kind: Komposer
metadata:
  name: full-platform
  version: v1.0.0
  description: >
    All seven official Orkestra Registry patterns composed into a single Orkestra
    runtime, alongside locally-authored katalogs. One process manages nine CRDs.

imports:
  registry:
    - oci://ghcr.io/orkspace/orkestra-registry/patterns/katalogs/postgres:v1.0.0
    - oci://ghcr.io/orkspace/orkestra-registry/patterns/katalogs/mysql:v1.0.0
    - oci://ghcr.io/orkspace/orkestra-registry/patterns/katalogs/mongodb:v1.0.0
    - oci://ghcr.io/orkspace/orkestra-registry/patterns/katalogs/redis:v1.0.0
    - oci://ghcr.io/orkspace/orkestra-registry/patterns/katalogs/kafka:v1.0.0
    - oci://ghcr.io/orkspace/orkestra-registry/patterns/katalogs/rabbitmq:v1.0.0
    - oci://ghcr.io/orkspace/orkestra-registry/patterns/katalogs/deployment-stack:v1.0.0

  # Team-authored katalogs alongside the registry patterns
  files:
    - ../02-katalog-api/katalog.yaml
    - ../03-katalog-cache/katalog.yaml

spec:
  crds:
    # Heavy stateful — single worker avoids concurrent mutation; 1m resync is enough
    postgres:
      workers: 1
      resync: 1m
      queue:
        failureThreshold: 3

    mysql:
      workers: 1
      resync: 1m
      queue:
        failureThreshold: 3

    mongodb:
      workers: 1
      resync: 1m
      queue:
        failureThreshold: 3

    # Semi-stateful cache
    redis:
      workers: 2
      resync: 30s

    # Messaging brokers — deeper queue absorbs burst
    kafka:
      workers: 2
      resync: 30s
      queue:
        maxDepth: 200

    rabbitmq:
      workers: 2
      resync: 30s
      queue:
        maxDepth: 200

    # Stateless deployments
    application:
      workers: 3
      resync: 30s

    # Team katalogs
    webapp:
      workers: 2
      resync: 30s

    cache:
      workers: 1
      resync: 30s
      queue:
        failureThreshold: 3
