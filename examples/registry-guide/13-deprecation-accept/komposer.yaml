apiVersion: orkestra.orkspace.io/v1
kind: Komposer
metadata:
  name: platform-komposer
  version: v1.0.0
  description: >
    Platform Komposer that imports a deprecated Katalog from a local file.
    lifecycle.accept.patterns acknowledges the import so ork validate does not warn.

# lifecycle:
#   maturity: stable
#   accept:
#     patterns:
#       - name: webapp-operator   # accepts all lifecycle concerns for this import
#         author: myorg           # optional — disambiguates when name is not unique

imports:
  files:
    - ./katalog.yaml
