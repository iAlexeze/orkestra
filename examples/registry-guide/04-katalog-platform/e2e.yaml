apiVersion: orkestra.orkspace.io/v1
kind: E2E
metadata:
  name: platform-app-e2e
  description: End-to-end test for the platform-app-operator pattern
spec:
  cluster:
    name: ork-e2e-platform
    provider: kind
    reuse: false
  katalog: ./katalog.yaml
  crd: ./crd.yaml
  cr: ./cr.yaml
  expect:
    - name: "PlatformApp CR created"
      after: cr-applied
      timeout: 30s
      resources:
        - kind: PlatformApp
          name: my-platform-app
          namespace: default

    - name: "Deployment running"
      after: cr-applied
      timeout: 120s
      resources:
        - kind: Deployment
          name: my-platform-app
          namespace: default
          ready: true

    - name: "Service exists"
      after: cr-applied
      timeout: 30s
      resources:
        - kind: Service
          name: my-platform-app-svc
          namespace: default

    - name: "PlatformApp CR deleted"
      after: cr-deleted
      timeout: 60s
      resources:
        - kind: PlatformApp
          name: my-platform-app
          namespace: default
          count: 0

    - name: "Deployment removed"
      after: cr-deleted
      timeout: 60s
      resources:
        - kind: Deployment
          name: my-platform-app
          namespace: default
          count: 0
