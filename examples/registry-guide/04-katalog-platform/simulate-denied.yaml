apiVersion: orkestra.orkspace.io/v1
kind: Simulate
metadata:
  name: platform-app-denied-sim
  description: >
    Verify the non-compliant CR (image from disallowed registry) is rejected
    at reconcile time — no resources are created.

spec:
  katalog: ./katalog.yaml
  cr: ./cr-denied.yaml
  cycles: 3

  expect:
    noErrors: false
    absent:
      - resource: deployments
        name: my-platform-app-denied
      - resource: services
        name: my-platform-app-denied-svc
