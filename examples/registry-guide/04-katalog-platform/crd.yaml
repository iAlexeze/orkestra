apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: platformapps.rkguide.demo
spec:
  group: rkguide.demo
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  description: "Container image — must be from ghcr.io/orkspace/"
                port:
                  type: integer
                  default: 8080
                replicas:
                  type: integer
                  default: 1
                host:
                  type: string
                  default: ""
                resourceProfile:
                  type: string
                  default: small
                  enum: [small, standard, burst]
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
  names:
    kind: PlatformApp
    plural: platformapps
    singular: platformapp
  scope: Namespaced