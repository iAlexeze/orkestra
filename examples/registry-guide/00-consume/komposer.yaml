apiVersion: orkestra.orkspace.io/v1
kind: Komposer
metadata:
  name: quickstart
  description: >
    Pull the postgres pattern from the Orkestra registry and run it in your cluster.
    This is the minimum Komposer needed to consume a published pattern.

imports:
  registry:
    - oci://ghcr.io/orkspace/orkestra-registry/patterns/katalogs/postgres@v1.0.0

# No spec.crds overrides — all defaults from the published pattern are used.
# Add a spec.crds.postgres block when you need to tune workers, resync, or
# override operatorBox behaviour for your environment.