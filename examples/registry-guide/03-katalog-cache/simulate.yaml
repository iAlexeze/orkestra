apiVersion: orkestra.orkspace.io/v1
kind: Simulate
metadata:
  name: cache-sim
  description: >
    Verify the data-store motif produces a StatefulSet, headless Service, and
    client Service on cycle 1. The credentials Secret is created once under
    onCreate and does not appear in subsequent reconcile cycles.

spec:
  katalog: ./katalog.yaml
  cr: ./cr.yaml
  cycles: 5

  expect:
    steady: true
    noErrors: true
    ops:
      - cycle: 1
        verb: create
        resource: statefulsets
        name: my-cache
      - cycle: 1
        verb: create
        resource: services
        name: my-cache-headless
      - cycle: 1
        verb: create
        resource: services
        name: my-cache-svc
      - cycle: 1
        verb: create
        resource: configmaps
        name: my-cache-config     # planned: connection info ConfigMap — not yet in motif
