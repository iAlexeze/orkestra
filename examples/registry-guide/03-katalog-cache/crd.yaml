apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: caches.rkguide.demo
spec:
  group: rkguide.demo
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  default: "redis:7"
                  description: Cache image (e.g. redis:7, memcached:1.6)
                port:
                  type: integer
                  default: 6379
                  description: Port the cache listens on
                storageSize:
                  type: string
                  default: "5Gi"
                  description: PVC size for persistence
                storageClass:
                  type: string
                  default: "standard"
                  description: StorageClass for dynamic PVC provisioning
                replicas:
                  type: integer
                  default: 1
                resourceProfile:
                  type: string
                  default: "burst"
                  enum: [burst, standard, compute-heavy]
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
  names:
    kind: Cache
    plural: caches
    singular: cache
  scope: Namespaced