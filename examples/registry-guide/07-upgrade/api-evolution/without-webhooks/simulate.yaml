apiVersion: orkestra.orkspace.io/v1
kind: Simulate
metadata:
  name: webapp-normalize-sim
  description: >
    Verify that the flat CR (spec.port) and the structured CR (spec.expose.port)
    both produce identical Deployments and Services after normalize collapses
    them into the canonical spec.expose shape.

spec:
  katalog: ./katalog.yaml
  cr: ./cr-port-string.yaml
  cycles: 3

  expect:
    steady: true
    noErrors: true
    ops:
      - cycle: 1
        verb: create
        resource: deployments
        name: webapp-flat
      - cycle: 1
        verb: create
        resource: services
        name: webapp-flat-svc
