---
# Single-version WebApp CRD — no conversion webhook.
#
# spec accepts EITHER the old flat format (spec.port + spec.host) OR the
# structured format (spec.expose.port + spec.expose.host). Orkestra detects
# which form was used and normalises it before any reconcile logic runs.
#
# No conversion block. No caBundle. No TLS. No cert-manager.
# This is the entire operational difference vs the with-webhooks variant.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: webapps.rkguide.demo
spec:
  group: rkguide.demo
  scope: Namespaced
  names:
    plural: webapps
    singular: webapp
    kind: WebApp
    shortNames: [wa]
    categories: [orkestra]
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Image
          type: string
          jsonPath: .spec.image
        - name: Port
          type: string
          jsonPath: .status.port
        - name: Format
          type: string
          jsonPath: .status.specFormat
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  description: Container image

                replicas:
                  type: integer
                  minimum: 1
                  default: 1

                # Old format — top-level port and host (deprecated: use spec.expose)
                port:
                  type: integer
                  description: >
                    Container port (deprecated: use spec.expose.port).
                    Accepted for backwards compatibility. normalize collapses
                    this into spec.expose.port before reconcile.

                host:
                  type: string
                  description: >
                    Ingress hostname (deprecated: use spec.expose.host).

                # New format — structured expose block
                expose:
                  type: object
                  required: [port]
                  description: Exposure configuration — port and hostname
                  properties:
                    port:
                      type: integer
                      description: Container port the application listens on
                    host:
                      type: string
                      description: Ingress hostname — when set, an Ingress is created

            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
