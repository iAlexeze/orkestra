apiVersion: orkestra.orkspace.io/v1
kind: E2E
metadata:
  name: webapp-normalize-e2e
  description: >
    End-to-end test for normalize-based format collapse. Applies the structured
    CR (spec.expose.port) and verifies it is stored, reconciled to a running
    Deployment and Service, then fully cleaned up on delete.

spec:
  cluster:
    name: ork-e2e-webapp-normalize
    provider: kind
    reuse: false
  katalog: ./katalog.yaml
  crd: ./crd.yaml
  cr: ./cr-port-structured.yaml

  expect:
    - name: "WebApp CR created"
      after: cr-applied
      timeout: 30s
      resources:
        - kind: WebApp
          name: webapp-structured
          namespace: default

    - name: "Deployment running"
      after: cr-applied
      timeout: 120s
      resources:
        - kind: Deployment
          name: webapp-structured
          namespace: default
          ready: true

    - name: "Service exists"
      after: cr-applied
      timeout: 30s
      resources:
        - kind: Service
          name: webapp-structured-svc
          namespace: default

    - name: "WebApp CR deleted"
      after: cr-deleted
      timeout: 60s
      resources:
        - kind: WebApp
          name: webapp-structured
          namespace: default
          count: 0

    - name: "Deployment removed"
      after: cr-deleted
      timeout: 60s
      resources:
        - kind: Deployment
          name: webapp-structured
          namespace: default
          count: 0
