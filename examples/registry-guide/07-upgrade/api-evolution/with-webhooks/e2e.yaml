apiVersion: orkestra.orkspace.io/v1
kind: E2E
metadata:
  name: webapp-conversion-e2e
  description: >
    End-to-end test for bidirectional v1↔v2 CRD conversion. Applies a v2 CR
    and verifies it is stored, reconciled to a running Deployment and Service,
    then fully cleaned up on delete.

spec:
  cluster:
    name: ork-e2e-webapp-conversion
    provider: kind
    reuse: false
  katalog: ./katalog.yaml
  crd: ./crd.yaml
  cr: ./cr-v2.yaml

  expect:
    - name: "WebApp CR created"
      after: cr-applied
      timeout: 30s
      resources:
        - kind: WebApp
          name: my-webapp-v2
          namespace: default

    - name: "Deployment running"
      after: cr-applied
      timeout: 120s
      resources:
        - kind: Deployment
          name: my-webapp-v2
          namespace: default
          ready: true

    - name: "Service exists"
      after: cr-applied
      timeout: 30s
      resources:
        - kind: Service
          name: my-webapp-v2-svc
          namespace: default

    - name: "WebApp CR deleted"
      after: cr-deleted
      timeout: 60s
      resources:
        - kind: WebApp
          name: my-webapp-v2
          namespace: default
          count: 0

    - name: "Deployment removed"
      after: cr-deleted
      timeout: 60s
      resources:
        - kind: Deployment
          name: my-webapp-v2
          namespace: default
          count: 0
