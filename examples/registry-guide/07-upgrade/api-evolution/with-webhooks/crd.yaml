apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: webapps.rkguide.demo
  annotations:
    orkestra.orkspace.io/pattern: webapp
    orkestra.orkspace.io/pattern-version: "2.0.0"
    orkestra.orkspace.io/managed-by: orkestra
spec:
  group: rkguide.demo
  scope: Namespaced
  names:
    plural: webapps
    singular: webapp
    kind: WebApp
    shortNames: [wa]
    categories: [orkestra]

  versions:
    # ── v1 ──────────────────────────────────────────────────────────────────
    # The original API. port and host are top-level fields.
    # Served but not stored — Orkestra converts on read/write via /convert.
    - name: v1
      served: true
      storage: false
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Image
          type: string
          jsonPath: .spec.image
        - name: Port
          type: integer
          jsonPath: .spec.port
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [image, port]
              properties:
                image:
                  type: string
                  description: Container image
                port:
                  type: integer
                  description: Container port the application listens on
                host:
                  type: string
                  description: Ingress hostname — when set, an Ingress is created
                replicas:
                  type: integer
                  minimum: 1
                  default: 1
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true

    # ── v2 ──────────────────────────────────────────────────────────────────
    # The current API. Exposure config moves into spec.expose for clarity and
    # extensibility. spec.expose.protocol is new — no equivalent in v1.
    # This is the storage version.
    - name: v2
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Image
          type: string
          jsonPath: .spec.image
        - name: Port
          type: string
          jsonPath: .spec.expose.port
        - name: Protocol
          type: string
          jsonPath: .spec.expose.protocol
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [image, expose]
              properties:
                image:
                  type: string
                  description: Container image
                replicas:
                  type: integer
                  minimum: 1
                  default: 1
                expose:
                  type: object
                  required: [port]
                  description: Exposure configuration — port, hostname, and protocol
                  properties:
                    port:
                      type: integer
                      description: Container port the application listens on
                    host:
                      type: string
                      description: Ingress hostname — when set, an Ingress is created
                    protocol:
                      type: string
                      description: Protocol for the Ingress (HTTP or HTTPS). New in v2.
                      enum: [HTTP, HTTPS]
                      default: HTTP
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true

  # ── Conversion webhook ────────────────────────────────────────────────────
  # Orkestra Gateway serves /convert in-process — no separate webhook pod.
  # The caBundle is injected by the Helm chart at deploy time.
  conversion:
    strategy: Webhook
    webhook:
      clientConfig:
        service:
          name: orkestra-gateway
          namespace: orkestra-system
          path: /convert
          port: 8443
        caBundle: ""
      conversionReviewVersions: ["v1"]
