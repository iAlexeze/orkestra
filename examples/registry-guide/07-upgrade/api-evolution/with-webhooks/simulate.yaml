apiVersion: orkestra.orkspace.io/v1
kind: Simulate
metadata:
  name: webapp-conversion-sim
  description: >
    Smoke-test the operator logic with a native v2 CR. Conversion from v1 requires
    the live Gateway and cannot be tested in simulate — this gate verifies steady
    state and no template errors for the storage format only.

spec:
  katalog: ./katalog.yaml
  cr: ./cr-v2.yaml
  cycles: 3

  expect:
    steady: true
    noErrors: true
