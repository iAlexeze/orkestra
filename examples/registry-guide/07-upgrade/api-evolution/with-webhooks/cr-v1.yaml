# v1 CR — flat exposure fields (legacy format)
# Orkestra converts this to v2 before storage.
# Read it back with either API version:
#   kubectl get webapps.v1.rkguide.demo my-webapp-v1
#   kubectl get webapps.v2.rkguide.demo my-webapp-v1
apiVersion: rkguide.demo/v1
kind: WebApp
metadata:
  name: my-webapp-v1
  namespace: default
spec:
  image: ghcr.io/orkspace/orkestra-dev-server:0.7.5
  port: 9999
  host: ""
  replicas: 1
