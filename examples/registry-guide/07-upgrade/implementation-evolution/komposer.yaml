apiVersion: orkestra.orkspace.io/v1
kind: Komposer
metadata:
  name: implementation-upgrade
  description: >
    Two teams. Same motif. Different upgrade timelines.
    webapp-operator:v1.1.0 (api-team) follows the motif upgrade — probes configurable.
    platform-app-operator:v1.0.0 (platform-team) stays pinned — probes at default /health.
    One runtime binary. Two namespace panels in the Control Center.

imports:
  registry:
    - oci://ghcr.io/myorg/katalogs/webapp-operator:v1.1.0
    - oci://ghcr.io/myorg/katalogs/platform-app-operator:v1.0.0
