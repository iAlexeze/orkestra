apiVersion: orkestra.orkspace.io/v1
kind: Motif
metadata:
  name: web-service
  version: v1.1.0
  description: >
    Deployment + ClusterIP Service + optional Ingress for a stateless web application.
    v1.1.0 adds configurable probe path and profile — existing CRs that omit these
    continue working unchanged (defaults preserve v1.0.0 behavior).
  author: myorg
  license: Apache-2.0
  tags:
    - web
    - deployment
    - service
    - ingress
    - stateless

inputs:
  - name: image
    description: Container image (e.g. ghcr.io/orkspace/orkestra-dev-server:0.7.5)
    required: true

  - name: port
    description: Container port the application listens on
    default: "9999"

  - name: replicas
    description: Number of replicas
    default: "1"

  - name: host
    description: Ingress hostname — when non-empty, an Ingress is created
    default: ""

  - name: resourceProfile
    description: CPU/memory profile (small, standard, burst)
    default: "small"

  - name: probeProfile
    description: Probe profile for readiness and liveness checks (e.g. standard, strict)
    default: "standard"

  - name: probePath
    description: HTTP path for readiness and liveness probes
    default: "/health"

resources:
  deployments:
    - name: "{{ .metadata.name }}"
      image: "{{ .inputs.image }}"
      replicas: "{{ .inputs.replicas }}"
      port: "{{ .inputs.port }}"
      resources:
        profile: "{{ .inputs.resourceProfile }}"
      probes:
        readiness:
          type: http
          path: "{{ .inputs.probePath }}"
          profile: "{{ .inputs.probeProfile }}"
        liveness:
          type: http
          path: "{{ .inputs.probePath }}"
          profile: "{{ .inputs.probeProfile }}"
      reconcile: true

  services:
    - name: "{{ .metadata.name }}-svc"
      port: "80"
      targetPort: "{{ .inputs.port }}"
      reconcile: true

  ingresses:
    - name: "{{ .metadata.name }}-ingress"
      host: "{{ .inputs.host }}"
      serviceName: "{{ .metadata.name }}-svc"
      servicePort: "80"
      reconcile: true
      when:
        - field: "{{ .inputs.host }}"
          exists: true

status:
  fields:
    - path: ready
      value: "{{ allReplicasReady .children.deployment }}"
    - path: image
      value: "{{ containerImage .children.deployment }}"
    - path: endpoint
      value: "http://{{ .metadata.name }}-svc.{{ .metadata.namespace }}.svc.cluster.local"
