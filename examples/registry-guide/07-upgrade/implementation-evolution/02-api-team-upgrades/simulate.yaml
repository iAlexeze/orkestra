apiVersion: orkestra.orkspace.io/v1
kind: Simulate
metadata:
  name: webapp-v1.1.0-sim
  description: >
    Verify v1.1.0 produces the same core resources as v1.0.0. The new probe
    inputs are exercised via cr.yaml — no new Kubernetes resources are asserted
    (probes are configuration on the Deployment, not separate resources).

spec:
  katalog: ./katalog.yaml
  cr: ./cr.yaml
  cycles: 3

  expect:
    steady: true
    noErrors: true
    ops:
      - cycle: 1
        verb: create
        resource: deployments
        name: my-webapp
      - cycle: 1
        verb: create
        resource: services
        name: my-webapp-svc
