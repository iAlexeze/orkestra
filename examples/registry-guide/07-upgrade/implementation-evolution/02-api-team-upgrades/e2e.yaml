# https://orkestra.sh/docs/reference/schema/e2e/
apiVersion: orkestra.orkspace.io/v1
kind: E2E
metadata:
  name: webapp-v1.1.0-e2e
  description: >
    End-to-end test for the v1.1.0 upgrade. Verifies that probePath and
    probeProfile are wired into the Deployment — the standard profile must
    expand to its concrete timing values (period=20s, failureThreshold=3)
    and the custom probePath (/ready) must appear on the HTTP GET probe.
spec:
  cluster:
    name: ork-e2e-webapp-v110
    provider: kind
    reuse: false
  katalog: ./katalog.yaml
  crd: ./crd.yaml
  cr: ./cr.yaml
  expect:
    - name: "WebApp CR created"
      after: cr-applied
      timeout: 30s
      resources:
        - kind: WebApp
          name: my-webapp
          namespace: default

    - name: "Deployment running"
      after: cr-applied
      timeout: 120s
      resources:
        - kind: Deployment
          name: my-webapp
          namespace: default
          ready: true

    - name: "Service exists"
      after: cr-applied
      timeout: 30s
      resources:
        - kind: Service
          name: my-webapp-svc
          namespace: default

    - name: "Ingress absent when host empty"
      after: cr-applied
      timeout: 30s
      resources:
        - kind: Ingress
          name: my-webapp-ingress
          namespace: default
          count: 0

    - name: "probePath wired as HTTP GET path"
      after: cr-applied
      timeout: 30s
      kubectl:
        get:
          - kind: Deployment
            name: my-webapp
            namespace: default
            field: .spec.template.spec.containers[0].readinessProbe.httpGet.path
            equals: /ready

    - name: "standard probeProfile expands correctly"
      after: cr-applied
      timeout: 30s
      kubectl:
        get:
          - kind: Deployment
            name: my-webapp
            namespace: default
            field: .spec.template.spec.containers[0].readinessProbe.periodSeconds
            equals: "20"
          - kind: Deployment
            name: my-webapp
            namespace: default
            field: .spec.template.spec.containers[0].readinessProbe.failureThreshold
            equals: "3"

    - name: "WebApp CR deleted"
      after: cr-deleted
      timeout: 60s
      resources:
        - kind: WebApp
          name: my-webapp
          namespace: default
          count: 0

    - name: "Deployment removed"
      after: cr-deleted
      timeout: 60s
      resources:
        - kind: Deployment
          name: my-webapp
          namespace: default
          count: 0
