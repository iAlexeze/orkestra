apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: webapp-operator
  version: v0.1.0
  description: WebApp operator — early alpha, API may change between releases.
  author: myorg
  license: Apache-2.0

lifecycle:
  maturity: alpha

spec:
  crds:
    webapp:
      crdFile: ./crd.yaml

      imports:
        - motif: ../01-motifs/web-service/motif.yaml
          with:
            image: "{{ .spec.image }}"
            port: "{{ .spec.port }}"
            replicas: "{{ .spec.replicas }}"

      operatorBox:
        reconciler:
          workers: 1
          resync: 2m
        status:
          fields:
            - path: phase
              value: "Running"
