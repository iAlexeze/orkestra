apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: caches.rkguide.demo
spec:
  group: rkguide.demo
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                port:
                  type: integer
                  default: 6379
                replicas:
                  type: integer
                  default: 1
            status:
              type: object
              properties:
                phase:
                  type: string
  scope: Namespaced
  names:
    plural: caches
    singular: cache
    kind: Cache
