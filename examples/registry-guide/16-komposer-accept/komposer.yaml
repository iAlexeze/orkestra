apiVersion: orkestra.orkspace.io/v1
kind: Komposer
metadata:
  name: platform-komposer
  version: v1.0.0
  description: >
    Platform Komposer that imports a deprecated Katalog and an alpha Katalog.
    lifecycle.accept.patterns acknowledges both so ork validate treats them as
    intentional — not unreviewed warnings.

lifecycle:
  maturity: stable
  accept:
    patterns:
      - name: webapp-operator   # deprecated: v1.0.0 — migrating to v2.0.0
        author: myorg
      - name: cache-operator    # alpha: API is settling, acceptable for this platform
        author: myorg

imports:
  files:
    - ./katalog-webapp.yaml
    - ./katalog-cache.yaml
