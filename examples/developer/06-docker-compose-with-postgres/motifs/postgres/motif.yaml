apiVersion: orkestra.orkspace.io/v1
kind: Motif
metadata:
  name: postgres
  version: v16
  description: >
    PostgreSQL StatefulSet with PVC, headless Service, and pgAdmin.
    Works with postgres:14 through postgres:17.
  author: orkspace
  license: Apache-2.0

inputs:
  - name: image
    description: PostgreSQL image (e.g. postgres:16)
    required: true

  - name: passwordSecretName
    description: Name of the Secret containing POSTGRES_PASSWORD
    required: true

  - name: user
    description: Database superuser username
    default: "postgres"

  - name: volumeSize
    description: PVC storage size
    default: "10Gi"

  - name: adminEmail
    description: pgAdmin login email
    default: "admin@example.com"

  - name: adminPassword
    description: pgAdmin login password
    default: "admin"

  - name: resourceProfile
    description: >
      CPU and memory profile for this service. Choose from the built‑in presets: docs.orkestra.sh/concepts/resource-profiles
    default: burst


resources:
  statefulSets:
    - name: "{{ .metadata.name }}-postgres"
      image: "{{ inputs.image }}"
      replicas: 1
      serviceName: "{{ .metadata.name }}-postgres-headless"
      volumeClaims:
        - name: pgdata
          size: "{{ inputs.volumeSize }}"
          mountPath: /var/lib/postgresql/data
      env:
        POSTGRES_USER:
          value: "{{ inputs.user }}"
        POSTGRES_PASSWORD:
          secretKeyRef:
            name: "{{ inputs.passwordSecretName }}"
            key: POSTGRES_PASSWORD
      reconcile: true
      resourceProfile: "{{ .inputs.resourceProfile }}"

  services:
    - name: "{{ .metadata.name }}-postgres-headless"
      clusterIP: None
      port: "5432"
      reconcile: true
    - name: "{{ .metadata.name }}-postgres"
      port: "5432"
      reconcile: true
    - name: "{{ .metadata.name }}-pgadmin-svc"
      port: "80"
      type: LoadBalancer
      targetPort: "80"
      reconcile: true

  deployments:
    - name: "{{ .metadata.name }}-pgadmin"
      image: "dpage/pgadmin4:latest"
      env:
        PGADMIN_DEFAULT_EMAIL:
          value: "{{ inputs.adminEmail }}"
        PGADMIN_DEFAULT_PASSWORD:
          value: "{{ inputs.adminPassword }}"
      reconcile: true


status:
  fields:
    - path: postgresReady
      value: "{{ replicasReady .children.statefulset }}"
    - path: connectionString
      value: "postgres://{{ inputs.user }}@{{ .metadata.name }}-postgres.{{ .metadata.namespace }}.svc.cluster.local:5432"
    - path: pgadminUrl
      value: "{{ serviceLoadBalancerHost .children.service }}"
