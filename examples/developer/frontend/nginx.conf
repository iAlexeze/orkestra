server {
    listen 3000;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Proxy API calls to the backend service.
    # Replace MY_API_URL with the actual internal service URL after deploying the backend.
    # Example: http://my-api-orkestra-svc.my-api-orkestra-ns.svc.cluster.local:8080
    location /api/ {
        proxy_pass http://my-api-orkestra-svc.my-api-orkestra-ns.svc.cluster.local:8080/;
    }
}
