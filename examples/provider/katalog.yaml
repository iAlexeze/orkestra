apiVersion: orkestra.konductor.io/v1Alpha
kind: Katalog
metadata:
  name: saas-backend
  author: orkspace
  version: 0.1.0
  description: >
    A complete SaaS backend: Kubernetes API deployment, AWS S3 for file storage,
    MongoDB for application data. Apply one CR, get everything.
    No AWS SDK code. No MongoDB driver code. No Go hooks. Pure YAML.

spec:
  crds:
    - name: saas-backend
      apiTypes:
        group: demo.orkestra.io
        version: v1alpha1
        kind: SaasBackend
        plural: saasbackends

      workers: 2
      resync: 30s

      validation:
        rules:
          - field: spec.image
            operator: exists
            message: "spec.image is required"
            action: deny
          - field: spec.region
            operator: exists
            message: "spec.region is required for S3 bucket creation"
            action: deny

      mutation:
        mutateFirst: true
        rules:
          - field: spec.replicas
            default: 2
          - field: spec.port
            default: 8080
          - field: spec.enableStorage
            default: "true"

      reconciler:
        default: true

        # ── Kubernetes resources ────────────────────────────────────────────
        onCreate:
          deployments:
            - name: "{{ .metadata.name }}"
              image: "{{ .spec.image }}"
              replicas: "{{ .spec.replicas }}"

          services:
            - name: "{{ .metadata.name }}"
              port: "{{ .spec.port }}"
              type: LoadBalancer

        onReconcile:
          deployments:
            - name: "{{ .metadata.name }}"
              image: "{{ .spec.image }}"
              replicas: "{{ .spec.replicas }}"
              reconcile: true  # drift correction

        # ── External resources — AWS + MongoDB ──────────────────────────────
        # Requires registration at startup:
        #   registry.Register(awsprovider.NewFromContext(ctx))
        #   registry.Register(mongoprovider.NewFromURI(ctx, mongoURI))
        providers:
          aws:
            # S3 bucket for file uploads
            - s3:
                bucket: "{{ .metadata.name }}-{{ .metadata.namespace }}-files"
                region: "{{ .spec.region }}"
                versioning: "{{ default .spec.enableVersioning \"false\" }}"
                when:
                  - field: spec.enableStorage
                    equals: "true"

            # Route53 record — created once LoadBalancer has an address
            - route53:
                zoneId: "{{ .spec.hostedZoneId }}"
                record: "{{ .metadata.name }}.{{ .spec.domain }}"
                type: CNAME
                target: "{{ default .children.service.status.loadBalancer.ingress \"\" }}"
                ttl: "300"
                when:
                  - field: spec.domain
                    operator: exists
                  - field: spec.hostedZoneId
                    operator: exists

          mongodb:
            # Application database
            - database:
                name: "{{ .metadata.name }}"

            # Application user with readWrite access
            - user:
                name: "{{ .metadata.name }}-app"
                database: "{{ .metadata.name }}"
                roles: "readWrite"
                credentials:
                  secretName: "{{ .metadata.name }}-mongo-credentials"
                  # Secret must contain:
                  #   MONGO_PASSWORD: <generated-password>

            # Events collection — only when events are enabled
            - collection:
                name: events
                database: "{{ .metadata.name }}"
                when:
                  - field: spec.enableEvents
                    equals: "true"

        # ── Status ─────────────────────────────────────────────────────────
        status:
          fields:
            - path: phase
              value: "Pending"
              when:
                - field: status.phase
                  operator: notExists

            - path: phase
              value: "Ready"
              when:
                - field: children.deployment.status.readyReplicas
                  operator: gt
                  value: "0"

            - path: replicas
              value: "{{ .children.deployment.status.readyReplicas }}"

            - path: image
              value: "{{ .spec.image }}"

            - path: storageBucket
              value: "{{ .metadata.name }}-{{ .metadata.namespace }}-files"
              when:
                - field: spec.enableStorage
                  equals: "true"

            - path: database
              value: "{{ .metadata.name }}
