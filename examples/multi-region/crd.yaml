---
# MultiRegionApp — demonstrates forEach expansion
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: multiregionapps.advanced.orkestra.io
spec:
  group: advanced.orkestra.io
  scope: Namespaced
  names:
    plural: multiregionapps
    singular: multiregionapp
    kind: MultiRegionApp
    shortNames: [mra]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Regions
          type: string
          jsonPath: .status.regionsDeployed
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [image, regions]
              properties:
                image:
                  type: string
                  description: Container image to deploy in each region
                regions:
                  type: array
                  description: List of region names — one Deployment is created per entry
                  items:
                    type: string
                  minItems: 1
                replicasPerRegion:
                  type: integer
                  default: 1
                  minimum: 1
                  maximum: 10
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true

