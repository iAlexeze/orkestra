apiVersion: orkestra.konductor.io/v1Alpha
kind: Katalog
metadata:
  name: multi-region-demo
  author: orkspace
  version: 0.1.0
  description: >
    This Katalog demonstrates Orkestra’s declarative forEach pattern by deploying 
    the same application into multiple regions without writing any Go code. 
    Instead of manually looping over spec.regions inside a reconcile function,
    the operatorBox automatically expands the Deployment template once per region.
spec:
  crds:
    website:
      apiTypes:
        group: demo.orkestra.io
        version: v1alpha1
        kind: Website
        plural: websites
      allowedNamespaces:
        - default

      operatorBox:
        status:
          fields:
            - path: phase
              value: "Running"
            - path: observedReplicas
              value: "{{ .spec.replicas }}"
            - path: endpoint
              value: "{{ .metadata.name }}.{{ .metadata.namespace }}.svc.cluster.local"

        onCreate:
          secrets:
            - name: "{{ .metadata.name }}"
              once: true
              rotateAfter: 90d
              data:
                apiKey: "{{ randomBase64 32 }}"
          deployments:
            - name: "{{ .metadata.name }}"
              image: "{{ .spec.image }}"
              replicas: "{{ .spec.replicas }}"
              port: "{{ .spec.port }}"
              reconcile: true
              env:
                API_KEY:
                  secretKeyRef:
                    name: "{{ .metadata.name }}"
                    key: apiKey

    multi-region-app:
      apiTypes:
        group: advanced.orkestra.io
        version: v1alpha1
        kind: MultiRegionApp
        plural: multiregionapps
      workers: 2
      resync: 30s
      operatorBox:
        default: true
        onReconcile:
          deployments:
            - name: "{{ .metadata.name }}-{{ .item }}"
              namespace: "{{ .metadata.namespace }}"
              image: "{{ .spec.image }}"
              replicas: "{{ .spec.replicasPerRegion }}"
              env:
                REGION: 
                  value: "{{ .item }}"
              labels:
                - key: app
                  value: "{{ .metadata.name }}-{{ .item }}"
              forEach:
                field: spec.regions
                as: item

          services:
            - name: "{{ .metadata.name }}-{{ .item }}-svc"
              namespace: "{{ .metadata.namespace }}"
              targetPort: 5000
              type: ClusterIP
              port: 5000
              labels:
                - key: app
                  value: "{{ .metadata.name }}-{{ .item }}"
              forEach:
                field: spec.regions
                as: item

