apiVersion: orkestra.konductor.io/v1Alpha
kind: Komposer
metadata:
  name: cronjob-production
  description: >
    Production Komposer for the CronJob pattern.
    Inherits all operator behavior from katalog.yaml.
    Overrides runtime tuning for production workloads.

sources:
  files:
    - url: ./katalog.yaml

spec:
  crds:
    - name: cronjob-v2
      workers: 8
      resync: 15s

    - name: cronjob-v1
      workers: 4
      resync: 15s
