apiVersion: orkestra.konductor.io/v1Alpha
kind: Pattern
metadata:
  name: cronjob
  version: 2.0.0
  description: >
    Multi-version CronJob operator. Demonstrates Orkestra's declarative
    version conversion — v1 (cron string) and v2 (structured schedule)
    with lossless round-trip conversion using cron notes. No Go code.
    No conversion functions. No separate webhook. Security-first RBAC.
  author: Orkspace
  license: MIT
  tags:
    - cronjob
    - scheduling
    - multi-version
    - conversion

artifacts:
  - file: crd.yaml
    description: CRD with v1 and v2 schemas and conversion webhook config
  - file: katalog.yaml
    description: Complete operator — reconciler, mutation, validation, status, conversion
  - file: komposer.yaml
    description: Production overlay with tuned workers and resync
  - file: rbac.yaml
    description: Least-privilege RBAC generated from Katalog intent
  - file: cr-v1.yaml
    description: Example CR in v1 format
  - file: cr-v2.yaml
    description: Example CRs in v2 format
  - file: README.md
    description: Complete guide with what this replaces and why

requires:
  orkestra: ">=1.0.0"
  kubernetes: ">=1.28.0"

import:
  registry:
    - url: ghcr.io/orkspace/orkestra-registry/cronjob@v2.0.0
      oci: true
