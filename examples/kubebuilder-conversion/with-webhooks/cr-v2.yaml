# v2 CR — structured schedule object
# More readable and self-documenting than the cron string.
# Stored directly — no conversion needed.
apiVersion: demo.orkestra.io/v2
kind: CronJob
metadata:
  name: print-hello-v2
  namespace: default
spec:
  schedule:
    minute: "*/1"   # every minute
    hour: "*"
    dayOfMonth: "*"
    month: "*"
    dayOfWeek: "*"
  image: busybox:1.36
  concurrencyPolicy: Allow
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
---
# A more expressive example — daily backup at 2am on weekdays
apiVersion: demo.orkestra.io/v2
kind: CronJob
metadata:
  name: daily-backup
  namespace: default
spec:
  schedule:
    minute: "0"
    hour: "2"
    dayOfMonth: "*"
    month: "*"
    dayOfWeek: "1-5"   # Monday through Friday
  image: myorg/backup-runner:latest
  concurrencyPolicy: Forbid   # never overlap backup runs
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 3
