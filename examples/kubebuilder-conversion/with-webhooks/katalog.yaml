apiVersion: orkestra.konductor.io/v1Alpha
kind: Katalog
metadata:
  name: cronjob-operator
  description: >
    Multi-version CronJob operator. v1 uses a cron string. v2 uses a
    structured schedule object. Conversion is lossless and bidirectional,
    declared entirely in YAML using cron notes. No Go. No hooks.
    No separate conversion webhook. One process. One Katalog.

security:
  deletionProtection:
    enabled: true
  rbac:
    enabled: false

spec:
  crds:
    # ── v2 ─────────────────────────────────────────────────────────────────
    # The current, storage version. All objects live here.
    # The API server calls /convert when a request comes in as v1.
    # Orkestra handles the conversion in-process — zero extra infrastructure.
    cronjob-v2:
      apiTypes:
        group: demo.orkestra.io
        version: v2
        kind: CronJob
        plural: cronjobs

      workers: 5
      resync: 30s

      # ── Lossless version conversion using cron notes ───────────────────────
      #
      # The core change between v1 and v2:
      #   v1: schedule: "*/5 0 * * 1"        (one string, five fields joined)
      #   v2: schedule:                        (named structured fields)
      #         minute: "*/5"
      #         hour: "0"
      #         dayOfMonth: "*"
      #         month: "*"
      #         dayOfWeek: "1"
      #
      # cron notes split and reconstruct this without losing information:
      #
      #   cronMinute "*/5 0 * * 1"  →  "*/5"
      #   cronHour   "*/5 0 * * 1"  →  "0"
      #   cronDom    "*/5 0 * * 1"  →  "*"
      #   cronMonth  "*/5 0 * * 1"  →  "*"
      #   cronDow    "*/5 0 * * 1"  →  "1"
      #
      #   cronExpr "*/5" "0" "*" "*" "1"  →  "*/5 0 * * 1"
      #
      # Round-trip guarantee: v1 → v2 → v1 produces the canonical
      # cron string — semantically identical to the original.
      # @-macros are expanded: @hourly → "0 * * * *"
      #
      conversion:
        storageVersion: v2
        paths:
          # v1 → v2: split the cron string into named fields
          - from: v1
            to: v2
            spec:
              schedule:
                minute:     "{{ cronMinute .spec.schedule }}"
                hour:       "{{ cronHour   .spec.schedule }}"
                dayOfMonth: "{{ cronDom    .spec.schedule }}"
                month:      "{{ cronMonth  .spec.schedule }}"
                dayOfWeek:  "{{ cronDow    .spec.schedule }}"
              image:                      "{{ .spec.image }}"
              concurrencyPolicy:          "{{ default .spec.concurrencyPolicy \"Allow\" }}"
              startingDeadlineSeconds:    "{{ .spec.startingDeadlineSeconds }}"
              successfulJobsHistoryLimit: "{{ default .spec.successfulJobsHistoryLimit 3 }}"
              failedJobsHistoryLimit:     "{{ default .spec.failedJobsHistoryLimit 1 }}"
              suspend:                    "{{ default .spec.suspend false }}"

          # v2 → v1: reconstruct the cron string from named fields
          - from: v2
            to: v1
            spec:
              schedule: "{{ cronExpr .spec.schedule.minute .spec.schedule.hour .spec.schedule.dayOfMonth .spec.schedule.month .spec.schedule.dayOfWeek }}"
              image:                      "{{ .spec.image }}"
              concurrencyPolicy:          "{{ default .spec.concurrencyPolicy \"Allow\" }}"
              startingDeadlineSeconds:    "{{ .spec.startingDeadlineSeconds }}"
              successfulJobsHistoryLimit: "{{ default .spec.successfulJobsHistoryLimit 3 }}"
              failedJobsHistoryLimit:     "{{ default .spec.failedJobsHistoryLimit 1 }}"
              suspend:                    "{{ default .spec.suspend false }}"

      # ── Admission Validation and Mutation ─────────────────────────────────────────────────────────
      # Defaults applied before validation, before reconcile
      mutation:
        mutateFirst: true
        rules:
          - field: spec.concurrencyPolicy
            default: "Allow"
          - field: spec.successfulJobsHistoryLimit
            default: 3
          - field: spec.failedJobsHistoryLimit
            default: 1
          - field: spec.suspend
            default: false

      # Validation — deny if image is empty
      validation:
        rules:
          - field: spec.image
            operator: exists
            message: "spec.image is required"
            action: deny

      # ── Reconciler ─────────────────────────────────────────────────────────
      reconciler:
        default: true

        # Status — three layers
        # Layer 1: Ready condition — automatic after every reconcile
        # Layer 2: Declared fields — resolved from live CR
        # Layer 3: children.* — populated from child CronJob
        status:
          fields:
            - path: phase
              value: "{{ ternary .spec.suspend \"Suspended\" \"Active\" }}"

            # Reconstruct the human-readable cron expression for display
            # This is what kubectl get cj shows in the Schedule column
            - path: scheduleExpression
              value: "{{ cronExpr .spec.schedule.minute .spec.schedule.hour .spec.schedule.dayOfMonth .spec.schedule.month .spec.schedule.dayOfWeek }}"

            - path: image
              value: "{{ .spec.image }}"

            - path: concurrencyPolicy
              value: "{{ .spec.concurrencyPolicy }}"

            # Last schedule time from the child CronJob
            - path: lastScheduleTime
              value: "{{ .children.cronjob.status.lastScheduleTime }}"

            - path: nextScheduleTime
              value: "{{ .children.cronjob.status.nextScheduleTime }}"

        # Creates the Kubernetes CronJob resource
        # The schedule field reconstructs the standard cron expression
        # from the v2 structured fields — ready for Kubernetes to use
        onCreate:
          cronJobs:
            - name: "{{ .metadata.name }}"
              image: "{{ .spec.image }}"
              schedule: "{{ cronExpr .spec.schedule.minute .spec.schedule.hour .spec.schedule.dayOfMonth .spec.schedule.month .spec.schedule.dayOfWeek }}"
              reconcile: true

        # When the CR is suspended, the child CronJob is suspended too
        # When unsuspended, it is restored — no manual intervention needed
        onReconcile:
          cronJobs:
            - name: "{{ .metadata.name }}"
              image: "{{ .spec.image }}"
              schedule: "{{ cronExpr .spec.schedule.minute .spec.schedule.hour .spec.schedule.dayOfMonth .spec.schedule.month .spec.schedule.dayOfWeek }}"
              suspend: "{{ .spec.suspend }}"
              successfulJobsHistoryLimit: "{{ .spec.successfulJobsHistoryLimit }}"
              failedJobsHistoryLimit: "{{ .spec.failedJobsHistoryLimit }}"
              reconcile: true

    # ── v1 ─────────────────────────────────────────────────────────────────
    # The legacy API. Objects applied as v1 are converted to v2 before
    # storage. Objects read as v1 are converted from v2 on the way out.
    # This CRD entry is present so Orkestra watches v1 events correctly.
    cronjob-v1:
      apiTypes:
        group: demo.orkestra.io
        version: v1
        kind: CronJob
        plural: cronjobs

      workers: 2
      resync: 30s

      mutation:
        mutateFirst: true
        rules:
          - field: spec.concurrencyPolicy
            default: "Allow"
          - field: spec.suspend
            default: false

      validation:
        rules:
          - field: spec.image
            operator: exists
            message: "spec.image is required"
            action: deny
          - field: spec.schedule
            operator: exists
            message: "spec.schedule is required"
            action: deny

      reconciler:
        default: true
        status:
          fields:
            - path: phase
              value: "{{ ternary .spec.suspend \"Suspended\" \"Active\" }}"
            - path: scheduleExpression
              value: "{{ .spec.schedule }}"
            - path: image
              value: "{{ .spec.image }}"

        onCreate:
          cronJobs:
            - name: "{{ .metadata.name }}"
              image: "{{ .spec.image }}"
              schedule: "{{ .spec.schedule }}"
              reconcile: true
