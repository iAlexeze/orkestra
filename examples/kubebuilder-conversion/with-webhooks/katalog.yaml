apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: cronjob-operator
  description: >
    Multi-version CronJob operator. v1 uses a cron string. v2 uses a
    structured schedule object. Conversion is lossless and bidirectional,
    declared entirely in YAML using cron notes. No Go. No hooks.
    No separate conversion webhook. One process. One Katalog.

security:
  deletionProtection:
    enabled: true
  conversion:
    enabled: true

spec:
  crds:
    # ── v2 (storage version) ─────────────────────────────────────────────────
    cronjob-v2:
      apiTypes:
        group: demo.orkestra.io
        version: v2
        kind: CronJob
        plural: cronjobs

      workers: 5
      resync: 30s

      conversion:
        storageVersion: v2
        updateCRD: true
        paths:
          # v1 → v2: split cron string into structured map
          - from: v1
            to: v2
            spec:
              schedule: "{{ cronToMap .spec.schedule }}"
              image:                      "{{ .spec.image }}"
              concurrencyPolicy:          "{{ default .spec.concurrencyPolicy \"Allow\" }}"
              startingDeadlineSeconds:    "{{ .spec.startingDeadlineSeconds }}"
              successfulJobsHistoryLimit: "{{ default .spec.successfulJobsHistoryLimit 3 }}"
              failedJobsHistoryLimit:     "{{ default .spec.failedJobsHistoryLimit 1 }}"
              suspend:                    "{{ default .spec.suspend false }}"

          # v2 → v1: reconstruct cron string from structured map
          - from: v2
            to: v1
            spec:
              schedule: "{{ cronFromMap .spec.schedule }}"
              image:                      "{{ .spec.image }}"
              concurrencyPolicy:          "{{ default .spec.concurrencyPolicy \"Allow\" }}"
              startingDeadlineSeconds:    "{{ .spec.startingDeadlineSeconds }}"
              successfulJobsHistoryLimit: "{{ default .spec.successfulJobsHistoryLimit 3 }}"
              failedJobsHistoryLimit:     "{{ default .spec.failedJobsHistoryLimit 1 }}"
              suspend:                    "{{ default .spec.suspend false }}"

      mutation:
        mutateFirst: true
        rules:
          - field: spec.concurrencyPolicy
            default: "Allow"
          - field: spec.successfulJobsHistoryLimit
            default: 3
          - field: spec.failedJobsHistoryLimit
            default: 1
          - field: spec.suspend
            default: false

      validation:
        rules:
          - field: spec.image
            operator: exists
            message: "spec.image is required"
            action: deny

      operatorBox:
        default: true
        status:
          fields:
            - path: phase
              value: "{{ ternary .spec.suspend \"Suspended\" \"Active\" }}"
            - path: scheduleExpression
              value: "{{ cronFromMap .spec.schedule }}"
            - path: image
              value: "{{ .spec.image }}"
            - path: concurrencyPolicy
              value: "{{ .spec.concurrencyPolicy }}"
            - path: lastScheduleTime
              value: "{{ get .children.cronjob "status" "lastScheduleTime" }}"
            - path: nextScheduleTime
              value: "{{ get .children.cronjob "status" "nextScheduleTime" }}"

        onCreate:
          cronJobs:
            - name: "{{ .metadata.name }}"
              image: "{{ .spec.image }}"
              schedule: "{{ cronFromMap .spec.schedule }}"
              reconcile: true

        onReconcile:
          cronJobs:
            - name: "{{ .metadata.name }}"
              image: "{{ .spec.image }}"
              schedule: "{{ cronFromMap .spec.schedule }}"
              suspend: "{{ .spec.suspend }}"
              successfulJobsHistoryLimit: "{{ .spec.successfulJobsHistoryLimit }}"
              failedJobsHistoryLimit: "{{ .spec.failedJobsHistoryLimit }}"
              reconcile: true

    # ── v1 (legacy API) ─────────────────────────────────────────────────────
    cronjob-v1:
      apiTypes:
        group: demo.orkestra.io
        version: v1
        kind: CronJob
        plural: cronjobs

      workers: 2
      resync: 30s

      mutation:
        mutateFirst: true
        rules:
          - field: spec.concurrencyPolicy
            default: "Allow"
          - field: spec.suspend
            default: false

      validation:
        rules:
          - field: spec.image
            operator: exists
            message: "spec.image is required"
            action: deny
          - field: spec.schedule
            operator: exists
            message: "spec.schedule is required"
            action: deny

      operatorBox:
        default: true
        status:
          fields:
            - path: phase
              value: "{{ ternary .spec.suspend \"Suspended\" \"Active\" }}"
            - path: scheduleExpression
              value: "{{ .spec.schedule }}"
            - path: image
              value: "{{ .spec.image }}"

        onCreate:
          cronJobs:
            - name: "{{ .metadata.name }}"
              image: "{{ .spec.image }}"
              schedule: "{{ .spec.schedule }}"
              reconcile: true