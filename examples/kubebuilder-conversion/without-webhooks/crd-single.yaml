---
# Single-version CronJob CRD — Solution 2 (no conversion webhook).
#
# spec.schedule accepts EITHER a cron string OR a structured object.
# Orkestra detects the format at reconcile time using typeOf.
# No conversion webhook. No caBundle. No TLS required.
#
# The schedule field uses x-kubernetes-preserve-unknown-fields: true
# because it accepts two structurally different shapes that cannot both
# be expressed in a single OpenAPI schema without oneOf (which kubebuilder
# supports but most admission controllers don't validate deeply).
# Orkestra's own validation rules cover the semantic constraints.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: cronjobs.demo.orkestra.io
spec:
  group: demo.orkestra.io
  scope: Namespaced
  names:
    plural: cronjobs
    singular: cronjob
    kind: CronJob
    shortNames: [cj]
    categories: [orkestra]
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Schedule
          type: string
          jsonPath: .status.scheduleExpression
        - name: Format
          type: string
          jsonPath: .status.scheduleFormat
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Image
          type: string
          jsonPath: .status.image
        - name: Last-Schedule
          type: string
          jsonPath: .status.lastScheduleTime
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [image, schedule]
              properties:
                image:
                  type: string
                  description: Container image for the job pod

                # schedule accepts either:
                #   a) A cron string: "*/5 * * * *"
                #   b) A structured object: {minute: "*/5", hour: "*", ...}
                # Orkestra detects which at reconcile time via typeOf.
                schedule:
                  x-kubernetes-preserve-unknown-fields: true
                  description: >
                    Schedule in cron string format ("*/5 * * * *") or structured
                    object format ({minute, hour, dayOfMonth, month, dayOfWeek}).
                    Both formats produce identical Kubernetes CronJobs.

                concurrencyPolicy:
                  type: string
                  enum: [Allow, Forbid, Replace]
                  default: Allow

                suspend:
                  type: boolean
                  default: false

                successfulJobsHistoryLimit:
                  type: integer
                  minimum: 0
                  default: 3

                failedJobsHistoryLimit:
                  type: integer
                  minimum: 0
                  default: 1

                startingDeadlineSeconds:
                  type: integer
                  minimum: 0

            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true

  # No conversion block — single version, no webhook needed.
  # This is the entire reason Solution 2 is simpler to operate.