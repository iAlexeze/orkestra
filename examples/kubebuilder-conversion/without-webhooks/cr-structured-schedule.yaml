---
# cr-structured-schedule.yaml
# Modern format — structured object in spec.schedule.
apiVersion: demo.orkestra.io/v1
kind: CronJob
metadata:
  name: print-hello-structured
  namespace: default
spec:
  schedule:
    minute: "*/1"
    hour: "*"
    dayOfMonth: "*"
    month: "*"
    dayOfWeek: "*"
  image: busybox:1.35
  successfulJobsHistoryLimit: 5