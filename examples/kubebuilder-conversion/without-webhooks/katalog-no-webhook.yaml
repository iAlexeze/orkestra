apiVersion: orkestra.konductor.io/v1Alpha
kind: Katalog
metadata:
  name: cronjob-operator
  description: >
    Single-version CronJob operator. Accepts both cron strings and structured
    schedule maps. Format detected via typeString/typeMap — no conversion
    webhook, no TLS, no multi-version CRD complexity.
    Run with: ork run -k katalog-no-webhook.yaml

spec:
  crds:
    cronjob:
      apiTypes:
        group: demo.orkestra.io
        version: v1
        kind: CronJob
        plural: cronjobs

      workers: 5
      resync: 15s

      # Defaults applied before validation
      mutation:
        mutateFirst: true
        rules:
          - field: spec.concurrencyPolicy
            default: "Allow"
          - field: spec.successfulJobsHistoryLimit
            default: 3
          - field: spec.failedJobsHistoryLimit
            default: 1
          - field: spec.suspend
            default: false

      validation:
        rules:
          - field: spec.image
            operator: exists
            message: "spec.image is required"
            action: deny
          - field: spec.schedule
            operator: exists
            message: "spec.schedule is required — use a cron string or structured object"
            action: deny

      operatorBox:
        default: true

        status:
          fields:
            # Phase: Active or Suspended
            - path: phase
              value: "{{ boolTernary .spec.suspend \"Suspended\" \"Active\" }}"

            # "string" or "map"
            - path: scheduleFormat
              value: "{{ typeOf .spec.schedule }}"

            # Canonical cron expression (string always)
            - path: scheduleExpression
              value: >
                {{ if typeMap .spec.schedule }}
                  {{ cronFromMap .spec.schedule }}
                {{ else }}
                  {{ cronNormalize .spec.schedule }}
                {{ end }}

            # Structured schedules: number of fields defined
            # String schedules: 1
            - path: scheduleFieldsDefined
              value: >
                {{ if typeMap .spec.schedule }}
                  {{ len .spec.schedule }}
                {{ else }}
                  1
                {{ end }}"

            # Human-readable description
            - path: scheduleDescription
              value: >
                {{ if typeMap .spec.schedule }}
                  {{ cronDescribe (cronFromMap .spec.schedule) }}
                {{ else }}
                  {{ cronDescribe .spec.schedule }}
                {{ end }}

            - path: image
              value: "{{ .spec.image }}"
            - path: concurrencyPolicy
              value: "{{ .spec.concurrencyPolicy }}"

            # Propagated from child CronJob
            - path: lastScheduleTime
              value: "{{ .children.cronjob.status.lastScheduleTime }}"
            - path: nextScheduleTime
              value: "{{ .children.cronjob.status.nextScheduleTime }}"

        onCreate:
          cronJobs:

            # ────────────────────────────────────────────────────────────────
            # Path A — schedule is a plain string
            # ────────────────────────────────────────────────────────────────
            - name: "{{ .metadata.name }}"
              image: "{{ .spec.image }}"
              schedule: "{{ cronNormalize .spec.schedule }}"
              suspend: "{{ .spec.suspend }}"
              successfulJobsHistoryLimit: "{{ .spec.successfulJobsHistoryLimit }}"
              failedJobsHistoryLimit: "{{ .spec.failedJobsHistoryLimit }}"
              concurrencyPolicy: "{{ .spec.concurrencyPolicy }}"
              when:
                - field: spec.schedule
                  operator: typeString

            # ────────────────────────────────────────────────────────────────
            # Path B — schedule is a structured map
            # ────────────────────────────────────────────────────────────────
            - name: "{{ .metadata.name }}"
              image: "{{ .spec.image }}"
              schedule: "{{ cronFromMap .spec.schedule }}"
              suspend: "{{ .spec.suspend }}"
              successfulJobsHistoryLimit: "{{ .spec.successfulJobsHistoryLimit }}"
              failedJobsHistoryLimit: "{{ .spec.failedJobsHistoryLimit }}"
              concurrencyPolicy: "{{ .spec.concurrencyPolicy }}"
              when:
                - field: spec.schedule
                  operator: typeMap
        
        onReconcile:  # This is defined to avoid the error on the UI during reconcile when orkestra still reads from the original CR
          cronJobs:
            - name: "{{ .metadata.name }}"
              schedule: >
                {{ if typeMap .spec.schedule }}
                  {{ cronFromMap .spec.schedule }}
                {{ else }}
                  {{ cronNormalize .spec.schedule }}
                {{ end }}
              image: "{{ .spec.image }}"
              suspend: "{{ .spec.suspend }}"
              successfulJobsHistoryLimit: "{{ .spec.successfulJobsHistoryLimit }}"
              failedJobsHistoryLimit: "{{ .spec.failedJobsHistoryLimit }}"
              concurrencyPolicy: "{{ .spec.concurrencyPolicy }}"

