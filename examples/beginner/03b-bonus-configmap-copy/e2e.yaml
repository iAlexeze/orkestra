apiVersion: orkestra.orkspace.io/v1
kind: E2E
metadata:
  name: configmap-distribution-e2e
  description: Distribute a shared ConfigMap from a platform namespace into team namespaces and verify removal on delete

spec:
  katalog: ./katalog.yaml
  crd: ./crd.yaml
  cr: ./cr.yaml

  cluster:
    provider: kind
    name: ork-e2e
    reuse: false

  setup:
    - ./setup.yaml   # creates platform/team-alpha/team-beta namespaces + source configmap

  expect:
    - name: ConfigMap distributed to team-alpha
      after: cr-applied
      timeout: 60s
      resources:
        - kind: ConfigMap
          name: app-config
          namespace: team-alpha

    - name: ConfigMap distributed to team-beta
      after: cr-applied
      timeout: 60s
      resources:
        - kind: ConfigMap
          name: app-config
          namespace: team-beta

    - name: ConfigMaps removed on delete
      after: cr-deleted
      timeout: 30s
      resources:
        - kind: ConfigMap
          name: app-config
          namespace: team-alpha
          count: 0
        - kind: ConfigMap
          name: app-config
          namespace: team-beta
          count: 0
