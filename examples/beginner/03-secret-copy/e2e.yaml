apiVersion: orkestra.orkspace.io/v1
kind: E2E
metadata:
  name: secret-distribution-e2e
  description: Distribute a database secret from a platform namespace into team namespaces and verify removal on delete

spec:
  katalog: ./katalog.yaml
  crd: ./crd.yaml
  cr: ./cr.yaml

  cluster:
    provider: kind
    name: ork-e2e
    reuse: false

  setup:
    - ./setup.yaml   # creates platform/team-alpha/team-beta namespaces + source secret

  expect:
    - name: CR created
      after: cr-applied
      timeout: 60s
      resources:
        - kind: SecretDistribution
          name: db-creds

    - name: Secret distributed to team-alpha
      after: cr-applied
      timeout: 60s
      resources:
        - kind: Secret
          name: database-credentials
          namespace: team-alpha

    - name: Secret distributed to team-beta
      after: cr-applied
      timeout: 60s
      resources:
        - kind: Secret
          name: database-credentials
          namespace: team-beta

    - name: Cleanup verified
      after: cr-deleted
      timeout: 30s
      resources:
        - kind: SecretDistribution
          name: db-creds
          count: 0
        - kind: Secret
          name: database-credentials
          namespace: team-alpha
          count: 0
        - kind: Secret
          name: database-credentials
          namespace: team-beta
          count: 0
