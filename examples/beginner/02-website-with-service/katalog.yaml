apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: website-with-service
  author: orkspace
  version: 0.1.0
  description: >
    Deployment + Service. Drift correction enabled on both.
    Status fields show the operator is working.

spec:
  crds:
    website:
      crdFile: ./crd.yaml
      resync: 5s

      operatorBox:
        default: true

        # ── Status ─────────────────────────────────────────────────────────
        # Written after every successful reconcile.
        # Layer 1 (Ready condition) is automatic — no declaration needed.
        # Layer 2 (these fields) are declared here.
        status:
          fields:
            - path: phase
              value: "Running"
            - path: observedReplicas
              value: "{{ .spec.replicas }}"
            - path: endpoint
              value: "{{ .metadata.name }}.{{ .metadata.namespace }}.svc.cluster.local"

        onCreate:
          deployments:
            - name: "{{ .metadata.name }}"
              image: "{{ .spec.image }}"
              replicas: "{{ .spec.replicas }}"
              port: "{{ .spec.port }}"
              reconcile: true   # ← drift correction: if this Deployment changes,
                                #   Orkestra corrects it on the next reconcile cycle

          services:
            - name: "{{ .metadata.name }}-svc"
              port: "80"
              targetPort: "{{ .spec.port }}"
              reconcile: true   # ← same for the Service
