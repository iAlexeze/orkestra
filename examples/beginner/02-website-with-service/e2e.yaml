apiVersion: orkestra.orkspace.io/v1
kind: E2E
metadata:
  name: website-with-service-e2e
  description: Deploy a website with a LoadBalancer Service and verify both resources are created and removed together

spec:
  katalog: ./katalog.yaml
  crd: ./crd.yaml
  cr: ./cr.yaml

  cluster:
    provider: kind
    name: ork-e2e
    reuse: false

  expect:
    - name: CR created
      after: cr-applied
      timeout: 60s
      resources:
        - kind: Website
          name: my-site
          namespace: default
    
    - name: Deployment and Service created
      after: cr-applied
      timeout: 60s
      resources:
        - kind: Deployment
          name: my-site
          namespace: default
          ready: true
        - kind: Service
          name: my-site-svc
          namespace: default

    - name: Cleanup verified
      after: cr-deleted
      timeout: 30s
      resources:
        - kind: Website
          name: my-site
          namespace: default
          count: 0
        - kind: Deployment
          name: my-site
          namespace: default
          count: 0
        - kind: Service
          name: my-site
          namespace: default
          count: 0
