apiVersion: advanced.orkestra.io/v1alpha1
kind: MultiRegionApp
metadata:
  name: my-multi-region
  namespace: default
spec:
  image: ghcr.io/orkspace/orkestra-demo:multi-region-map

  # Fallbacks used when a region entry omits replicas or port.
  defaultReplicas: 1
  defaultPort: 8080

  # Map forEach — each key is a region name.
  # .item = region name, .value.replicas / .value.port = per-region overrides.
  regions:
    us-east-1:
      replicas: 3
      port: 8080
    eu-west-1:
      replicas: 1
      port: 8081
    ap-southeast-1:
      replicas: 2
      port: 8080
