apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: platforms.demo.orkestra.io
spec:
  group: demo.orkestra.io
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [image, tier]
              properties:
                image:
                  type: string
                tier:
                  type: string
                  enum: [free, pro, enterprise]
                  description: Deployment tier — controls which resources are created
                replicas:
                  type: integer
                  default: 1
                port:
                  type: integer
                  default: 8080
                monitoring:
                  type: boolean
                  default: false
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
  names:
    kind: Platform
    plural: platforms
    singular: platform
  scope: Namespaced
