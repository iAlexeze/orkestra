# https://orkestra.sh/docs/reference/cli/simulate/
apiVersion: orkestra.orkspace.io/v1
kind: Simulate
metadata:
  name: conditional-resources-free
  description: >
    Free tier — Deployment and ClusterIP Service created in cycle 1.
    LoadBalancer, monitoring ConfigMap, and enterprise ConfigMap must be absent.

spec:
  katalog: ./katalog.yaml
  crd: ./crd.yaml
  cr: ./cr-free.yaml
  cycles: 5

  expect:
    steady: true
    noErrors: true
    ops:
      - cycle: 1
        verb: apply
        resource: deployments
        name: my-platform
      - cycle: 1
        verb: apply
        resource: services
        name: my-platform-internal
    absent:
      - resource: services
        name: my-platform-lb
      - resource: configmaps
        name: my-platform-monitoring
      - resource: configmaps
        name: my-platform-enterprise-config
