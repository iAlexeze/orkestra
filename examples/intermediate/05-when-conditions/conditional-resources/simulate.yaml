# https://orkestra.sh/docs/reference/cli/simulate/
apiVersion: orkestra.orkspace.io/v1
kind: Simulate
metadata:
  name: conditional-resources-sim
  description: >
    Resource-level when: conditions — same CRD, different topology per tier.
    Two scenarios: free tier (core resources only) and enterprise tier
    (LoadBalancer + monitoring + enterprise config).

imports:
  - ./simulate-free.yaml
  - ./simulate-enterprise.yaml
