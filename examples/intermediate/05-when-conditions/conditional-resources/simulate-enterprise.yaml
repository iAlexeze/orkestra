# https://orkestra.sh/docs/reference/cli/simulate/
apiVersion: orkestra.orkspace.io/v1
kind: Simulate
metadata:
  name: conditional-resources-enterprise
  description: >
    Enterprise tier — Deployment, ClusterIP Service, LoadBalancer, monitoring
    ConfigMap, and enterprise ConfigMap all created in cycle 1.

spec:
  katalog: ./katalog.yaml
  crd: ./crd.yaml
  cr: ./cr-enterprise.yaml
  cycles: 5

  expect:
    steady: true
    noErrors: true
    ops:
      - cycle: 1
        verb: apply
        resource: deployments
        name: my-platform
      - cycle: 1
        verb: apply
        resource: services
        name: my-platform-internal
      - cycle: 1
        verb: apply
        resource: services
        name: my-platform-lb
      - cycle: 1
        verb: apply
        resource: configmaps
        name: my-platform-monitoring
      - cycle: 1
        verb: apply
        resource: configmaps
        name: my-platform-enterprise-config
