# https://orkestra.sh/docs/reference/schema/e2e/
apiVersion: orkestra.orkspace.io/v1
kind: E2E
metadata:
  name: intermediate-when-conditions-e2e
  description: >
    when: conditions — same CRD, different topology per tier.
    Free tier: core Deployment only. Enterprise tier: Deployment + LoadBalancer + monitoring.

spec:
  katalog: ./katalog.yaml
  crd: ./crd.yaml
  cr: ./cr-free.yaml

  cluster:
    provider: kind
    name: ork-e2e
    reuse: false

  expect:
    - name: Free tier — core Deployment created
      after: cr-applied
      timeout: 90s
      resources:
        - kind: Deployment
          name: my-platform
          namespace: default
          ready: true

    - name: Free tier — status tier is free
      after: cr-applied
      timeout: 60s
      kubectl:
        get:
          - kind: Platform
            name: my-platform
            namespace: default
            field: .status.tier
            equals: free

    - name: Cleanup verified
      after: cr-deleted
      timeout: 30s
      resources:
        - kind: Deployment
          name: my-platform
          namespace: default
          count: 0
        - kind: Platform
          name: my-platform
          namespace: default
          count: 0
