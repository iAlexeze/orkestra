apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: routes.demo.orkestra.io
spec:
  group: demo.orkestra.io
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [port]
              properties:
                host:
                  type: string
                port:
                  type: integer
                  default: 8080
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
  names:
    kind: Route
    plural: routes
    singular: route
  scope: Namespaced
