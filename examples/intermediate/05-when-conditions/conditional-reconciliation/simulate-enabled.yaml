apiVersion: orkestra.orkspace.io/v1
kind: Simulate
metadata:
  name: conditional-reconciliation-enabled
  description: >
    App with spec.enabled: true — gate passes, reconciler runs, Deployment applied in cycle 1.

spec:
  katalog: ./katalog.yaml
  crdFiles:
    - ./crd-app.yaml
    - ./crd-route.yaml
  crFiles:
    - ./cr-app.yaml
    - ./cr-route.yaml
  cycles: 5

  expect:
    crds:
      app:
        steady: true
        noErrors: true
        ops:
          - cycle: 1
            verb: apply
            resource: deployments
            name: my-app
      route:
        steady: true
        noErrors: true
        ops:
          - cycle: 1
            verb: apply
            resource: services
            name: my-route
