# https://orkestra.sh/docs/reference/schema/e2e/
apiVersion: orkestra.orkspace.io/v1
kind: E2E
metadata:
  name: conditional-reconciliation-e2e
  description: >
    Gate pass: App (enabled:true) creates a Deployment; Route creates a Service.
    Gate discard: patch App to enabled:false — kordinator discards the item,
    Deployment removed, runtime reports gated:true.

spec:
  katalog: ./katalog.yaml
  crdFiles:
    - ./crd-app.yaml
    - ./crd-route.yaml
  crFiles:
    - ./cr-app.yaml
    - ./cr-route.yaml

  cluster:
    provider: kind
    name: ork-e2e
    reuse: false

  expect:
    - name: App enabled — Deployment created and ready
      after: cr-applied
      timeout: 90s
      resources:
        - kind: Deployment
          name: my-app
          namespace: default
          ready: true
        - kind: Service
          name: my-route
          namespace: default

    - name: Runtime reports App as healthy and not gated
      after: cr-applied
      timeout: 60s
      kubectl:
        port-forward:
          - namespace: orkestra-system
            leaderElection:
              lease: orkestra-konductor
            port: 8080
            path: /katalog/app/health
            jq: healthy
            equals: "true"

          - namespace: orkestra-system
            leaderElection:
              lease: orkestra-konductor
            port: 8080
            path: /katalog/app/health
            jq: gated
            equals: "false"

    - name: Disable App — gate discards item, Deployment removed
      after: cr-applied
      timeout: 60s
      kubectl:
        patch:
          - kind: App
            name: my-app
            namespace: default
            patch: '{"spec":{"enabled":false}}'
      resources:
        - kind: Deployment
          name: my-app
          namespace: default
          count: 0

    - name: Runtime reports App as gated
      after: cr-applied
      timeout: 60s
      kubectl:
        port-forward:
          - namespace: orkestra-system
            leaderElection:
              lease: orkestra-konductor
            port: 8080
            path: /katalog/app/health
            jq: gated
            equals: "true"

    - name: Cleanup verified
      after: cr-deleted
      timeout: 30s
      resources:
        - kind: Deployment
          name: my-app
          namespace: default
          count: 0
        - kind: App
          name: my-app
          namespace: default
          count: 0
        - kind: Service
          name: my-route
          namespace: default
          count: 0
        - kind: Route
          name: my-route
          namespace: default
          count: 0

  onFailure:
    kubectl:
      logs:
        - leaderElection:
            lease: orkestra-konductor
          namespace: orkestra-system
          since: 5m
      describe:
        - kind: App
          name: my-app
          namespace: default
        - kind: Deployment
          name: my-app
          namespace: default
      events:
        - kind: App
          name: my-app
          namespace: default
        - kind: Deployment
          name: my-app
          namespace: default
