# https://orkestra.sh/docs/reference/cli/simulate/
apiVersion: orkestra.orkspace.io/v1
kind: Simulate
metadata:
  name: conditional-reconciliation-sim
  description: >
    Gate conditions evaluated against a real Kubernetes API server via --envtest.
    Two scenarios: enabled:true creates the Deployment; enabled:false is discarded
    by the kordinator before the reconciler is ever called.

imports:
  - ./simulate-enabled.yaml
  - ./simulate-gated.yaml
