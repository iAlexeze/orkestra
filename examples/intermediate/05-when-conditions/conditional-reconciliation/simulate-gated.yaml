apiVersion: orkestra.orkspace.io/v1
kind: Simulate
metadata:
  name: conditional-reconciliation-gated
  description: >
    App with spec.enabled: false — the kordinator discards the item before calling
    the reconciler. No Deployment is ever created. The loop reaches steady state cleanly.

spec:
  katalog: ./katalog.yaml
  crdFiles:
    - ./crd-app.yaml
    - ./crd-route.yaml
  crFiles:
    - ./cr-app-disabled.yaml
    - ./cr-route.yaml
  cycles: 5

  expect:
    crds:
      app:
        steady: true
        noErrors: true
        absent:
          - resource: deployments
      route:
        steady: true
        noErrors: true
        ops:
          - cycle: 1
            verb: apply
            resource: services
            name: my-route
