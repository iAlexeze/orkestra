apiVersion: orkestra.orkspace.io/v1
kind: E2E
metadata:
  name: intermediate-komposer-basic-e2e
  description: >
    Two Katalogs composed via a Komposer. Overrides applied per-environment without
    touching the base Katalog. Website operator + namespace governance in one runtime.

spec:
  katalog: ./komposer.yaml
  crd: ./crd.yaml
  cr: ./cr.yaml

  cluster:
    provider: kind
    name: ork-e2e
    reuse: false

  expect:
    - name: Website CR created
      after: cr-applied
      timeout: 90s
      resources:
        - kind: Website
          name: composed-site
          namespace: default

    - name: Deployment and Service created
      after: cr-applied
      timeout: 90s
      resources:
        - kind: Deployment
          namespace: default
          ready: true
        - kind: Service
          namespace: default

    - name: Cleanup verified
      after: cr-deleted
      timeout: 30s
      resources:
        - kind: Deployment
          namespace: default
          count: 0
        - kind: Website
          name: composed-site
          namespace: default
          count: 0
