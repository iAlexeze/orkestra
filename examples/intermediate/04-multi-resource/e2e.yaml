apiVersion: orkestra.orkspace.io/v1
kind: E2E
metadata:
  name: intermediate-multi-resource-e2e
  description: >
    Three resources from one CR — Deployment, Service, and ConfigMap.
    Layer 3 status: readyReplicas read back from the live Deployment into status.

spec:
  katalog: ./katalog.yaml
  crd: ./crd.yaml
  cr: ./cr.yaml

  cluster:
    provider: kind
    name: ork-e2e
    reuse: false

  expect:
    - name: All three resources created
      after: cr-applied
      timeout: 90s
      resources:
        - kind: Deployment
          name: my-app
          namespace: default
          ready: true
        - kind: Service
          name: my-app-svc
          namespace: default
        - kind: ConfigMap
          name: my-app-config
          namespace: default

    - name: Status reflects live Deployment state
      after: cr-applied
      timeout: 60s
      commands:
        - run: kubectl get application my-app -o jsonpath='{.status.phase}'
          outputContains: Running

    - name: Cleanup verified
      after: cr-deleted
      timeout: 30s
      resources:
        - kind: Deployment
          name: my-app
          namespace: default
          count: 0
        - kind: Service
          name: my-app-svc
          namespace: default
          count: 0
        - kind: ConfigMap
          name: my-app-config
          namespace: default
          count: 0
        - kind: Application
          name: my-app
          namespace: default
          count: 0
