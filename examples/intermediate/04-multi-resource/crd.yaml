apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: applications.demo.orkestra.io
spec:
  group: demo.orkestra.io
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [image, port]
              properties:
                image:
                  type: string
                replicas:
                  type: integer
                  default: 2
                port:
                  type: integer
                logLevel:
                  type: string
                  default: info
                maxConnections:
                  type: integer
                  default: 100
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
  names:
    kind: Application
    plural: applications
    singular: application
  scope: Namespaced
