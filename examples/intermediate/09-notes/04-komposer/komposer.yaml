apiVersion: orkestra.orkspace.io/v1
kind: Komposer
metadata:
  name: notes-komposer-override
  description: >
    Composes both notes katalogs into one runtime.
    Overrides the serviceHost note inline so it uses a production cluster domain
    instead of the default declared in 03-motifs/katalog.yaml.

imports:
  files:
    - ../01-built-in/katalog.yaml
    - ../03-motifs/katalog.yaml

# Inline notes: on a Komposer override any imported Katalog note with the same name.
# Here serviceHost is redeclared with a production-specific cluster domain.
# The appLabel and fullImage notes come unchanged from the imported Motif.
notes:
  - name: serviceHost
    description: Production-qualified hostname for this service
    expression: "{{ .metadata.name }}.{{ .metadata.namespace }}.svc.prod-cluster.example.com"
