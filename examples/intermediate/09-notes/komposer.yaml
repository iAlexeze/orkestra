apiVersion: orkestra.orkspace.io/v1
kind: Komposer
metadata:
  name: notes-komposer
  description: >
    Composes both notes katalogs into one runtime.
    Manages Website CRDs (built-in notes) and Service CRDs (user-defined notes)
    from a single operator instance.

imports:
  files:
    - ./01-built-in/katalog.yaml
    - ./02-user-defined/katalog.yaml
    - ./03-motifs/katalog.yaml
