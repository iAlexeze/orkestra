# https://orkestra.sh/docs/reference/schema/e2e/
apiVersion: orkestra.orkspace.io/v1
kind: E2E
metadata:
  name: notes-motifs-e2e
  description: >
    Notes 03 — Motif-distributed notes.
    fullImage and appLabel come from motifs/motif.yaml via spec.imports.
    serviceHost is declared inline. Deployment is named from appLabel;
    image is composed by fullImage.

spec:
  katalog: ./katalog.yaml
  crd: ./crd.yaml
  cr: ./cr.yaml

  cluster:
    provider: kind
    name: ork-e2e
    reuse: false

  expect:
    - name: Deployment created with appLabel name
      after: cr-applied
      timeout: 90s
      resources:
        - kind: Deployment
          name: default-my-service
          namespace: default
          ready: true

    - name: Status phase becomes Ready
      after: cr-applied
      timeout: 90s
      kubectl:
        get:
          - kind: Workload
            name: my-service
            namespace: default
            field: .status.phase
            equals: Ready

    - name: Status image reflects fullImage note
      after: cr-applied
      timeout: 90s
      kubectl:
        get:
          - kind: Workload
            name: my-service
            namespace: default
            field: .status.image
            equals: "nginx:1.25"

    - name: Status host reflects serviceHost note
      after: cr-applied
      timeout: 90s
      kubectl:
        get:
          - kind: Workload
            name: my-service
            namespace: default
            field: .status.host
            equals: "my-service.default.svc.cluster.local"

    # Mirror: kubectl apply -f cr-default.yaml
    # tag is omitted — fullImage note supplies "latest"
    - name: Default note — missing tag produces image nginx:latest
      after: cr-applied
      timeout: 90s
      kubectl:
        apply:
          - file: ./cr-default.yaml
        get:
          - kind: Deployment
            name: default-my-service-default
            namespace: default
            field: .spec.template.spec.containers[0].image
            equals: "nginx:latest"
          - kind: Workload
            name: my-service-default
            namespace: default
            field: .status.image
            equals: "nginx:latest"

    - name: Delete default CR
      after: cr-applied
      timeout: 30s
      kubectl:
        delete:
          - kind: Workload
            name: my-service-default
            namespace: default
            ignoreNotFound: true

    - name: Cleanup verified
      after: cr-deleted
      timeout: 30s
      resources:
        - kind: Deployment
          name: default-my-service
          namespace: default
          count: 0
        - kind: Deployment
          name: default-my-service-default
          namespace: default
          count: 0
