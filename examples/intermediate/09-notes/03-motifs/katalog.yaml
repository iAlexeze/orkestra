apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: workload-motif-notes
  description: >
    Notes 03 — user-defined notes distributed via a Motif.
    fullImage and appLabel are declared in motifs/motif.yaml and imported
    at the Katalog level via spec.imports. serviceHost is declared inline.
    All three are available in every template expression in this Katalog.

spec:
  imports:
    - motif: ./motifs/motif.yaml

  crds:
    workload:
      crdFile: ./crd.yaml
      crFiles:
        - ./cr.yaml
      operatorBox:
        reconciler:
          workers: 2
          resync: 30s

        status:
          fields:
            - path: phase
              value: "Pending"
              when:
                - field: status.phase
                  operator: notExists
            - path: phase
              value: "Ready"
              when:
                - field: "{{ allReplicasReady .children.deployment }}"
                  equals: "true"
            - path: host
              value: "{{ serviceHost }}"
            - path: image
              value: "{{ fullImage }}"

        onReconcile:
          deployments:
            - name: "{{ appLabel }}"
              image: "{{ fullImage }}"
              port: "{{ .spec.port }}"
              replicas: "{{ default .spec.replicas 1 }}"

notes:
  - name: serviceHost
    description: Fully-qualified hostname for this workload
    expression: "{{ .metadata.name }}.{{ .metadata.namespace }}.svc.cluster.local"
