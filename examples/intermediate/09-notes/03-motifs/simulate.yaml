apiVersion: orkestra.orkspace.io/v1
kind: Simulate
metadata:
  name: notes-motifs-sim
  description: >
    Verify Deployment is created with the appLabel-derived name and
    fullImage-derived image reference.

spec:
  katalog: ./katalog.yaml
  cr: ./cr.yaml
  cycles: 3

  expect:
    steady: true
    noErrors: true
    ops:
      - cycle: 1
        verb: create
        resource: deployments
        name: default-my-service
