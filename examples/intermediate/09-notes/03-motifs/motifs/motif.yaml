apiVersion: orkestra.orkspace.io/v1
kind: Motif
metadata:
  name: team-notes
  description: >
    Org-wide user-defined notes for the service platform team.
    Imported at spec.imports so every CRD in the Katalog can call
    these notes inside any template expression.

notes:
  functions:
    - name: fullImage
      description: Combine spec.image and spec.tag into a qualified image reference
      expression: "{{ .spec.image }}:{{ .spec.tag | default \"latest\" }}"

    - name: appLabel
      description: Standard label value combining namespace and name
      expression: "{{ .metadata.namespace }}-{{ .metadata.name }}"
