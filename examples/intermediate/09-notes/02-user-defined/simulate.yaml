apiVersion: orkestra.orkspace.io/v1
kind: Simulate
metadata:
  name: notes-user-defined-sim
  description: Verify Deployment is created and serviceHost populates status.host

spec:
  katalog: ./katalog.yaml
  cr: ./cr.yaml
  cycles: 3

  expect:
    steady: true
    noErrors: true
    ops:
      - cycle: 1
        verb: apply
        resource: deployments
        name: my-service
