apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: workload-inline-notes
  description: >
    Notes 02 — inline user-defined notes.
    A single note (serviceHost) is declared inline and written to status.host.

spec:
  crds:
    workload:
      crdFile: ./crd.yaml
      crFiles:
        - ./cr.yaml
      operatorBox:
        reconciler:
          workers: 2
          resync: 30s

        status:
          fields:
            - path: phase
              value: "Pending"
              when:
                - field: status.phase
                  operator: notExists
            - path: phase
              value: "Ready"
              when:
                - field: "{{ allReplicasReady .children.deployment }}"
                  equals: "true"
            - path: host
              value: "{{ serviceHost }}"

        onReconcile:
          deployments:
            - name: "{{ .metadata.name }}"
              image: "{{ .spec.image }}:{{ .spec.tag | default \"latest\" }}"
              port: "{{ .spec.port }}"
              replicas: "1"

notes:
  - name: serviceHost
    description: Fully-qualified hostname for this workload
    expression: "{{ .metadata.name }}.{{ .metadata.namespace }}.svc.cluster.local"
