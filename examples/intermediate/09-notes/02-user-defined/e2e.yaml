# https://orkestra.sh/docs/reference/schema/e2e/
apiVersion: orkestra.orkspace.io/v1
kind: E2E
metadata:
  name: notes-user-defined-e2e
  description: >
    Notes 02 — inline user-defined note (serviceHost) written to status.host.
    One Workload CR. Deployment is named from .metadata.name directly.

spec:
  katalog: ./katalog.yaml
  crd: ./crd.yaml
  cr: ./cr.yaml

  cluster:
    provider: kind
    name: ork-e2e
    reuse: false

  expect:
    - name: Deployment created
      after: cr-applied
      timeout: 90s
      resources:
        - kind: Deployment
          name: my-service
          namespace: default
          ready: true

    - name: Status phase becomes Ready
      after: cr-applied
      timeout: 90s
      kubectl:
        get:
          - kind: Workload
            name: my-service
            namespace: default
            field: .status.phase
            equals: Ready

    - name: Status host reflects serviceHost note
      after: cr-applied
      timeout: 90s
      kubectl:
        get:
          - kind: Workload
            name: my-service
            namespace: default
            field: .status.host
            equals: "my-service.default.svc.cluster.local"

    # Mirror: kubectl apply -f cr-default.yaml
    # The default note in the image expression supplies "latest" when tag is absent.
    - name: Default note — missing tag field produces image nginx:latest
      after: cr-applied
      timeout: 90s
      kubectl:
        apply:
          - file: ./cr-default.yaml
        get:
          - kind: Deployment
            name: my-service-default
            namespace: default
            field: .spec.template.spec.containers[0].image
            equals: "nginx:latest"
          - kind: Workload
            name: my-service-default
            namespace: default
            field: .status.host
            equals: "my-service-default.default.svc.cluster.local"

    - name: Delete default CR
      after: cr-applied
      timeout: 30s
      kubectl:
        delete:
          - kind: Workload
            name: my-service-default
            namespace: default
            ignoreNotFound: true

    - name: Cleanup verified
      after: cr-deleted
      timeout: 30s
      resources:
        - kind: Deployment
          name: my-service
          namespace: default
          count: 0
        - kind: Deployment
          name: my-service-default
          namespace: default
          count: 0
