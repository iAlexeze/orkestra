apiVersion: orkestra.orkspace.io/v1
kind: Simulate
metadata:
  name: notes-built-in-sim
  description: Verify the Deployment is created and status fields are populated via built-in notes

spec:
  katalog: ./katalog.yaml
  cr: ./cr.yaml
  cycles: 3

  expect:
    steady: true
    noErrors: true
    ops:
      - cycle: 1
        verb: apply
        resource: deployments
        name: my-website
