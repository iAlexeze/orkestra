# https://orkestra.sh/docs/reference/schema/e2e/
apiVersion: orkestra.orkspace.io/v1
kind: E2E
metadata:
  name: notes-built-in-e2e
  description: >
    Notes 01 — built-in notes in status, conditions, and resource templates.
    One Website CR creates one Deployment. Status fields are computed via
    allReplicasReady and default notes.

spec:
  katalog: ./katalog.yaml
  crd: ./crd.yaml
  cr: ./cr.yaml

  cluster:
    provider: kind
    name: ork-e2e
    reuse: false

  expect:
    - name: Deployment created
      after: cr-applied
      timeout: 90s
      resources:
        - kind: Deployment
          name: my-website
          namespace: default
          ready: true

    - name: Status phase becomes Ready
      after: cr-applied
      timeout: 90s
      kubectl:
        get:
          - kind: Website
            name: my-website
            namespace: default
            field: .status.phase
            equals: Ready

    - name: Status ready becomes true
      after: cr-applied
      timeout: 90s
      kubectl:
        get:
          - kind: Website
            name: my-website
            namespace: default
            field: .status.ready
            equals: "true"

    # Mirror: kubectl apply -f cr-default.yaml
    # The default note supplies replicas: 1 when the field is absent in the CR.
    - name: Default note — missing replicas field produces deployment with 1 replica
      after: cr-applied
      timeout: 90s
      kubectl:
        apply:
          - file: ./cr-default.yaml
        get:
          - kind: Deployment
            name: my-website-default
            namespace: default
            field: .spec.replicas
            equals: "1"

    - name: Delete default CR
      after: cr-applied
      timeout: 30s
      kubectl:
        delete:
          - kind: Website
            name: my-website-default
            namespace: default
            ignoreNotFound: true

    - name: Cleanup verified
      after: cr-deleted
      timeout: 30s
      resources:
        - kind: Deployment
          name: my-website
          namespace: default
          count: 0
        - kind: Deployment
          name: my-website-default
          namespace: default
          count: 0
