apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: databases.crdfile.orkestra.io
spec:
  group: crdfile.orkestra.io
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Engine
          type: string
          jsonPath: .spec.engine
        - name: Storage
          type: string
          jsonPath: .spec.storageSize
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                engine:
                  type: string
                  default: postgres
                  enum: [postgres, mysql, sqlite]
                storageSize:
                  type: string
                  default: "1Gi"
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
  names:
    kind: Database
    plural: databases
    singular: database
  scope: Namespaced
