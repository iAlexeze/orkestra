apiVersion: orkestra.orkspace.io/v1
kind: E2E
metadata:
  name: intermediate-crd-file-e2e
  description: >
    crdFile in the Katalog — two CRDs declared inline, both applied automatically
    before reconcile loops start. Tests App CR creates a Deployment and reports Running.

spec:
  katalog: ./katalog.yaml
  cr: ./cr-app.yaml

  cluster:
    provider: kind
    name: ork-e2e
    reuse: false

  expect:
    - name: App CR created and Deployment ready
      after: cr-applied
      timeout: 90s
      resources:
        - kind: App
          name: my-app
          namespace: default
        - kind: Deployment
          namespace: default
          ready: true

    - name: Status phase is Running
      after: cr-applied
      timeout: 60s
      commands:
        - run: kubectl get app my-app -o jsonpath='{.status.phase}'
          outputContains: Running

    - name: Cleanup verified
      after: cr-deleted
      timeout: 30s
      resources:
        - kind: App
          name: my-app
          namespace: default
          count: 0
        - kind: Deployment
          namespace: default
          count: 0
