apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: platform-security
  description: >
    Platform security Katalog for managing namespaces, service accounts, and website deployments with deletion protection.
  author: orkspace
  license: Apache2.0
  version: v0.1.0

gateway:
  enabled: true

security:
  deletionProtection:
    enabled: true
    strictMode: false
    cleanupOnShutdown: true

spec:
  crds:
    website:
      apiTypes:
        kind: Website
        group: demo.orkestra.io
        version: v1alpha1
        plural: websites
      allowedNamespaces:
        - default

      operatorBox:
        default: true

        status:
          fields:
            - path: phase
              value: "Running"
            - path: endpoint
              value: "{{ .metadata.name }}.{{ .metadata.namespace }}.svc.cluster.local"

        onCreate:
          deployments:
            - name: "{{ .metadata.name }}"
              image: "{{ .spec.image }}"
              replicas: "{{ .spec.replicas }}"
              port: "{{ .spec.port }}"
              reconcile: true
    platform:
      apiTypes:
        kind: Namespace
      labelSelector:
        app: my-operator
      operatorBox:
        onCreate:
          secrets:
            - name: "{{ .metadata.name }}-creds"
              namespace: "{{ .metadata.name }}"
              once: true
              rotateAfter: 90d
              data:
                API_KEY: "{{ randomHex 16 }}"
                JWT_SECRET: "{{ randomBase64 32 }}"
        onReconcile:
          namespaces:
            - name: "{{ .metadata.name }}"
          serviceAccounts:
            - name: "{{ .metadata.name }}-sa"
              namespace: "{{ .metadata.name }}"
              labels:
                - key: app
                  value: my-operator-sa
          deployments:
            - name: "{{ .metadata.name }}"
              namespace: "{{ .metadata.name }}"
              image: nginx:latest
              port: 80
              replicas: 4
              serviceAccountName: "{{ .metadata.name }}-sa"
              envFrom:
                secretRef:
                  - "{{ .metadata.name }}-creds"
          services:
            - name: "{{ .metadata.name }}-svc"
              port: "80"
              targetPort: "80"
    identity:
      apiTypes:
        kind: ServiceAccount
      labelSelector:
        app: my-operator
      operatorBox:
        onCreate:
          namespaces:
            - name: "{{ .metadata.name }}"
              reconcile: true
          serviceAccounts:
            - name: "{{ .metadata.name }}-minor"
              namespace: "{{ .metadata.namespace }}"
              reconcile: true
            - name: "{{ .metadata.name }}"
              namespace: "{{ .metadata.namespace }}"
              reconcile: true