apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: orkestra-gateway
  author: orkspace
  version: 0.1.0
  description: >
    Standalone Orkestra gateway — no operator, no CRDs, no runtime required.
    Deploys deletion protection, admission webhooks, namespace protection,
    and auto-managed TLS certs to any Kubernetes cluster.
    Label any resource orkestra.io/deletion-protection=true and it is immediately protected.

# Gateway deployment mode.
# standalone: true — this katalog runs as a gateway-only installation.
# No companion runtime operator is required. spec: is intentionally empty.
gateway:
  standalone: true
  endpoint: ""

security:
  # ── Deletion protection ───────────────────────────────────────────────────
  # Blocks kubectl delete on any resource labelled orkestra.io/deletion-protection=true.
  # failurePolicy: Fail means the delete is rejected when the gateway is unreachable.
  deletionProtection:
    enabled: true
    strictMode: true
    failurePolicy: Fail
    cleanupOnShutdown: true

  # ── Admission webhooks ────────────────────────────────────────────────────
  # ValidatingWebhookConfiguration and MutatingWebhookConfiguration.
  # Enabled globally; per-CRD rules drive what actually runs (none here — standalone).
  webhooks:
    admission:
      enabled: true
    failurePolicy: Ignore
    cleanupOnShutdown: false

  # ── Namespace protection ──────────────────────────────────────────────────
  # Blocks CRs from being created in restricted namespaces at admission time.
  namespaceProtection:
    enabled: true
    failurePolicy: Fail
    restrictedNamespaces:
      - kube-system
      - kube-public

  # ── Certificate manager ───────────────────────────────────────────────────
  # Orkestra auto-generates and manages the TLS cert used by all webhooks.
  # autoRotate: true — rotate before expiry (default).
  # rotationThreshold: how far before expiry to rotate (default: 30d).
  # validFor: how long is this certificate valid for.
  certManager:
    autoRotate: true
    rotationThreshold: "14d"
    validFor: "2y"

# ── Notifications ─────────────────────────────────────────────────────────────
# Fires when cert is rotated. SLACK_WEBHOOK_URL and SMTP_* must be set in env.
# Slack is preferred over email when both are configured.
notification:
  teams:
    platform:
      slack:
        - "#platform-alerts"
      email:
        - platform@example.com

spec: {}
