apiVersion: orkestra.orkspace.io/v1
kind: Simulate
metadata:
  name: regional-peak-simulate
  description: >
    Validates the regional-peak operator across several reconcile cycles.
    All three regional deployments and the routing ConfigMap are created unconditionally.
    Replica counts vary by time of day — the simulate verifies stability regardless
    of which timezone is currently in peak hours.

spec:
  katalog: ./katalog.yaml
  cr: ./cr.yaml
  cycles: 3

  expect:
    noErrors: true
    ops:
      - cycle: 1
        verb: create
        resource: deployments
        name: my-cdn-edge-us-east

      - cycle: 1
        verb: create
        resource: deployments
        name: my-cdn-edge-eu-central

      - cycle: 1
        verb: create
        resource: deployments
        name: my-cdn-edge-apac

      - cycle: 1
        verb: create
        resource: configmaps
        name: my-cdn-edge-routing
