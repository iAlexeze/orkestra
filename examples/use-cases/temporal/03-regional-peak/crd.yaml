apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: cdnedges.demo.orkestra.io
spec:
  group: demo.orkestra.io
  scope: Namespaced
  names:
    plural: cdnedges
    singular: cdnedge
    kind: CDNEdge
    shortNames: [cdn]
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: US-East
          type: string
          jsonPath: .status.usEastPeak
        - name: EU-Central
          type: string
          jsonPath: .status.euCentralPeak
        - name: APAC
          type: string
          jsonPath: .status.apacPeak
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  description: Container image for edge nodes
                peakReplicas:
                  type: integer
                  minimum: 1
                  default: 8
                  description: Replica count during regional peak hours
                baseReplicas:
                  type: integer
                  minimum: 1
                  default: 2
                  description: Replica count outside peak hours
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
