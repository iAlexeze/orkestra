apiVersion: orkestra.orkspace.io/v1
kind: E2E
metadata:
  name: regional-peak-e2e
  description: >
    CDN edge operator with per-region peak-hour replica scaling.
    Validates all three regional deployments and the routing ConfigMap are created.
    Replica counts are time-dependent — the e2e verifies structural correctness
    and that status peak flags are written.

spec:
  katalog: ./katalog.yaml
  crd: ./crd.yaml
  cr: ./cr.yaml

  cluster:
    provider: kind
    name: ork-e2e-regional-peak
    reuse: false

  expect:
    - include: ./e2e/01-resources.yaml
    - include: ./e2e/02-status.yaml
    - include: ./e2e/03-configmap.yaml
    - include: ./e2e/04-cleanup.yaml

  onFailure:
    kubectl:
      get:
        - kind: CDNEdge
          name: my-cdn-edge
          namespace: default
      describe:
        - kind: Deployment
          name: my-cdn-edge-us-east
          namespace: default
        - kind: Deployment
          name: my-cdn-edge-eu-central
          namespace: default
      events:
        - kind: Deployment
          name: my-cdn-edge-us-east
          namespace: default
    commands:
      - kubectl get pods -n default -o wide
