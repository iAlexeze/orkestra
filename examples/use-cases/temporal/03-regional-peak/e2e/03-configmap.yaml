expect:
  - name: Routing ConfigMap has all region keys
    after: cr-applied
    timeout: 30s
    kubectl:
      describe:
        - kind: ConfigMap
          name: my-cdn-edge-routing
          namespace: default
          outputContains: usEastPeak
        - kind: ConfigMap
          name: my-cdn-edge-routing
          namespace: default
          outputContains: euCentralPeak
        - kind: ConfigMap
          name: my-cdn-edge-routing
          namespace: default
          outputContains: apacPeak
