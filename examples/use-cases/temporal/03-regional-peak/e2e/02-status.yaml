expect:
  - name: Status phase is Active
    after: cr-applied
    timeout: 60s
    kubectl:
      get:
        - kind: CDNEdge
          name: my-cdn-edge
          namespace: default
          field: .status.phase
          equals: Active

  - name: Status peak flags are written
    after: cr-applied
    timeout: 30s
    kubectl:
      get:
        - kind: CDNEdge
          name: my-cdn-edge
          namespace: default
          field: .status.usEastPeak
          oneOf: ["true", "false"]
        - kind: CDNEdge
          name: my-cdn-edge
          namespace: default
          field: .status.euCentralPeak
          oneOf: ["true", "false"]
        - kind: CDNEdge
          name: my-cdn-edge
          namespace: default
          field: .status.apacPeak
          oneOf: ["true", "false"]
