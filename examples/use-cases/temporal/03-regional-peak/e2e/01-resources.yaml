expect:
  - name: All regional deployments and ConfigMap created
    after: cr-applied
    timeout: 120s
    resources:
      - kind: CDNEdge
        name: my-cdn-edge
        namespace: default
      - kind: Deployment
        name: my-cdn-edge-us-east
        namespace: default
        ready: true
      - kind: Deployment
        name: my-cdn-edge-eu-central
        namespace: default
        ready: true
      - kind: Deployment
        name: my-cdn-edge-apac
        namespace: default
        ready: true
      - kind: ConfigMap
        name: my-cdn-edge-routing
        namespace: default
