apiVersion: orkestra.orkspace.io/v1
kind: Simulate
metadata:
  name: business-hours-simulate
  description: >
    Validates the business-hours operator runs without errors across several
    reconcile cycles. Resource creation depends on current time — run during
    Mon–Fri 09:00–18:00 UTC to observe Deployment and Service creation.

spec:
  katalog: ./katalog.yaml
  cr: ./cr.yaml
  cycles: 3

  expect:
    noErrors: true
