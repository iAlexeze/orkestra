apiVersion: orkestra.orkspace.io/v1
kind: E2E
metadata:
  name: business-hours-e2e
  description: >
    Business-hours operator — provisions a Deployment and Service Mon–Fri
    09:00–18:00 UTC and removes them automatically when the window closes.
    Run during business hours to observe active state; outside to observe suspended.

spec:
  katalog: ./katalog.yaml
  crd: ./crd.yaml
  cr: ./cr.yaml

  cluster:
    provider: kind
    name: ork-e2e-business-hours
    reuse: false

  expect:
    - name: DevEnvironment CR created and reconciled
      after: cr-applied
      timeout: 60s
      resources:
        - kind: DevEnvironment
          name: my-env
          namespace: default

    - name: Cleanup verified
      after: cr-deleted
      timeout: 60s
      resources:
        - kind: DevEnvironment
          name: my-env
          namespace: default
          count: 0
        - kind: Deployment
          name: my-env
          namespace: default
          count: 0
        - kind: Service
          name: my-env-svc
          namespace: default
          count: 0

  onFailure:
    kubectl:
      get:
        - kind: DevEnvironment
          name: my-env
          namespace: default
      describe:
        - kind: DevEnvironment
          name: my-env
          namespace: default
    commands:
      - kubectl get all -n default
