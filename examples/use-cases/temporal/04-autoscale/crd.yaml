apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: apiservers.demo.orkestra.io
spec:
  group: demo.orkestra.io
  scope: Namespaced
  names:
    plural: apiservers
    singular: apiserver
    kind: APIServer
    shortNames: [api]
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Replicas
          type: string
          jsonPath: .status.replicas
        - name: Peak
          type: string
          jsonPath: .status.inBusinessHours
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  description: Container image
                baseReplicas:
                  type: integer
                  default: 2
                  description: Off-peak replica count
                peakReplicas:
                  type: integer
                  default: 8
                  description: Business-hours replica count
                port:
                  type: integer
                  default: 8080
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
