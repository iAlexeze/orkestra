apiVersion: orkestra.orkspace.io/v1
kind: E2E
metadata:
  name: autoscale-e2e
  description: >
    API server operator with business-hours autoscaling.
    Validates the Deployment is always created and the CR status reflects
    the current window state. Replica count is time-dependent and not asserted.

spec:
  katalog: ./katalog.yaml
  crd: ./crd.yaml
  cr: ./cr.yaml

  cluster:
    provider: kind
    name: ork-e2e-autoscale
    reuse: false

  expect:
    - name: Deployment created and ready
      after: cr-applied
      timeout: 120s
      resources:
        - kind: Deployment
          name: my-api
          namespace: default
          ready: true

    - name: CR status fields written and consistent
      after: cr-applied
      timeout: 120s
      kubectl:
        get:
          - kind: APIServer
            name: my-api
            namespace: default
            field: .status.phase
            oneOf: [Peak, Steady]
          - kind: APIServer
            name: my-api
            namespace: default
            field: .status.inBusinessHours
            oneOf: ["true", "false"]

  onFailure:
    kubectl:
      get:
        - kind: APIServer
          name: my-api
          namespace: default
      describe:
        - kind: Deployment
          name: my-api
          namespace: default
      events:
        - kind: Deployment
          name: my-api
          namespace: default
    commands:
      - kubectl get pods -n default -o wide
