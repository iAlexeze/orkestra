apiVersion: orkestra.orkspace.io/v1
kind: Simulate
metadata:
  name: autoscale-simulate
  description: >
    Validates the API server autoscale operator runs without errors across several
    reconcile cycles. Replica count depends on current time — the simulation verifies
    structural correctness, not the replica value.

spec:
  katalog: ./katalog.yaml
  cr: ./cr.yaml
  cycles: 3

  expect:
    noErrors: true
