expect:
  - name: Status fields populated
    after: cr-applied
    timeout: 60s
    kubectl:
      get:
        - kind: Database
          name: my-db
          namespace: default
          field: .status.maintenanceActive
          oneOf: ["true", "false"]
        - kind: Database
          name: my-db
          namespace: default
          field: .status.nextMaintenance
          notEquals: "<no value>"
