expect:
  - name: All resources created
    after: cr-applied
    timeout: 120s
    resources:
      - kind: Database
        name: my-db
        namespace: default
      - kind: StatefulSet
        name: my-db-primary
        namespace: default
        ready: true
      - kind: StatefulSet
        name: my-db-replicas
        namespace: default
      - kind: ConfigMap
        name: my-db-routing
        namespace: default
