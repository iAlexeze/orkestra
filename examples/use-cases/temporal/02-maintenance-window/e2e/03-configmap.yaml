expect:
  - name: Routing ConfigMap has maintenance and readReplicas keys
    after: cr-applied
    timeout: 30s
    kubectl:
      describe:
        - kind: ConfigMap
          name: my-db-routing
          namespace: default
          outputContains: maintenance
        - kind: ConfigMap
          name: my-db-routing
          namespace: default
          outputContains: readReplicas
