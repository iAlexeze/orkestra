apiVersion: orkestra.orkspace.io/v1
kind: E2E
metadata:
  name: maintenance-window-e2e
  description: >
    Database operator with a weekly maintenance window.
    Validates the primary StatefulSet and routing ConfigMap are always created.
    Read-replica count is time-dependent — the e2e verifies structural correctness,
    not the replica value.

spec:
  katalog: ./katalog.yaml
  crd: ./crd.yaml
  cr: ./cr.yaml

  cluster:
    provider: kind
    name: ork-e2e-maintenance
    reuse: false

  expect:
    - include: ./e2e/01-resources.yaml
    - include: ./e2e/02-status.yaml
    - include: ./e2e/03-configmap.yaml
    - include: ./e2e/04-cleanup.yaml

  onFailure:
    kubectl:
      get:
        - kind: Database
          name: my-db
          namespace: default
      describe:
        - kind: StatefulSet
          name: my-db-primary
          namespace: default
        - kind: StatefulSet
          name: my-db-replicas
          namespace: default
      events:
        - kind: StatefulSet
          name: my-db-primary
          namespace: default
    commands:
      - kubectl get pods -n default -o wide
