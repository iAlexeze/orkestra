apiVersion: orkestra.orkspace.io/v1
kind: Simulate
metadata:
  name: maintenance-window-simulate
  description: >
    Validates the maintenance-window operator across several reconcile cycles.
    Primary StatefulSet and routing ConfigMap are created unconditionally.
    Read-replica count varies by time — zero during Sun 02:00–04:00 UTC,
    spec.readReplicas (3) at all other times.

spec:
  katalog: ./katalog.yaml
  cr: ./cr.yaml
  cycles: 3

  expect:
    noErrors: true
    ops:
      - cycle: 1
        verb: create
        resource: statefulsets
        name: my-db-primary

      - cycle: 1
        verb: create
        resource: configmaps
        name: my-db-routing

      - cycle: 1
        verb: create
        resource: statefulsets
        name: my-db-replicas
