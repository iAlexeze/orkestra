apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: databases.demo.orkestra.io
spec:
  group: demo.orkestra.io
  scope: Namespaced
  names:
    plural: databases
    singular: database
    kind: Database
    shortNames: [db]
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Read-Replicas
          type: string
          jsonPath: .status.readReplicas
        - name: Next-Maintenance
          type: string
          jsonPath: .status.nextMaintenance
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  description: Database container image
                readReplicas:
                  type: integer
                  minimum: 0
                  default: 3
                  description: Number of read replicas outside the maintenance window
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
