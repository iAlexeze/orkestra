apiVersion: orkestra.orkspace.io/v1
kind: Komposer
metadata:
  name: temporal-komposer
  description: >
    Composes all three temporal katalogs into one runtime.
    Manages DevEnvironment, Database, and CDNEdge CRDs from a single operator instance.

imports:
  files:
    - ./01-business-hours/katalog.yaml
    - ./02-maintenance-window/katalog.yaml
    - ./03-regional-peak/katalog.yaml
    - ./04-autoscale/katalog.yaml
