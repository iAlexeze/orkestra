---
apiVersion: v1
data:
  katalog.yaml: |
    apiVersion: orkestra.orkspace.io/v1
    kind: Katalog
    metadata:
        name: cronjob-operator
        description: |
            Multi-version CronJob operator. v1 uses a cron string. v2 uses a structured schedule object. Conversion is lossless and bidirectional, declared entirely in YAML using cron notes. No Go. No hooks. No separate conversion webhook. One process. One Katalog.
    spec:
        crds:
            cronjob-v1:
                description: 'CronJob CRD, GVK: /, Kind='
                mode: dynamic
                apiTypes:
                    group: demo.orkestra.io
                    version: v1
                    kind: CronJob
                    plural: cronjobs
                    apiPath: /apis
                workers: 2
                resync: 30s
                operatorBox:
                    default: true
                    onCreate:
                        cronJobs:
                            - name: '{{ .metadata.name }}'
                              schedule: '{{ .spec.schedule }}'
                              image: '{{ .spec.image }}'
                              reconcile: true
                    status:
                        fields:
                            - path: phase
                              value: '{{ ternary .spec.suspend "Suspended" "Active" }}'
                            - path: scheduleExpression
                              value: '{{ .spec.schedule }}'
                            - path: image
                              value: '{{ .spec.image }}'
                queue:
                    maxQueueDepth: 100
                    degradeThreshold: 100
                ignoreStatusPatch: true
                conversion:
                    participant: true
                warnings: []
            cronjob-v2:
                description: 'CronJob CRD, GVK: /, Kind='
                mode: dynamic
                apiTypes:
                    group: demo.orkestra.io
                    version: v2
                    kind: CronJob
                    plural: cronjobs
                    apiPath: /apis
                workers: 5
                resync: 30s
                operatorBox:
                    default: true
                    onCreate:
                        cronJobs:
                            - name: '{{ .metadata.name }}'
                              schedule: '{{ cronFromAny .spec.schedule }}'
                              image: '{{ .spec.image }}'
                              reconcile: true
                    onReconcile:
                        cronJobs:
                            - name: '{{ .metadata.name }}'
                              schedule: '{{ cronFromAny .spec.schedule }}'
                              image: '{{ .spec.image }}'
                              reconcile: true
                              suspend: '{{ .spec.suspend }}'
                              successfulJobsHistoryLimit: '{{ .spec.successfulJobsHistoryLimit }}'
                              failedJobsHistoryLimit: '{{ .spec.failedJobsHistoryLimit }}'
                    status:
                        fields:
                            - path: phase
                              value: '{{ boolTernary .spec.suspend "Suspended" "Active" }}'
                            - path: scheduleExpression
                              value: '{{ cronFromAny .spec.schedule }}'
                            - path: scheduleDescription
                              value: '{{ cronDescribe .spec.schedule }}'
                            - path: image
                              value: '{{ .spec.image }}'
                            - path: concurrencyPolicy
                              value: '{{ .spec.concurrencyPolicy }}'
                            - path: lastScheduleTime
                              value: '{{ default .children.cronjob.status.lastScheduleTime "" }}'
                            - path: nextScheduleTime
                              value: '{{ default .children.cronjob.status.nextScheduleTime "" }}'
                queue:
                    maxQueueDepth: 100
                    degradeThreshold: 100
                ignoreStatusPatch: true
                conversion:
                    storageVersion: v1
                    paths:
                        - from: v1
                          to: v2
                          spec:
                            concurrencyPolicy: '{{ default .spec.concurrencyPolicy "Allow" }}'
                            failedJobsHistoryLimit: '{{ default .spec.failedJobsHistoryLimit 1 }}'
                            image: '{{ .spec.image }}'
                            schedule: '{{ cronToMap .spec.schedule }}'
                            startingDeadlineSeconds: '{{ .spec.startingDeadlineSeconds }}'
                            successfulJobsHistoryLimit: '{{ default .spec.successfulJobsHistoryLimit 3 }}'
                            suspend: '{{ default .spec.suspend false }}'
                        - from: v2
                          to: v1
                          spec:
                            concurrencyPolicy: '{{ default .spec.concurrencyPolicy "Allow" }}'
                            failedJobsHistoryLimit: '{{ default .spec.failedJobsHistoryLimit 1 }}'
                            image: '{{ .spec.image }}'
                            schedule: '{{ cronFromAny .spec.schedule }}'
                            startingDeadlineSeconds: '{{ .spec.startingDeadlineSeconds }}'
                            successfulJobsHistoryLimit: '{{ default .spec.successfulJobsHistoryLimit 3 }}'
                            suspend: '{{ default .spec.suspend false }}'
                    updateCRD: true
                warnings: []
    security:
        deletionProtection:
            enabled: true
        conversion:
            enabled: true
    gateway:
        endpoint: http://orkestra-gateway:8080
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/name: orkestra
    app.kubernetes.io/tag: orkestra-internal
    orkestra.io/deletion-protection: "true"
  name: orkestra-katalog
  namespace: orkestra-system

