# v1 CR — classic cron string format
# Orkestra converts this to v2 before storage.
# Read it back with either version:
#   kubectl get cronjobs.v1.demo.orkestra.io print-hello
#   kubectl get cronjobs.v2.demo.orkestra.io print-hello
apiVersion: demo.orkestra.io/v1
kind: CronJob
metadata:
  name: print-hello-v1
  namespace: default
spec:
  schedule: "*/1 * * * *"   # every minute — classic cron string
  image: busybox:1.36
  concurrencyPolicy: Allow
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
