apiVersion: orkestra.orkspace.io/v1
kind: E2E
metadata:
  name: namespace-provisioner-motif-profiles-e2e
  description: >
    End-to-end test for the motif-profiles namespace provisioner. Applies a
    NamespaceClaim with tier: medium and asserts all twelve managed resources
    are created — all six profile classes resolved from the tenant-policies
    motif with no profiles: block in the Katalog itself.

spec:
  katalog: ./katalog.yaml
  crd: ../crd.yaml
  cr: ./cr.yaml
  setup:
    - ../setup.yaml

  cluster:
    provider: kind
    name: ork-e2e-nsp
    reuse: false

  expect:
    - name: NamespaceClaim created
      after: cr-applied
      timeout: 30s
      commands:
        - run: kubectl get namespaceclaims.provisioner.orkestra.io team-delta-claim
          exitCode: 0

    - name: Namespace provisioned
      after: cr-applied
      timeout: 60s
      resources:
        - kind: Namespace
          name: team-delta

    - name: ServiceAccount created
      after: cr-applied
      timeout: 60s
      resources:
        - kind: ServiceAccount
          name: delta-operator
          namespace: team-delta

    - name: Three NetworkPolicies from tenant-policies motif
      after: cr-applied
      timeout: 60s
      resources:
        - kind: NetworkPolicy
          name: delta-deny-all
          namespace: team-delta
        - kind: NetworkPolicy
          name: delta-allow-dns
          namespace: team-delta
        - kind: NetworkPolicy
          name: delta-allow-monitoring
          namespace: team-delta

    - name: ResourceQuota from org-medium profile via motif
      after: cr-applied
      timeout: 60s
      resources:
        - kind: ResourceQuota
          name: delta-quota
          namespace: team-delta

    - name: org-medium expands to 25 pods
      after: cr-applied
      timeout: 60s
      commands:
        - run: kubectl get resourcequota delta-quota -n team-delta -o jsonpath='{.spec.hard.pods}'
          outputContains: "25"

    - name: LimitRange from org-container-defaults profile via motif
      after: cr-applied
      timeout: 60s
      resources:
        - kind: LimitRange
          name: delta-container-limits
          namespace: team-delta

    - name: Deployment with org-safe rolling update profile via motif
      after: cr-applied
      timeout: 90s
      resources:
        - kind: Deployment
          name: delta-ns-agent
          namespace: team-delta

    - name: HPA with org-conservative behavior profile via motif
      after: cr-applied
      timeout: 60s
      resources:
        - kind: HorizontalPodAutoscaler
          name: delta-ns-agent-hpa
          namespace: team-delta

    - name: PDB with org-at-least-one behavior profile via motif
      after: cr-applied
      timeout: 60s
      resources:
        - kind: PodDisruptionBudget
          name: delta-ns-agent-pdb
          namespace: team-delta

    - name: ClusterRole and ClusterRoleBinding from tenant-rbac motif
      after: cr-applied
      timeout: 60s
      resources:
        - kind: ClusterRole
          name: delta-ns-admin
        - kind: ClusterRoleBinding
          name: delta-ns-admin-binding

    - name: NamespaceClaim removed
      after: cr-deleted
      timeout: 60s
      resources:
        - kind: NamespaceClaim
          name: team-delta-claim
          count: 0

    - name: Namespace removed
      after: cr-deleted
      timeout: 90s
      resources:
        - kind: Namespace
          name: team-delta
          count: 0
