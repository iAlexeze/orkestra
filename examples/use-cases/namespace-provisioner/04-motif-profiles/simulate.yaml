apiVersion: orkestra.orkspace.io/v1
kind: Simulate
metadata:
  name: namespace-provisioner-motif-profiles-sim
  description: >
    Verify that profiles imported via the tenant-policies motif are resolved
    correctly at reconcile time — all six classes exercised with no profiles:
    block in the Katalog itself.

spec:
  katalog: ./katalog.yaml
  cr: ./cr.yaml
  cycles: 3

  expect:
    steady: true
    ops:
      - cycle: 1
        verb: create
        resource: namespaces
        name: team-delta

      - cycle: 1
        verb: create
        resource: serviceaccounts
        name: delta-operator

      - cycle: 1
        verb: apply
        resource: networkpolicies
        name: delta-deny-all

      - cycle: 1
        verb: apply
        resource: networkpolicies
        name: delta-allow-dns

      - cycle: 1
        verb: apply
        resource: networkpolicies
        name: delta-allow-monitoring

      - cycle: 1
        verb: apply
        resource: resourcequotas
        name: delta-quota

      - cycle: 1
        verb: apply
        resource: limitranges
        name: delta-container-limits

      - cycle: 1
        verb: apply
        resource: deployments
        name: delta-ns-agent

      - cycle: 1
        verb: apply
        resource: horizontalpodautoscalers
        name: delta-ns-agent-hpa

      - cycle: 1
        verb: apply
        resource: poddisruptionbudgets
        name: delta-ns-agent-pdb

      - cycle: 1
        verb: apply
        resource: clusterroles
        name: delta-ns-admin

      - cycle: 1
        verb: apply
        resource: clusterrolebindings
        name: delta-ns-admin-binding
