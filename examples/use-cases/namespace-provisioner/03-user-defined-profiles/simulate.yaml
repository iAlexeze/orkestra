apiVersion: orkestra.orkspace.io/v1
kind: Simulate
metadata:
  name: namespace-provisioner-user-profiles-sim
  description: >
    Verify that a NamespaceClaim provisions all resources in cycle 1 using
    user-defined profiles for all six profile classes (networkPolicies,
    resourceQuotas, limitRanges, hpa, pdb, rollingUpdate).

spec:
  katalog: ./katalog.yaml
  cr: ./cr.yaml
  cycles: 3

  expect:
    steady: true
    ops:
      - cycle: 1
        verb: create
        resource: namespaces
        name: team-gamma

      - cycle: 1
        verb: create
        resource: serviceaccounts
        name: gamma-operator

      - cycle: 1
        verb: create
        resource: networkpolicies
        name: gamma-deny-all

      - cycle: 1
        verb: create
        resource: networkpolicies
        name: gamma-allow-dns

      - cycle: 1
        verb: create
        resource: networkpolicies
        name: gamma-allow-monitoring

      - cycle: 1
        verb: create
        resource: resourcequotas
        name: gamma-quota

      - cycle: 1
        verb: create
        resource: limitranges
        name: gamma-container-limits

      - cycle: 1
        verb: create
        resource: deployments
        name: gamma-ns-agent

      - cycle: 1
        verb: create
        resource: horizontalpodautoscalers
        name: gamma-ns-agent-hpa

      - cycle: 1
        verb: create
        resource: poddisruptionbudgets
        name: gamma-ns-agent-pdb

      - cycle: 1
        verb: create
        resource: clusterroles
        name: gamma-ns-admin

      - cycle: 1
        verb: create
        resource: clusterrolebindings
        name: gamma-ns-admin-binding
