---
apiVersion: v1
data:
  katalog.yaml: |
    apiVersion: orkestra.orkspace.io/v1
    kind: Katalog
    metadata:
        name: namespace-provisioner-user-profiles
        description: |
            Namespace Provisioner 03 — all six user-defined profile classes in one place. Demonstrates that every profile class (networkPolicies, resourceQuotas, limitRanges, hpa, pdb, rollingUpdate) can be declared and resolved from the katalog's own profiles: block instead of using Orkestra built-ins.
            The RBAC layer comes from the shared tenant-rbac motif. Network isolation is defined here as user profiles, not built-ins.
        version: v1.0.0
        author: orkspace
        tags:
            - namespace
            - networkpolicy
            - resourcequota
            - limitrange
            - hpa
            - pdb
            - rollingupdate
            - user-defined-profiles
            - multi-tenancy
    spec:
        crds:
            namespaceclaim:
                katalogName: namespace-provisioner-user-profiles
                katalogNamespace: default
                katalogDescription: |
                    Namespace Provisioner 03 — all six user-defined profile classes in one place. Demonstrates that every profile class (networkPolicies, resourceQuotas, limitRanges, hpa, pdb, rollingUpdate) can be declared and resolved from the katalog's own profiles: block instead of using Orkestra built-ins.
                    The RBAC layer comes from the shared tenant-rbac motif. Network isolation is defined here as user profiles, not built-ins.
                katalogVersion: v1.0.0
                description: 'NamespaceClaim CRD, GVK: provisioner.orkestra.io/v1, Kind=NamespaceClaim'
                mode: dynamic
                apiTypes:
                    group: provisioner.orkestra.io
                    version: v1
                    kind: NamespaceClaim
                    plural: namespaceclaims
                    apiPath: /apis
                crFiles:
                    - /home/alex_eze/orkestra/examples/use-cases/namespace-provisioner/03-user-defined-profiles/cr.yaml
                setup:
                    apply:
                        - path: /home/alex_eze/orkestra/examples/use-cases/namespace-provisioner/setup.yaml
                    wait:
                        - kind: Secret
                          name: database-credentials
                          namespace: platform
                          timeout: 15s
                workers: 2
                resync: 1m0s
                operatorBox:
                    onCreate:
                        deployments:
                            - name: '{{ .spec.team }}-ns-agent'
                              image: orkspace/ns-agent:v1
                              replicas: "2"
                              namespace: '{{ .spec.targetNamespace }}'
                              labels:
                                - key: team
                                  value: '{{ .spec.team }}'
                                - key: app
                                  value: ns-agent
                                - key: managed-by
                                  value: orkestra
                              reconcile: true
                              rollingUpdate:
                                profile: org-safe
                        secrets:
                            - name: registry-credentials
                              fromSecret: registry-credentials
                              fromNamespace: platform
                              toNamespaces:
                                - '{{ .spec.targetNamespace }}'
                              reconcile: true
                        serviceAccounts:
                            - name: '{{ .spec.owner }}'
                              namespace: '{{ .spec.targetNamespace }}'
                              labels:
                                - key: team
                                  value: '{{ .spec.team }}'
                                - key: managed-by
                                  value: orkestra
                              reconcile: true
                        hpa:
                            - name: '{{ .spec.team }}-ns-agent-hpa'
                              namespace: '{{ .spec.targetNamespace }}'
                              scaleTargetRef:
                                apiVersion: apps/v1
                                kind: Deployment
                                name: '{{ .spec.team }}-ns-agent'
                              minReplicas: "2"
                              maxReplicas: "8"
                              behavior:
                                profile: org-conservative
                              labels:
                                - key: team
                                  value: '{{ .spec.team }}'
                                - key: managed-by
                                  value: orkestra
                              reconcile: true
                        pdb:
                            - name: '{{ .spec.team }}-ns-agent-pdb'
                              namespace: '{{ .spec.targetNamespace }}'
                              selector:
                                app: ns-agent
                                team: '{{ .spec.team }}'
                              labels:
                                - key: team
                                  value: '{{ .spec.team }}'
                                - key: managed-by
                                  value: orkestra
                              behavior:
                                profile: org-at-least-one
                              reconcile: true
                        namespaces:
                            - name: '{{ .spec.targetNamespace }}'
                              labels:
                                - key: team
                                  value: '{{ .spec.team }}'
                                - key: managed-by
                                  value: orkestra
                              reconcile: true
                        limitRanges:
                            - name: '{{ .spec.team }}-container-limits'
                              namespace: '{{ .spec.targetNamespace }}'
                              profile: org-container-defaults
                              labels:
                                - key: team
                                  value: '{{ .spec.team }}'
                                - key: managed-by
                                  value: orkestra
                              reconcile: true
                        resourceQuotas:
                            - name: '{{ .spec.team }}-quota'
                              namespace: '{{ .spec.targetNamespace }}'
                              labels:
                                - key: team
                                  value: '{{ .spec.team }}'
                                - key: managed-by
                                  value: orkestra
                              reconcile: true
                              profile: '{{ printf "org-%s" .spec.tier }}'
                        networkPolicies:
                            - name: '{{ .spec.team }}-deny-all'
                              namespace: '{{ .spec.targetNamespace }}'
                              labels:
                                - key: team
                                  value: '{{ .spec.team }}'
                                - key: managed-by
                                  value: orkestra
                              profile: org-deny-all
                              reconcile: true
                            - name: '{{ .spec.team }}-allow-dns'
                              namespace: '{{ .spec.targetNamespace }}'
                              labels:
                                - key: team
                                  value: '{{ .spec.team }}'
                                - key: managed-by
                                  value: orkestra
                              profile: org-allow-dns-egress
                              reconcile: true
                            - name: '{{ .spec.team }}-allow-monitoring'
                              namespace: '{{ .spec.targetNamespace }}'
                              labels:
                                - key: team
                                  value: '{{ .spec.team }}'
                                - key: managed-by
                                  value: orkestra
                              profile: org-allow-monitoring
                              reconcile: true
                    onReconcile:
                        clusterRoles:
                            - name: '{{ .spec.team }}-ns-admin'
                              labels:
                                - key: team
                                  value: '{{ .spec.team }}'
                                - key: managed-by
                                  value: myorg
                              rules:
                                - apiGroups:
                                    - ""
                                    - apps
                                    - batch
                                  resources:
                                    - pods
                                    - deployments
                                    - replicasets
                                    - statefulsets
                                    - daemonsets
                                    - services
                                    - configmaps
                                    - secrets
                                    - serviceaccounts
                                    - jobs
                                    - cronjobs
                                  verbs:
                                    - '*'
                              reconcile: true
                        clusterRoleBindings:
                            - name: '{{ .spec.team }}-ns-admin-binding'
                              labels:
                                - key: team
                                  value: '{{ .spec.team }}'
                                - key: managed-by
                                  value: myorg
                              roleRef:
                                name: '{{ .spec.team }}-ns-admin'
                                kind: ClusterRole
                              subjects:
                                - kind: ServiceAccount
                                  name: '{{ .spec.owner }}'
                                  namespace: '{{ .spec.ownerNamespace }}'
                              reconcile: true
                    status:
                        fields:
                            - path: phase
                              value: Provisioning
                              when:
                                - field: status.phase
                                  operator: notExists
                            - path: phase
                              value: Ready
                              when:
                                - field: '{{ resourceExists .children.namespaces }}'
                                  equals: "true"
                            - path: namespace
                              value: '{{ .spec.targetNamespace }}'
                            - path: team
                              value: '{{ .spec.team }}'
                queue:
                    maxDepth: 100
                    failureThreshold: 100
                warnings: []
    security: {}
    profiles:
        networkPolicies:
            - name: org-deny-all
              description: Block all ingress and egress (policyTypes makes it explicit)
              policyTypes:
                - Ingress
                - Egress
            - name: org-allow-dns-egress
              description: Allow UDP/TCP port 53 so pods can resolve DNS
              egress:
                - ports:
                    - protocol: UDP
                      port: "53"
                    - protocol: TCP
                      port: "53"
              policyTypes:
                - Egress
            - name: org-allow-monitoring
              description: Allow ingress from the platform monitoring namespace
              ingress:
                - from:
                    - namespaceSelector:
                        team: platform
              policyTypes:
                - Ingress
        resourceQuotas:
            - name: org-small
              description: Minimal allocation for prototype or CI namespaces
              hard:
                cpu: "1"
                limits.cpu: "1"
                limits.memory: 2Gi
                memory: 2Gi
                pods: "10"
                requests.cpu: 500m
                requests.memory: 1Gi
            - name: org-medium
              description: Standard team namespace allocation
              hard:
                cpu: "4"
                limits.cpu: "4"
                limits.memory: 8Gi
                memory: 8Gi
                pods: "25"
                requests.cpu: "2"
                requests.memory: 4Gi
            - name: org-large
              description: High-traffic or data-intensive team namespaces
              hard:
                cpu: "12"
                limits.cpu: "12"
                limits.memory: 24Gi
                memory: 24Gi
                pods: "60"
                requests.cpu: "6"
                requests.memory: 12Gi
        limitRanges:
            - name: org-container-defaults
              description: Default CPU/memory requests and limits for containers that do not declare them
              limits:
                - type: Container
                  max:
                    cpu: "4"
                    memory: 8Gi
                  default:
                    cpu: 500m
                    memory: 512Mi
                  defaultRequest:
                    cpu: 100m
                    memory: 128Mi
        hpa:
            - name: org-conservative
              description: Conservative scale-down for stateful or slow-starting services
              targetCPUUtilizationPercentage: "70"
              behavior:
                scaleDown:
                    stabilizationWindowSeconds: 300
                    policies:
                        - type: Pods
                          value: 1
                          periodSeconds: 60
            - name: org-burst
              description: Faster scale-down for stateless services that recover quickly
              targetCPUUtilizationPercentage: "60"
              behavior:
                scaleDown:
                    stabilizationWindowSeconds: 60
                    policies:
                        - type: Percent
                          value: 20
                          periodSeconds: 30
        pdb:
            - name: org-at-least-one
              description: Always keep at least one pod available during drains or rollouts
              minAvailable: "1"
            - name: org-majority
              description: Keep the majority of pods available (suitable for quorum workloads)
              minAvailable: 51%
        rollingUpdate:
            - name: org-safe
              description: Zero-downtime rollout — adds new pod before removing the old one
              maxSurge: "1"
              maxUnavailable: "0"
            - name: org-fast
              description: Fast rollout — tolerates some disruption to replace pods quickly
              maxSurge: 25%
              maxUnavailable: 25%
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/name: orkestra
    app.kubernetes.io/tag: orkestra-internal
    orkestra.io/deletion-protection: "true"
  name: orkestra-katalog
  namespace: orkestra-system

