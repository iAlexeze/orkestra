# https://orkestra.sh/docs/reference/schema/e2e/
apiVersion: orkestra.orkspace.io/v1
kind: E2E
metadata:
  name: namespace-provisioner-user-defined-profiles-e2e
  description: >
    End-to-end test for the user-defined profiles namespace provisioner. Applies
    a NamespaceClaim with tier: medium and asserts all twelve managed resources
    are created — all six profile classes exercised from profiles declared in
    the Katalog's own profiles: block.

spec:
  katalog: ./katalog.yaml
  crd: ../crd.yaml
  cr: ./cr.yaml
  setup:
    - ../setup.yaml

  cluster:
    provider: kind
    name: ork-e2e-nsp
    reuse: false

  expect:
    - name: NamespaceClaim created
      after: cr-applied
      timeout: 30s
      commands:
        - run: kubectl get namespaceclaims.provisioner.orkestra.io team-gamma-claim
          exitCode: 0

    - name: Namespace provisioned
      after: cr-applied
      timeout: 60s
      resources:
        - kind: Namespace
          name: team-gamma

    - name: ServiceAccount created
      after: cr-applied
      timeout: 60s
      resources:
        - kind: ServiceAccount
          name: gamma-operator
          namespace: team-gamma

    - name: Three NetworkPolicies from user-defined profiles
      after: cr-applied
      timeout: 60s
      resources:
        - kind: NetworkPolicy
          name: gamma-deny-all
          namespace: team-gamma
        - kind: NetworkPolicy
          name: gamma-allow-dns
          namespace: team-gamma
        - kind: NetworkPolicy
          name: gamma-allow-monitoring
          namespace: team-gamma

    - name: ResourceQuota from org-medium profile
      after: cr-applied
      timeout: 60s
      resources:
        - kind: ResourceQuota
          name: gamma-quota
          namespace: team-gamma

    - name: org-medium expands to 25 pods
      after: cr-applied
      timeout: 60s
      kubectl:
        get:
          - kind: ResourceQuota
            name: gamma-quota
            namespace: team-gamma
            field: .spec.hard.pods
            equals: "25"

    - name: LimitRange from org-container-defaults profile
      after: cr-applied
      timeout: 60s
      resources:
        - kind: LimitRange
          name: gamma-container-limits
          namespace: team-gamma

    - name: Deployment with org-safe rolling update profile
      after: cr-applied
      timeout: 90s
      resources:
        - kind: Deployment
          name: gamma-ns-agent
          namespace: team-gamma

    - name: HPA with org-conservative behavior profile
      after: cr-applied
      timeout: 60s
      resources:
        - kind: HorizontalPodAutoscaler
          name: gamma-ns-agent-hpa
          namespace: team-gamma

    - name: PDB with org-at-least-one behavior profile
      after: cr-applied
      timeout: 60s
      resources:
        - kind: PodDisruptionBudget
          name: gamma-ns-agent-pdb
          namespace: team-gamma

    - name: ClusterRole and ClusterRoleBinding from tenant-rbac motif
      after: cr-applied
      timeout: 60s
      resources:
        - kind: ClusterRole
          name: gamma-ns-admin
        - kind: ClusterRoleBinding
          name: gamma-ns-admin-binding

    - name: NamespaceClaim removed
      after: cr-deleted
      timeout: 60s
      resources:
        - kind: NamespaceClaim
          name: team-gamma-claim
          count: 0

    - name: Namespace removed
      after: cr-deleted
      timeout: 90s
      resources:
        - kind: Namespace
          name: team-gamma
          count: 0
