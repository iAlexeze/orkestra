apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: namespaceclaims.provisioner.orkestra.io
spec:
  group: provisioner.orkestra.io
  scope: Cluster
  names:
    plural: namespaceclaims
    singular: namespaceclaim
    kind: NamespaceClaim
    shortNames: [nsc]
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Namespace
          type: string
          jsonPath: .spec.targetNamespace
        - name: Team
          type: string
          jsonPath: .spec.team
        - name: Tier
          type: string
          jsonPath: .spec.tier
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [targetNamespace, team, owner]
              properties:
                targetNamespace:
                  type: string
                  description: Name of the namespace to provision
                team:
                  type: string
                  description: Team identifier — used for labels and RBAC naming
                owner:
                  type: string
                  description: ServiceAccount name that receives admin access to the namespace
                ownerNamespace:
                  type: string
                  description: Namespace the owner ServiceAccount lives in
                  default: default
                tier:
                  type: string
                  description: >
                    ResourceQuota preset — small, medium, large, or xlarge.
                    Used by the 02-profiles example. When omitted, set explicit limits.
                  enum: [small, medium, large, xlarge]
                limits:
                  type: object
                  description: Explicit resource limits — used by the 01-explicit example
                  properties:
                    maxPods:
                      type: integer
                      description: Maximum number of pods in the namespace
                      default: 20
                    cpu:
                      type: string
                      description: Total CPU request ceiling (e.g. "4")
                      default: "4"
                    memory:
                      type: string
                      description: Total memory request ceiling (e.g. "8Gi")
                      default: "8Gi"
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
