apiVersion: orkestra.orkspace.io/v1
kind: Simulate
metadata:
  name: namespace-provisioner-explicit-sim
  description: >
    Verify that a NamespaceClaim with explicit limits provisions all expected
    resources in cycle 1: Namespace, ServiceAccount, ResourceQuota, two
    NetworkPolicies, ClusterRole, and ClusterRoleBinding.

spec:
  katalog: ./katalog.yaml
  cr: ./cr.yaml
  cycles: 3

  expect:
    steady: true
    ops:
      - cycle: 1
        verb: create
        resource: namespaces
        name: team-alpha

      - cycle: 1
        verb: create
        resource: serviceaccounts
        name: alpha-operator

      - cycle: 1
        verb: create
        resource: resourcequotas
        name: alpha-quota

      - cycle: 1
        verb: create
        resource: networkpolicies
        name: alpha-deny-all

      - cycle: 1
        verb: create
        resource: networkpolicies
        name: alpha-allow-dns

      - cycle: 1
        verb: create
        resource: clusterroles
        name: alpha-ns-admin

      - cycle: 1
        verb: create
        resource: clusterrolebindings
        name: alpha-ns-admin-binding
