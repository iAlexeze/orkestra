apiVersion: orkestra.orkspace.io/v1
kind: E2E
metadata:
  name: namespace-provisioner-explicit-e2e
  description: >
    End-to-end test for the explicit namespace provisioner. Applies a
    NamespaceClaim and asserts all seven managed resources are created,
    then asserts they are removed after CR deletion.

spec:
  katalog: ./katalog.yaml
  crd: ../crd.yaml
  cr: ./cr.yaml
  setup:
    - ../setup.yaml

  cluster:
    provider: kind
    name: ork-e2e-nsp
    reuse: false

  expect:
    - name: NamespaceClaim created
      after: cr-applied
      timeout: 30s
      commands:
        - run: kubectl get namespaceclaims.provisioner.orkestra.io team-alpha-claim
          exitCode: 0

    - name: Namespace provisioned
      after: cr-applied
      timeout: 60s
      resources:
        - kind: Namespace
          name: team-alpha

    - name: ServiceAccount created in target namespace
      after: cr-applied
      timeout: 60s
      resources:
        - kind: ServiceAccount
          name: alpha-operator
          namespace: team-alpha

    - name: Image pull secret copied to namespace
      after: cr-applied
      timeout: 60s
      resources:
        - kind: Secret
          name: registry-credentials
          namespace: team-alpha

    - name: ResourceQuota applied
      after: cr-applied
      timeout: 60s
      resources:
        - kind: ResourceQuota
          name: alpha-quota
          namespace: team-alpha

    - name: NetworkPolicies applied
      after: cr-applied
      timeout: 60s
      resources:
        - kind: NetworkPolicy
          name: alpha-deny-all
          namespace: team-alpha
        - kind: NetworkPolicy
          name: alpha-allow-dns
          namespace: team-alpha

    - name: ClusterRole created
      after: cr-applied
      timeout: 60s
      resources:
        - kind: ClusterRole
          name: alpha-ns-admin

    - name: ClusterRoleBinding created
      after: cr-applied
      timeout: 60s
      resources:
        - kind: ClusterRoleBinding
          name: alpha-ns-admin-binding

    - name: ResourceQuota has correct pod limit
      after: cr-applied
      timeout: 60s
      commands:
        - run: kubectl get resourcequota alpha-quota -n team-alpha -o jsonpath='{.spec.hard.pods}'
          outputContains: "20"

    - name: NamespaceClaim removed
      after: cr-deleted
      timeout: 60s
      resources:
        - kind: NamespaceClaim
          name: team-alpha-claim
          count: 0

    - name: Namespace removed
      after: cr-deleted
      timeout: 90s
      resources:
        - kind: Namespace
          name: team-alpha
          count: 0
