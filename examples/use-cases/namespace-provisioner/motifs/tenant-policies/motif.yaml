apiVersion: orkestra.orkspace.io/v1
kind: Motif
metadata:
  name: tenant-policies
  version: v1.0.0
  description: >
    All six user-defined profile classes for a provisioned tenant namespace.
    Import this motif to get org-standard network policies, quota tiers, container
    limits, HPA behavior, disruption budgets, and rollout strategies without
    declaring them in every Katalog.
  author: orkspace
  license: Apache-2.0
  tags:
    - profiles
    - networkpolicy
    - resourcequota
    - limitrange
    - hpa
    - pdb
    - rollingupdate
    - multi-tenancy

inputs:
  - name: namespace
    description: Target namespace to apply policies to
    required: true

  - name: team
    description: Team label applied to all resources
    required: true

profiles:
  networkPolicies:
    - name: org-deny-all
      description: Block all ingress and egress — start here, add back what you need
      policyTypes: [Ingress, Egress]

    - name: org-allow-dns-egress
      description: Allow UDP/TCP port 53 so pods can resolve DNS
      egress:
        - ports:
            - port: 53
              protocol: UDP
            - port: 53
              protocol: TCP
      policyTypes: [Egress]

    - name: org-allow-monitoring
      description: Allow ingress from the platform monitoring namespace
      ingress:
        - from:
            - namespaceSelector:
                team: platform
      policyTypes: [Ingress]

  resourceQuotas:
    - name: org-small
      description: Prototype and CI namespaces
      hard:
        pods: "10"
        cpu: "1"
        memory: "2Gi"
        requests.cpu: "500m"
        requests.memory: "1Gi"
        limits.cpu: "1"
        limits.memory: "2Gi"

    - name: org-medium
      description: Standard team namespace
      hard:
        pods: "25"
        cpu: "4"
        memory: "8Gi"
        requests.cpu: "2"
        requests.memory: "4Gi"
        limits.cpu: "4"
        limits.memory: "8Gi"

    - name: org-large
      description: High-traffic or data-intensive namespaces
      hard:
        pods: "60"
        cpu: "12"
        memory: "24Gi"
        requests.cpu: "6"
        requests.memory: "12Gi"
        limits.cpu: "12"
        limits.memory: "24Gi"

  limitRanges:
    - name: org-container-defaults
      description: Default CPU and memory for containers that do not declare them
      limits:
        - type: Container
          default:
            cpu: 500m
            memory: 512Mi
          defaultRequest:
            cpu: 100m
            memory: 128Mi
          max:
            cpu: "4"
            memory: 8Gi

  hpa:
    - name: org-conservative
      description: 70% CPU target with a 5-minute scale-down stabilization window
      targetCPUUtilizationPercentage: "70"
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Pods
              value: 1
              periodSeconds: 60

    - name: org-burst
      description: 60% CPU target with fast scale-down for stateless services
      targetCPUUtilizationPercentage: "60"
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 60
          policies:
            - type: Percent
              value: 20
              periodSeconds: 30

  pdb:
    - name: org-at-least-one
      description: Always keep at least one pod available
      minAvailable: "1"

    - name: org-majority
      description: Keep the majority of pods available (quorum workloads)
      minAvailable: "51%"

  rollingUpdate:
    - name: org-safe
      description: Zero-downtime rollout — adds before removing
      maxSurge: "1"
      maxUnavailable: "0"

    - name: org-fast
      description: Fast rollout — tolerates brief capacity reduction
      maxSurge: "25%"
      maxUnavailable: "25%"

resources:
  networkPolicies:
    - name: "{{ .inputs.team }}-deny-all"
      namespace: "{{ .inputs.namespace }}"
      podSelector: {}
      profile: org-deny-all
      labels:
        - key: team
          value: "{{ .inputs.team }}"
        - key: managed-by
          value: orkestra
      reconcile: true

    - name: "{{ .inputs.team }}-allow-dns"
      namespace: "{{ .inputs.namespace }}"
      podSelector: {}
      profile: org-allow-dns-egress
      labels:
        - key: team
          value: "{{ .inputs.team }}"
        - key: managed-by
          value: orkestra
      reconcile: true

    - name: "{{ .inputs.team }}-allow-monitoring"
      namespace: "{{ .inputs.namespace }}"
      podSelector: {}
      profile: org-allow-monitoring
      labels:
        - key: team
          value: "{{ .inputs.team }}"
        - key: managed-by
          value: orkestra
      reconcile: true
