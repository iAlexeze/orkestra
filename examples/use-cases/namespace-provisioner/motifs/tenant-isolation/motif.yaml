apiVersion: orkestra.orkspace.io/v1
kind: Motif
metadata:
  name: tenant-isolation
  version: v1.0.0
  description: >
    NetworkPolicy layer for a provisioned tenant namespace.
    Applies deny-all (blocks all ingress and egress by default) then
    adds a second policy that opens port 53 so pods can resolve DNS.
    Import this motif whenever a namespace needs hard network isolation
    without breaking service discovery.
  author: orkspace
  license: Apache-2.0
  tags:
    - networkpolicy
    - isolation
    - security
    - multi-tenancy

inputs:
  - name: namespace
    description: Target namespace to apply the policies to
    required: true

  - name: team
    description: Team label value applied to both policies
    required: true

resources:
  networkPolicies:
    - name: "{{ .inputs.team }}-deny-all"
      namespace: "{{ .inputs.namespace }}"
      profile: deny-all
      labels:
        team: "{{ .inputs.team }}"
        managed-by: orkestra
      reconcile: true

    - name: "{{ .inputs.team }}-allow-dns"
      namespace: "{{ .inputs.namespace }}"
      profile: allow-dns-egress
      labels:
        team: "{{ .inputs.team }}"
        managed-by: orkestra
      reconcile: true
