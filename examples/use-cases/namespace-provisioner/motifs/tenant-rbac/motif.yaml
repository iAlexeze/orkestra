apiVersion: orkestra.orkspace.io/v1
kind: Motif
metadata:
  name: tenant-rbac
  version: v1.0.0
  description: >
    ClusterRole + ClusterRoleBinding that grant a ServiceAccount full admin
    access scoped to a single provisioned namespace. The role permits all
    verbs on all core and apps resources within the target namespace only.
    Import this motif alongside tenant-isolation to give a team ownership
    of their namespace without cluster-wide privileges.
  author: orkspace
  license: Apache-2.0
  tags:
    - clusterrole
    - clusterrolebinding
    - rbac
    - multi-tenancy

inputs:
  - name: team
    description: Team identifier — used in ClusterRole and ClusterRoleBinding names
    required: true

  - name: targetNamespace
    description: Namespace the ClusterRole is scoped to
    required: true

  - name: owner
    description: ServiceAccount name that receives admin access
    required: true

  - name: ownerNamespace
    description: Namespace the owner ServiceAccount lives in
    default: default

resources:
  clusterRoles:
    - name: "{{ .inputs.team }}-ns-admin"
      labels:
        team: "{{ .inputs.team }}"
        managed-by: myorg
      rules:
        - apiGroups: ["", "apps", "batch"]
          resources:
            - pods
            - deployments
            - replicasets
            - statefulsets
            - daemonsets
            - services
            - configmaps
            - secrets
            - serviceaccounts
            - jobs
            - cronjobs
          verbs: ["*"]
          resourceNames: []
      reconcile: true

  clusterRoleBindings:
    - name: "{{ .inputs.team }}-ns-admin-binding"
      labels:
        team: "{{ .inputs.team }}"
        managed-by: myorg
      roleRef:
        kind: ClusterRole
        name: "{{ .inputs.team }}-ns-admin"
      subjects:
        - kind: ServiceAccount
          name: "{{ .inputs.owner }}"
          namespace: "{{ .inputs.ownerNamespace }}"
      reconcile: true
