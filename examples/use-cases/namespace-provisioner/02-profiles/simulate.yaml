apiVersion: orkestra.orkspace.io/v1
kind: Simulate
metadata:
  name: namespace-provisioner-profiles-sim
  description: >
    Verify that a NamespaceClaim with tier: medium provisions all expected
    resources in cycle 1 using profiles. Same resource set as 01-explicit
    but the ResourceQuota hard limits come from the medium preset rather
    than inline spec values.

spec:
  katalog: ./katalog.yaml
  cr: ./cr.yaml
  cycles: 3

  expect:
    steady: true
    ops:
      - cycle: 1
        verb: create
        resource: namespaces
        name: team-beta

      - cycle: 1
        verb: create
        resource: serviceaccounts
        name: beta-operator

      - cycle: 1
        verb: create
        resource: resourcequotas
        name: beta-quota

      - cycle: 1
        verb: create
        resource: networkpolicies
        name: beta-deny-all

      - cycle: 1
        verb: create
        resource: networkpolicies
        name: beta-allow-dns

      - cycle: 1
        verb: create
        resource: clusterroles
        name: beta-ns-admin

      - cycle: 1
        verb: create
        resource: clusterrolebindings
        name: beta-ns-admin-binding
