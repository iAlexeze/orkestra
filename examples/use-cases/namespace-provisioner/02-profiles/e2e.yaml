# https://orkestra.sh/docs/reference/schema/e2e/
apiVersion: orkestra.orkspace.io/v1
kind: E2E
metadata:
  name: namespace-provisioner-profiles-e2e
  description: >
    End-to-end test for the profile-based namespace provisioner. Applies a
    NamespaceClaim with tier: medium and asserts all seven managed resources
    are created with the correct quota limits from the medium preset.

spec:
  katalog: ./katalog.yaml
  crd: ../crd.yaml
  cr: ./cr.yaml
  setup:
    - ../setup.yaml

  cluster:
    provider: kind
    name: ork-e2e-nsp
    reuse: false

  expect:
    - name: NamespaceClaim created
      after: cr-applied
      timeout: 30s
      commands:
        - run: kubectl get namespaceclaims.provisioner.orkestra.io team-beta-claim
          exitCode: 0

    - name: Namespace provisioned
      after: cr-applied
      timeout: 60s
      resources:
        - kind: Namespace
          name: team-beta

    - name: ServiceAccount created in target namespace
      after: cr-applied
      timeout: 60s
      resources:
        - kind: ServiceAccount
          name: beta-operator
          namespace: team-beta

    - name: Image pull secret copied to namespace
      after: cr-applied
      timeout: 60s
      resources:
        - kind: Secret
          name: registry-credentials
          namespace: team-beta

    - name: ResourceQuota applied from medium profile
      after: cr-applied
      timeout: 60s
      resources:
        - kind: ResourceQuota
          name: beta-quota
          namespace: team-beta

    - name: medium profile expands to 20 pods and 2 CPU request
      after: cr-applied
      timeout: 60s
      kubectl:
        get:
          - kind: ResourceQuota
            name: beta-quota
            namespace: team-beta
            field: .spec.hard.pods
            equals: "20"
          - kind: ResourceQuota
            name: beta-quota
            namespace: team-beta
            field: '.spec.hard["requests.cpu"]'
            equals: "2"

    - name: NetworkPolicies applied
      after: cr-applied
      timeout: 60s
      resources:
        - kind: NetworkPolicy
          name: beta-deny-all
          namespace: team-beta
        - kind: NetworkPolicy
          name: beta-allow-dns
          namespace: team-beta

    - name: ClusterRole and ClusterRoleBinding created
      after: cr-applied
      timeout: 60s
      resources:
        - kind: ClusterRole
          name: beta-ns-admin
        - kind: ClusterRoleBinding
          name: beta-ns-admin-binding

    - name: NamespaceClaim removed
      after: cr-deleted
      timeout: 60s
      resources:
        - kind: NamespaceClaim
          name: team-beta-claim
          count: 0

    - name: Namespace removed
      after: cr-deleted
      timeout: 90s
      resources:
        - kind: Namespace
          name: team-beta
          count: 0
