# Creates the namespace and source Secret used by this example.
# Run this before applying the CR.

---
apiVersion: v1
kind: Namespace
metadata:
  name: platform
---
# The source Secret that will be copied to team namespaces
apiVersion: v1
kind: Secret
metadata:
  name: registry-credentials
  namespace: platform
type: Opaque
stringData:
  username: "appuser"
  password: "supersecret"
