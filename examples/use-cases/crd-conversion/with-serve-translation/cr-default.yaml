---
# cr-default.yaml — pre-built CR in the structured form the serve layer produces.
# Used by: simulate.yaml, e2e.yaml (operator-side verification).
# To test serve translation end-to-end, submit intent.yaml via the gateway instead.
apiVersion: demo.orkestra.io/v1
kind: CronJob
metadata:
  name: daily-backup
  namespace: default
spec:
  schedule:
    minute: "0"
    hour: "2"
    dayOfMonth: "*"
    month: "*"
    dayOfWeek: "1-5"
  image: gcr.io/google-containers/busybox:latest
  concurrencyPolicy: Allow
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  suspend: false
