---
# Single-version CronJob CRD — Solution 3 (serve layer field translation).
#
# spec.schedule is a structured object only. The cron string lives in the
# intent payload; the serve layer fans it out before the CR ever reaches
# the API server.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: cronjobs.demo.orkestra.io
spec:
  group: demo.orkestra.io
  scope: Namespaced
  names:
    plural: cronjobs
    singular: cronjob
    kind: CronJob
    shortNames: [cj]
    categories: [orkestra]
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Schedule
          type: string
          jsonPath: .status.scheduleExpression
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Image
          type: string
          jsonPath: .status.image
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [image, schedule]
              properties:
                image:
                  type: string
                  description: Container image for the job pod

                # schedule is always structured — the serve layer handles
                # the translation from the caller's flat cron string.
                schedule:
                  type: object
                  required: [minute, hour, dayOfMonth, month, dayOfWeek]
                  properties:
                    minute:
                      type: string
                    hour:
                      type: string
                    dayOfMonth:
                      type: string
                    month:
                      type: string
                    dayOfWeek:
                      type: string

                concurrencyPolicy:
                  type: string
                  enum: [Allow, Forbid, Replace]
                  default: Allow

                suspend:
                  type: boolean
                  default: false

                successfulJobsHistoryLimit:
                  type: integer
                  default: 3

                failedJobsHistoryLimit:
                  type: integer
                  default: 1

            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
