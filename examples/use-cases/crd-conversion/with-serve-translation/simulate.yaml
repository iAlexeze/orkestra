apiVersion: orkestra.orkspace.io/v1
kind: Simulate
metadata:
  name: crd-conversion-serve-translation-sim
  description: >
    Verify the serve-translation operator — structured schedule CR produces a
    Kubernetes CronJob with the reconstructed cron expression in its schedule.

spec:
  katalog: ./katalog.yaml
  cr: ./cr-default.yaml
  cycles: 5

  expect:
    steady: true
    noErrors: true
    ops:
      - cycle: 1
        verb: apply
        resource: cronjobs
        name: daily-backup
