# https://orkestra.sh/docs/reference/schema/e2e/
apiVersion: orkestra.orkspace.io/v1
kind: E2E
metadata:
  name: crd-conversion-serve-translation-e2e
  description: >
    CronJob operator with serve layer field translation. A flat cron string
    submitted via the Gateway is fanned out to the five structured schedule
    fields before reaching the API server. Verifies both the translation
    and the resulting Kubernetes CronJob schedule.

spec:
  katalog: ./katalog.yaml
  crd: ./crd.yaml
  valuesFiles:
    - ./values.yaml

  expect:
    - name: Gateway accepts flat cron string and translates to structured spec
      timeout: 60s
      kubectl:
        port-forward:
          - service: orkestra-gateway
            namespace: orkestra-system
            port: 8080
            path: /api/v1/apply
            method: POST
            headers:
              Authorization: "Bearer ${DEV_TOKEN}"
              Content-Type: "application/json"
            body: '{"target":"cronjob-tutorial","name":"daily-backup","schedule":"0 2 * * 1-5","image":"gcr.io/google-containers/busybox:latest"}'
            statusCode: 200

    - name: Serve translation fans cron string out to structured spec fields
      timeout: 60s
      kubectl:
        get:
          - kind: cronjobs.demo.orkestra.io
            name: daily-backup
            namespace: default
            field: .spec.schedule.minute
            equals: "0"
          - kind: cronjobs.demo.orkestra.io
            name: daily-backup
            namespace: default
            field: .spec.schedule.hour
            equals: "2"
          - kind: cronjobs.demo.orkestra.io
            name: daily-backup
            namespace: default
            field: .spec.schedule.dayOfWeek
            equals: "1-5"

    - name: Invalid cron string is rejected by intent gate
      timeout: 30s
      kubectl:
        port-forward:
          - service: orkestra-gateway
            namespace: orkestra-system
            port: 8080
            path: /api/v1/apply
            method: POST
            headers:
              Authorization: "Bearer ${DEV_TOKEN}"
              Content-Type: "application/json"
            body: '{"target":"cronjob-tutorial","name":"bad-cron","schedule":"not-a-cron","image":"gcr.io/google-containers/busybox:latest"}'
            outputContains: '"accepted":false'