# Serve field config for the crd-conversion/with-serve-translation example.
# Included from katalog.yaml via serve.include.

fields:
  # ── Fanout: one cron string → five structured spec fields ─────────────────
  #
  # The caller submits:
  #   schedule: "*/5 0 * * 1"
  #
  # The serve layer writes:
  #   spec.schedule.minute:     "*/5"
  #   spec.schedule.hour:       "0"
  #   spec.schedule.dayOfMonth: "*"
  #   spec.schedule.month:      "*"
  #   spec.schedule.dayOfWeek:  "1"
  #
  # The CRD only accepts the structured form — callers never need to know.
  schedule:
    label: "Schedule (cron)"
    hint: 'Standard cron expression, e.g. "*/5 * * * *" or "0 2 * * 1-5"'
    required: true
    values:
      schedule.minute:     '{{ cronMinute .value }}'
      schedule.hour:       '{{ cronHour   .value }}'
      schedule.dayOfMonth: '{{ cronDom    .value }}'
      schedule.month:      '{{ cronMonth  .value }}'
      schedule.dayOfWeek:  '{{ cronDow    .value }}'

  image:
    label: "Image"
    hint: "Container image to run on the schedule"
    required: true

