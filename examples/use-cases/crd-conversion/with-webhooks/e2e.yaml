# https://orkestra.sh/docs/reference/schema/e2e/
apiVersion: orkestra.orkspace.io/v1
kind: E2E
metadata:
  name: crd-conversion-webhook-e2e
  description: >
    Multi-version CronJob operator with conversion webhooks. Orkestra Gateway
    handles v1 ↔ v2 schedule conversion. The proof: a v1 CR (cron string) and
    a v2 CR (structured object) both produce a Kubernetes CronJob with the
    correct normalized schedule — no Go, no webhook server to deploy.

spec:
  katalog: ./katalog.yaml
  crd: ./crd.yaml
  cr: ./cr-v1.yaml

  cluster:
    provider: kind
    name: ork-e2e
    reuse: false

  expect:
    - name: v1 CR produces Kubernetes CronJob with correct schedule
      after: cr-applied
      timeout: 60s
      kubectl:
        get:
          - kind: CronJob
            name: print-hello-v1
            namespace: default
            field: .spec.schedule
            equals: "*/1 * * * *"

    - name: Apply v2 CR
      after: cr-applied
      timeout: 30s
      commands:
        - run: kubectl apply -f cr-v2.yaml
          exitCode: 0

    - name: v2 CR also produces Kubernetes CronJobs with correct schedules
      after: cr-applied
      timeout: 60s
      kubectl:
        get:
          - kind: CronJob
            name: print-hello-v2
            namespace: default
            field: .spec.schedule
            equals: "*/1 * * * *"
          - kind: CronJob
            name: daily-backup
            namespace: default
            field: .spec.schedule
            equals: "0 2 * * 1-5"

    - name: Delete v2 CR
      after: cr-applied
      timeout: 30s
      commands:
        - run: kubectl delete -f cr-v2.yaml
          exitCode: 0

    - name: Cleanup verified (v1)
      after: cr-deleted
      timeout: 30s
      resources:
        - kind: CronJob
          name: daily-backup-string
          namespace: default
          count: 0

    - name: Cleanup verified (v2)
      after: cr-deleted
      timeout: 30s
      resources:
        - kind: CronJob
          name: daily-backup
          namespace: default
          count: 0
        - kind: CronJob
          name: print-hello-v2
          namespace: default
          count: 0
