apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: cronjobs.demo.orkestra.io
  annotations:
    orkestra.orkspace.io/pattern: cronjob
    orkestra.orkspace.io/pattern-version: "2.0.0"
    orkestra.orkspace.io/managed-by: orkestra
spec:
  group: demo.orkestra.io
  scope: Namespaced
  names:
    plural: cronjobs
    singular: cronjob
    kind: CronJob
    shortNames: [cj]

  versions:
    # ── v1 ─────────────────────────────────────────────────────────────────
    # The original API. schedule is a single cron string.
    # Served but not stored — objects are stored in v2.
    # Orkestra converts on read/write via /convert.
    - name: v1
      served: true
      storage: false
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Schedule
          type: string
          jsonPath: .spec.schedule
        - name: Image
          type: string
          jsonPath: .spec.image
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [schedule, image]
              properties:
                schedule:
                  type: string
                  description: |
                    Standard cron expression. Examples:
                      "*/5 * * * *"   — every 5 minutes
                      "0 2 * * *"     — daily at 2am
                      "0 0 * * 1"     — every Monday at midnight
                      "@hourly"       — once an hour
                      "@daily"        — once a day
                image:
                  type: string
                concurrencyPolicy:
                  type: string
                  enum: [Allow, Forbid, Replace]
                  default: Allow
                startingDeadlineSeconds:
                  type: integer
                  minimum: 0
                successfulJobsHistoryLimit:
                  type: integer
                  minimum: 0
                  default: 3
                failedJobsHistoryLimit:
                  type: integer
                  minimum: 0
                  default: 1
                suspend:
                  type: boolean
                  default: false
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true

    # ── v2 ─────────────────────────────────────────────────────────────────
    # The current API. schedule is a structured object with named fields.
    # This is the storage version.
    - name: v2
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Schedule
          type: string
          jsonPath: .status.scheduleExpression
        - name: Image
          type: string
          jsonPath: .spec.image
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [schedule, image]
              properties:
                schedule:
                  type: object
                  description: Structured cron schedule. Each field accepts standard cron syntax.
                  properties:
                    minute:
                      type: string
                      default: "*"
                      description: "Minute (0-59, */n, ranges). Default: *"
                    hour:
                      type: string
                      default: "*"
                      description: "Hour (0-23, */n, ranges). Default: *"
                    dayOfMonth:
                      type: string
                      default: "*"
                      description: "Day of month (1-31). Default: *"
                    month:
                      type: string
                      default: "*"
                      description: "Month (1-12 or JAN-DEC). Default: *"
                    dayOfWeek:
                      type: string
                      default: "*"
                      description: "Day of week (0-6 or SUN-SAT, 0=Sunday). Default: *"
                image:
                  type: string
                  description: Container image for the job runner
                concurrencyPolicy:
                  type: string
                  enum: [Allow, Forbid, Replace]
                  default: Allow
                  description: How to treat concurrent executions
                startingDeadlineSeconds:
                  type: integer
                  minimum: 0
                  description: Deadline for starting a job if it misses its scheduled time
                successfulJobsHistoryLimit:
                  type: integer
                  minimum: 0
                  default: 3
                failedJobsHistoryLimit:
                  type: integer
                  minimum: 0
                  default: 1
                suspend:
                  type: boolean
                  default: false
                  description: Suspend all subsequent executions
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true

  # ── Conversion webhook ──────────────────────────────────────────────────────
  # Orkestra serves /convert in-process — no separate webhook deployment.
  # The CA bundle is injected by cert-manager or the Helm chart at deploy time.
  conversion:
    strategy: Webhook
    webhook:
      clientConfig:
        service:
          name: orkestra-gateway
          namespace: orkestra-system
          path: /convert
          port: 8443
        caBundle: ""
      conversionReviewVersions: ["v1"]
