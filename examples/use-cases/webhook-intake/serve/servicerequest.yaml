# Serve field config for the webhook-intake example. Included from
# katalog.yaml via serve.include — same mechanism every other serve
# example uses.

fields:
  image:
    label: "Image"
    hint: "Container image to run"
    required: true

  team:
    label: "Team"
    hint: "Owning team"
    required: true

  replicas:
    label: "Replicas"
    type: integer
