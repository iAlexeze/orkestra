apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: shared-platform
  namespace: platform
  description: >
    Shared platform — cache and queue CRDs readable by all teams (crossAccess defaults to true).

spec:
  crds:
    cache:
      apiTypes:
        group: multi-tenancy.orkestra.io
        version: v1alpha1
        kind: Cache
        plural: caches

      workers: 2
      resync: 30s

      operatorBox:
        status:
          fields:
            - path: phase
              value: "ready"
            - path: endpoint
              value: "{{ .metadata.name }}.{{ .metadata.namespace }}.svc.cluster.local:6379"

        onCreate:
          deployments:
            - name: "{{ .metadata.name }}-redis"
              image: "redis:7-alpine"
              replicas: "1"
              port: "6379"
              reconcile: true

          services:
            - name: "{{ .metadata.name }}"
              port: "6379"
              targetPort: "6379"
              reconcile: true

    queue:
      apiTypes:
        group: multi-tenancy.orkestra.io
        version: v1alpha1
        kind: Queue
        plural: queues

      workers: 2
      resync: 30s

      operatorBox:
        status:
          fields:
            - path: phase
              value: "Ready"
            - path: amqpEndpoint
              value: "amqp://{{ .metadata.name }}.{{ .metadata.namespace }}.svc.cluster.local"

        onCreate:
          deployments:
            - name: "{{ .metadata.name }}-broker"
              image: "rabbitmq:3-alpine"
              replicas: "1"
              port: "5672"
              reconcile: true

          services:
            - name: "{{ .metadata.name }}"
              port: "5672"
              targetPort: "5672"
              reconcile: true
