---
# platform CRDs — shared infrastructure
apiVersion: multi-tenancy.orkestra.io/v1alpha1
kind: Cache
metadata:
  name: app-cache
  namespace: default
spec: {}
---
apiVersion: multi-tenancy.orkestra.io/v1alpha1
kind: Queue
metadata:
  name: app-queue
  namespace: default
spec: {}
---
# team-a CRD — reads cache and queue endpoints via cross:
apiVersion: multi-tenancy.orkestra.io/v1alpha1
kind: Api
metadata:
  name: my-api
  namespace: default
spec:
  image: nginx:alpine
  cacheName: app-cache
  queueName: app-queue
