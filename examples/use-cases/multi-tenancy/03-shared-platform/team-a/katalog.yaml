apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: team-a
  namespace: team-a
  description: >
    Team A — reads shared cache and queue endpoints via cross: and
    injects them as environment variables into the API deployment.

spec:
  crds:
    api:
      apiTypes:
        group: multi-tenancy.orkestra.io
        version: v1alpha1
        kind: Api
        plural: apis

      workers: 2
      resync: 20s

      operatorBox:
        cross:
          - crd: cache
            as: sharedCache
            selector:
              name: "{{ .spec.cacheName }}"
              namespace: "{{ .metadata.namespace }}"
          - crd: queue
            as: sharedQueue
            selector:
              name: "{{ .spec.queueName }}"
              namespace: "{{ .metadata.namespace }}"

        status:
          fields:
            - path: phase
              value: '{{ boolTernary (and (eq .cross.sharedCache.found "true") (eq .cross.sharedQueue.found "true")) "running" "waiting" }}'

        onCreate:
          deployments:
            - name: "{{ .metadata.name }}"
              image: "{{ .spec.image }}"
              replicas: '{{ default "1" .spec.replicas }}'
              port: "8080"
              when:
                - field: cross.sharedCache.found
                  operator: eq
                  value: "true"
                - field: cross.sharedQueue.found
                  operator: eq
                  value: "true"
              env:
                - name: REDIS_URL
                  value: "{{ .cross.sharedCache.status.endpoint }}"
                - name: AMQP_URL
                  value: "{{ .cross.sharedQueue.status.amqpEndpoint }}"
              reconcile: true

          services:
            - name: "{{ .metadata.name }}-svc"
              port: "80"
              targetPort: "8080"
              reconcile: true
