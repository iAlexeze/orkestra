apiVersion: orkestra.orkspace.io/v1
kind: E2E
metadata:
  name: multi-tenancy-basic-e2e
  description: >
    Two namespaced Katalogs in one runtime. platform-team manages a Database CRD;
    product-team manages a Website CRD. Verifies both CRs reconcile independently
    and their child resources are created under the correct namespace grouping.

spec:
  katalog: ./komposer.yaml
  crd: ./crd.yaml
  cr: ./cr.yaml

  cluster:
    provider: kind
    name: ork-e2e
    reuse: false

  expect:
    - name: Database CR created
      after: cr-applied
      timeout: 60s
      resources:
        - kind: Database
          name: main-db
          namespace: default

    - name: Website CR created
      after: cr-applied
      timeout: 60s
      resources:
        - kind: Website
          name: storefront
          namespace: default

    - name: Database Deployment ready
      after: cr-applied
      timeout: 90s
      resources:
        - kind: Deployment
          name: main-db
          namespace: default
          ready: true

    - name: Database Secret created (once:)
      after: cr-applied
      timeout: 60s
      resources:
        - kind: Secret
          name: main-db-creds
          namespace: default

    - name: Database Service created
      after: cr-applied
      timeout: 60s
      resources:
        - kind: Service
          name: main-db
          namespace: default

    - name: Website Deployment ready
      after: cr-applied
      timeout: 90s
      resources:
        - kind: Deployment
          name: storefront
          namespace: default
          ready: true

    - name: Website Service created
      after: cr-applied
      timeout: 60s
      resources:
        - kind: Service
          name: storefront-svc
          namespace: default

    - name: Cleanup verified
      after: cr-deleted
      timeout: 60s
      resources:
        - kind: Database
          name: main-db
          namespace: default
          count: 0
        - kind: Website
          name: storefront
          namespace: default
          count: 0
        - kind: Deployment
          name: main-db
          namespace: default
          count: 0
        - kind: Deployment
          name: storefront
          namespace: default
          count: 0
