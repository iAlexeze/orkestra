---
# internal-team CRDs
apiVersion: multi-tenancy.orkestra.io/v1alpha1
kind: Payment
metadata:
  name: checkout
  namespace: default
spec:
  amount: "99.99"
---
apiVersion: multi-tenancy.orkestra.io/v1alpha1
kind: Ledger
metadata:
  name: main-ledger
  namespace: default
spec:
  initialEntries: 0
---
# analytics-team CRD — reads ledger (allowed), cannot read payment (blocked)
apiVersion: multi-tenancy.orkestra.io/v1alpha1
kind: Report
metadata:
  name: daily-summary
  namespace: default
spec:
  ledgerName: main-ledger
