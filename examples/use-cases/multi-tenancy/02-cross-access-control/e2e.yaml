# https://orkestra.sh/docs/reference/schema/e2e/
apiVersion: orkestra.orkspace.io/v1
kind: E2E
metadata:
  name: cross-access-control-e2e
  description: >
    internal-team closes all CRDs with crossAccess: false at the Katalog level.
    ledger overrides to crossAccess: true at the CRD level.
    analytics-team's Report reads ledger data (allowed) and cannot read payment (blocked).
    Verifies graceful degradation when a cross read is denied.

spec:
  katalog: ./komposer.yaml
  crd: ./crd.yaml
  cr: ./cr.yaml

  cluster:
    provider: kind
    name: ork-e2e
    reuse: false

  expect:
    - name: All CRs created
      after: cr-applied
      timeout: 60s
      resources:
        - kind: Payment
          name: checkout
          namespace: default
        - kind: Ledger
          name: main-ledger
          namespace: default
        - kind: Report
          name: daily-summary
          namespace: default

    - name: Report reaches Ready phase (reads ledger, skips payment gracefully)
      after: cr-applied
      timeout: 90s
      kubectl:
        get:
          - kind: Report
            name: daily-summary
            namespace: default
            field: .status.phase
            equals: Ready

    - name: Report status reflects ledger data
      after: cr-applied
      timeout: 90s
      kubectl:
        get:
          - kind: Report
            name: daily-summary
            namespace: default
            field: .status.ledgerPhase
            equals: Running

    - name: Report ConfigMap is blocked from ledger data
      after: cr-applied
      timeout: 60s
      resources:
        - kind: ConfigMap
          name: daily-summary-report
          namespace: default
          count: 0

    - name: Cleanup verified
      after: cr-deleted
      timeout: 60s
      resources:
        - kind: Payment
          name: checkout
          namespace: default
          count: 0
        - kind: Ledger
          name: main-ledger
          namespace: default
          count: 0
        - kind: Report
          name: daily-summary
          namespace: default
          count: 0
