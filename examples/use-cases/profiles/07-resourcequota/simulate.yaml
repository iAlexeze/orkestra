apiVersion: orkestra.orkspace.io/v1
kind: Simulate
metadata:
  name: profiles-resourcequota-sim
  description: >
    Four ResourceQuota profiles — small, medium, large, xlarge.
    All four are created in cycle 1 from a single CR.

spec:
  katalog: ./katalog.yaml
  cr: ../cr.yaml
  cycles: 3

  expect:
    steady: true
    ops:
      - cycle: 1
        verb: apply
        resource: resourcequotas
        name: my-service-quota-small

      - cycle: 1
        verb: apply
        resource: resourcequotas
        name: my-service-quota-medium

      - cycle: 1
        verb: apply
        resource: resourcequotas
        name: my-service-quota-large

      - cycle: 1
        verb: apply
        resource: resourcequotas
        name: my-service-quota-xlarge
