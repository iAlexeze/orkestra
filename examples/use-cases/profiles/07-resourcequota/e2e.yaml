apiVersion: orkestra.orkspace.io/v1
kind: E2E
metadata:
  name: profiles-resourcequota-e2e
  description: >
    resourcequota.profile — one CR produces four ResourceQuotas each using
    a different tier profile. Verifies all four are created and removed on deletion.

spec:
  katalog: ./katalog.yaml
  crd: ../crd.yaml
  cr: ../cr.yaml

  cluster:
    provider: kind
    name: ork-e2e
    reuse: false

  expect:
    - name: Service CR created
      after: cr-applied
      timeout: 60s
      commands:
        - run: kubectl get services.demo.orkestra.io my-service
          exitCode: 0

    - name: Four ResourceQuotas created
      after: cr-applied
      timeout: 60s
      resources:
        - kind: ResourceQuota
          name: my-service-quota-small
          namespace: default
        - kind: ResourceQuota
          name: my-service-quota-medium
          namespace: default
        - kind: ResourceQuota
          name: my-service-quota-large
          namespace: default
        - kind: ResourceQuota
          name: my-service-quota-xlarge
          namespace: default

    - name: Cleanup verified
      after: cr-deleted
      timeout: 60s
      resources:
        - kind: ResourceQuota
          name: my-service-quota-small
          namespace: default
          count: 0
