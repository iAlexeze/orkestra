# https://orkestra.sh/docs/reference/schema/e2e/
apiVersion: orkestra.orkspace.io/v1
kind: E2E
metadata:
  name: profiles-rolling-update-e2e
  description: >
    rollingUpdate.profile — one CR produces three Deployments each with a
    different rollout strategy from a profile name. Verifies all three
    Deployments are created and that maxSurge/maxUnavailable match the profile.

spec:
  katalog: ./katalog.yaml
  crd: ../crd.yaml
  cr: ../cr.yaml

  cluster:
    provider: kind
    name: ork-e2e
    reuse: false

  expect:
    - name: Service CR created
      after: cr-applied
      timeout: 60s
      commands:
        - run: kubectl get services.demo.orkestra.io my-service
          exitCode: 0

    - name: Three rolling update profile Deployments created
      after: cr-applied
      timeout: 90s
      resources:
        - kind: Deployment
          name: my-service-safe
          namespace: default
        - kind: Deployment
          name: my-service-fast
          namespace: default
        - kind: Deployment
          name: my-service-bg
          namespace: default

    - name: Cleanup verified
      after: cr-deleted
      timeout: 60s
      resources:
        - kind: Deployment
          name: my-service-safe
          namespace: default
          count: 0
