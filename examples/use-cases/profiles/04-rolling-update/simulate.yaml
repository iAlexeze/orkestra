apiVersion: orkestra.orkspace.io/v1
kind: Simulate
metadata:
  name: profiles-rolling-update-sim
  description: >
    Three rolling update profiles — safe, fast, blue-green. All three
    Deployments are created in cycle 1 from a single CR.

spec:
  katalog: ./katalog.yaml
  cr: ../cr.yaml
  cycles: 3

  expect:
    steady: true
    ops:
      - cycle: 1
        verb: create
        resource: deployments
        name: my-service-safe

      - cycle: 1
        verb: create
        resource: deployments
        name: my-service-fast

      - cycle: 1
        verb: create
        resource: deployments
        name: my-service-bg
