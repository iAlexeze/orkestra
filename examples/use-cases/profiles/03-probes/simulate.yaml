apiVersion: orkestra.orkspace.io/v1
kind: Simulate
metadata:
  name: profiles-probes-sim
  description: >
    Four probe profiles — fast, standard, patient, slow-start. All four
    Deployments are created in cycle 1 from a single CR.

spec:
  katalog: ./katalog.yaml
  cr: ../cr.yaml
  cycles: 3

  expect:
    steady: true
    ops:
      - cycle: 1
        verb: create
        resource: deployments
        name: my-service-fast

      - cycle: 1
        verb: create
        resource: deployments
        name: my-service-standard

      - cycle: 1
        verb: create
        resource: deployments
        name: my-service-patient

      - cycle: 1
        verb: create
        resource: deployments
        name: my-service-slow-start
