apiVersion: orkestra.orkspace.io/v1
kind: Simulate
metadata:
  name: profiles-pdb-sim
  description: >
    Three PDB profiles — zero-downtime, rolling, relaxed. Three Deployments
    and three PodDisruptionBudgets are created in cycle 1 from a single CR.

spec:
  katalog: ./katalog.yaml
  cr: ../cr.yaml
  cycles: 3

  expect:
    steady: true
    ops:
      - cycle: 1
        verb: create
        resource: deployments
        name: my-service-zero

      - cycle: 1
        verb: create
        resource: deployments
        name: my-service-rolling

      - cycle: 1
        verb: create
        resource: deployments
        name: my-service-relaxed

      - cycle: 1
        verb: create
        resource: poddisruptionbudgets
        name: my-service-zero-pdb

      - cycle: 1
        verb: create
        resource: poddisruptionbudgets
        name: my-service-rolling-pdb

      - cycle: 1
        verb: create
        resource: poddisruptionbudgets
        name: my-service-relaxed-pdb
