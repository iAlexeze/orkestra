apiVersion: orkestra.orkspace.io/v1
kind: Simulate
metadata:
  name: profiles-reconciler-sim
  description: >
    Reconciler profile — user-defined local-dev preset expands to
    workers: 1, resync: 15s, queue.maxDepth: 50. One Deployment is
    created in cycle 1 and the operator reaches steady state by cycle 3.

spec:
  katalog: ./katalog.yaml
  cr: ../cr.yaml
  cycles: 3

  expect:
    steady: true
    ops:
      - cycle: 1
        verb: create
        resource: deployments
        name: my-service
