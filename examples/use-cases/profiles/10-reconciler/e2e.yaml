# https://orkestra.sh/docs/reference/schema/e2e/
apiVersion: orkestra.orkspace.io/v1
kind: E2E
metadata:
  name: profiles-reconciler-e2e
  description: >
    reconciler.profile — the local-dev profile expands to workers: 1,
    resync: 15s, queue.maxDepth: 50. One CR produces one Deployment.
    Verifies the Deployment is created and removed on CR deletion.
    Inspect the reconciler config via port-forward after ork run (see README).

spec:
  katalog: ./katalog.yaml
  crd: ../crd.yaml
  cr: ../cr.yaml

  cluster:
    provider: kind
    name: ork-e2e
    reuse: false

  expect:
    - name: Service CR created
      after: cr-applied
      timeout: 60s
      commands:
        - run: kubectl get services.demo.orkestra.io my-service
          exitCode: 0

    - name: Deployment created
      after: cr-applied
      timeout: 90s
      resources:
        - kind: Deployment
          name: my-service
          namespace: default

    - name: Reconciler config matches local-dev profile
      after: cr-applied
      timeout: 30s
      kubectl:
        port-forward:
          - service: orkestra-runtime
            namespace: orkestra-system
            port: 8080
            path: /katalog/service
            jq: workers
            equals: "1"

    - name: Cleanup verified
      after: cr-deleted
      timeout: 60s
      resources:
        - kind: Deployment
          name: my-service
          namespace: default
          count: 0
