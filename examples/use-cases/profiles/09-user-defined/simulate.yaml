apiVersion: orkestra.orkspace.io/v1
kind: Simulate
metadata:
  name: profiles-user-defined-sim
  description: >
    Six user-defined profile classes — networkPolicies, hpa, resources, probes,
    containerSecurity, podSecurity. All six resources (1 Deployment, 3 NetworkPolicies,
    2 HPAs) are created in cycle 1. The Deployment container carries resource,
    probe, and security settings from team-owned profile definitions.

spec:
  katalog: ./katalog.yaml
  cr: ../cr.yaml
  cycles: 3

  expect:
    steady: true
    ops:
      - cycle: 1
        verb: create
        resource: deployments
        name: my-service

      - cycle: 1
        verb: create
        resource: networkpolicies
        name: my-service-deny-all

      - cycle: 1
        verb: create
        resource: networkpolicies
        name: my-service-allow-internal

      - cycle: 1
        verb: create
        resource: networkpolicies
        name: my-service-allow-dns

      - cycle: 1
        verb: create
        resource: horizontalpodautoscalers
        name: my-service-hpa-conservative

      - cycle: 1
        verb: create
        resource: horizontalpodautoscalers
        name: my-service-hpa-responsive
