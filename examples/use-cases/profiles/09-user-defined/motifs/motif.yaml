apiVersion: orkestra.orkspace.io/v1
kind: Motif
metadata:
  name: team-profiles
  description: >
    Org-wide profile definitions for the service platform team.
    Imported at spec.imports so every CRD in the Katalog can reference
    these profiles without re-declaring them.

profiles:
  networkPolicies:
    - name: team-deny-all
      description: Block all ingress and egress — baseline isolation
      policyTypes: [Ingress, Egress]

    - name: team-allow-internal
      description: Allow ingress from pods in the same namespace
      ingress:
        - from:
            - podSelector: {}
      policyTypes: [Ingress]

    - name: team-allow-dns
      description: Allow outbound DNS resolution
      egress:
        - ports:
            - port: 53
              protocol: UDP
            - port: 53
              protocol: TCP
      policyTypes: [Egress]

  hpa:
    - name: team-conservative
      description: 70% CPU target, slow scale-down
      targetCPUUtilizationPercentage: "70"
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Pods
              value: 1
              periodSeconds: 60

    - name: team-responsive
      description: 50% CPU target, fast scale-down
      targetCPUUtilizationPercentage: "50"
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 30
          policies:
            - type: Percent
              value: 25
              periodSeconds: 15

  resources:
    - name: team-api
      description: Standard allocation for a web API container
      requests:
        cpu: "200m"
        memory: "128Mi"
      limits:
        cpu: "1"
        memory: "512Mi"

  probes:
    - name: team-standard
      description: Standard timing for most web services
      initialDelaySeconds: 10
      periodSeconds: 15
      failureThreshold: 3
      successThreshold: 1
      timeoutSeconds: 5

  containerSecurity:
    - name: team-baseline
      description: Drop NET_RAW, no privilege escalation
      allowPrivilegeEscalation: false
      capabilities:
        drop: [NET_RAW]

  podSecurity:
    - name: team-nonroot
      description: Run as a fixed non-root UID
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
