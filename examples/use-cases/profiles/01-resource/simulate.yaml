apiVersion: orkestra.orkspace.io/v1
kind: Simulate
metadata:
  name: profiles-resource-sim
  description: >
    Eight resource profiles — tiny through memory-heavy. All eight Deployments
    are created in cycle 1 from a single CR.

spec:
  katalog: ./katalog.yaml
  cr: ../cr.yaml
  cycles: 3

  expect:
    steady: true
    ops:
      - cycle: 1
        verb: create
        resource: deployments
        name: my-service-tiny

      - cycle: 1
        verb: create
        resource: deployments
        name: my-service-small

      - cycle: 1
        verb: create
        resource: deployments
        name: my-service-medium

      - cycle: 1
        verb: create
        resource: deployments
        name: my-service-large

      - cycle: 1
        verb: create
        resource: deployments
        name: my-service-burst

      - cycle: 1
        verb: create
        resource: deployments
        name: my-service-steady

      - cycle: 1
        verb: create
        resource: deployments
        name: my-service-compute-heavy

      - cycle: 1
        verb: create
        resource: deployments
        name: my-service-memory-heavy
