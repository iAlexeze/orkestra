apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: services.demo.orkestra.io
spec:
  group: demo.orkestra.io
  scope: Namespaced
  names:
    plural: services
    singular: service
    kind: Service
    shortNames: [svc]
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  description: Container image
                port:
                  type: integer
                  default: 8080
                  description: Port exposed by the container
                replicas:
                  type: integer
                  minimum: 1
                  default: 1
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
