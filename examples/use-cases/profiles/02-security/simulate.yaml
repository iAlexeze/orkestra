apiVersion: orkestra.orkspace.io/v1
kind: Simulate
metadata:
  name: profiles-security-sim
  description: >
    Three security profiles — baseline, restricted, hardened. All three
    Deployments are created in cycle 1 from a single CR.

spec:
  katalog: ./katalog.yaml
  cr: ../cr.yaml
  cycles: 3

  expect:
    steady: true
    ops:
      - cycle: 1
        verb: apply
        resource: deployments
        name: my-service-baseline

      - cycle: 1
        verb: apply
        resource: deployments
        name: my-service-restricted

      - cycle: 1
        verb: apply
        resource: deployments
        name: my-service-hardened
