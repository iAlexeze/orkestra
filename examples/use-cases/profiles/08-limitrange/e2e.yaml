apiVersion: orkestra.orkspace.io/v1
kind: E2E
metadata:
  name: profiles-limitrange-e2e
  description: >
    limitrange.profile (user-defined) — one CR produces three LimitRanges each
    using a profile declared in the Katalog's profiles: block. Verifies all three
    are created and removed on deletion.

spec:
  katalog: ./katalog.yaml
  crd: ../crd.yaml
  cr: ../cr.yaml

  cluster:
    provider: kind
    name: ork-e2e
    reuse: false

  expect:
    - name: Service CR created
      after: cr-applied
      timeout: 60s
      commands:
        - run: kubectl get services.demo.orkestra.io my-service
          exitCode: 0

    - name: Three LimitRanges created
      after: cr-applied
      timeout: 60s
      resources:
        - kind: LimitRange
          name: my-service-limits-minimal
          namespace: default
        - kind: LimitRange
          name: my-service-limits-standard
          namespace: default
        - kind: LimitRange
          name: my-service-limits-generous
          namespace: default

    - name: Cleanup verified
      after: cr-deleted
      timeout: 60s
      resources:
        - kind: LimitRange
          name: my-service-limits-minimal
          namespace: default
          count: 0
