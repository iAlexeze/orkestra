apiVersion: orkestra.orkspace.io/v1
kind: Simulate
metadata:
  name: profiles-limitrange-sim
  description: >
    Three user-defined LimitRange profiles — minimal, standard, generous.
    All three are created in cycle 1. LimitRange has no built-in profiles;
    the profiles: block in the Katalog is the only source.

spec:
  katalog: ./katalog.yaml
  cr: ../cr.yaml
  cycles: 3

  expect:
    steady: true
    ops:
      - cycle: 1
        verb: create
        resource: limitranges
        name: my-service-limits-minimal

      - cycle: 1
        verb: create
        resource: limitranges
        name: my-service-limits-standard

      - cycle: 1
        verb: create
        resource: limitranges
        name: my-service-limits-generous
