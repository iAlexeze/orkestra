apiVersion: orkestra.orkspace.io/v1
kind: E2E
metadata:
  name: profiles-networkpolicy-e2e
  description: >
    networkpolicy.profile — one CR produces five NetworkPolicies each using
    a different built-in profile. Verifies all five are created and removed
    on deletion.

spec:
  katalog: ./katalog.yaml
  crd: ../crd.yaml
  cr: ../cr.yaml

  cluster:
    provider: kind
    name: ork-e2e
    reuse: false

  expect:
    - name: Service CR created
      after: cr-applied
      timeout: 60s
      commands:
        - run: kubectl get services.demo.orkestra.io my-service
          exitCode: 0

    - name: Five NetworkPolicies created
      after: cr-applied
      timeout: 60s
      resources:
        - kind: NetworkPolicy
          name: my-service-deny-all
          namespace: default
        - kind: NetworkPolicy
          name: my-service-deny-ingress
          namespace: default
        - kind: NetworkPolicy
          name: my-service-deny-egress
          namespace: default
        - kind: NetworkPolicy
          name: my-service-allow-same-ns
          namespace: default
        - kind: NetworkPolicy
          name: my-service-allow-dns
          namespace: default

    - name: Cleanup verified
      after: cr-deleted
      timeout: 60s
      resources:
        - kind: NetworkPolicy
          name: my-service-deny-all
          namespace: default
          count: 0
