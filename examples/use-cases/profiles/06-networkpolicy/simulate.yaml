apiVersion: orkestra.orkspace.io/v1
kind: Simulate
metadata:
  name: profiles-networkpolicy-sim
  description: >
    Five NetworkPolicy profiles — deny-all, deny-all-ingress, deny-all-egress,
    allow-same-namespace, allow-dns-egress. All five are created in cycle 1.

spec:
  katalog: ./katalog.yaml
  cr: ../cr.yaml
  cycles: 3

  expect:
    steady: true
    ops:
      - cycle: 1
        verb: create
        resource: networkpolicies
        name: my-service-deny-all

      - cycle: 1
        verb: create
        resource: networkpolicies
        name: my-service-deny-ingress

      - cycle: 1
        verb: create
        resource: networkpolicies
        name: my-service-deny-egress

      - cycle: 1
        verb: create
        resource: networkpolicies
        name: my-service-allow-same-ns

      - cycle: 1
        verb: create
        resource: networkpolicies
        name: my-service-allow-dns
