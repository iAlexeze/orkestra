apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: apps.demo.orkestra.io
spec:
  group: demo.orkestra.io
  scope: Namespaced
  names:
    plural: apps
    singular: app
    kind: App
    shortNames: [ap]
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Image
          type: string
          jsonPath: .status.image
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  description: >
                    Container image. All formats accepted:
                      "nginx"                        → registry.internal/nginx:latest
                      "nginx:1.25"                   → registry.internal/nginx:1.25
                      "registry.internal/nginx:1.25" → unchanged
                replicas:
                  type: integer
                  minimum: 1
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
