# https://orkestra.sh/docs/reference/schema/e2e/
apiVersion: orkestra.orkspace.io/v1
kind: E2E
metadata:
  name: normalize-image-e2e
  description: >
    normalize: image rules — registry prefix and explicit tag applied regardless
    of what the user wrote. Verifies bare, tagged, and fully-qualified inputs
    all produce a canonical image in status after normalization.

spec:
  katalog: ./katalog.yaml
  crd: ./crd.yaml
  cr: ./cr-bare.yaml

  cluster:
    provider: kind
    name: ork-e2e
    reuse: false

  expect:
    - name: App CR created
      after: cr-applied
      timeout: 60s
      resources:
        - kind: App
          name: app-bare
          namespace: default

    - name: Deployment created with normalized image
      after: cr-applied
      timeout: 60s
      resources:
        - kind: Deployment
          name: app-bare
          namespace: default

    - name: Status image has registry and tag added
      after: cr-applied
      timeout: 60s
      kubectl:
        get:
          - kind: App
            name: app-bare
            namespace: default
            field: .status.image
            outputContains: registry.internal/nginx

    - name: Cleanup verified
      after: cr-deleted
      timeout: 30s
      resources:
        - kind: App
          name: app-bare
          namespace: default
          count: 0
