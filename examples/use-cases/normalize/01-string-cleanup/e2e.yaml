# https://orkestra.sh/docs/reference/schema/e2e/
apiVersion: orkestra.orkspace.io/v1
kind: E2E
metadata:
  name: normalize-string-cleanup-e2e
  description: >
    normalize: string rules — toLower, trimSpace, domain stripping.
    Verifies that messy inputs (mixed case, whitespace, protocol prefix) are
    normalised before any resource is written, and that the ConfigMap and status
    reflect the canonical values.

spec:
  katalog: ./katalog.yaml
  crd: ./crd.yaml
  cr: ./cr-messy.yaml

  cluster:
    provider: kind
    name: ork-e2e
    reuse: false

  expect:
    - name: Tenant CR created
      after: cr-applied
      timeout: 60s
      resources:
        - kind: Tenant
          name: acme
          namespace: default

    - name: ConfigMap created with normalized values
      after: cr-applied
      timeout: 60s
      resources:
        - kind: ConfigMap
          name: acme-config
          namespace: default

    - name: Status shows normalized name (lowercase, trimmed)
      after: cr-applied
      timeout: 60s
      kubectl:
        get:
          - kind: Tenant
            name: acme
            namespace: default
            field: .status.name
            outputContains: acme corp

    - name: Status shows normalized domain (protocol stripped)
      after: cr-applied
      timeout: 60s
      kubectl:
        get:
          - kind: Tenant
            name: acme
            namespace: default
            field: .status.domain
            equals: acme.example.com

    - name: Cleanup verified
      after: cr-deleted
      timeout: 30s
      resources:
        - kind: Tenant
          name: acme
          namespace: default
          count: 0
        - kind: ConfigMap
          name: acme-config
          namespace: default
          count: 0
