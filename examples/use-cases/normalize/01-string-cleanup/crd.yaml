apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tenants.demo.orkestra.io
spec:
  group: demo.orkestra.io
  scope: Namespaced
  names:
    plural: tenants
    singular: tenant
    kind: Tenant
    shortNames: [tn]
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Environment
          type: string
          jsonPath: .status.environment
        - name: Domain
          type: string
          jsonPath: .status.domain
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [name, domain]
              properties:
                name:
                  type: string
                  description: Tenant name. Any casing accepted — normalized to lowercase.
                environment:
                  type: string
                  description: Deployment environment. Any casing and surrounding whitespace accepted.
                domain:
                  type: string
                  description: Application domain. Protocol prefix and trailing slash are stripped.
                tier:
                  type: string
                  description: Tenant tier label. Normalized to lowercase.
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
