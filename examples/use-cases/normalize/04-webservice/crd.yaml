apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: webservices.demo.orkestra.io
spec:
  group: demo.orkestra.io
  scope: Namespaced
  names:
    plural: webservices
    singular: webservice
    kind: WebService
    shortNames: [ws]
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Environment
          type: string
          jsonPath: .status.environment
        - name: Domain
          type: string
          jsonPath: .status.domain
        - name: Backends
          type: integer
          jsonPath: .status.backendCount
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [image, organizationId, domain]
              properties:
                image:
                  type: string
                  description: >
                    Container image. All formats accepted:
                      "nginx"                        → registry.internal/nginx:latest
                      "nginx:1.25"                   → registry.internal/nginx:1.25
                      "registry.internal/nginx:1.25" → unchanged
                organizationId:
                  type: string
                  description: Organization identifier. Used for secret namespacing.
                environment:
                  type: string
                  description: Deployment environment. Any casing accepted — normalized to lowercase.
                domain:
                  type: string
                  description: Application domain. Protocol and trailing slash stripped by normalize.
                replicas:
                  type: integer
                  minimum: 1
                  description: Defaults to 1 when omitted.
                resources:
                  type: object
                  properties:
                    requests:
                      type: object
                      properties:
                        cpu:
                          type: string
                        memory:
                          type: string
                backends:
                  type: array
                  description: Backend service names. One Deployment is created per entry.
                  items:
                    type: string
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
