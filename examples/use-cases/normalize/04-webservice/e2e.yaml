# https://orkestra.sh/docs/reference/schema/e2e/
apiVersion: orkestra.orkspace.io/v1
kind: E2E
metadata:
  name: normalize-webservice-e2e
  description: >
    normalize: all patterns in one operator — image normalization, string cleanup,
    resource defaults, composite internalName, once: secrets, forEach backends.
    Verifies that messy inputs produce canonical resources and status.

spec:
  katalog: ./katalog.yaml
  crd: ./crd.yaml
  cr: ./cr-simple.yaml

  cluster:
    provider: kind
    name: ork-e2e
    reuse: false

  expect:
    - name: WebService CR created
      after: cr-applied
      timeout: 60s
      resources:
        - kind: WebService
          name: my-app
          namespace: default

    - name: ConfigMap created with normalized values
      after: cr-applied
      timeout: 60s
      resources:
        - kind: ConfigMap
          name: my-app-production-config
          namespace: default

    - name: Secrets created with once semantics
      after: cr-applied
      timeout: 60s
      resources:
        - kind: Secret
          name: my-app-production-acme-corp-api-key
          namespace: default
        - kind: Secret
          name: my-app-production-jwt
          namespace: default

    - name: Status internalName is normalized (environment trimmed and lowercased)
      after: cr-applied
      timeout: 60s
      kubectl:
        get:
          - kind: WebService
            name: my-app
            namespace: default
            field: .status.internalName
            outputContains: my-app-production

    - name: Cleanup verified
      after: cr-deleted
      timeout: 60s
      resources:
        - kind: WebService
          name: my-app
          namespace: default
          count: 0
        - kind: ConfigMap
          name: my-app-production-config
          namespace: default
          count: 0
