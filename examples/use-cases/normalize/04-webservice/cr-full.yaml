apiVersion: demo.orkestra.io/v1
kind: WebService
metadata:
  name: payments-service
  namespace: default
spec:
  image: registry.internal/payments:2.1.3   # normalize → unchanged
  environment: staging                       # normalize → "staging" (unchanged)
  domain: "payments-staging.example.com"    # normalize → unchanged
  organizationId: acme-corp
  replicas: 3
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
  backends:
    - processor
    - reconciler
    - reporter
  # internalName computed → "payments-service-staging"
