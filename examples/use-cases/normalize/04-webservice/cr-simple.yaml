apiVersion: demo.orkestra.io/v1
kind: WebService
metadata:
  name: my-app
  namespace: default
spec:
  image: nginx                          # normalize → registry.internal/nginx:latest
  environment: " Production "           # normalize → "production"
  domain: "https://my-app.example.com/" # normalize → "my-app.example.com"
  organizationId: acme-corp
  backends:
    - api
    - worker
  # replicas omitted         → normalize defaults to 1
  # resources omitted        → normalize defaults cpu:100m, memory:128Mi
  # internalName is computed → "my-app-production"
