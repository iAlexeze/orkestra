# https://orkestra.sh/docs/reference/schema/e2e/
apiVersion: orkestra.orkspace.io/v1
kind: E2E
metadata:
  name: normalize-defaults-e2e
  description: >
    normalize: default injection without a webhook — omitted fields receive
    their defaults before reconcile logic runs. Verifies that a minimal CR
    (image only) produces a Deployment with the correct defaulted replica
    count and resource requests.

spec:
  katalog: ./katalog.yaml
  crd: ./crd.yaml
  cr: ./cr-minimal.yaml

  cluster:
    provider: kind
    name: ork-e2e
    reuse: false

  expect:
    - name: Workload CR created
      after: cr-applied
      timeout: 60s
      resources:
        - kind: Workload
          name: api-server
          namespace: default

    - name: Deployment created
      after: cr-applied
      timeout: 60s
      resources:
        - kind: Deployment
          name: api-server
          namespace: default

    - name: Status has defaulted replicas
      after: cr-applied
      timeout: 60s
      kubectl:
        get:
          - kind: Workload
            name: api-server
            namespace: default
            field: .status.replicas
            equals: "1"

    - name: Status shows defaulted CPU request
      after: cr-applied
      timeout: 60s
      kubectl:
        get:
          - kind: Workload
            name: api-server
            namespace: default
            field: .status.cpu
            equals: 100m

    - name: Cleanup verified
      after: cr-deleted
      timeout: 30s
      resources:
        - kind: Workload
          name: api-server
          namespace: default
          count: 0
