apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: workloads.demo.orkestra.io
spec:
  group: demo.orkestra.io
  scope: Namespaced
  names:
    plural: workloads
    singular: workload
    kind: Workload
    shortNames: [wl]
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Replicas
          type: integer
          jsonPath: .status.replicas
        - name: CPU
          type: string
          jsonPath: .status.cpu
        - name: Memory
          type: string
          jsonPath: .status.memory
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                replicas:
                  type: integer
                  minimum: 1
                  description: Defaults to 1 when omitted.
                resources:
                  type: object
                  properties:
                    requests:
                      type: object
                      properties:
                        cpu:
                          type: string
                          description: Defaults to "100m" when omitted.
                        memory:
                          type: string
                          description: Defaults to "128Mi" when omitted.
                concurrencyPolicy:
                  type: string
                  description: Defaults to "Allow" when omitted.
                suspend:
                  type: boolean
                  description: Defaults to false when omitted.
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
