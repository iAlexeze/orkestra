apiVersion: demo.orkestra.io/v1
kind: Workload
metadata:
  name: api-server
  namespace: default
spec:
  image: myorg/api-server:latest
  # replicas omitted        → normalize defaults to 1
  # resources omitted       → normalize defaults to cpu:100m, memory:128Mi
  # concurrencyPolicy omit  → normalize defaults to "Allow"
  # suspend omitted         → normalize defaults to false
