apiVersion: orkestra.orkspace.io/v1
kind: Simulate
metadata:
  name: feature-flags-sim
  description: >
    Verify the Deployment is created at full capacity when v2Enabled is true.
    Run with --dev-server — the dev server returns "true" for the flag by
    default, so the operator takes the full-capacity path (spec.replicas).

spec:
  katalog: ./katalog.yaml
  cr: ./cr.yaml
  cycles: 5

  expect:
    steady: true
    noErrors: true
    ops:
      - cycle: 1
        verb: create
        resource: deployments
        name: my-app
