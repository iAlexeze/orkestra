# https://orkestra.sh/docs/reference/schema/e2e/
apiVersion: orkestra.orkspace.io/v1
kind: E2E
metadata:
  name: external-feature-flags-e2e
  description: >
    external: feature flag rollout gate — GET /flags/:name/v2Enabled drives
    replica count. v2Enabled=true (default) → spec.replicas (5).
    Run with `ork e2e --dev-server`.

spec:
  katalog: ./katalog.yaml
  crd: ../crd.yaml
  cr: ./cr-e2e.yaml

  cluster:
    provider: kind
    name: ork-e2e
    reuse: false

  expect:
    - name: Deployment at full replicas when v2Enabled is true
      after: cr-applied
      timeout: 90s
      resources:
        - kind: Deployment
          name: my-app
          namespace: default
          ready: true

    - name: Status v2Enabled is true and activeReplicas is 5
      after: cr-applied
      timeout: 60s
      kubectl:
        get:
          - kind: WebApp
            name: my-app
            namespace: default
            field: .status.v2Enabled
            equals: "true"
          - kind: Deployment
            name: my-app
            namespace: default
            field: .spec.replicas
            equals: "5"

    - name: Cleanup verified
      after: cr-deleted
      timeout: 30s
      resources:
        - kind: Deployment
          name: my-app
          namespace: default
          count: 0
        - kind: WebApp
          name: my-app
          namespace: default
          count: 0
