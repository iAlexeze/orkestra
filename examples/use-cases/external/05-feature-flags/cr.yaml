apiVersion: demo.orkestra.io/v1
kind: WebApp
metadata:
  name: my-app
spec:
  image: nginx:1.25
  # Dev server /flags/my-app/v2Enabled returns "true" by default.
  # Toggle it: curl -X POST http://localhost:9999/flags/my-app/v2Enabled/toggle
  # Run `ork run --dev-server` before applying this CR.
  serviceUrl: "http://localhost:9999"
  replicas: 5
