apiVersion: demo.orkestra.io/v1
kind: Worker
metadata:
  name: my-worker
spec:
  image: busybox:1.36
  # Dev server handles both motif endpoints:
  #   GET  /vault/v1/secret/data/apps/my-worker → 200 secret data
  #   POST /v1/data/deploy                       → allow:true
  # Run `ork run --dev-server` before applying.
  serviceUrl: "http://localhost:9999"
  replicas: 1
