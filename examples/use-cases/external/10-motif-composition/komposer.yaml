apiVersion: orkestra.orkspace.io/v1
kind: Komposer
metadata:
  name: supply-chain-platform
  version: 0.1.0
  description: >
    Runs WebApp and Worker operators together in one runtime.
    Both import vault-gate and opa-policy from the same motif files.
    WebApp additionally imports supply-chain for image verification.
    The motifs are written once — both operators consume them without
    duplicating any external call logic.

imports:
  files:
    - ./katalog-webapp.yaml
    - ./katalog-worker.yaml
