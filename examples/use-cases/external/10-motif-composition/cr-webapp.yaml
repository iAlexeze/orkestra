apiVersion: demo.orkestra.io/v1
kind: WebApp
metadata:
  name: my-app
spec:
  image: nginx:1.25
  # Dev server handles all three motif endpoints:
  #   GET  /sbom/nginx:1.25           → clean SBOM
  #   POST /cosign/verify             → verified
  #   GET  /vault/v1/secret/data/...  → 200 secret data
  #   POST /v1/data/deploy            → allow:true
  # Run `ork run --dev-server` before applying.
  serviceUrl: "http://localhost:9999"
  replicas: 2
