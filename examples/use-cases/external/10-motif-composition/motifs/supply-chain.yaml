apiVersion: orkestra.orkspace.io/v1
kind: Motif
metadata:
  name: supply-chain
  version: 0.1.0
  description: >
    SBOM and cosign verification, once per image change.
    The motif owns the call sequence, the idempotency gate, and the status fields.
    Any CRD that cares about supply chain safety imports this and passes
    its image and serviceUrl through with:.

inputs:
  - name: serviceUrl
    description: Base URL of the supply chain service (SBOM + cosign endpoints)
    required: true

  - name: image
    description: Container image to verify — bind to {{ .spec.image }} or equivalent
    required: true

resources:
  external:
    # ── Call 1: SBOM vulnerability report ─────────────────────────────────
    # Gate: only fires when this image has not yet been verified or rejected.
    # nginx:vulnerable → critical:3, high:12, clean:false
    # nginx:unknown    → 404 (no SBOM on record — continueOnError: true degrades)
    - name: sbom
      url: "{{ .inputs.serviceUrl }}/sbom/{{ .inputs.image }}"
      method: GET
      continueOnError: true
      timeout: 10s
      when:
        - field: status.verifiedImage
          notEquals: "{{ .inputs.image }}"
        - field: status.rejectedImage
          notEquals: "{{ .inputs.image }}"

    # ── Call 2: cosign signature verification ─────────────────────────────
    # Only fires when SBOM passed. nginx:unsigned → 403.
    # Chained: the SBOM result gates this call so a vulnerable image never
    # reaches the signature service.
    - name: cosign
      url: "{{ .inputs.serviceUrl }}/cosign/verify"
      method: POST
      body: '{"image": "{{ .inputs.image }}"}'
      continueOnError: true
      timeout: 10s
      when:
        - field: status.verifiedImage
          notEquals: "{{ .inputs.image }}"
        - field: status.rejectedImage
          notEquals: "{{ .inputs.image }}"
        - field: external.sbom.status
          equals: "200"
        - field: external.sbom.body
          contains: '"clean":true'

status:
  fields:
    # Close both gates: verifiedImage written on cosign 200.
    - path: verifiedImage
      value: "{{ .inputs.image }}"
      when:
        - field: external.cosign.called
          equals: "true"
        - field: external.cosign.status
          equals: "200"

    - path: supplyChainPhase
      value: "Verifying"
      when:
        - field: status.verifiedImage
          notEquals: "{{ .inputs.image }}"

    # Close both gates: rejectedImage written on cosign 4xx.
    - path: rejectedImage
      value: "{{ .inputs.image }}"
      when:
        - field: external.cosign.called
          equals: "true"
        - field: external.cosign.status
          prefix: "4"

    # Also close on SBOM vulnerability — no point calling cosign.
    - path: rejectedImage
      value: "{{ .inputs.image }}"
      when:
        - field: external.sbom.called
          equals: "true"
        - field: external.sbom.body
          contains: '"clean":false'

    - path: supplyChainPhase
      value: "Verified"
      when:
        - field: status.verifiedImage
          equals: "{{ .inputs.image }}"

    - path: supplyChainPhase
      value: "Rejected"
      when:
        - field: status.rejectedImage
          equals: "{{ .inputs.image }}"
