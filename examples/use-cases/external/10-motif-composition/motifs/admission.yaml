apiVersion: orkestra.orkspace.io/v1
kind: Motif
metadata:
  name: base-admission
  version: 0.1.0
  description: >
    Shared admission rules for all CRDs in this composition.
    Validates that spec.image and spec.serviceUrl are provided.
    Imported by both WebApp and Worker katalogs — defined once.

admission:
  validation:
    rules:
      - field: spec.image
        operator: exists
        message: "spec.image is required"
        action: deny
      - field: spec.serviceUrl
        operator: exists
        message: "spec.serviceUrl is required"
        action: deny
