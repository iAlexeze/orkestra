apiVersion: orkestra.orkspace.io/v1
kind: Motif
metadata:
  name: opa-policy
  version: 0.1.0
  description: >
    OPA policy enforcement gate.
    Submits CR identity (name, namespace, image) to an OPA endpoint on every
    reconcile. The Deployment is gated on allow:true. Denial reason is surfaced
    in status.policyDecision for observability. Any CRD that must pass an org
    policy check before deploying imports this motif.

inputs:
  - name: serviceUrl
    description: OPA service base URL (e.g. http://opa.internal:8181)
    required: true

  - name: policy
    description: OPA policy path to evaluate (e.g. deploy, prod/deploy)
    required: false
    default: "deploy"

resources:
  external:
    # continueOnError: false — Deployment must never exist without a passing check.
    - name: policy
      url: "{{ .inputs.serviceUrl }}/v1/data/{{ .inputs.policy }}"
      method: POST
      body: '{"input": {"name": "{{ .metadata.name }}", "namespace": "{{ .metadata.namespace }}", "image": "{{ .spec.image }}"}}'
      expectedStatus: 200
      continueOnError: false
      timeout: 5s

status:
  fields:
    - path: policyDecision
      value: "{{ .external.policy.body }}"
      when:
        - field: external.policy.called
          equals: "true"

    - path: policyPhase
      value: "Allowed"
      when:
        - field: external.policy.body
          contains: '"allow":true'

    - path: policyPhase
      value: "Denied"
      when:
        - field: external.policy.called
          equals: "true"
        - field: external.policy.body
          contains: '"deny":true'
