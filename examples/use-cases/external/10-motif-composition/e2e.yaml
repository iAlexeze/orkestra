apiVersion: orkestra.orkspace.io/v1
kind: E2E
metadata:
  name: external-motif-composition-e2e
  description: >
    external: motif composition — four shared motifs (admission, supply-chain,
    vault-gate, opa-policy) composed into two operators. WebApp runs all four;
    Worker runs admission + vault + OPA. Both Deployments gated on all checks.
    Run with `ork e2e --dev-server`.

spec:
  katalog: ./komposer.yaml
  crd: ./crd-webapp.yaml
  cr: ./cr-e2e.yaml

  cluster:
    provider: kind
    name: ork-e2e
    reuse: false

  expect:
    - name: Both CRs created
      after: cr-applied
      timeout: 60s
      resources:
        - kind: WebApp
          name: my-app
          namespace: default
        - kind: Worker
          name: my-worker
          namespace: default

    - name: WebApp Deployment ready — all four motif checks pass
      after: cr-applied
      timeout: 120s
      resources:
        - kind: Deployment
          name: my-app
          namespace: default
          ready: true
      commands:
        - run: kubectl get webapp my-app -o jsonpath='{.status.phase}'
          outputContains: Ready

    - name: Worker Deployment ready — vault + OPA checks pass
      after: cr-applied
      timeout: 120s
      resources:
        - kind: Deployment
          name: my-worker
          namespace: default
          ready: true
      commands:
        - run: kubectl get worker my-worker -o jsonpath='{.status.phase}'
          outputContains: Ready

    - name: Cleanup verified
      after: cr-deleted
      timeout: 60s
      resources:
        - kind: Deployment
          name: my-app
          namespace: default
          count: 0
        - kind: Deployment
          name: my-worker
          namespace: default
          count: 0
        - kind: WebApp
          name: my-app
          namespace: default
          count: 0
        - kind: Worker
          name: my-worker
          namespace: default
          count: 0
