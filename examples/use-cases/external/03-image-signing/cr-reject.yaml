apiVersion: demo.orkestra.io/v1
kind: WebApp
metadata:
  name: my-app
spec:
  image: nginx:not-secure
  # Dev server POST /sign rejects this image with 403 — signing policy violation.
  # No Deployment is created. Phase becomes SigningRejected.
  # Run `ork run --dev-server` before applying this CR.
  serviceUrl: "http://localhost:9999"
  replicas: 1
