apiVersion: demo.orkestra.io/v1
kind: WebApp
metadata:
  name: my-app
spec:
  image: nginx:1.25
  # Dev server responds to POST /sign with {"signed":true} — ignores body and token.
  # No IMAGE_SIGNING_TOKEN needed in dev. Run `ork run --dev-server` before applying.
  serviceUrl: "http://localhost:9999"
  replicas: 2
