apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: webapp-image-signing
  description: >
    External pattern 03 — image signing with the "once per image" pattern.
    The signing call only fires when spec.image differs from status.signedImage.
    After a successful sign, status.signedImage is set to the current image —
    subsequent reconciles skip the call entirely until the image changes again.
    No new machinery needed: a status field and a when: condition do all the work.

spec:
  crds:
    webapp:
      crdFile: ../crd.yaml

      workers: 2
      resync: 30s

      validation:
        rules:
          - field: spec.image
            operator: exists
            message: "spec.image is required"
            action: deny
          - field: spec.serviceUrl
            operator: exists
            message: "spec.serviceUrl is required — your image signing service base URL"
            action: deny

      operatorBox:
        default: true

        onReconcile:
          # ── External call — only fires when the image changes ──────────────
          # The when: condition gates the call: if spec.image already matches
          # status.signedImage the signing service is not called this cycle.
          # This is the idiomatic "once per image" pattern — no annotations,
          # no counters, just a status field and a condition.
          external:
            - name: signImage
              url: "{{ .spec.serviceUrl }}/sign"
              method: POST
              body: '{"image": "{{ .spec.image }}", "namespace": "{{ .metadata.namespace }}"}'
              token: "$IMAGE_SIGNING_TOKEN"
              expectedStatus: 200
              continueOnError: false
              timeout: 15s
              when:
                - field: status.signedImage
                  notEquals: "{{ .spec.image }}"

          # Only created after the image is signed.
          deployments:
            - name: "{{ .metadata.name }}"
              image: "{{ .spec.image }}"
              replicas: "{{ .spec.replicas }}"
              reconcile: true
              when:
                - field: status.signedImage
                  equals: "{{ .spec.image }}"

        status:
          fields:
            - path: phase
              value: "Pending"
              when:
                - field: status.phase
                  operator: notExists

            - path: phase
              value: "Signing"
              when:
                - field: status.signedImage
                  notEquals: "{{ .spec.image }}"

            - path: phase
              value: "Ready"
              when:
                - field: status.signedImage
                  equals: "{{ .spec.image }}"
                - field: "{{ allReplicasReady .children.deployment }}"
                  equals: "true"

            # Written after a successful sign. This is what prevents re-signing
            # on every reconcile — the next cycle sees signedImage == spec.image
            # and skips both the external call and this status write.
            - path: signedImage
              value: "{{ .spec.image }}"
              when:
                - field: external.signImage.called
                  equals: "true"
                - field: external.signImage.status
                  equals: "200"

            - path: lastExternalStatus
              value: "{{ .external.signImage.status }}"
              when:
                - field: external.signImage.called
                  equals: "true"
