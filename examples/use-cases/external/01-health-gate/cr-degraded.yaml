apiVersion: demo.orkestra.io/v1
kind: WebApp
metadata:
  name: my-app-degraded
spec:
  image: nginx:1.25
  # Dev server /status/503 returns 503 — simulates an unhealthy upstream.
  # The Deployment for this CR will never be created until the URL returns 200.
  # Run `ork run --dev-server` or `ork simulate --dev-server` before applying this CR.
  healthCheckUrl: "http://localhost:9999/status/503"
  replicas: 2
