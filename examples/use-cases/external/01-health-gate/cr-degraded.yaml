apiVersion: demo.orkestra.io/v1
kind: WebApp
metadata:
  name: my-app-degraded
spec:
  image: nginx:1.25
  # httpbin returns HTTP 503 for /status/503 — simulates an unhealthy upstream.
  # The Deployment for this CR will never be created until the URL returns 200.
  serviceUrl: "https://httpbin.org/status/503"
  replicas: 2
