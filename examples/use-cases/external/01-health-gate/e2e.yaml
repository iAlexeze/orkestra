# https://orkestra.sh/docs/reference/schema/e2e/
apiVersion: orkestra.orkspace.io/v1
kind: E2E
metadata:
  name: external-health-gate-e2e
  description: >
    external: health gate — Deployment only created when /health returns 200,
    suppressed when /status/503 is returned. Run with `ork e2e --dev-server`.

spec:
  katalog: ./katalog.yaml
  crd: ../crd.yaml
  cr: ./cr-e2e.yaml

  cluster:
    provider: kind
    name: ork-e2e
    reuse: false

  expect:
    - name: Deployment created when health check passes
      after: cr-applied
      timeout: 90s
      resources:
        - kind: Deployment
          name: my-app-healthy
          namespace: default
          ready: true

    - name: No Deployment when health check fails
      after: cr-applied
      timeout: 60s
      resources:
        - kind: Deployment
          name: my-app-degraded
          namespace: default
          count: 0

    - name: Cleanup verified
      after: cr-deleted
      timeout: 60s
      resources:
        - kind: Deployment
          name: my-app-healthy
          namespace: default
          count: 0
        - kind: WebApp
          name: my-app-healthy
          namespace: default
          count: 0
        - kind: WebApp
          name: my-app-degraded
          namespace: default
          count: 0
