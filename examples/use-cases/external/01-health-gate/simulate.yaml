apiVersion: orkestra.orkspace.io/v1
kind: Simulate
metadata:
  name: health-gate-sim
  description: >
    Verify the Deployment is created when the health check returns 200.
    Run with --dev-server — the health endpoint returns 200 so the when:
    condition passes and the Deployment is created in cycle 1.

spec:
  katalog: ./katalog.yaml
  cr: ./cr-healthy.yaml
  cycles: 5

  expect:
    steady: true
    noErrors: true
    ops:
      - cycle: 1
        verb: create
        resource: deployments
        name: my-app-healthy
