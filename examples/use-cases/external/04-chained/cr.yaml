apiVersion: demo.orkestra.io/v1
kind: WebApp
metadata:
  name: my-app
spec:
  image: nginx:1.25
  # Dev server handles the full chain:
  #   POST /auth/token  → returns "dev-token-abc123"
  #   GET  /resources/my-app (authenticated) → returns {"name":"my-app","status":"active","ready":true}
  # No CLIENT_SECRET needed in dev. Run `ork run --dev-server` before applying.
  serviceUrl: "http://localhost:9999"
  replicas: 1
