apiVersion: orkestra.orkspace.io/v1
kind: E2E
metadata:
  name: external-chained-e2e
  description: >
    external: chained calls — POST /auth/token then GET /resources/:name with
    bearer token. Deployment gated on both calls succeeding.
    Run with `ork e2e --dev-server`.

spec:
  katalog: ./katalog.yaml
  crd: ../crd.yaml
  cr: ./cr-e2e.yaml

  cluster:
    provider: kind
    name: ork-e2e
    reuse: false

  expect:
    - name: Deployment created after full auth chain succeeds
      after: cr-applied
      timeout: 90s
      resources:
        - kind: Deployment
          name: my-app
          namespace: default
          ready: true

    - name: Status phase is Ready
      after: cr-applied
      timeout: 60s
      commands:
        - run: kubectl get webapp my-app -o jsonpath='{.status.phase}'
          outputContains: Ready

    - name: Cleanup verified
      after: cr-deleted
      timeout: 30s
      resources:
        - kind: Deployment
          name: my-app
          namespace: default
          count: 0
        - kind: WebApp
          name: my-app
          namespace: default
          count: 0
