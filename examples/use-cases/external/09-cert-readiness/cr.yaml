apiVersion: demo.orkestra.io/v1
kind: WebApp
metadata:
  name: my-app
spec:
  image: nginx:1.25
  # Dev server: GET /certs/my-app/status → 200 issued (default).
  # Toggle to pending: curl -X POST http://localhost:9999/certs/my-app/toggle
  # Run `ork run --dev-server` before applying.
  serviceUrl: "http://localhost:9999"
  replicas: 2
