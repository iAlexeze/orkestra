apiVersion: demo.orkestra.io/v1
kind: WebApp
metadata:
  name: my-app-expired
spec:
  image: nginx:1.25
  # Dev server: GET /vault/v1/secret/data/apps/my-app-expired → 403 (path
  # contains "expired" → lease expired). Phase: SecretExpired. No Deployment.
  # Run `ork run --dev-server` before applying.
  serviceUrl: "http://localhost:9999"
  replicas: 2
