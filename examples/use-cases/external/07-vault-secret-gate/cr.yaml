apiVersion: demo.orkestra.io/v1
kind: WebApp
metadata:
  name: my-app
spec:
  image: nginx:1.25
  # Dev server: GET /vault/v1/secret/data/apps/my-app → 200 with secret data.
  # No VAULT_TOKEN needed in dev — the mock server ignores the header.
  # Run `ork run --dev-server` before applying.
  serviceUrl: "http://localhost:9999"
  replicas: 2
