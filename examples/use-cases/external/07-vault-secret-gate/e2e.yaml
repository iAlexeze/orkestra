apiVersion: orkestra.orkspace.io/v1
kind: E2E
metadata:
  name: external-vault-secret-gate-e2e
  description: >
    external: Vault secret gate — GET /vault/v1/secret/data/:path before the
    Deployment. Valid path → Ready. Path containing "expired" → SecretExpired,
    no Deployment. Run with `ork e2e --dev-server`.

spec:
  katalog: ./katalog.yaml
  crd: ../crd.yaml
  cr: ./cr-e2e.yaml

  cluster:
    provider: kind
    name: ork-e2e
    reuse: false

  expect:
    - name: Deployment created when Vault secret is valid
      after: cr-applied
      timeout: 90s
      resources:
        - kind: Deployment
          name: my-app
          namespace: default
          ready: true

    - name: No Deployment when secret is expired — status shows SecretExpired
      after: cr-applied
      timeout: 60s
      resources:
        - kind: Deployment
          name: my-app-expired
          namespace: default
          count: 0
      commands:
        - run: kubectl get webapp my-app-expired -o jsonpath='{.status.phase}'
          outputContains: SecretExpired

    - name: Cleanup verified
      after: cr-deleted
      timeout: 60s
      resources:
        - kind: Deployment
          name: my-app
          namespace: default
          count: 0
        - kind: WebApp
          name: my-app
          namespace: default
          count: 0
        - kind: WebApp
          name: my-app-expired
          namespace: default
          count: 0
