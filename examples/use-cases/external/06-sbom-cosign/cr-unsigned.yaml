apiVersion: demo.orkestra.io/v1
kind: WebApp
metadata:
  name: my-app
spec:
  image: nginx:unsigned
  # Dev server: GET /sbom/nginx:unsigned → clean report (SBOM passes),
  # POST /cosign/verify → 403 (no signature found). Phase: SignatureRejected.
  # No Deployment is created. Run `ork run --dev-server` before applying.
  serviceUrl: "http://localhost:9999"
  replicas: 2
