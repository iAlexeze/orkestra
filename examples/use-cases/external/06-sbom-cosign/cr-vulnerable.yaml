apiVersion: demo.orkestra.io/v1
kind: WebApp
metadata:
  name: my-app
spec:
  image: nginx:vulnerable
  # Dev server: GET /sbom/nginx:vulnerable → critical:3, high:12, clean:false.
  # The cosign call is never made — gated out by the SBOM result.
  # Phase: VulnerabilityRejected. No Deployment is created.
  # Run `ork run --dev-server` before applying.
  serviceUrl: "http://localhost:9999"
  replicas: 2
