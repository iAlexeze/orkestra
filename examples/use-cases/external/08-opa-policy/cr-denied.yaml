apiVersion: demo.orkestra.io/v1
kind: WebApp
metadata:
  name: deny-my-app
spec:
  image: nginx:1.25
  # Dev server: POST /v1/data/deploy → deny:true because name contains "deny".
  # Phase: PolicyDenied. No Deployment is created.
  # Run `ork run --dev-server` before applying.
  serviceUrl: "http://localhost:9999"
  replicas: 2
