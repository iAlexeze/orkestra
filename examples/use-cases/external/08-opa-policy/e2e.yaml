# https://orkestra.sh/docs/reference/schema/e2e/
apiVersion: orkestra.orkspace.io/v1
kind: E2E
metadata:
  name: external-opa-policy-e2e
  description: >
    external: OPA policy enforcement — POST /v1/data/deploy before the
    Deployment. allow:true → Ready. Name containing "deny" → PolicyDenied,
    no Deployment. Run with `ork e2e --dev-server`.

spec:
  katalog: ./katalog.yaml
  crd: ../crd.yaml
  cr: ./cr-e2e.yaml

  cluster:
    provider: kind
    name: ork-e2e
    reuse: false

  expect:
    - name: Deployment created when OPA allows
      after: cr-applied
      timeout: 90s
      resources:
        - kind: Deployment
          name: my-app
          namespace: default
          ready: true

    - name: No Deployment when OPA denies — status shows PolicyDenied
      after: cr-applied
      timeout: 60s
      resources:
        - kind: Deployment
          name: deny-my-app
          namespace: default
          count: 0
      kubectl:
        get:
          - kind: WebApp
            name: deny-my-app
            namespace: default
            field: .status.phase
            equals: PolicyDenied

    - name: Cleanup verified
      after: cr-deleted
      timeout: 60s
      resources:
        - kind: Deployment
          name: my-app
          namespace: default
          count: 0
        - kind: WebApp
          name: my-app
          namespace: default
          count: 0
        - kind: WebApp
          name: deny-my-app
          namespace: default
          count: 0
