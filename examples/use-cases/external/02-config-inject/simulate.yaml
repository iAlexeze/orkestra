apiVersion: orkestra.orkspace.io/v1
kind: Simulate
metadata:
  name: config-inject-sim
  description: >
    Verify the Deployment and ConfigMap are created in cycle 1 with real config
    data from the dev server. Run with --dev-server so the external call hits
    localhost:9999 and the ConfigMap when: condition passes.

spec:
  katalog: ./katalog.yaml
  cr: ./cr.yaml
  cycles: 5

  expect:
    steady: true
    noErrors: true
    ops:
      - cycle: 1
        verb: create
        resource: deployments
        name: my-app
      - cycle: 1
        verb: create
        resource: configmaps
        name: my-app-config
