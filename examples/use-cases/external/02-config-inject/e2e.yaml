apiVersion: orkestra.orkspace.io/v1
kind: E2E
metadata:
  name: external-config-inject-e2e
  description: >
    external: config inject — response body embedded into a ConfigMap on every
    reconcile. Requires ork start dev-server in a separate terminal.

spec:
  katalog: ./katalog.yaml
  crd: ../crd.yaml
  cr: ./cr.yaml

  cluster:
    provider: kind
    name: ork-e2e
    reuse: false

  expect:
    - name: ConfigMap created with injected external config
      after: cr-applied
      timeout: 60s
      resources:
        - kind: ConfigMap
          name: my-app-config
          namespace: default

    - name: Cleanup verified
      after: cr-deleted
      timeout: 30s
      resources:
        - kind: ConfigMap
          name: my-app-config
          namespace: default
          count: 0
