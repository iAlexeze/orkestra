# https://orkestra.sh/docs/reference/schema/e2e/
apiVersion: orkestra.orkspace.io/v1
kind: E2E
metadata:
  name: external-config-inject-e2e
  description: >
    external: config inject — GET /config/:name response body embedded into
    a ConfigMap on every reconcile. Deployment mounts it without a restart.
    Run with `ork e2e --dev-server`.

spec:
  katalog: ./katalog.yaml
  crd: ../crd.yaml
  cr: ./cr-e2e.yaml

  cluster:
    provider: kind
    name: ork-e2e
    reuse: false

  expect:
    - name: ConfigMap created and contains injected config
      after: cr-applied
      timeout: 90s
      resources:
        - kind: ConfigMap
          name: my-app-config
          namespace: default
      kubectl:
        get:
          - kind: ConfigMap
            name: my-app-config
            namespace: default
            field: .data["app.json"]
            outputContains: production

    - name: Status reflects successful external call
      after: cr-applied
      timeout: 60s
      kubectl:
        get:
          - kind: WebApp
            name: my-app
            namespace: default
            field: .status.phase
            equals: Ready

    - name: Cleanup verified
      after: cr-deleted
      timeout: 30s
      resources:
        - kind: ConfigMap
          name: my-app-config
          namespace: default
          count: 0
        - kind: WebApp
          name: my-app
          namespace: default
          count: 0
