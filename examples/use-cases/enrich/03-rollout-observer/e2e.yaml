# https://orkestra.sh/docs/reference/schema/e2e/
apiVersion: orkestra.orkspace.io/v1
kind: E2E
metadata:
  name: enrich-rollout-observer-e2e
  description: >
    or: enrich condition — replicaset data is fetched only during rollouts or
    when spec.debug is true. Verifies no replicaset data in status during steady
    state, and that setting debug: true surfaces the replicaset data immediately.

spec:
  katalog: ./katalog.yaml
  crd: ../crd.yaml
  cr: ./cr.yaml

  cluster:
    provider: kind
    name: ork-e2e
    reuse: false

  expect:
    - name: Microservice CR created and ready
      after: cr-applied
      timeout: 90s
      resources:
        - kind: Microservice
          name: web-frontend
          namespace: default
        - kind: Deployment
          name: web-frontend
          namespace: default
          ready: true

    - name: No replicaset data in steady state (or gate held)
      after: cr-applied
      timeout: 60s
      commands:
        - run: kubectl get microservice web-frontend -o jsonpath='{.status.replicaSetCount}'
          outputContains: ""

    - name: Enable debug mode
      after: cr-applied
      timeout: 30s
      commands:
        - run: kubectl patch microservice web-frontend --type=merge -p '{"spec":{"debug":"true"}}'
          exitCode: 0

    - name: Debug mode accepted and phase stays Ready
      after: cr-applied
      timeout: 60s
      commands:
        - run: kubectl get microservice web-frontend -o jsonpath='{.status.phase}'
          outputContains: Ready

    - name: Cleanup verified
      after: cr-deleted
      timeout: 60s
      resources:
        - kind: Microservice
          name: web-frontend
          namespace: default
          count: 0
        - kind: Deployment
          name: web-frontend
          namespace: default
          count: 0
