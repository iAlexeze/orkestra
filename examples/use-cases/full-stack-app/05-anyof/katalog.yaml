apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: flex-app
  description: >
    Pattern 05 — anyOf:.
    Creates Jobs when any one of several phase conditions is true (OR logic).
    when: and anyOf: can be combined: when: is AND, anyOf: is OR, both must pass.
    Replaces multi-branch if-conditions in OnReconcile hooks.

spec:
  crds:
    flex-app:
      crdFile: ./crd.yaml

      workers: 2
      resync: 30s

      operatorBox:
        onCreate:
          deployments:
            - name: "{{ .metadata.name }}"
              image: "{{ .spec.image }}"

        onReconcile:
          jobs:
            - name: "{{ .metadata.name }}-cleanup"
              image: alpine:3.19
              command: ["/bin/sh", "-c", "echo 'cleanup complete'"]
              anyOf:
                - field: status.phase
                  equals: "Failed"
                - field: status.phase
                  equals: "Succeeded"

            - name: "{{ .metadata.name }}-notify"
              image: alpine:3.19
              command: ["/bin/sh", "-c", "echo 'notification sent'"]
              when:
                - field: spec.notify
                  equals: "true"
              anyOf:
                - field: status.phase
                  equals: "Running"
                - field: status.phase
                  equals: "Failed"
                - field: status.phase
                  equals: "Succeeded"

        status:
          fields:
            - path: phase
              value: "Running"
              when:
                - field: status.phase
                  operator: notExists
            - path: phase
              value: "Succeeded"
              when:
                - field: "{{ jobSucceeded .children.job }}"
                  equals: "true"
