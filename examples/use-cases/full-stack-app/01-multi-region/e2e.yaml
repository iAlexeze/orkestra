apiVersion: orkestra.orkspace.io/v1
kind: E2E
metadata:
  name: multi-region-list-e2e
  description: >
    forEach over a list — one CR spec.regions list produces one Deployment per region.
    Verifies three regional Deployments are created and ready.

spec:
  katalog: ./katalog.yaml
  crd: ./crd.yaml
  cr: ./cr.yaml

  cluster:
    provider: kind
    name: ork-e2e
    reuse: false

  expect:
    - name: MultiRegionApp CR created
      after: cr-applied
      timeout: 60s
      resources:
        - kind: MultiRegionApp
          name: my-multi-region
          namespace: default

    - name: Three regional Deployments ready
      after: cr-applied
      timeout: 90s
      resources:
        - kind: Deployment
          name: my-multi-region-us-east-1
          namespace: default
          ready: true
        - kind: Deployment
          name: my-multi-region-eu-west-1
          namespace: default
          ready: true
        - kind: Deployment
          name: my-multi-region-ap-southeast-1
          namespace: default
          ready: true

    - name: Cleanup verified
      after: cr-deleted
      timeout: 60s
      resources:
        - kind: MultiRegionApp
          name: my-multi-region
          namespace: default
          count: 0
        - kind: Deployment
          name: my-multi-region-us-east-1
          namespace: default
          count: 0
