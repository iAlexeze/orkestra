apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: cross-crd
  description: >
    Pattern 03 — cross:.
    ManagedDatabase creates a Postgres Deployment and exposes its endpoint in status.
    DatabaseBackedApp observes the ManagedDatabase CR via cross: and waits for it to
    reach Ready before creating its own Deployment. Replaces client.Get() + re-queue.

spec:
  crds:
    managed-database:
      crdFile: ./crd-managed-database.yaml

      workers: 2
      resync: 30s

      operatorBox:
        onCreate:
          deployments:
            - name: "{{ .metadata.name }}-postgres"
              image: "postgres:17"
              env:
                - name: POSTGRES_PASSWORD
                  value: "postgres"
                - name: POSTGRES_USER
                  value: "postgres"
                - name: POSTGRES_DB
                  value: "postgres"

          services:
            - name: "{{ .metadata.name }}-postgres"
              port: "5432"
              reconcile: true

        status:
          fields:
            - path: phase
              value: "Pending"
              when:
                - field: status.phase
                  operator: notExists
            - path: resourceExists
              value: "ResourceExists"
              when:
                - field: "{{ resourceExists .children.deployment }}"
                  equals: "true"
            - path: phase
              value: "Ready"
              when:
                - field: "{{ allReplicasReady .children.deployment }}"
                  equals: "true"
            - path: endpoint
              value: "{{ .metadata.name }}-postgres.{{ .metadata.namespace }}.svc.cluster.local:5432"
            - path: replicasReady
              value: "{{ allReplicasReady .children.deployment }}"
            - path: resourceExists
              value: "{{ resourceExists .children.deployment }}"

    database-backed-app:
      crdFile: ./crd-database-backed-app.yaml

      workers: 2
      resync: 30s
      dependsOn:
        managed-database: healthy

      validation:
        rules:
          - field: spec.image
            operator: exists
            action: deny

      operatorBox:
        cross:
          - crd: managed-database
            selector:
              name: "{{ .metadata.name }}-db"
              namespace: "{{ .metadata.namespace }}"
            as: db

        onReconcile:
          deployments:
            - name: "{{ .metadata.name }}"
              image: "{{ .spec.image }}"
              when:
                - field: "{{ phase .cross.db }}"
                  equals: "Ready"

          configMaps:
            - name: "{{ .metadata.name }}-config"
              data:
                DB_HOST: "{{ .cross.db.status.endpoint }}"
                DB_PORT: "5432"
              when:
                - field: "{{ resourceExists .cross.db }}"
                  equals: "true"

        status:
          fields:
            - path: phase
              value: "WaitingForDatabase"
              when:
                - field: "{{ resourceExists .cross.db }}"
                  equals: "false"
            - path: phase
              value: "WaitingForDatabase"
              when:
                - field: "{{ phase .cross.db }}"
                  notEquals: "Ready"
            - path: phase
              value: "Ready"
              when:
                - field: "{{ phase .cross.db }}"
                  equals: "Ready"
                - field: "{{ allReplicasReady .children.deployment }}"
                  equals: "true"
            - path: databaseEndpoint
              value: "{{ get .cross.db \"status\" \"endpoint\" }}"
              when:
                - field: "{{ resourceExists .cross.db }}"
                  equals: "true"
