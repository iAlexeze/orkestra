# DatabaseBackedApp — the observer side of cross: observation
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: databasebackedapps.advanced.orkestra.io
spec:
  group: advanced.orkestra.io
  scope: Namespaced
  names:
    plural: databasebackedapps
    singular: databasebackedapp
    kind: DatabaseBackedApp
    shortNames: [dba]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: DatabaseEndpoint
          type: string
          jsonPath: .status.databaseEndpoint
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [image]
              properties:
                image:
                  type: string
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
