# https://orkestra.sh/docs/reference/schema/e2e/
apiVersion: orkestra.orkspace.io/v1
kind: E2E
metadata:
  name: cross-crd-e2e
  description: >
    cross: observation — DatabaseBackedApp reads ManagedDatabase status via cross: and
    injects the database endpoint into its Deployment env and ConfigMap.
    Verifies the app waits while the database is not ready, then reconciles once it is.

spec:
  katalog: ./katalog.yaml
  crd: ./crd-managed-database.yaml
  cr: ./database-cr.yaml

  cluster:
    provider: kind
    name: ork-e2e
    reuse: false

  setup:
    apply:
      - ./application-cr.yaml
      - ./crd-database-backed-app.yaml
    wait:
      - kind: ManagedDatabase
        name: my-app-db
        namespace: default
        timeout: 60s

  expect:
    - name: DatabaseBackedApp CR created
      after: cr-applied
      timeout: 60s
      resources:
        - kind: DatabaseBackedApp
          name: my-app
          namespace: default

    - name: Deployment ready after database is available
      after: cr-applied
      timeout: 90s
      resources:
        - kind: Deployment
          name: my-app
          namespace: default
          ready: true

    - name: ConfigMap carries database endpoint
      after: cr-applied
      timeout: 60s
      resources:
        - kind: ConfigMap
          name: my-app-config
          namespace: default

    - name: Status reflects database endpoint
      after: cr-applied
      timeout: 90s
      kubectl:
        get:
          - kind: DatabaseBackedApp
            name: my-app
            namespace: default
            field: .status.databaseEndpoint
            outputContains: my-app-db

    - name: Cleanup verified
      after: cr-deleted
      timeout: 60s
      resources:
        - kind: DatabaseBackedApp
          name: my-app
          namespace: default
          count: 0
        - kind: Deployment
          name: my-app
          namespace: default
          count: 0
