# FlexApp — demonstrates or: OR condition logic
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: flexapps.advanced.orkestra.io
spec:
  group: advanced.orkestra.io
  scope: Namespaced
  names:
    plural: flexapps
    singular: flexapp
    kind: FlexApp
    shortNames: [fa]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                notify:
                  type: string
                  enum: ["true", "false"]
                  default: "false"
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true

