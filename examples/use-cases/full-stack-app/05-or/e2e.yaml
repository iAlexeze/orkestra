# https://orkestra.sh/docs/reference/schema/e2e/
apiVersion: orkestra.orkspace.io/v1
kind: E2E
metadata:
  name: or-e2e
  description: >
    or: OR conditions — a cleanup Job fires when the FlexApp phase is Failed
    OR the CR has notify: "true". Verifies the Deployment is created in normal
    operation, and that setting notify: "true" triggers the notification Job.

spec:
  katalog: ./katalog.yaml
  crd: ./crd.yaml
  cr: ./cr.yaml

  cluster:
    provider: kind
    name: ork-e2e
    reuse: false

  expect:
    - name: FlexApp CR created
      after: cr-applied
      timeout: 60s
      resources:
        - kind: FlexApp
          name: my-flex-app
          namespace: default

    - name: Deployment ready
      after: cr-applied
      timeout: 90s
      resources:
        - kind: Deployment
          name: my-flex-app
          namespace: default
          ready: true

    - name: No notify Job in normal operation
      after: cr-applied
      timeout: 30s
      resources:
        - kind: Job
          name: my-flex-app-notify
          namespace: default
          count: 0

    - name: Patch notify to true
      after: cr-applied
      timeout: 30s
      commands:
        - run: kubectl patch flexapp my-flex-app --type=merge -p '{"spec":{"notify":"true"}}'
          exitCode: 0

    - name: Notify Job created after or condition met
      after: cr-applied
      timeout: 60s
      resources:
        - kind: Job
          name: my-flex-app-notify
          namespace: default

    - name: Cleanup verified
      after: cr-deleted
      timeout: 60s
      resources:
        - kind: FlexApp
          name: my-flex-app
          namespace: default
          count: 0
        - kind: Deployment
          name: my-flex-app
          namespace: default
          count: 0
