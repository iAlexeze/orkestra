# 02 — external: health gate
apiVersion: advanced.orkestra.io/v1alpha1
kind: GatedApp
metadata:
  name: my-gated-app
  namespace: default
spec:
  image: nginx:1.25
  # Dev server handles both calls:
  #   GET /health           → 200 (gates Deployment creation)
  #   GET /flags/my-gated-app → feature flags JSON (non-blocking)
  # Run `ork run --dev-server` before applying this CR.
  serviceUrl: "http://localhost:9999"
