# GatedApp — demonstrates external: HTTP calls before resource creation
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: gatedapps.advanced.orkestra.io
spec:
  group: advanced.orkestra.io
  scope: Namespaced
  names:
    plural: gatedapps
    singular: gatedapp
    kind: GatedApp
    shortNames: [ga]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: HealthCheck
          type: string
          jsonPath: .status.lastHealthCheck
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [image, serviceUrl]
              properties:
                image:
                  type: string
                serviceUrl:
                  type: string
                  description: URL of the service to health-check before deploying
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
