apiVersion: orkestra.orkspace.io/v1
kind: E2E
metadata:
  name: workload-autoscale-time-e2e
  description: >
    Time-based workload autoscaler. Validates the Deployment is created
    and CR status reflects the current window. Replica count is not asserted
    as it depends on the time the test runs.

spec:
  katalog: ./katalog.yaml
  crd: ./crd.yaml
  cr: ./cr.yaml

  cluster:
    provider: kind
    name: ork-e2e-workload-autoscale
    reuse: false

  expect:
    - name: Deployment created
      after: cr-applied
      timeout: 90s
      resources:
        - kind: Deployment
          name: my-worker
          namespace: default
    - name: CR status phase is written
      after: cr-applied
      timeout: 60s
      kubectl:
        get:
          - kind: WorkerService
            name: my-worker
            namespace: default
            field: .status.phase
            oneOf: [Peak, Steady]

  onFailure:
    kubectl:
      get:
        - kind: WorkerService
          name: my-worker
          namespace: default
      describe:
        - kind: Deployment
          name: my-worker
          namespace: default
    commands:
      - kubectl get pods -n default -o wide
