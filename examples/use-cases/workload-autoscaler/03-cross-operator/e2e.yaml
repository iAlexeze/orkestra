apiVersion: orkestra.orkspace.io/v1
kind: E2E
metadata:
  name: workload-autoscale-cross-e2e
  description: >
    Cross-operator workload autoscaler. JobQueue starts with depth 150 —
    above the scale-up threshold. Verifies workers scale up and status
    reflects the observed queue depth. Then patches depth to 0 and verifies
    the worker status shifts to Steady.

spec:
  katalog: ./katalog.yaml
  crd: ./crd-worker.yaml
  cr: ./cr.yaml

  setup:
    apply:
      - ./crd-queue.yaml

  cluster:
    provider: kind
    name: ork-e2e-workload-autoscale-cross
    reuse: false

  expect:
    - name: Queue and Worker Deployments created
      after: cr-applied
      timeout: 90s
      resources:
        - kind: Deployment
          name: my-queue-queue
          namespace: default
        - kind: Deployment
          name: my-worker
          namespace: default
          ready: true

    - name: Worker status reflects queue depth and scales up
      after: cr-applied
      timeout: 120s
      kubectl:
        get:
          - kind: JobWorker
            name: my-worker
            namespace: default
            field: .status.phase
            equals: Scaling
          - kind: JobWorker
            name: my-worker
            namespace: default
            field: .status.observedQueueDepth
            equals: "150"

    - name: Worker Deployment has more replicas than baseline
      after: cr-applied
      timeout: 30s
      commands:
        - run: >-
            kubectl get deployment my-worker -n default
            -o jsonpath='{.spec.replicas}'
          outputContains: "4"

    - name: Patch queue depth to zero — queue drained
      after: cr-applied
      timeout: 30s
      commands:
        - run: >-
            kubectl patch jobqueue my-queue -n default
            --type=merge -p '{"spec":{"initialDepth":0}}'
          exitCode: 0

    - name: Worker status shifts to Steady
      after: cr-applied
      timeout: 120s
      kubectl:
        get:
          - kind: JobWorker
            name: my-worker
            namespace: default
            field: .status.phase
            equals: Steady

    - name: Cleanup verified
      after: cr-deleted
      timeout: 60s
      resources:
        - kind: Deployment
          name: my-queue-queue
          namespace: default
          count: 0
        - kind: Deployment
          name: my-worker
          namespace: default
          count: 0
        - kind: JobQueue
          name: my-queue
          namespace: default
          count: 0
        - kind: JobWorker
          name: my-worker
          namespace: default
          count: 0

  onFailure:
    kubectl:
      get:
        - kind: JobQueue
          name: my-queue
          namespace: default
        - kind: JobWorker
          name: my-worker
          namespace: default
      describe:
        - kind: Deployment
          name: my-worker
          namespace: default
    commands:
      - kubectl get pods -n default -o wide
