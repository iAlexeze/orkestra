apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: jobqueues.demo.orkestra.io
spec:
  group: demo.orkestra.io
  scope: Namespaced
  names:
    plural: jobqueues
    singular: jobqueue
    kind: JobQueue
    shortNames: [jq]
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Depth
          type: string
          jsonPath: .status.queueDepth
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                port:
                  type: integer
                  default: 8080
                initialDepth:
                  type: integer
                  description: Simulated queue depth written to status for testing
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
