apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: jobworkers.demo.orkestra.io
spec:
  group: demo.orkestra.io
  scope: Namespaced
  names:
    plural: jobworkers
    singular: jobworker
    kind: JobWorker
    shortNames: [jw]
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Replicas
          type: string
          jsonPath: .status.replicas
        - name: QueueDepth
          type: string
          jsonPath: .status.observedQueueDepth
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [image, queueName]
              properties:
                image:
                  type: string
                port:
                  type: integer
                  default: 9090
                queueName:
                  type: string
                  description: Name of the JobQueue CR to consume from
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
