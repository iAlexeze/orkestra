apiVersion: orkestra.orkspace.io/v1
kind: Simulate
metadata:
  name: workload-autoscale-cross-simulate
  description: >
    Validates the cross-operator workload autoscaler runs without errors.
    JobQueue depth is set via spec.initialDepth — no external services needed.

spec:
  katalog: ./katalog.yaml
  cr: ./cr.yaml
  cycles: 3

  expect:
    noErrors: true
