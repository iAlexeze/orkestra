apiVersion: orkestra.orkspace.io/v1
kind: E2E
metadata:
  name: workload-autoscale-external-e2e
  description: >
    External-API workload autoscaler — scale a Deployment based on live queue
    depth from the dev server. Flips load mid-test, verifies scale-up fires,
    then verifies cleanup. Run with `ork e2e --dev-server`.

spec:
  katalog: ./katalog.yaml
  crd: ./crd.yaml
  cr: ./cr-e2e.yaml

  cluster:
    provider: kind
    name: ork-e2e-workload-autoscale-external
    reuse: false

  expect:
    - name: Deployment created at baseline
      after: cr-applied
      timeout: 90s
      resources:
        - kind: Deployment
          name: my-pool
          namespace: default
          ready: true

    - name: Status phase is Steady at low load
      after: cr-applied
      timeout: 60s
      kubectl:
        get:
          - kind: WorkerPool
            name: my-pool
            namespace: default
            field: .status.phase
            equals: Steady

    - name: Flip to high load
      after: cr-applied
      timeout: 60s
      kubectl:
        port-forward:
          - service: orkestra-dev-server
            namespace: orkestra-system
            port: 9999
            path: /workload-metrics/flip
            method: POST
            equals: high-load

    - name: Pool scales up and status shows Scaling
      after: cr-applied
      timeout: 120s
      kubectl:
        get:
          - kind: WorkerPool
            name: my-pool
            namespace: default
            field: .status.phase
            oneOf: [Scaling, Steady]

    - name: Deployment has more replicas than baseline
      after: cr-applied
      timeout: 30s
      kubectl:
        get:
          - kind: Deployment
            name: my-pool
            namespace: default
            field: .spec.replicas
            greaterThan: "1"

    - name: Cleanup verified
      after: cr-deleted
      timeout: 60s
      resources:
        - kind: Deployment
          name: my-pool
          namespace: default
          count: 0
        - kind: WorkerPool
          name: my-pool
          namespace: default
          count: 0

  onFailure:
    kubectl:
      get:
        - kind: WorkerPool
          name: my-pool
          namespace: default
      describe:
        - kind: Deployment
          name: my-pool
          namespace: default
    commands:
      - kubectl get pods -n default -o wide
      - curl -s http://orkestra-dev-server.orkestra-system.svc:9999/workload-metrics || true
