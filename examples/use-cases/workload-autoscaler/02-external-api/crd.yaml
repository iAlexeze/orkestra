apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: workerpools.demo.orkestra.io
spec:
  group: demo.orkestra.io
  scope: Namespaced
  names:
    plural: workerpools
    singular: workerpool
    kind: WorkerPool
    shortNames: [wp]
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Replicas
          type: string
          jsonPath: .status.replicas
        - name: PendingJobs
          type: string
          jsonPath: .status.pendingJobs
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [image, metricsEndpoint]
              properties:
                image:
                  type: string
                port:
                  type: integer
                  default: 8080
                metricsEndpoint:
                  type: string
                  description: URL of the queue metrics endpoint
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
