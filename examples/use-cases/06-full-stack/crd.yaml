# FullStackApp — combines forEach + external + cross + once + anyOf
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: fullstackapps.advanced.orkestra.io
spec:
  group: advanced.orkestra.io
  scope: Namespaced
  names:
    plural: fullstackapps
    singular: fullstackapp
    kind: FullStackApp
    shortNames: [fsa]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Regions
          type: string
          jsonPath: .status.regionsDeployed
        - name: Database
          type: string
          jsonPath: .status.databaseEndpoint
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [image, regions, serviceUrl]
              properties:
                image:
                  type: string
                regions:
                  type: array
                  items:
                    type: string
                  minItems: 1
                replicasPerRegion:
                  type: integer
                  default: 1
                  minimum: 1
                serviceUrl:
                  type: string
                environment:
                  type: string
                  default: production
                notify:
                  type: string
                  default: "false"
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true