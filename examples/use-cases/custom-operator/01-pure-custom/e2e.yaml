# https://orkestra.sh/docs/reference/schema/e2e/
apiVersion: orkestra.orkspace.io/v1
kind: E2E
metadata:
  name: cert-manager-e2e
  description: >
    custom.target: kubernetes — cert-manager installed via setup.helm.
    Applies a self-signed Certificate CR and asserts the TLS Secret is created.
    No Orkestra bundle or helm install — ork e2e is the test harness only.

spec:
  custom:
    target: kubernetes
  cr: ./cr.yaml

  cluster:
    provider: kind
    name: ork-e2e
    reuse: false

  setup:
    helm:
      - repo: https://charts.jetstack.io
        chart: cert-manager
        namespace: cert-manager
        createNamespace: true
        version: v1.14.5
        values:
          installCRDs: true
    wait:
      - kind: Deployment
        name: cert-manager
        namespace: cert-manager
        ready: true
        timeout: 120s
      - kind: Deployment
        name: cert-manager-webhook
        namespace: cert-manager
        ready: true
        timeout: 120s

  expect:
    - name: ClusterIssuer and Certificate created
      after: cr-applied
      timeout: 30s
      kubectl:
        get:
          - kind: ClusterIssuer
            name: selfsigned-issuer
            field: .status.conditions[0].type
            equals: Ready

    - name: TLS Secret issued by cert-manager
      after: cr-applied
      timeout: 60s
      resources:
        - kind: Secret
          name: my-tls-secret
          namespace: default

    - name: Cleanup verified
      after: cr-deleted
      timeout: 30s
      commands:
        - run: kubectl delete secret my-tls-secret --ignore-not-found
          exitCode: 0
      resources:
        - kind: Secret
          name: my-tls-secret
          namespace: default
          count: 0
