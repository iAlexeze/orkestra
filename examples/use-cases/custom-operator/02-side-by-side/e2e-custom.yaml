apiVersion: orkestra.orkspace.io/v1
kind: E2E
metadata:
  name: appcert-custom-e2e
  description: >
    AppCert via customOperator: true — cert-manager manages the Certificate directly,
    no Orkestra. The AppCert CR is applied and deleted manually; cert-manager issues
    the TLS Secret. Assertions are identical to e2e-orkestra.yaml.

spec:
  customOperator: true
  crd: ./crd.yaml
  cr: ./cr.yaml

  cluster:
    provider: kind
    name: ork-e2e
    reuse: false

  setup:
    helm:
      - repo: https://charts.jetstack.io
        chart: cert-manager
        namespace: cert-manager
        createNamespace: true
        version: v1.14.5
        values:
          installCRDs: true
    wait:
      - kind: Deployment
        name: cert-manager-webhook
        namespace: cert-manager
        ready: true
        timeout: 120s

  expect:
    - name: AppCert CR created
      after: cr-applied
      timeout: 60s
      resources:
        - kind: AppCert
          name: my-app
          namespace: default

    - name: TLS Secret issued directly by cert-manager
      after: cr-applied
      timeout: 90s
      commands:
        - run: |
            kubectl apply -f - <<EOF
            apiVersion: cert-manager.io/v1
            kind: Issuer
            metadata:
              name: my-app-issuer
              namespace: default
            spec:
              selfSigned: {}
            ---
            apiVersion: cert-manager.io/v1
            kind: Certificate
            metadata:
              name: my-app-cert
              namespace: default
            spec:
              secretName: my-app-tls
              issuerRef:
                name: my-app-issuer
                kind: Issuer
              commonName: my-app.example.local
              dnsNames:
                - my-app.example.local
            EOF
          exitCode: 0
      resources:
        - kind: Secret
          name: my-app-tls
          namespace: default

    - name: Cleanup verified
      after: cr-deleted
      timeout: 30s
      commands:
        - run: kubectl delete issuer my-app-issuer -n default --ignore-not-found
          exitCode: 0
        - run: kubectl delete certificate my-app-cert -n default --ignore-not-found
          exitCode: 0
        - run: kubectl delete secret my-app-tls -n default --ignore-not-found
          exitCode: 0
      resources:
        - kind: Secret
          name: my-app-tls
          namespace: default
          count: 0
        - kind: AppCert
          name: my-app
          namespace: default
          count: 0
