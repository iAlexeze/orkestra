apiVersion: orkestra.orkspace.io/v1
kind: E2E
metadata:
  name: appcert-orkestra-e2e
  description: >
    AppCert operator via Orkestra katalog — wraps cert-manager using customResources.
    Assertions are identical to e2e-custom.yaml. When both pass, equivalence is verified.

spec:
  katalog: ./katalog.yaml
  crd: ./crd.yaml
  cr: ./cr.yaml

  cluster:
    provider: kind
    name: ork-e2e
    reuse: false

  setup:
    helm:
      - repo: https://charts.jetstack.io
        chart: cert-manager
        namespace: cert-manager
        createNamespace: true
        version: v1.14.5
        values:
          installCRDs: true
    wait:
      - kind: Deployment
        name: cert-manager-webhook
        namespace: cert-manager
        ready: true
        timeout: 120s

  expect:
    - name: AppCert CR created
      after: cr-applied
      timeout: 60s
      resources:
        - kind: AppCert
          name: my-app
          namespace: default

    - name: TLS Secret issued via Orkestra-managed Certificate
      after: cr-applied
      timeout: 90s
      resources:
        - kind: Secret
          name: my-app-tls
          namespace: default

    - name: Cleanup verified
      after: cr-deleted
      timeout: 30s
      resources:
        - kind: Secret
          name: my-app-tls
          namespace: default
          count: 0
        - kind: AppCert
          name: my-app
          namespace: default
          count: 0
