plugins:
  - search
  - mermaid2:
      version: 10.0.2
  - gh-admonitions
repo_url: https://github.com/iAlexeze/orkestra
site_name: Orkestra - Declarative Operator Runtime for Kubernetes
site_description: Declarative Operator Runtime for Kubernetes
site_url: https://orkestra.sh
site_author: "Orkestra Team"
copyright: "Orkestra"


# site_name: ORK
# docs_dir: coming-soon

# site_url: !ENV READTHEDOCS_CANONICAL_URL
# strict: true


# Configuraton
extra:
  analytics:
    property: G-5Z1VTPDL73
    provider: google
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/orkestra-sh/orkestra
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/orkestra
extra_css:
  - css/footer-nav.css
# - assets/versions.css

# extra_javascript:
# - assets/versions.js

markdown_extensions:
  - markdown_include.include
  - admonition
  - markdown_grid_tables
  # - pymdownx.details
  # - pymdownx.highlight
  # - pymdownx.superfences:
  #     custom_fences:
  #       - name: mermaid
  #         class: mermaid
  #         format: !!python/name:mermaid2.fence_mermaid_custom
  - codehilite:
      css_class: highlight
  - toc:
      permalink: true

theme:
  icon:
    repo: fontawesome/brands/github
  # custom_dir: docs/overrides
  favicon: assets/ork-logo-white.png
  font:
    text: Work Sans
  logo: assets/ork-logo-white.png
  name: material
  palette:
  - media: '(prefers-color-scheme: light)'
    # primary: teal
    # primary: dark purple
    primary: brown
    scheme: default
    toggle:
      icon: material/brightness-7
      name: Switch to dark mode
  - media: '(prefers-color-scheme: dark)'
    # primary: teal
    # primary: dark purple
    primary: brown
    scheme: slate
    toggle:
      icon: material/brightness-4
      name: Switch to light mode