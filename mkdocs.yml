plugins:
  - search
  - mermaid2:
      version: 10.0.2
      arguments:
        securityLevel: 'loose'
        startOnLoad: true
        theme: "^(document.querySelector('body').getAttribute('data-md-color-scheme') === 'slate') ? 'dark' : 'default'"
  - gh-admonitions
repo_url: https://github.com/iAlexeze/orkestra
site_name: Orkestra - Declarative Operator Runtime for Kubernetes
site_description: Declarative Operator Runtime for Kubernetes
site_url: https://orkestra.sh
site_author: "Orkestra Team"
copyright: "Orkestra"


# site_name: ORK
# docs_dir: coming-soon

# site_url: !ENV READTHEDOCS_CANONICAL_URL
# strict: true


# Configuraton
extra:
  analytics:
    property: G-5Z1VTPDL73
    provider: google
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/orkestra-sh/orkestra
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/orkestra

markdown_extensions:
  - markdown_include.include
  - admonition
  - markdown_grid_tables
  - toc:
      permalink: true

theme:
  features: 
    - navigation.footer
  icon:
    repo: fontawesome/brands/github
  favicon: assets/ork-logo-white.png
  font:
    text: Work Sans
  logo: assets/ork-logo-white.png
  name: material
  palette:
  - media: '(prefers-color-scheme: light)'
    primary: deep purple
    scheme: default
    toggle:
      icon: material/brightness-7
      name: Switch to dark mode
  - media: '(prefers-color-scheme: dark)'
    primary: deep purple
    scheme: slate
    toggle:
      icon: material/brightness-4
      name: Switch to light mode