apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: network-suite
  author: orkspace
  version: 0.1.0
  tags:
    - networking
    - traffic
    - tls
    - ratelimit
    - resilience
  description: >
    A 7-CRD networking suite operator. Manages traffic routing, ReplicaSet-backed
    compute, health monitoring, rate limiting with rotating keys, circuit breaking,
    and self-signed TLS certificate generation. Imports local motifs for structural
    patterns — keeping each CRD entry focused on its domain logic only.

spec:
  crds:
    traffic-policy:
      namespaced: true
      allowedNamespaces:
        - demo-06
      apiTypes:
        group: net.demo.orkestra.io
        version: v1alpha1
        kind: TrafficPolicy
        plural: trafficpolicies
      operatorBox:
        onCreate:
          configMaps:
            - name: "{{ .metadata.name }}-traffic-policy"
              data:
                WEIGHT: "{{ .spec.weight }}"
                TIMEOUT: "{{ .spec.timeout }}"
                RETRIES: "{{ .spec.retries }}"
        status:
          fields:
            - path: phase
              value: "Active"
            - path: weight
              value: "{{ .spec.weight }}"

    virtual-service:
      namespaced: true
      allowedNamespaces:
        - demo-06
      apiTypes:
        group: net.demo.orkestra.io
        version: v1alpha1
        kind: VirtualService
        plural: virtualservices
      operatorBox:
        onCreate:
          services:
            - name: "{{ .metadata.name }}-vs"
              port: "80"
              targetPort: "{{ .spec.port }}"
          configMaps:
            - name: "{{ .metadata.name }}-virtual-service"
              data:
                HOST: "{{ .spec.host }}"
                UPSTREAM: "{{ .spec.upstream }}"
        status:
          fields:
            - path: phase
              value: "Bound"
            - path: host
              value: "{{ .spec.host }}"
            - path: endpoint
              value: "{{ .metadata.name }}-vs.{{ .metadata.namespace }}.svc.cluster.local"

    backend:
      namespaced: true
      allowedNamespaces:
        - demo-06
      apiTypes:
        group: net.demo.orkestra.io
        version: v1alpha1
        kind: Backend
        plural: backends
      imports:
        - motif: ../motifs/replicaset-service/motif.yaml
          with:
            image: "{{ .spec.image }}"
            replicas: "{{ .spec.replicas }}"
            port: "{{ .spec.port }}"
      operatorBox:
        status:
          fields:
            - path: phase
              value: "Ready"

    health-check:
      namespaced: true
      allowedNamespaces:
        - demo-06
      apiTypes:
        group: net.demo.orkestra.io
        version: v1alpha1
        kind: HealthCheck
        plural: healthchecks
      operatorBox:
        onCreate:
          configMaps:
            - name: "{{ .metadata.name }}-health-check"
              data:
                TARGET: "{{ .spec.target }}"
                PATH: "{{ .spec.path }}"
                INTERVAL: "{{ .spec.interval }}"
                TIMEOUT: "{{ .spec.timeout }}"
        status:
          fields:
            - path: phase
              value: "Monitoring"
            - path: target
              value: "{{ .spec.target }}"
            - path: interval
              value: "{{ .spec.interval }}"

    rate-limit:
      namespaced: true
      allowedNamespaces:
        - demo-06
      apiTypes:
        group: net.demo.orkestra.io
        version: v1alpha1
        kind: RateLimit
        plural: ratelimits
      imports:
        - motif: ../motifs/rotating-api-key/motif.yaml
          with:
            rotateAfter: "180d"
      operatorBox:
        onCreate:
          configMaps:
            - name: "{{ .metadata.name }}-rate-limit"
              data:
                LIMIT: "{{ .spec.limit }}"
                WINDOW: "{{ .spec.window }}"
                BURST: "{{ .spec.burst }}"
        status:
          fields:
            - path: phase
              value: "Enforced"
            - path: limit
              value: "{{ .spec.limit }}"
            - path: window
              value: "{{ .spec.window }}"

    circuit-breaker:
      namespaced: true
      allowedNamespaces:
        - demo-06
      apiTypes:
        group: net.demo.orkestra.io
        version: v1alpha1
        kind: CircuitBreaker
        plural: circuitbreakers
      operatorBox:
        onCreate:
          configMaps:
            - name: "{{ .metadata.name }}-circuit-breaker"
              data:
                TARGET: "{{ .spec.target }}"
                THRESHOLD: "{{ .spec.threshold }}"
                COOLDOWN: "{{ .spec.cooldown }}"
                HALF_OPEN_REQUESTS: "{{ .spec.halfOpenRequests }}"
        status:
          fields:
            - path: phase
              value: "Closed"
            - path: target
              value: "{{ .spec.target }}"
            - path: threshold
              value: "{{ .spec.threshold }}"

    tls-policy:
      namespaced: true
      allowedNamespaces:
        - demo-06
      apiTypes:
        group: net.demo.orkestra.io
        version: v1alpha1
        kind: TLSPolicy
        plural: tlspolicies
      imports:
        - motif: ../motifs/tls-cert/motif.yaml
          with:
            commonName: "{{ .spec.commonName }}"
            rotateAfter: "1y"
      operatorBox:
        status:
          fields:
            - path: phase
              value: "Issued"
