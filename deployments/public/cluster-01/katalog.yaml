apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: hello-website
  author: orkspace
  version: 0.1.0
  description: The canonical Orkestra operator. One CRD, one Deployment, one Service.
  tags:
    - hello
    - beginner
    - web

spec:
  crds:
    website:
      allowedNamespaces:
        - demo-01

      apiTypes:
        group: demo.orkestra.io
        version: v1alpha1
        kind: Website
        plural: websites

      operatorBox:
        default: true

        status:
          fields:
            - path: phase
              value: "Running"
            - path: endpoint
              value: "{{ .metadata.name }}.{{ .metadata.namespace }}.svc.cluster.local"

        onCreate:
          deployments:
            - name: "{{ .metadata.name }}"
              image: "{{ .spec.image }}"
              replicas: "{{ .spec.replicas }}"
              port: "{{ .spec.port }}"
              reconcile: true

          services:
            - name: "{{ .metadata.name }}-svc"
              port: "80"
              targetPort: "{{ .spec.port }}"
              reconcile: true
