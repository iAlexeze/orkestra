apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: data-platform
  author: orkspace
  version: 0.1.0
  tags:
    - data
    - pipeline
    - analytics
    - secrets
    - rotation
  description: >
    A 10-CRD data platform operator. Manages the full data lifecycle: ingestion
    (Source, Dataset), processing (Pipeline, Transform, Schema), delivery (Sink),
    scheduling (Schedule, DataJob), and observability (Alert, Dashboard).
    Imports local motifs for worker pools and rotating credentials.

spec:
  crds:
    pipeline:
      namespaced: true
      allowedNamespaces:
        - demo-05
      apiTypes:
        group: data.demo.orkestra.io
        version: v1alpha1
        kind: Pipeline
        plural: pipelines
      imports:
        - motif: ../motifs/rotating-credentials/motif.yaml
          with:
            rotateAfter: "30d"
      operatorBox:
        onCreate:
          configMaps:
            - name: "{{ .metadata.name }}-pipeline"
              data:
                SOURCE: "{{ .spec.source }}"
                SINK: "{{ .spec.sink }}"
                BATCH_SIZE: "{{ .spec.batchSize }}"
        status:
          fields:
            - path: phase
              value: "Running"
            - path: source
              value: "{{ .spec.source }}"
            - path: sink
              value: "{{ .spec.sink }}"

    dataset:
      namespaced: true
      allowedNamespaces:
        - demo-05
      apiTypes:
        group: data.demo.orkestra.io
        version: v1alpha1
        kind: Dataset
        plural: datasets
      imports:
        - motif: ../motifs/rotating-api-key/motif.yaml
          with:
            rotateAfter: "180d"
      operatorBox:
        onCreate:
          configMaps:
            - name: "{{ .metadata.name }}-dataset"
              data:
                FORMAT: "{{ .spec.format }}"
                LOCATION: "{{ .spec.location }}"
        status:
          fields:
            - path: phase
              value: "Available"
            - path: format
              value: "{{ .spec.format }}"

    schema:
      namespaced: true
      allowedNamespaces:
        - demo-05
      apiTypes:
        group: data.demo.orkestra.io
        version: v1alpha1
        kind: Schema
        plural: schemas
      operatorBox:
        onCreate:
          configMaps:
            - name: "{{ .metadata.name }}-schema"
              data:
                VERSION: "{{ .spec.version }}"
                COMPATIBILITY: BACKWARD
        status:
          fields:
            - path: phase
              value: "Registered"
            - path: version
              value: "{{ .spec.version }}"

    transform:
      namespaced: true
      allowedNamespaces:
        - demo-05
      apiTypes:
        group: data.demo.orkestra.io
        version: v1alpha1
        kind: Transform
        plural: transforms
      imports:
        - motif: ../motifs/worker-pool/motif.yaml
          with:
            image: "{{ .spec.image }}"
            workers: "{{ .spec.workers }}"
      operatorBox:
        onCreate:
          configMaps:
            - name: "{{ .metadata.name }}-transform"
              data:
                TYPE: "{{ .spec.type }}"
                PARALLELISM: "{{ .spec.workers }}"
        status:
          fields:
            - path: phase
              value: "Running"

    sink:
      namespaced: true
      allowedNamespaces:
        - demo-05
      apiTypes:
        group: data.demo.orkestra.io
        version: v1alpha1
        kind: Sink
        plural: sinks
      imports:
        - motif: ../motifs/rotating-credentials/motif.yaml
          with:
            rotateAfter: "60d"
      operatorBox:
        onCreate:
          configMaps:
            - name: "{{ .metadata.name }}-sink"
              data:
                TARGET: "{{ .spec.target }}"
                FORMAT: "{{ .spec.format }}"
        status:
          fields:
            - path: phase
              value: "Connected"
            - path: target
              value: "{{ .spec.target }}"

    source:
      namespaced: true
      allowedNamespaces:
        - demo-05
      apiTypes:
        group: data.demo.orkestra.io
        version: v1alpha1
        kind: Source
        plural: sources
      imports:
        - motif: ../motifs/rotating-credentials/motif.yaml
          with:
            rotateAfter: "60d"
      operatorBox:
        onCreate:
          configMaps:
            - name: "{{ .metadata.name }}-source"
              data:
                ENDPOINT: "{{ .spec.endpoint }}"
                POLL_INTERVAL: "{{ .spec.pollInterval }}"
        status:
          fields:
            - path: phase
              value: "Connected"
            - path: endpoint
              value: "{{ .spec.endpoint }}"

    data-job:
      namespaced: true
      allowedNamespaces:
        - demo-05
      apiTypes:
        group: data.demo.orkestra.io
        version: v1alpha1
        kind: DataJob
        plural: datajobs
      imports:
        - motif: ../motifs/worker-pool/motif.yaml
          with:
            image: "{{ .spec.image }}"
            workers: "{{ .spec.parallelism }}"
      operatorBox:
        onCreate:
          configMaps:
            - name: "{{ .metadata.name }}-job"
              data:
                TIMEOUT: "{{ .spec.timeout }}"
        status:
          fields:
            - path: phase
              value: "Running"
            - path: parallelism
              value: "{{ .spec.parallelism }}"

    schedule:
      namespaced: true
      allowedNamespaces:
        - demo-05
      apiTypes:
        group: data.demo.orkestra.io
        version: v1alpha1
        kind: Schedule
        plural: schedules
      operatorBox:
        onCreate:
          configMaps:
            - name: "{{ .metadata.name }}-schedule"
              data:
                CRON: "{{ .spec.cron }}"
                TARGET: "{{ .spec.target }}"
                TIMEZONE: UTC
        status:
          fields:
            - path: phase
              value: "Active"
            - path: cron
              value: "{{ .spec.cron }}"
            - path: target
              value: "{{ .spec.target }}"

    alert:
      namespaced: true
      allowedNamespaces:
        - demo-05
      apiTypes:
        group: data.demo.orkestra.io
        version: v1alpha1
        kind: Alert
        plural: alerts
      operatorBox:
        onCreate:
          configMaps:
            - name: "{{ .metadata.name }}-alert"
              data:
                SEVERITY: "{{ .spec.severity }}"
                CONDITION: "{{ .spec.condition }}"
                CHANNEL: "{{ .spec.channel }}"
        status:
          fields:
            - path: phase
              value: "Active"
            - path: severity
              value: "{{ .spec.severity }}"

    dashboard:
      namespaced: true
      allowedNamespaces:
        - demo-05
      apiTypes:
        group: data.demo.orkestra.io
        version: v1alpha1
        kind: Dashboard
        plural: dashboards
      operatorBox:
        onCreate:
          configMaps:
            - name: "{{ .metadata.name }}-dashboard"
              data:
                TITLE: "{{ .spec.title }}"
                REFRESH: "{{ .spec.refreshInterval }}"
                PANELS: "{{ .spec.panelCount }}"
        status:
          fields:
            - path: phase
              value: "Published"
            - path: title
              value: "{{ .spec.title }}"
