apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: app-platform
  author: orkspace
  version: 0.1.0
  tags:
    - apps
    - platform
    - replicaset
    - secrets
    - config
  description: >
    A 5-CRD application platform operator. Manages the full application lifecycle
    using ReplicaSets (not Deployments), auto-rotating API keys, and ConfigMap
    distribution. Imports local motifs for structural patterns.

spec:
  crds:
    application:
      namespaced: true
      allowedNamespaces:
        - demo-04
      apiTypes:
        group: apps.demo.orkestra.io
        version: v1alpha1
        kind: Application
        plural: applications
      imports:
        - motif: ../motifs/replicaset-service/motif.yaml
          with:
            image: "{{ .spec.image }}"
            replicas: "{{ .spec.replicas }}"
            port: "{{ .spec.port }}"
        - motif: ../motifs/rotating-api-key/motif.yaml
          with:
            rotateAfter: "90d"
      operatorBox:
        onCreate:
          configMaps:
            - name: "{{ .metadata.name }}-config"
              data:
                LOG_LEVEL: info
                MAX_CONNECTIONS: "100"
        status:
          fields:
            - path: phase
              value: "Ready"

    app-service:
      namespaced: true
      allowedNamespaces:
        - demo-04
      apiTypes:
        group: apps.demo.orkestra.io
        version: v1alpha1
        kind: AppService
        plural: appservices
      operatorBox:
        onCreate:
          services:
            - name: "{{ .metadata.name }}-svc"
              port: "{{ .spec.port }}"
          configMaps:
            - name: "{{ .metadata.name }}-svc-config"
              data:
                TIMEOUT: 30s
                RETRIES: "3"
        status:
          fields:
            - path: phase
              value: "Active"
            - path: port
              value: "{{ .spec.port }}"

    route:
      namespaced: true
      allowedNamespaces:
        - demo-04
      apiTypes:
        group: apps.demo.orkestra.io
        version: v1alpha1
        kind: Route
        plural: routes
      operatorBox:
        onCreate:
          configMaps:
            - name: "{{ .metadata.name }}-route"
              data:
                HOST: "{{ .spec.host }}"
                PATH: "{{ .spec.path }}"
                SERVICE: "{{ .spec.service }}"
        status:
          fields:
            - path: phase
              value: "Bound"
            - path: host
              value: "{{ .spec.host }}"

    config-bundle:
      namespaced: true
      allowedNamespaces:
        - demo-04
      apiTypes:
        group: apps.demo.orkestra.io
        version: v1alpha1
        kind: ConfigBundle
        plural: configbundles
      operatorBox:
        onCreate:
          configMaps:
            - name: "{{ .metadata.name }}-bundle"
              data:
                TARGET: "{{ .spec.target }}"
                ENV: "{{ .spec.env }}"
        status:
          fields:
            - path: phase
              value: "Applied"
            - path: target
              value: "{{ .spec.target }}"

    scale-policy:
      namespaced: true
      allowedNamespaces:
        - demo-04
      apiTypes:
        group: apps.demo.orkestra.io
        version: v1alpha1
        kind: ScalePolicy
        plural: scalepolicies
      operatorBox:
        onCreate:
          configMaps:
            - name: "{{ .metadata.name }}-scale-policy"
              data:
                MIN_REPLICAS: "{{ .spec.minReplicas }}"
                MAX_REPLICAS: "{{ .spec.maxReplicas }}"
                CPU_THRESHOLD: "{{ .spec.cpuThreshold }}"
        status:
          fields:
            - path: phase
              value: "Enforced"
            - path: minReplicas
              value: "{{ .spec.minReplicas }}"
            - path: maxReplicas
              value: "{{ .spec.maxReplicas }}"
