  orkestra:
  - annotations:
      artifacthub.io/alternativeNames: |
        - operator-sdk
        - kubebuilder
        - kudo
        - crossplane
      artifacthub.io/changes: |-
        - kind: added
          description: "Initial release of Orkestra v1.0.0"
          links:
            - name: GitHub Release
              url: https://github.com/iAlexeze/orkestra/releases/tag/v1.0.0
        - kind: added
          description: "Control Center dashboard for real-time CRD observability"
        - kind: added
          description: "Declarative version conversion between API versions"
        - kind: added
          description: "Built-in validation and mutation rules for any CRD"
        - kind: added
          description: "OCI registry pattern distribution"
      artifacthub.io/crds: |
        - kind: Katalog
          version: v1Alpha
          name: katalogs.orkestra.konductor.io
          displayName: Katalog
          description: Declarative operator definition for one or more CRDs
        - kind: Komposer
          version: v1Alpha
          name: komposers.orkestra.konductor.io
          displayName: Komposer
          description: Compose multiple Katalogs from different sources
      artifacthub.io/license: MIT
      artifacthub.io/links: |
