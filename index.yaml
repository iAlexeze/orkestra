apiVersion: v1
entries:
  orkestra:
  - annotations:
      artifacthub.io/changes: |-
        - kind: added
          description: "Initial release of Orkestra v1.0.0"
          links:
            - name: GitHub Release
              url: https://github.com/orkspace/orkestra/releases/tag/v1.0.0
        - kind: added
          description: "Control Center dashboard for real-time CRD observability"
        - kind: added
          description: "Declarative version conversion between API versions"
        - kind: added
          description: "Built-in validation and mutation rules for any CRD"
        - kind: added
          description: "OCI registry pattern distribution"
      artifacthub.io/crds: |
        - kind: Katalog
          version: v1
          name: orkestra.orkspace.io
          displayName: Katalog
          description: Declarative operator definition for one or more CRDs
        - kind: Komposer
          version: v1
          name: orkestra.orkspace.io
          displayName: Komposer
          description: Compose multiple Katalogs from different sources
        - kind: Motif
          version: v1
          name: orkestra.orkspace.io
          displayName: Motif
          description: A parameterized set of resource declarations. Write once, import from any Katalog.
        - kind: E2E
          version: v1
          name: orkestra.orkspace.io
          displayName: E2E
          description: Declarative end-to-end testing for kubernetes operators
      artifacthub.io/crdsExamples: |
        - apiVersion: orkestra.orkspace.io/v1
          kind: Katalog
          metadata:
            name: hello-website
            author: orkspace
            version: 0.1.0
            description: The canonical Orkestra operator. One CRD, one Deployment, one Service.
            tags:
              - hello
              - beginner
              - web

          spec:
            crds:
              website:
                crdFile: ./crd.yaml
                crFiles:
                  - ./cr.yaml
                allowedNamespaces:
                  - default

                operatorBox:
                  default: true

                  status:
                    fields:
                      - path: phase
                        value: "Running"
                      - path: endpoint
                        value: "{{ .metadata.name }}.{{ .metadata.namespace }}.svc.cluster.local"

                  onCreate:
                    deployments:
                      - name: "{{ .metadata.name }}"
                        image: "{{ .spec.image }}"
                        replicas: "{{ .spec.replicas }}"
                        port: "{{ .spec.port }}"
                        reconcile: true

                    services:
                      - name: "{{ .metadata.name }}-svc"
                        port: "80"
                        targetPort: "{{ .spec.port }}"
                        reconcile: true
        
        - apiVersion: orkestra.orkspace.io/v1
          kind: Katalog
          metadata:
            name: kafka
            version: v1.0.0
            description: >-
              A declarative Apache Kafka deployment pattern that provisions a single‑broker
              Kafka cluster in KRaft mode (no Zookeeper dependency) using any CR image version.
              The pattern accepts any valid Apache Kafka image tag through spec.version and
              exposes port 9092 via a stable Service. Includes an optional Kafka UI management
              console. Suitable for event streaming, log aggregation, and real-time data pipelines.
            author: orkspace
            license: Apache-2.0
            tags:
              - kafka
              - messaging
              - streaming
              - stateful
              - persistent-storage
              - service
              - single-instance
              - kraft
              - distributed
              - development
              - ci
              - production-ready
              - storage
              - katalog

          spec:
            crds:
              kafka:
                apiTypes:
                  group: kafka.orkestra.io
                  version: v1
                  kind: Kafka
                  plural: kafkas
                workers: 2
                resync: 1m
                imports:
                  - motif: oci://ghcr.io/orkspace/orkestra-registry/patterns/motifs/kafka:v0.1.0
                    with:
                      image: 'apache/kafka:{{ .spec.version | default "latest" }}'
                      replicas: '{{ .spec.replicas | default "1" }}'
                      resourceProfile: '{{ .spec.resourceProfile | default "compute-heavy" }}'
                      volumeSize: '{{ .spec.storageSize | default "20Gi" }}'
                      storageClass: '{{ .spec.storageClass | default "standard" }}'
                      enableUI: '{{ .spec.enableUI | default "true" }}'

        - apiVersion: orkestra.orkspace.io/v1
          kind: Komposer
          metadata:
            name: platform-full
            author: orkspace
            version: 0.1.0
            description: >
              Multi-source Komposer: OCI registry pattern + local Katalog + Helm chart.
              Shows the full composition model for a platform team.

          # ── Sources ────────────────────────────────────────────────────────────────

          imports:
            # OCI registry pattern — versioned, immutable
            # Pull a published operator pattern from the Orkestra registry
            registry:
              - url: ghcr.io/orkspace/patterns/postgres@v1.0.0
                oci: true
                # auth:
                #   type: bearer
                #   fromEnv: ORK_REGISTRY_TOKEN
                # version is pinned via @v1.0.0 — immutable, safe for production

            # Local Katalog — your team's custom CRD
            files:
              - ./website-katalog.yaml

            # Helm chart source — pulls CRD behavior definitions from a chart
            helm:
              - repo: https://github.com/orkspace/charts.git
                chart: orkestra-katalog-example
                path: katalog-example
                version: v0.1.0     # ignore to use main branch or add branch name instead
                # auth:
                #   type: bearer
                #   fromEnv: HELM_REPO_TOKEN

          # ── Overrides ──────────────────────────────────────────────────────────────
          # Environment-specific tuning. Wins over all sources.

          spec:
            crds:
              # Override the postgres pattern for production
              postgres:
                workers: 8
                resync: 30s
                # All other postgres behavior inherited from the OCI pattern

              # Override the website operator for production
              website:
                workers: 6
                resync: 15s
                # All other website behavior inherited from the local Katalog

              # Disable the database operator since we now have Postgres
              database:
                enabled: false

        - 

        - apiVersion: orkestra.orkspace.io/v1
          kind: E2E
          metadata:
            name: hello-website-e2e
            description: Deploy a single nginx website and verify the deployment and service comes up and are cleaned up on delete

          spec:
            katalog: ./katalog.yaml
            crd: ./crd.yaml
            cr: ./cr.yaml

            cluster:
              provider: kind
              name: ork-e2e
              reuse: false

            expect:
              - name: CR created
                after: cr-applied
                timeout: 60s
                resources:
                  - kind: Website
                    name: hello-website
                    namespace: default

              - name: Deployment created
                after: cr-applied
                timeout: 60s
                resources:
                  - kind: Deployment
                    namespace: default
                    ready: true
                  - kind: Service
                    namespace: default

              - name: Cleanup verified
                after: cr-deleted
                timeout: 30s
                resources:
                  - kind: Deployment
                    name: hello-website
                    namespace: default
                    count: 0
                  - kind: Service
                    name: hello-website-svc
                    namespace: default
                    count: 0
                  - kind: Website
                    name: hello-website
                    namespace: default
                    count: 0

        - apiVersion: orkestra.orkspace.io/v1
          kind: Motif
          metadata:
            name: kafka
            version: v0.1.0
            description: >
              Apache Kafka StatefulSet in KRaft mode (no Zookeeper), persistent storage,
              headless Service for broker DNS, external Service, and Kafka UI management console.
            author: orkspace
            license: Apache-2.0
            tags:
              - kafka
              - messaging
              - streaming
              - statefulset
              - storage
              - kraft
              - distributed
              - ui

          inputs:
            - name: image
              description: Apache Kafka image (KRaft-capable)
              default: "apache/kafka:latest"

            - name: replicas
              description: Number of broker/controller replicas
              default: "1"

            - name: resourceProfile
              description: CPU/memory profile (small, burst, standard, compute-heavy)
              default: "compute-heavy"

            - name: volumeSize
              description: PVC storage size for the log directory
              default: "20Gi"

            - name: storageClass
              description: StorageClass for dynamic PVC provisioning
              default: "standard"

            - name: kafkaUiImage
              description: Kafka UI management console image
              default: "provectuslabs/kafka-ui:latest"

            - name: enableUI
              description: Deploy the Kafka UI management console (true/false)
              default: "true"

          resources:
            statefulSets:
              - name: "{{ .metadata.name }}-kafka"
                image: "{{ .inputs.image }}"
                replicas: "{{ .inputs.replicas }}"
                serviceName: "{{ .metadata.name }}-kafka-headless"
                port: 9092
                resources:
                  profile: "{{ .inputs.resourceProfile }}"
                reconcile: true
                probes:
                  startup:
                    type: tcp
                    profile: slow-start
                  liveness:
                    type: tcp
                    profile: standard
                  readiness:
                    type: tcp
                    profile: standard
                volumeClaimTemplates:
                  - name: data
                    storageClass: "{{ .inputs.storageClass }}"
                    storageSize: "{{ .inputs.volumeSize }}"
                    mountPath: /var/lib/kafka/data
                env:
                  - name: KAFKA_NODE_ID
                    value: "1"
                  - name: KAFKA_PROCESS_ROLES
                    value: "broker,controller"
                  - name: KAFKA_LISTENERS
                    value: "PLAINTEXT://:9092,CONTROLLER://:9093"
                  - name: KAFKA_ADVERTISED_LISTENERS
                    value: "PLAINTEXT://{{ .metadata.name }}-kafka-0.{{ .metadata.name }}-kafka-headless.{{ .metadata.namespace }}.svc.cluster.local:9092"
                  - name: KAFKA_CONTROLLER_QUORUM_VOTERS
                    value: "1@{{ .metadata.name }}-kafka-0.{{ .metadata.name }}-kafka-headless.{{ .metadata.namespace }}.svc.cluster.local:9093"
                  - name: KAFKA_CONTROLLER_LISTENER_NAMES
                    value: "CONTROLLER"
                  - name: KAFKA_INTER_BROKER_LISTENER_NAME
                    value: "PLAINTEXT"
                  - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
                    value: "1"
                  - name: KAFKA_LOG_DIRS
                    value: "/var/lib/kafka/data"

            services:
              - name: "{{ .metadata.name }}-kafka-headless"
                headless: true
                port: 9092
                targetPort: 9092
                reconcile: true

              - name: "{{ .metadata.name }}-kafka"
                port: 9092
                targetPort: 9092
                reconcile: true

              - name: "{{ .metadata.name }}-kafka-ui-svc"
                port: 8080
                targetPort: 8080
                type: LoadBalancer
                reconcile: true
                when:
                  - field: inputs.enableUI
                    equals: "true"

            deployments:
              - name: "{{ .metadata.name }}-kafka-ui"
                image: "{{ .inputs.kafkaUiImage }}"
                env:
                  - name: KAFKA_CLUSTERS_0_NAME
                    value: "{{ .metadata.name }}"
                  - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
                    value: "{{ .metadata.name }}-kafka.{{ .metadata.namespace }}.svc.cluster.local:9092"
                port: 8080
                resources:
                  profile: "{{ .inputs.resourceProfile }}"
                reconcile: true
                probes:
                  liveness:
                    type: http
                    path: /actuator/health
                    profile: standard
                  readiness:
                    type: http
                    path: /actuator/health
                    profile: standard
                when:
                  - field: inputs.enableUI
                    equals: "true"

          status:
            fields:
              - path: kafkaReady
                value: "{{ allReplicasReady .children.statefulset }}"
              - path: bootstrapServers
                value: "{{ .metadata.name }}-kafka.{{ .metadata.namespace }}.svc.cluster.local:9092"
              - path: kafkaUiUrl
                value: "http://{{ .metadata.name }}-kafka-ui-svc.{{ .metadata.namespace }}.svc.cluster.local:8080"

      artifacthub.io/license: Apache 2.0
      artifacthub.io/links: |
        - name: Documentation
          url: https://docs.orkestra.sh
        - name: Whitepaper
          url: https://docs.orkestra.sh/publications/declarative-operators-whitepaper
        - name: Control Center Dashboard
          url: https://cc.orkestra.sh
      artifacthub.io/operator: "true"
      artifacthub.io/operatorCapabilities: Deep Insights
      artifacthub.io/screenshots: |
