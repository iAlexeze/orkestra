{% if page and (page.previous_page or page.next_page) %}
<footer class="ork-footer-nav">
  <nav class="ork-footer-nav__inner">

    {% if page.previous_page %}
    <a href="{{ page.previous_page.url | url }}" class="ork-footer-nav__link ork-footer-nav__link--prev">
      <div class="ork-footer-nav__button">
        <span class="md-icon" aria-hidden="true">chevron_left</span>
        <span class="ork-footer-nav__label">Previous</span>
      </div>
      <div class="ork-footer-nav__title">{{ page.previous_page.title }}</div>
    </a>
    {% endif %}

    {% if page.next_page %}
    <a href="{{ page.next_page.url | url }}" class="ork-footer-nav__link ork-footer-nav__link--next">
      <div class="ork-footer-nav__button">
        <span class="ork-footer-nav__label">Next</span>
        <span class="md-icon" aria-hidden="true">chevron_right</span>
      </div>
      <div class="ork-footer-nav__title">{{ page.next_page.title }}</div>
    </a>
    {% endif %}

  </nav>
</footer>
{% endif %}
