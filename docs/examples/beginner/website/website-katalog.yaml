apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: website-katalog
  description: >-
    Manages the Website CRD.
    For every Website CR, Orkestra creates a Deployment and a Service.
    No Go code required.

spec:
  finalizers:
    - finalizer.demo.orkestra.io/website

# endpoints:
#   Controls which HTTP endpoints are exposed for this CRD.
#   All fields are optional. Omitted fields use operator defaults.
#   
#   enabled: true|false      # if false, endpoints are disabled   (default: true)
#   health: true|false       # /katalog/<crd>/health              (default: true)
#   info: true|false         # /katalog/<crd>                     (default: true)
#
#   Example:
#     endpoints:
#       info: false          # hide CRD info endpoint
  crds:
    pod-governance:
      enabled: false
      apiTypes:
        kind: Pod          # built-in — Kubernetes knows the rest
      restrictedNamespaces:
        - kube-system              # never clean up system pods
        - cert-manager

    deployment-watcher:
      enabled: false
      apiTypes:
        kind: Deployment
      endpoints:
        info: false
    secrets-manager:
      enabled: false
      apiTypes:
        kind: Secret
      endpoints:
        info: false
      restrictedNamespaces:
        - kube-system
        - cert-manager

    backend:
      # enabled: false
      apiTypes:
        group: orkestra.konduktor.io
        version: v1alpha1
        kind: OrkApp
        plural: orkapps
      endpoints:
        enabled: true  # This disables endpoint creation for this CRD
      operatorBox:
        default: true
      dependsOn:
        - frontend

    frontend:
      enabled: true     # Default
      namespaced: true  # Default
      workers: 2
      resync: 30s
      # dependsOn:
      #   - backend

      apiTypes:
        group: demo.orkestra.io
        version: v1alpha1
        kind: Website
        plural: websites
        # location omitted — no compiled types needed
        # Orkestra uses *unstructured.Unstructured automatically

      operatorBox:
        finalizers:
          - finalizer.demo.orkestra.io/website

        # ── onCreate ──────────────────────────────────────────────────────
        # Runs on every reconcile. Create is idempotent — skipped if exists.
        # reconcile: true means also apply as drift correction — no need to
        # declare the same resource again under onReconcile.

        onCreate:
          deployments:
            - name: "{{ .metadata.name }}"
              image: "{{ .spec.image }}"
              replicas: "{{ .spec.replicas }}"
              port: "{{ .spec.port }}"
              namespace: "{{ .metadata.namespace }}"
              reconcile: true
              labels:
                - key: app
                  value: "{{ .metadata.name }}"

          services:
            - name: "{{ .metadata.name }}-svc"
              type: "{{ .spec.serviceType }}"
              port: "80"
              targetPort: "{{ .spec.port }}"
              namespace: "{{ .metadata.namespace }}"
              reconcile: true
              when:
              - field: spec.exposePublicly
                equals: "true"
              labels:
                - key: app
                  value: "{{ .metadata.name }}"
            - name: "{{ .metadata.name }}-general-svc"
              type: "ClusterIP"
              port: "8080"
              targetPort: "8080"
              namespace: "{{ .metadata.namespace }}"
              reconcile: true
              labels:
                - key: app
                  value: "{{ .metadata.name }}"




        # onDelete — owner references handle Deployment + Service cleanup
        # automatically. No explicit onDelete needed.

      queue:
        default: true       # Do not create a separate queue for this CRD (Default: false)
        maxQueueDepth: 200

      description: >-
        Manages a web application Deployment and Service pair.
        Declare what you want in the Website CR spec — Orkestra handles the rest.