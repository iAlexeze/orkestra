# values/overrides.yaml
# Override chart defaults for this environment.
# Applied on top of helm-example/values.yaml.

# This environment uses a different API group
apiGroup: platform.example.io

crds:
  database:
    enabled: true
    kind: Database
    plural: databases
    namespaced: false
    workers: 2
    resync: 1m
    operatorBox:
      default: true
      mode: dynamic
    description: Database CRD from Helm chart

  cache:
    enabled: true
    kind: Cache
    plural: caches
    namespaced: true
    workers: 2
    resync: 30s
    operatorBox:
      default: true
      mode: dynamic
    description: Cache CRD from Helm chart