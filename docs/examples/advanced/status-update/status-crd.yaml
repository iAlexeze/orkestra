apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: websites.demo.orkestra.io
spec:
  group: demo.orkestra.io
  versions:
    - name: v1alpha1
      served: true
      storage: true
      # ── Add this block ───────────────────────────────────────────────────
      subresources:
        status: {}      # enables /status subresource endpoint
      # ────────────────────────────────────────────────────────────────────
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                image:
                  type: string
                replicas:
                  type: integer
                port:
                  type: integer
                serviceType:
                  type: string
            # ── Add this block ─────────────────────────────────────────────
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true  # accepts any status fields
              properties:
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                      observedGeneration:
                        type: integer
                observedGeneration:
                  type: integer
                phase:
                  type: string
                observedReplicas:
                  type: string
                endpoint:
                  type: string
            # ───────────────────────────────────────────────────────────────
  names:
    kind: Website
    plural: websites
    singular: website
  scope: Namespaced