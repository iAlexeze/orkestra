apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: websites.demo.orkestra.io
spec:
  group: demo.orkestra.io
  scope: Namespaced
  names:
    plural: websites
    singular: website
    kind: Website
    listKind: WebsiteList

  versions:
    # ───────────────────────────────────────────────
    # v1alpha1 — simple version with "theme"
    # ───────────────────────────────────────────────
    - name: v1alpha1
      served: true
      storage: false
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: ["image"]
              properties:
                image:
                  type: string
                replicas:
                  type: integer
                  default: 1
                port:
                  type: integer
                  default: 80
                theme:
                  type: string

    # ───────────────────────────────────────────────
    # v1 — adds "seo" block, removes "theme"
    # ───────────────────────────────────────────────
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: ["image"]
              properties:
                image:
                  type: string
                replicas:
                  type: integer
                  default: 1
                port:
                  type: integer
                  default: 80
                seo:
                  type: object
                  properties:
                    enabled:
                      type: boolean
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true

  # ───────────────────────────────────────────────
  # Conversion webhook → Orkestra HTTPS endpoint
  # ───────────────────────────────────────────────
  conversion:
    strategy: Webhook
    webhook:
      clientConfig:
        service:
          name: orkestra
          namespace: orkestra-system
          path: /convert
          port: 8443
        caBundle: 
      conversionReviewVersions: ["v1"]
