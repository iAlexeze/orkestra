# ───────────────────────────────────────────────────────────────
# Namespace
# ───────────────────────────────────────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: orkestra-system
---
# ───────────────────────────────────────────────────────────────
# Secret
# ───────────────────────────────────────────────────────────────
apiVersion: v1
data:
  tls.crt: 
  tls.key: 
kind: Secret
metadata:
  name: orkestra-tls
  namespace: orkestra-system
type: kubernetes.io/tls
---
# ───────────────────────────────────────────────────────────────
# ServiceAccount
# ───────────────────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orkestra
  namespace: orkestra-system
---
# ───────────────────────────────────────────────────────────────
# RBAC — Orkestra needs cluster-wide access to CRDs + workloads
# ───────────────────────────────────────────────────────────────
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: orkestra
  labels:
    app.kubernetes.io/name: orkestra
rules:
  # Manage any resource declared in the Katalog
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Leader election lease
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]

  # Emit Kubernetes events
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]

  # Register webhook configurations
  - apiGroups: ["admissionregistration.k8s.io"]
    resources:
      - validatingwebhookconfigurations
      - mutatingwebhookconfigurations
    verbs: ["get", "create", "update", "patch"]

# ───────────────────────────────────────────────────────────────
# ClusterRoleBinding
# ───────────────────────────────────────────────────────────────
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: orkestra
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: orkestra
subjects:
  - kind: ServiceAccount
    name: orkestra
    namespace: orkestra

# ───────────────────────────────────────────────────────────────
# Ingress
# ───────────────────────────────────────────────────────────────
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: orkestra-ingress
  namespace: orkestra-system
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
spec:
  ingressClassName: nginx
  rules:
    - host: xx.orkestra.sh
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: orkestra
                port:
                  number: 8080
