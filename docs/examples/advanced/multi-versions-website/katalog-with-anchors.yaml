
# ============================================================
# Shared anchors
# ============================================================

# Common reconciler template for both versions
commonReconciler: &commonReconciler
  reconciler:
    default: true
    onCreate:
      - name: "{{ .metadata.name }}"
        image: "{{ .spec.image }}"
        replicas: "{{ .spec.replicas }}"
        port: "{{ .spec.port }}"
        reconcile: true

# Common spec mapping used in conversion paths
commonSpec: &commonSpec
  image: "{{ .spec.image }}"
  replicas: "{{ .spec.replicas }}"
  port: "{{ .spec.port }}"

# Versions
storageVersion: &storageVersion v1
alpha: &alpha v1alpha1

# Common Type
commonType: &commonType
  group: demo.orkestra.io
  kind: Website
  plural: websites


# ── Katalog ─────────────────────────────────────────────────────────────
apiVersion: orkestra.konductor.io/v1Alpha
kind: Katalog
metadata:
  name: multi-version-website
  description: Manages Website CRD with v1alpha1 and v1 versions

spec:
  crds:
    # ============================================================
    # v1alpha1 CRD
    # ============================================================
    - name: website-v1alpha1
      <<: *commonReconciler
      apiTypes:
        <<: *commonType
        version: *alpha


    # ============================================================
    # v1 CRD
    # ============================================================
    - name: website-v1
      <<: *commonReconciler
      apiTypes:
        <<: *commonType
        version: *storageVersion

      # ============================================================
      # Declarative conversion rules (anchor‑powered)
      # ============================================================
      conversion:
        storageVersion: *storageVersion
        paths:
          # v1alpha1 → v1
          - from: *alpha
            to: *storageVersion
            spec:
              <<: *commonSpec
              seo:
                enabled: false   # default because v1alpha1 has no SEO

          # v1 → v1alpha1
          - from: *storageVersion
            to: *alpha
            spec:
              <<: *commonSpec
              theme: "default"   # default because v1 has no theme
