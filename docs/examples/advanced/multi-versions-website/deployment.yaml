# ───────────────────────────────────────────────────────────────
# Deployment — Orkestra Runtime
# ───────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orkestra-runtime
  namespace: orkestra-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orkestra-runtime
  template:
    metadata:
      labels:
        app: orkestra-runtime
    spec:
      serviceAccountName: orkestra

      # Needed for distroless to read mounted TLS secrets
      securityContext:
        fsGroup: 65532

      containers:
      - name: orkestra
        image: ialexeze/ork:history

        env:
          - name: ENABLE_CONVERSION
            value: "true"
          - name: ENABLE_WEBHOOKS
            value: "false"
          - name: HEALTH_PORT
            value: "8080"
          - name: ORKESTRA_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace

          # Correct: file paths, not secret contents
          - name: TLS_CERT
            value: "/tls/tls.crt"
          - name: TLS_KEY
            value: "/tls/tls.key"

        args:
          - run
          - --katalog
          - /katalogs/conversion-test-katalog.yaml
          # - /katalogs/website-admission-test-katalog.yaml

        ports:
          - containerPort: 8080
          - containerPort: 8443

        volumeMounts:
          - name: katalogs
            mountPath: /katalogs
          - name: tls
            mountPath: /tls
            readOnly: true
        resources: {}

      volumes:
        - name: katalogs
          configMap:
            # name: website-admission-test-katalog
            name: conversion-test-katalog

        - name: tls
          secret:
            secretName: orkestra-tls
---
# ───────────────────────────────────────────────────────────────
# Service — exposes health + conversion webhook
# MUST match CRD conversion.webhook.clientConfig.service
# ───────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: orkestra
  namespace: orkestra-system
spec:
  selector:
    app: orkestra-runtime
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: https
      port: 8443
      targetPort: 8443
