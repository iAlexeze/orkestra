apiVersion: orkestra.konductor.io/v1Alpha
kind: Katalog
metadata:
  name: multi-version-website
  description: Manages Website CRD with v1alpha1 and v1 versions

spec:
  crds:
    # ───────────────────────────────────────────────
    # v1alpha1 reconciliation
    # ───────────────────────────────────────────────
    website-v1alpha1:
      apiTypes:
        group: demo.orkestra.io
        version: v1alpha1
        kind: Website
        plural: websites

      reconciler:
        default: true
        onCreate:
          deployments:
            - name: "{{ .metadata.name }}"
              image: "{{ .spec.image }}"
              replicas: "{{ .spec.replicas }}"
              port: "{{ .spec.port }}"
              reconcile: true

    # ───────────────────────────────────────────────
    # v1 reconciliation
    # ───────────────────────────────────────────────
    website-v1:
      apiTypes:
        group: demo.orkestra.io
        version: v1
        kind: Website
        plural: websites

      reconciler:
        default: true
        onCreate:
          deployments:
            - name: "{{ .metadata.name }}"
              image: "{{ .spec.image }}"
              replicas: "{{ .spec.replicas }}"
              port: "{{ .spec.port }}"
              reconcile: true

      # ───────────────────────────────────────────────
      # Declarative conversion rules (aligned to struct)
      # ───────────────────────────────────────────────
      conversion:
        storageVersion: "v1"

        paths:
          - from: "v1alpha1"
            to: "v1"
            spec:
              image: "{{ .spec.image }}"
              replicas: "{{ .spec.replicas }}"
              port: "{{ .spec.port }}"
              seo:
                enabled: false

          - from: "v1"
            to: "v1alpha1"
            spec:
              image: "{{ .spec.image }}"
              replicas: "{{ .spec.replicas }}"
              port: "{{ .spec.port }}"
              theme: "default"
