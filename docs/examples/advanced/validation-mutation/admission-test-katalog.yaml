# test/katalog.yaml
# Run with kubectl apply -f test/katalog.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: website-admission-test-katalog
  namespace: orkestra
data:
  website-admission-test-katalog.yaml: |

    apiVersion: orkestra.orkspace.io/v1
    kind: Katalog
    metadata:
      name: website-admission-test
      description: Tests validation and mutation at admission time and reconcile time

    spec:
      crds:
        website:
          apiTypes:
            group: demo.orkestra.io
            version: v1alpha1
            kind: Website
            plural: websites

          # ── Per-CRD webhook control ──────────────────────────────────────────
          # Both enabled by default when ENABLE_ADMISSION_WEBHOOK=true.
          # Included here explicitly so you can see the knobs.
          webhooks:
            validation: true
            mutation: true
            operations:
              - CREATE
              - UPDATE

          # ── Mutation rules ─────────────────────────────────────────────────
          # Applied at admission BEFORE validation, and at reconcile time.
          #
          # Test case A: apply cr-missing-defaults.yaml
          #   spec.replicas and spec.logLevel are absent
          #   → Orkestra sets replicas=2 and logLevel=info before validation runs
          #   → kubectl get website my-site -o yaml shows the defaults applied
          #
          # Test case B: apply cr-override.yaml with a non-myorg image
          #   → Orkestra does NOT override image (that is validation's job to deny)
          #   → override is only used for values the platform must control
          mutation:
            mutateFirst: false            # validate-then-mutate at reconcile time
                                          # at admission time mutation always fires first
            rules:
              - field: spec.replicas
                default: "2"              # set to 2 when not declared

              - field: spec.logLevel
                default: "info"           # set to info when not declared

              - field: metadata.labels.managed-by
                override: "orkestra"      # always set — ensures every Website is labelled


          # ── Validation rules ───────────────────────────────────────────────
          # Applied AFTER mutation at admission time.
          # The mutated object is what validation sees.
          #
          # Test case C: apply cr-bad-image.yaml (image without myorg/ prefix)
          #   → deny fires: kubectl returns error immediately
          #
          # Test case D: apply cr-no-team-label.yaml (missing team label)
          #   → warn fires: kubectl prints Warning but CR is created
          #   → /katalog/website shows activeWarnings entry
          #
          # Test case E: apply cr-valid.yaml (everything correct)
          #   → all rules pass: CR is created, no warnings
          validation:
            rules:
              - field: spec.image
                prefix: "myorg/"
                message: "image must be from the myorg registry — use myorg/<name>:<tag>"
                action: deny

              - field: spec.replicas
                min: "1"
                message: "replicas must be at least 1"
                action: deny
                # Note: this rule passes even for cr-missing-defaults.yaml because
                # mutation sets replicas=2 BEFORE validation runs at admission time.

              - field: spec.replicas
                max: "10"
                message: "replicas cannot exceed 10 — contact platform team for exceptions"
                action: deny

              - field: metadata.labels.team
                operator: exists
                message: "all Website resources should declare a team owner"
                action: warn   # advisory — surfaces but does not block

              - field: spec.enabled
                operator: exists
                message: "spec.enabled should be declared explicitly"
                action: warn   # advisory

          operatorBox:
            default: true
            onCreate:
              deployments:
                - name: "{{ .metadata.name }}"
                  image: "{{ .spec.image }}"
                  replicas: "{{ .spec.replicas }}"
                  port: "{{ .spec.port }}"
                  reconcile: true
              services:
                - name: "{{ .metadata.name }}-svc"
                  port: "80"
                  targetPort: "{{ .spec.port }}"
                  reconcile: true
