# test/deployment.yaml
# Orkestra deployment with admission webhooks enabled.
# Requires: TLS certificates already mounted as the orkestra-tls Secret.
#
# To generate self-signed certs for local testing:
#   see test/generate-certs.sh
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orkestra-runtime
  namespace: orkestra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orkestra-runtime
  template:
    metadata:
      labels:
        app: orkestra-runtime
    spec:
      serviceAccountName: orkestra
      securityContext:
        fsGroup: 65532
      containers:
        - name: orkestra
          image: orkspace/ork:example
          env:
            # ── Admission webhooks ──────────────────────────────────────────
            # ENABLE_ADMISSION_WEBHOOK=true requires ENABLE_CONVERSION=true
            # (they share the same HTTPS server on :8443)
            - name: ENABLE_CONVERSION
              value: "false"
            - name: ENABLE_ADMISSION_WEBHOOK
              value: "true"

            # ── TLS (shared by conversion and admission) ────────────────────
            - name: TLS_CERT
              value: "/tls/tls.crt"
            - name: TLS_KEY
              value: "/tls/tls.key"

            # ── Runtime ────────────────────────────────────────────────────
            - name: ORKESTRA_PORT
              value: "8080"
            - name: ORKESTRA_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace

          args:
            - run
            - --file
            - /katalogs/katalog.yaml

          ports:
            - containerPort: 8080   # health + metrics
            - containerPort: 8443   # HTTPS: /convert + /validate + /mutate

          volumeMounts:
            - name: katalogs
              mountPath: /katalogs
            - name: tls
              mountPath: /tls
              readOnly: true

      volumes:
        - name: katalogs
          configMap:
            name: orkestra-katalog
        - name: tls
          secret:
            secretName: orkestra-tls
---
apiVersion: v1
kind: Service
metadata:
  name: orkestra
  namespace: orkestra
spec:
  selector:
    app: orkestra-runtime
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: https
      port: 8443
      targetPort: 8443
