# test/cr-missing-defaults.yaml
# Test case A: SHOULD SUCCEED — mutation fills in the missing defaults
#
# spec.replicas is absent → mutation sets it to "2" before validation
# spec.logLevel is absent → mutation sets it to "info" before validation
# metadata.labels.managed-by is absent → override sets it to "orkestra"
#
# Expected with ENABLE_WEBHOOKS=true:
#   website.demo.orkestra.io/defaults-site created
#   (no error, no warning — replicas default satisfies min:1)
#
# After apply, verify the defaults were stored:
#   kubectl get website defaults-site -o yaml
#   Should show:
#     spec.replicas: 2          ← set by mutation default
#     spec.logLevel: info       ← set by mutation default
#     metadata.labels.managed-by: orkestra  ← set by mutation override
#
# Warning expected (action: warn):
#   Warning: orkestra: field "metadata.labels.team": all Website resources should declare...
#   Warning: orkestra: field "spec.enabled": spec.enabled should be declared explicitly
apiVersion: demo.orkestra.io/v1alpha1
kind: Website
metadata:
  name: defaults-site
  namespace: orkestra
  # no team label — warn rule fires but does not block
spec:
  image: myorg/nginx:1.25
  port: 8080
  # replicas absent    → mutation sets to "2"
  # logLevel absent    → mutation sets to "info"
  # enabled absent     → warn rule fires
