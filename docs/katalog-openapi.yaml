# 1. OpenAPI Specification for `/katalog` API**

# This is a **complete, valid OpenAPI 3.1** document describing your three endpoints:

# - `/katalog`
# - `/katalog/{crd}`
# - `/katalog/{crd}/health`

# It reflects exactly what your handlers return.

openapi: 3.1.0
info:
  title: Orkestra Runtime API
  version: 1.0.0
  description: |
    API for inspecting the running Orkestra operator, CRD health, and reconciler configuration.

paths:
  /katalog:
    get:
      summary: List all CRDs managed by the operator
      tags: [Katalog]
      responses:
        '200':
          description: List of CRDs with health and configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  crds:
                    type: array
                    items:
                      $ref: '#/components/schemas/CRDEntry'

  /katalog/{crd}:
    get:
      summary: Get detailed information about a single CRD
      tags: [Katalog]
      parameters:
        - name: crd
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: CRD info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CRDInfo'

  /katalog/{crd}/health:
    get:
      summary: Get health status for a CRD reconciler
      tags: [Health]
      parameters:
        - name: crd
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: CRD is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CRDHealth'
        '503':
          description: CRD is degraded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CRDHealth'

components:
  schemas:

    CRDEntry:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        mode: { type: string, enum: [dynamic, typed] }
        gvk: { type: object }
        gvr: { type: string }
        critical: { type: boolean }
        namespaced: { type: boolean }
        namespace: { type: string }
        dependsOn:
          type: array
          items: { type: string }
        workers: { type: integer }
        workersSource: { type: string }
        resync: { type: string }
        resyncSource: { type: string }
        queueDepth: { type: integer }
        queueDepthSource: { type: string }
        resourceCount: { type: integer }
        reconciler: { $ref: '#/components/schemas/ReconcilerInfo' }
        healthy: { type: boolean }
        started: { type: boolean }
        startedAt: { type: string }
        uptime: { type: string }
        errorRate: { type: number }
        endpoints:
          type: object
          properties:
            health: { type: string }
            info: { type: string }

    CRDInfo:
      allOf:
        - $ref: '#/components/schemas/CRDEntry'
      properties:
        # CRDInfo is CRDEntry minus endpoints
        endpoints: { nullable: true }

    CRDHealth:
      type: object
      properties:
        name: { type: string }
        healthy: { type: boolean }
        started: { type: boolean }
        startedAt: { type: string }
        status: { type: integer }
        uptime: { type: string }
        message: { type: string }
        errorRate: { type: number }
        consecutiveFails: { type: integer }
        totalReconciles: { type: integer }
        lastError: { type: string }
        lastReconcile: { type: string }

    ReconcilerInfo:
      type: object
      properties:
        type: { type: string, enum: [generic, custom] }
        finalizers:
          type: object
          properties:
            source: { type: string }
            values:
              type: array
              items: { type: string }
        hooks:
          type: object
        constructor:
          type: object
        templates:
          type: object
