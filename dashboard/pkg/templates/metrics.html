<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orkestra Dashboard – Metrics</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <div class="flex items-center justify-between mb-8">
            <div>
                <a href="/dashboard" class="text-blue-600 hover:text-blue-800">← Back</a>
                <h1 class="text-3xl font-bold text-gray-900 mt-2">Metrics</h1>
                <p class="text-gray-600 mt-1">Prometheus metrics and performance data</p>
            </div>
        </div>

        <div class="bg-white rounded-lg shadow p-12 text-center">
            <div class="text-6xl mb-4">📊</div>
            <h2 class="text-2xl font-semibold text-gray-800 mb-2">Coming Soon</h2>
            <p class="text-gray-600">Prometheus metrics visualization will be available here in a future release.</p>
            <p class="text-gray-500 text-sm mt-4">For now, you can access raw metrics at <code class="bg-gray-100 px-2 py-1 rounded">/metrics</code> endpoint.</p>
        </div>
    </div>
</body>
</html>
