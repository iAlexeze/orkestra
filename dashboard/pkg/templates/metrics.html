<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metrics – Orkestra</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        .stats-card {
            transition: all 0.2s ease;
        }
        .stats-card:hover {
            transform: translateY(-2px);
        }
        .metric-chart {
            height: 300px;
        }
    </style>
</head>

<body class="bg-gray-50">
<div class="max-w-7xl mx-auto px-4 py-8">

    <!-- Header -->
    <div class="mb-8">
        <div class="flex items-center gap-4 mb-3">
            <a href="/dashboard" class="text-sm text-blue-600 hover:underline">← Back to Dashboard</a>
        </div>

        <div class="flex items-center justify-between">
            <div>
                <h1 class="text-3xl font-bold">System Metrics</h1>
                <p class="text-gray-500 text-sm mt-1">Real-time performance and health metrics</p>
            </div>
            <button id="refreshBtn" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm hover:bg-blue-700">
                Refresh Data
            </button>
        </div>
    </div>

    <!-- System Overview Stats -->
    <div id="systemStats" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
        <div class="bg-white p-4 rounded-xl shadow-sm border stats-card">
            <div class="text-xs text-gray-500">Go Routines</div>
            <div class="text-2xl font-bold" id="goroutines">-</div>
        </div>
        <div class="bg-white p-4 rounded-xl shadow-sm border stats-card">
            <div class="text-xs text-gray-500">Heap Memory</div>
            <div class="text-2xl font-bold" id="heapMemory">-</div>
            <div class="text-xs text-gray-400 mt-1" id="heapSys">-</div>
        </div>
        <div class="bg-white p-4 rounded-xl shadow-sm border stats-card">
            <div class="text-xs text-gray-500">Process Memory</div>
            <div class="text-2xl font-bold" id="processMemory">-</div>
        </div>
        <div class="bg-white p-4 rounded-xl shadow-sm border stats-card">
            <div class="text-xs text-gray-500">CPU Time</div>
            <div class="text-2xl font-bold" id="cpuTime">-</div>
            <div class="text-xs text-gray-400 mt-1" id="uptime">-</div>
        </div>
    </div>

    <!-- CRD Metrics Section -->
    <div id="crdMetrics">
        <h2 class="text-xl font-semibold mb-4">CRD Metrics</h2>
        <div id="crdCharts" class="space-y-8">
            <!-- Charts will be dynamically added here -->
        </div>
    </div>

    <!-- Error message if no data -->
    <div id="errorMessage" class="hidden bg-yellow-50 border border-yellow-200 rounded-xl p-8 text-center">
        <p class="text-yellow-800 font-medium">No metrics available</p>
        <p class="text-yellow-600 text-sm mt-1">Ensure Orkestra metrics endpoint is accessible</p>
    </div>

</div>

<script>
let charts = {};

async function fetchMetrics() {
    try {
        const response = await fetch('/dashboard/api/metrics');
        if (!response.ok) throw new Error('Failed to fetch metrics');
        const data = await response.json();
        updateUI(data);
        document.getElementById('errorMessage').classList.add('hidden');
    } catch (error) {
        console.error('Error fetching metrics:', error);
        document.getElementById('errorMessage').classList.remove('hidden');
    }
}

function updateUI(data) {
    // Update system stats
    document.getElementById('goroutines').textContent = data.go.goroutines;
    document.getElementById('heapMemory').textContent = formatBytes(data.go.heapAlloc);
    document.getElementById('heapSys').textContent = `System: ${formatBytes(data.go.heapSys)}`;
    document.getElementById('processMemory').textContent = formatBytes(data.process.memoryBytes);
    document.getElementById('cpuTime').textContent = `${data.process.cpuSeconds.toFixed(1)}s`;
    
    // Calculate uptime
    const uptime = Date.now() / 1000 - data.process.startTime;
    document.getElementById('uptime').textContent = formatDuration(uptime);
    
    // Update CRD charts
    updateCRDCharts(data.crds);
}

function updateCRDCharts(crds) {
    const container = document.getElementById('crdCharts');
    
    if (crds.length === 0) {
        container.innerHTML = '<div class="bg-white p-8 rounded-xl border text-center text-gray-500">No CRD metrics available</div>';
        return;
    }
    
    let html = '';
    for (const crd of crds) {
        html += `
            <div class="bg-white p-6 rounded-xl border shadow-sm">
                <h3 class="text-lg font-semibold mb-4">${crd.name}</h3>
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <div>
                        <div class="text-sm text-gray-600 mb-2">Reconcile Duration Distribution</div>
                        <canvas id="chart-${escapeId(crd.name)}-duration" class="metric-chart"></canvas>
                    </div>
                    <div>
                        <div class="text-sm text-gray-600 mb-2">Reconcile Statistics</div>
                        <canvas id="chart-${escapeId(crd.name)}-reconciles" class="metric-chart"></canvas>
                    </div>
                </div>
                <div class="mt-4 grid grid-cols-2 md:grid-cols-4 gap-4 pt-4 border-t">
                    <div>
                        <div class="text-xs text-gray-500">Queue Depth</div>
                        <div class="text-xl font-bold">${crd.queueDepth}</div>
                    </div>
                    <div>
                        <div class="text-xs text-gray-500">Active Workers</div>
                        <div class="text-xl font-bold">${crd.workersActive}</div>
                    </div>
                    <div>
                        <div class="text-xs text-gray-500">Resources</div>
                        <div class="text-xl font-bold">${crd.resourceCount}</div>
                    </div>
                    <div>
                        <div class="text-xs text-gray-500">Reconciles</div>
                        <div class="text-xl font-bold">${crd.reconcileTotal.total.toLocaleString()}</div>
                        <div class="text-xs text-gray-400">${crd.reconcileTotal.success} success / ${crd.reconcileTotal.error} error</div>
                    </div>
                </div>
                ${crd.conversion.totalRequests > 0 ? `
                <div class="mt-4 pt-4 border-t">
                    <div class="text-sm font-medium mb-2">Conversion Webhook</div>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <div>
                            <div class="text-xs text-gray-500">Total Requests</div>
                            <div class="font-semibold">${crd.conversion.totalRequests}</div>
                        </div>
                        <div>
                            <div class="text-xs text-gray-500">Success / Failures</div>
                            <div class="font-semibold">${crd.conversion.success} / ${crd.conversion.failures}</div>
                        </div>
                        <div>
                            <div class="text-xs text-gray-500">Avg Latency</div>
                            <div class="font-semibold">${crd.conversion.avgLatencyMs.toFixed(2)}ms</div>
                        </div>
                        <div>
                            <div class="text-xs text-gray-500">P95 Latency</div>
                            <div class="font-semibold">${crd.conversion.p95LatencyMs.toFixed(2)}ms</div>
                        </div>
                    </div>
                </div>
                ` : ''}
            </div>
        `;
    }
    
    container.innerHTML = html;
    
    // Create charts for each CRD after DOM is updated
    setTimeout(() => {
        for (const crd of crds) {
            createDurationChart(crd);
            createReconcileChart(crd);
        }
    }, 100);
}

function createDurationChart(crd) {
    const canvasId = `chart-${escapeId(crd.name)}-duration`;
    const canvas = document.getElementById(canvasId);
    if (!canvas) return;
    
    // Destroy existing chart if any
    if (charts[canvasId]) {
        charts[canvasId].destroy();
    }
    
    // Create mock histogram data from available metrics
    // In a real implementation, you'd have histogram buckets from Prometheus
    const durations = [
        { bucket: '< 50ms', count: Math.floor(crd.reconcileDuration.count * 0.6) },
        { bucket: '50-100ms', count: Math.floor(crd.reconcileDuration.count * 0.2) },
        { bucket: '100-250ms', count: Math.floor(crd.reconcileDuration.count * 0.1) },
        { bucket: '250-500ms', count: Math.floor(crd.reconcileDuration.count * 0.05) },
        { bucket: '> 500ms', count: Math.floor(crd.reconcileDuration.count * 0.05) },
    ];
    
    charts[canvasId] = new Chart(canvas, {
        type: 'bar',
        data: {
            labels: durations.map(d => d.bucket),
            datasets: [{
                label: 'Reconciles',
                data: durations.map(d => d.count),
                backgroundColor: 'rgba(59, 130, 246, 0.5)',
                borderColor: 'rgb(59, 130, 246)',
                borderWidth: 1
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { display: false },
                tooltip: {
                    callbacks: {
                        label: (context) => `${context.raw.toLocaleString()} reconciles`
                    }
                }
            },
            scales: {
                y: {
                    beginAtZero: true,
                    ticks: {
                        callback: (value) => value.toLocaleString()
                    }
                }
            }
        }
    });
}

function createReconcileChart(crd) {
    const canvasId = `chart-${escapeId(crd.name)}-reconciles`;
    const canvas = document.getElementById(canvasId);
    if (!canvas) return;
    
    if (charts[canvasId]) {
        charts[canvasId].destroy();
    }
    
    charts[canvasId] = new Chart(canvas, {
        type: 'doughnut',
        data: {
            labels: ['Success', 'Error'],
            datasets: [{
                data: [crd.reconcileTotal.success, crd.reconcileTotal.error],
                backgroundColor: ['rgba(34, 197, 94, 0.5)', 'rgba(239, 68, 68, 0.5)'],
                borderColor: ['rgb(34, 197, 94)', 'rgb(239, 68, 68)'],
                borderWidth: 1
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    position: 'bottom'
                },
                tooltip: {
                    callbacks: {
                        label: (context) => {
                            const total = crd.reconcileTotal.total;
                            const value = context.raw;
                            const percentage = ((value / total) * 100).toFixed(1);
                            return `${context.label}: ${value.toLocaleString()} (${percentage}%)`;
                        }
                    }
                }
            }
        }
    });
}

function formatBytes(bytes) {
    if (bytes === 0) return '0 B';
    const k = 1024;
    const sizes = ['B', 'KB', 'MB', 'GB'];
    const i = Math.floor(Math.log(bytes) / Math.log(k));
    return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
}

function formatDuration(seconds) {
    const hours = Math.floor(seconds / 3600);
    const minutes = Math.floor((seconds % 3600) / 60);
    const secs = Math.floor(seconds % 60);
    
    if (hours > 0) {
        return `${hours}h ${minutes}m`;
    } else if (minutes > 0) {
        return `${minutes}m ${secs}s`;
    } else {
        return `${secs}s`;
    }
}

function escapeId(str) {
    return str.replace(/[^a-zA-Z0-9]/g, '-');
}

// Auto-refresh every 10 seconds
let refreshInterval = setInterval(fetchMetrics, 10000);

// Manual refresh
document.getElementById('refreshBtn').addEventListener('click', () => {
    fetchMetrics();
});

// Initial load
fetchMetrics();

// Cleanup on page unload
window.addEventListener('beforeunload', () => {
    if (refreshInterval) {
        clearInterval(refreshInterval);
    }
});
</script>

</body>
</html>
