<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metrics – Orkestra</title>
    <link rel="icon" type="image/png" href="/dashboard/assets/static/logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50">
<div class="max-w-7xl mx-auto px-4 py-8">

    <!-- Header -->
    <div class="mb-8">
        <div class="flex items-center justify-between">
            <div>
                <a href="/dashboard" class="text-sm text-blue-600 hover:underline">← Back to Dashboard</a>
                <h1 class="text-3xl font-bold mt-2">Runtime Metrics</h1>
                <p class="text-gray-500 text-sm">Go runtime performance metrics</p>
            </div>
            <div class="flex gap-3">
                <span class="text-xs text-gray-400" id="lastUpdate">Updating...</span>
                <button id="refreshBtn" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm hover:bg-blue-700">
                    Refresh
                </button>
            </div>
        </div>
    </div>

    <!-- Runtime Metrics Cards -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="bg-gradient-to-br from-purple-50 to-white p-6 rounded-xl shadow-sm border">
            <div class="flex items-center justify-between mb-3">
                <h3 class="font-semibold text-gray-700">GC Pause Time</h3>
            </div>
            <div class="text-3xl font-bold text-purple-600" id="gcPause">-</div>
            <div class="text-xs text-gray-500 mt-2">Average stop-the-world duration</div>
        </div>
        
        <div class="bg-gradient-to-br from-blue-50 to-white p-6 rounded-xl shadow-sm border">
            <div class="flex items-center justify-between mb-3">
                <h3 class="font-semibold text-gray-700">Heap Memory</h3>
            </div>
            <div class="text-3xl font-bold text-blue-600" id="heapMemory">-</div>
            <div class="text-xs text-gray-500 mt-2">Allocated / System: <span id="heapAlloc">-</span> / <span id="heapSys">-</span></div>
        </div>
        
        <div class="bg-gradient-to-br from-green-50 to-white p-6 rounded-xl shadow-sm border">
            <div class="flex items-center justify-between mb-3">
                <h3 class="font-semibold text-gray-700">Goroutines</h3>
            </div>
            <div class="text-3xl font-bold text-green-600" id="goroutines">-</div>
            <div class="text-xs text-gray-500 mt-2">Threads: <span id="threads">-</span> | GOMAXPROCS: <span id="gomaxprocs">-</span></div>
        </div>
    </div>

    <!-- Error message -->
    <div id="errorMessage" class="hidden mt-8 bg-yellow-50 border border-yellow-200 rounded-xl p-8 text-center">
        <p class="text-yellow-800">No metrics available</p>
    </div>

</div>

<script>
async function fetchMetrics() {
    try {
        const response = await fetch('/dashboard/api/metrics');
        if (!response.ok) throw new Error('Failed to fetch');
        const data = await response.json();
        updateUI(data);
        document.getElementById('errorMessage').classList.add('hidden');
        document.getElementById('lastUpdate').textContent = `Updated: ${new Date().toLocaleTimeString()}`;
    } catch (error) {
        console.error('Error:', error);
        document.getElementById('errorMessage').classList.remove('hidden');
    }
}

function updateUI(data) {
    // Update GC pause time
    const gcPauseMs = (data.gcPauseAvg * 1000).toFixed(2);
    document.getElementById('gcPause').textContent = `${gcPauseMs}ms`;
    
    // Update heap memory
    document.getElementById('heapMemory').textContent = formatBytes(data.heapAlloc);
    document.getElementById('heapAlloc').textContent = formatBytes(data.heapAlloc);
    document.getElementById('heapSys').textContent = formatBytes(data.heapSys);
    
    // Update goroutines
    document.getElementById('goroutines').textContent = data.goroutines;
    document.getElementById('threads').textContent = data.threads || '-';
    document.getElementById('gomaxprocs').textContent = data.gomaxprocs || '-';
}

function formatBytes(bytes) {
    if (bytes === 0) return '0 B';
    const k = 1024;
    const sizes = ['B', 'KB', 'MB', 'GB'];
    const i = Math.floor(Math.log(bytes) / Math.log(k));
    return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
}

// Auto-refresh every 10 seconds
let refreshInterval = setInterval(fetchMetrics, 10000);

// Manual refresh
document.getElementById('refreshBtn').addEventListener('click', () => {
    fetchMetrics();
});

// Initial load
fetchMetrics();

// Cleanup
window.addEventListener('beforeunload', () => {
    if (refreshInterval) clearInterval(refreshInterval);
});
</script>

</body>
</html>
