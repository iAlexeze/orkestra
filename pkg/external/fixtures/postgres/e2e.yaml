apiVersion: orkestra.orkspace.io/v1
kind: E2E
metadata:
  name: external-postgres-e2e
  description: >
    Verifies protocol: postgres by deploying PostgreSQL in orkestra-system
    and querying current_database() and pg_stat_activity from the WebApp reconciler.

spec:
  katalog: ./katalog.yaml
  crd: ./crd.yaml
  cr: ./e2e/cr-e2e.yaml

  cluster:
    provider: kind
    name: ork-external-postgres
    reuse: false

  expect:
    - include: ./e2e/01-postgres-deploy.yaml
    - include: ./e2e/02-assertions.yaml
    - include: ./e2e/03-cleanup.yaml

  onFailure:
    kubectl:
      get:
        - kind: WebApp
          namespace: default
      logs:
        - leaderElection:
            lease: orkestra-konductor
            namespace: orkestra-system
          since: 2m
