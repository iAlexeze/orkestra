expect:
  - name: deploy Kafka in orkestra-system
    kubectl:
      apply:
        - inline: |
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: kafka
              namespace: orkestra-system
            spec:
              replicas: 1
              selector:
                matchLabels:
                  app: kafka
              template:
                metadata:
                  labels:
                    app: kafka
                spec:
                  containers:
                    - name: kafka
                      image: apache/kafka:3.9.0
                      ports:
                        - containerPort: 9092
                      env:
                        - name: KAFKA_NODE_ID
                          value: "1"
                        - name: KAFKA_PROCESS_ROLES
                          value: broker,controller
                        - name: KAFKA_LISTENERS
                          value: PLAINTEXT://:9092,CONTROLLER://:9093
                        - name: KAFKA_ADVERTISED_LISTENERS
                          value: PLAINTEXT://kafka.orkestra-system.svc:9092
                        - name: KAFKA_CONTROLLER_QUORUM_VOTERS
                          value: 1@localhost:9093
                        - name: KAFKA_CONTROLLER_LISTENER_NAMES
                          value: CONTROLLER
                        - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
                          value: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
                        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
                          value: "1"
                        - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
                          value: "true"
        - inline: |
            apiVersion: v1
            kind: Service
            metadata:
              name: kafka
              namespace: orkestra-system
            spec:
              selector:
                app: kafka
              ports:
                - port: 9092
                  targetPort: 9092

  - name: Kafka pod is ready
    timeout: 120s
    resources:
      - kind: Deployment
        name: kafka
        namespace: orkestra-system
        condition: Available
