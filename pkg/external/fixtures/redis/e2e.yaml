apiVersion: orkestra.orkspace.io/v1
kind: E2E
metadata:
  name: external-redis-e2e
  description: >
    Verifies protocol: redis by deploying a Redis instance in orkestra-system
    and querying it from the WebApp reconciler. PING asserts connectivity;
    DBSIZE asserts the result field is set.

spec:
  katalog: ./katalog.yaml
  crd: ./crd.yaml
  cr: ./e2e/cr-e2e.yaml

  cluster:
    provider: kind
    name: ork-external-redis
    reuse: false

  expect:
    - include: ./e2e/01-redis-deploy.yaml
    - include: ./e2e/02-assertions.yaml
    - include: ./e2e/03-cleanup.yaml

  onFailure:
    kubectl:
      get:
        - kind: WebApp
          namespace: default
      logs:
        - leaderElection:
            lease: orkestra-konductor
            namespace: orkestra-system
          since: 2m
