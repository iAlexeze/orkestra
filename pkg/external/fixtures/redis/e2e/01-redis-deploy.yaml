expect:
  - name: deploy Redis in orkestra-system
    kubectl:
      apply:
        - inline: |
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: redis
              namespace: orkestra-system
            spec:
              replicas: 1
              selector:
                matchLabels:
                  app: redis
              template:
                metadata:
                  labels:
                    app: redis
                spec:
                  containers:
                    - name: redis
                      image: redis:7-alpine
                      ports:
                        - containerPort: 6379
                      command: ["redis-server", "--save", "", "--appendonly", "no"]
        - inline: |
            apiVersion: v1
            kind: Service
            metadata:
              name: redis
              namespace: orkestra-system
            spec:
              selector:
                app: redis
              ports:
                - port: 6379
                  targetPort: 6379

  - name: Redis pod is ready
    timeout: 60s
    resources:
      - kind: Deployment
        name: redis
        namespace: orkestra-system
        condition: Available
