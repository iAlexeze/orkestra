apiVersion: orkestra.orkspace.io/v1
kind: E2E
metadata:
  name: external-mongo-e2e
  description: >
    Verifies protocol: mongo by deploying MongoDB in orkestra-system and querying
    the orkestra.test collection from the WebApp reconciler.

spec:
  katalog: ./katalog.yaml
  crd: ./crd.yaml
  cr: ./cr.yaml

  cluster:
    provider: kind
    name: ork-external-mongo
    reuse: false

  expect:
    - include: ./e2e/01-mongo-deploy.yaml
    - include: ./e2e/02-assertions.yaml
    - include: ./e2e/03-cleanup.yaml

  onFailure:
    kubectl:
      get:
        - kind: WebApp
          namespace: default
      logs:
        - leaderElection:
            lease: orkestra-konductor
            namespace: orkestra-system
          since: 2m
