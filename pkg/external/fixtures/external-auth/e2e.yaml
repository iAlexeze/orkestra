apiVersion: orkestra.orkspace.io/v1
kind: E2E
metadata:
  name: external-auth-e2e
  description: >
    Verifies auth.secretRef on external calls. The config call hits
    /protected/:name which requires Bearer dev-token-abc123. The token is
    read from a Kubernetes Secret. status.tokenValid proves the credential
    was resolved and accepted. Patching the Secret to a wrong token drives
    configStatus to 401 on the next reconcile.

spec:
  katalog: ./katalog.yaml
  crd: ./crd.yaml
  cr: ./cr.yaml

  cluster:
    provider: kind
    name: ork-external-auth
    reuse: false

  expect:
    - include: ./e2e/01-setup.yaml
    - include: ./e2e/02-wrong-token.yaml
    - include: ./e2e/03-cleanup.yaml

  onFailure:
    kubectl:
      get:
        - kind: WebApp
          namespace: default
      logs:
        - leaderElection:
            lease: orkestra-konductor
            namespace: orkestra-system
          since: 2m
