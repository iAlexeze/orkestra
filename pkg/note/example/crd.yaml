apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: noteprobes.note.orkestra.io
spec:
  group: note.orkestra.io
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Ready
          type: string
          jsonPath: .status.replicasReady
        - name: Image
          type: string
          jsonPath: .status.containerImage
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  description: Container image for the probe deployment
                replicas:
                  type: integer
                  default: 1
                  description: Number of desired replicas
                port:
                  type: integer
                  default: 8080
                  description: Port exposed by the container
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
  names:
    kind: NoteProbe
    plural: noteprobes
    singular: noteprobe
  scope: Namespaced
