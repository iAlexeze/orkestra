apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: note-probe
  author: orkspace
  version: 0.1.0
  description: >
    NoteProbe — living integration test for kubernetes, replica, container,
    and service notes. Creates a Deployment and Service.
    For job notes see katalog-job.yaml; for pod notes see katalog-pods.yaml.
    Apply the CR and inspect: kubectl get noteprobe <name> -o yaml

spec:
  crds:
    note-probe:
      crdFile: ./crd.yaml
      crFiles:
        - ./cr.yaml

      workers: 1
      resync: 30s

      operatorBox:
        onCreate:
          deployments:
            - name: "{{ .metadata.name }}-app"
              image: "{{ .spec.image }}"
              replicas: "{{ .spec.replicas }}"
              port: "{{ .spec.port }}"
              reconcile: true

          services:
            - name: "{{ .metadata.name }}-svc"
              port: "80"
              targetPort: "{{ .spec.port }}"
              reconcile: true

        status:
          fields:
            # ── Phase state machine ─────────────────────────────────────────
            - path: phase
              value: "Pending"
              when:
                - field: status.phase
                  operator: notExists

            - path: phase
              value: "Deploying"
              when:
                - field: "{{ resourceExists .children.deployment }}"
                  equals: "true"
                - field: "{{ allReplicasReady .children.deployment }}"
                  equals: "false"

            - path: phase
              value: "Ready"
              when:
                - field: "{{ allReplicasReady .children.deployment }}"
                  equals: "true"

            # ── kubernetes notes ────────────────────────────────────────────
            - path: resourceExistsDeployment
              value: "{{ resourceExists .children.deployment }}"

            - path: resourceExistsService
              value: "{{ resourceExists .children.service }}"

            - path: childName
              value: "{{ name .children.deployment }}"

            - path: childNamespace
              value: "{{ namespace .children.deployment }}"

            - path: isTerminating
              value: "{{ isTerminating .children.deployment }}"

            - path: generation
              value: "{{ generation .children.deployment }}"

            - path: observedGeneration
              value: "{{ observedGeneration .children.deployment }}"

            - path: isSynced
              value: "{{ isSynced .children.deployment }}"

            - path: resourceCPU
              value: "{{ resourceCPU .children.deployment }}"

            - path: resourceMemory
              value: "{{ resourceMemory .children.deployment }}"

            - path: hasConditionAvailable
              value: "{{ hasCondition .children.deployment \"Available\" }}"

            - path: hasConditionProgressing
              value: "{{ hasCondition .children.deployment \"Progressing\" }}"

            - path: conditionAvailableReason
              value: "{{ conditionReason .children.deployment \"Available\" }}"

            - path: conditionProgressingMessage
              value: "{{ conditionMessage .children.deployment \"Progressing\" }}"

            # ── replica notes ───────────────────────────────────────────────
            - path: allReady
              value: "{{ allReplicasReady .children.deployment }}"

            - path: rolloutDone
              value: "{{ rolloutComplete .children.deployment }}"

            - path: desiredReplicas
              value: "{{ desiredReplicas .children.deployment }}"

            - path: readyReplicas
              value: "{{ readyReplicas .children.deployment }}"

            - path: availableReplicas
              value: "{{ availableReplicas .children.deployment }}"

            - path: updatedReplicas
              value: "{{ updatedReplicas .children.deployment }}"

            # ── container notes ─────────────────────────────────────────────
            - path: containerImage
              value: "{{ containerImage .children.deployment }}"

            - path: containerCount
              value: "{{ containerCount .children.deployment }}"

            - path: containerPort
              value: "{{ containerPort .children.deployment }}"

            - path: hasContainerPort8080
              value: "{{ hasContainerPort .children.deployment 0 8080 }}"

            # ── service notes ───────────────────────────────────────────────
            - path: serviceClusterIP
              value: "{{ serviceClusterIP .children.service }}"

            - path: endpointsReady
              value: "{{ endpointsReady .children.endpointslice }}"

            # ── domain notes ────────────────────────────────────────────────
            - path: domainHost
              value: '{{ domainHost "https://acme.example.com/" }}'

            - path: domainBare
              value: '{{ domainBare "https://www.acme.com/" }}'
