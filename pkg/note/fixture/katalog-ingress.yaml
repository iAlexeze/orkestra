apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: ingress-probe
  author: orkspace
  version: 0.1.0
  description: >
    IngressProbe — living integration test for Ingress notes.
    Creates a Deployment + Service + Ingress.
    Apply the CR and inspect: kubectl get ingressprobe <name> -o yaml

spec:
  crds:
    ingress-probe:
      apiTypes:
        group: note.orkestra.io
        version: v1alpha1
        kind: IngressProbe
        plural: ingressprobes
      workers: 1
      resync: 30s

      operatorBox:
        default: true

        onCreate:
          deployments:
            - name: "{{ .metadata.name }}-app"
              image: "{{ .spec.image }}"
              replicas: "{{ .spec.replicas }}"
              port: "{{ .spec.port }}"
              reconcile: true

          services:
            - name: "{{ .metadata.name }}-svc"
              port: "80"
              targetPort: "{{ .spec.port }}"
              reconcile: true

          ingresses:
            - name: "{{ .metadata.name }}-ingress"
              host: "{{ .spec.host }}"
              serviceName: "{{ .metadata.name }}-svc"
              servicePort: "80"
              reconcile: true

        status:
          fields:
            # ── Phase state machine ─────────────────────────────────────────
            - path: phase
              value: "Pending"
              when:
                - field: status.phase
                  operator: notExists

            - path: phase
              value: "Deploying"
              when:
                - field: "{{ allReplicasReady .children.deployment }}"
                  equals: "false"

            - path: phase
              value: "Ready"
              when:
                - field: "{{ allReplicasReady .children.deployment }}"
                  equals: "true"
                - field: "{{ ingressReady .children.ingress }}"
                  equals: "true"

            - path: phase
              value: "WaitingForIngress"
              when:
                - field: "{{ allReplicasReady .children.deployment }}"
                  equals: "true"
                - field: "{{ ingressReady .children.ingress }}"
                  equals: "false"

            # ── ingress notes ───────────────────────────────────────────────
            - path: ingressReady
              value: "{{ ingressReady .children.ingress }}"

            - path: ingressHost
              value: "{{ ingressHost .children.ingress }}"

            - path: ingressIP
              value: "{{ ingressIP .children.ingress }}"

            - path: ingressRules
              value: "{{ ingressRules .children.ingress }}"

            - path: ingressTLSHosts
              value: "{{ ingressTLSHosts .children.ingress }}"
