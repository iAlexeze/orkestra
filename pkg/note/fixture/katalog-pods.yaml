apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: pod-probe
  author: orkspace
  version: 0.1.0
  description: >
    PodProbe — living integration test for pod notes.
    Creates a Deployment with enrich: [pods] so that _pods is embedded in
    the resolver context. Status fields exercise every pod note function.
    Apply the CR and inspect: kubectl get podprobe <name> -o yaml

spec:
  crds:
    pod-probe:
      apiTypes:
        group: note.orkestra.io
        version: v1alpha1
        kind: PodProbe
        plural: podprobes
      workers: 1
      resync: 30s
      enrich: [pods]

      operatorBox:
        default: true

        onCreate:
          deployments:
            - name: "{{ .metadata.name }}-app"
              image: "{{ .spec.image }}"
              replicas: "{{ .spec.replicas }}"
              port: "{{ .spec.port }}"
              reconcile: true

        status:
          fields:
            # ── Phase ───────────────────────────────────────────────────────
            - path: phase
              value: "Pending"
              when:
                - field: status.phase
                  operator: notExists

            - path: phase
              value: "Ready"
              when:
                - field: "{{ allReplicasReady .children.deployment }}"
                  equals: "true"

            # ── pod notes ───────────────────────────────────────────────────
            - path: podNames
              value: "{{ podNames .children.deployment }}"

            - path: podIPs
              value: "{{ podIPs .children.deployment }}"

            - path: podPhases
              value: "{{ podPhases .children.deployment }}"

            - path: podNodes
              value: "{{ podNodes .children.deployment }}"

            - path: podCount
              value: "{{ podCount .children.deployment }}"

            - path: readyPodCount
              value: "{{ readyPodCount .children.deployment }}"

            - path: podMaxRestarts
              value: "{{ podMaxRestarts .children.deployment }}"

            - path: hasCrashingPod
              value: "{{ hasCrashingPod .children.deployment }}"

            # ── container status notes ──────────────────────────────────────
            - path: podCrashLoopDetected
              value: "{{ podCrashLoopDetected .children.deployment }}"

            - path: podContainerReasons
              value: "{{ podContainerReasons .children.deployment }}"
