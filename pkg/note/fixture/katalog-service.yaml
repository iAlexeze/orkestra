apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: service-probe
  author: orkspace
  version: 0.1.0
  description: >
    ServiceProbe — integration test for enriched endpoint notes.
    Creates a Deployment + Service with enrich: [endpoints].
    Apply the CR and inspect: kubectl get serviceprobe <name> -o yaml

spec:
  crds:
    service-probe:
      apiTypes:
        group: note.orkestra.io
        version: v1alpha1
        kind: ServiceProbe
        plural: serviceprobes
      workers: 1
      resync: 30s

      enrich:
        - endpoints

      operatorBox:
        default: true

        onCreate:
          deployments:
            - name: "{{ .metadata.name }}-app"
              image: "{{ .spec.image }}"
              replicas: "{{ .spec.replicas }}"
              port: "{{ .spec.port }}"
              reconcile: true

          services:
            - name: "{{ .metadata.name }}-svc"
              port: "80"
              targetPort: "{{ .spec.port }}"
              reconcile: true

        status:
          fields:
            # ── Phase state machine ─────────────────────────────────────────
            - path: phase
              value: "Pending"
              when:
                - field: status.phase
                  operator: notExists

            - path: phase
              value: "Deploying"
              when:
                - field: "{{ resourceExists .children.deployment }}"
                  equals: "true"
                - field: "{{ allReplicasReady .children.deployment }}"
                  equals: "false"

            - path: phase
              value: "Ready"
              when:
                - field: "{{ allReplicasReady .children.deployment }}"
                  equals: "true"
                - field: "{{ hasEndpoints .children.service }}"
                  equals: "true"

            # ── service notes ───────────────────────────────────────────────
            - path: serviceClusterIP
              value: "{{ serviceClusterIP .children.service }}"

            - path: endpointsReady
              value: "{{ endpointsReady .children.endpointslice }}"

            # ── enriched endpoint notes (require enrich: [endpoints]) ───────
            - path: hasEndpoints
              value: "{{ hasEndpoints .children.service }}"

            - path: endpointCount
              value: "{{ serviceEndpointCount .children.service }}"

            - path: endpoints
              value: "{{ serviceEndpoints .children.service }}"

            - path: firstEndpoint
              value: "{{ serviceFirstEndpoint .children.service }}"
