apiVersion: orkestra.orkspace.io/v1
kind: Motif
metadata:
  name: simple

inputs:
  - name: image
    required: true
  - name: tag
    default: "latest"

resources:
  deployments:
    - name: "app"
      image: "{{ index .inputs \"image\" }}:{{ index .inputs \"tag\" }}"
      replicas: 1
