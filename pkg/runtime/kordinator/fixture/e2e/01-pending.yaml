expect:
  - name: Runtime started — all CRDs pending, not yet installed
    after: cr-applied
    timeout: 15s
    kubectl:
      port-forward:
        - leaderElection:
            lease: orkestra-konductor
            namespace: orkestra-system
          port: 8080
          path: /katalog/worker/health
          jq: .state
          equals: pending
        - leaderElection:
            lease: orkestra-konductor
            namespace: orkestra-system
          port: 8080
          path: /katalog/component/health
          jq: .state
          equals: pending
        - leaderElection:
            lease: orkestra-konductor
            namespace: orkestra-system
          port: 8080
          path: /katalog/platform/health
          jq: .state
          equals: pending
