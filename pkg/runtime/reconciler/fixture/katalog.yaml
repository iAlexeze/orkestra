apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: reconciler-probe
  author: orkspace
  version: 0.1.0
  description: >
    ReconcilerProbe — living integration fixture for all reconciler resource types.
    All resource blocks live in focused motifs under motifs/. Add coverage for a
    new type there. See pkg/reconciler/fixture/README.md for the checklist.

security:
  webhooks:
    admission:
      enabled: true

gateway:
  enabled: true

spec:
  crds:
    reconciler-suite:
      apiTypes:
        group: reconciler.orkestra.io
        version: v1alpha1
        kind: ReconcilerSuite
        plural: reconcilersuites

      operatorBox:
        onCreate:
          custom:
            - apiVersion: reconciler.orkestra.io/v1alpha1
              kind: ReconcilerProbe
              metadata:
                name: probe
                namespaced: false
              spec:
                image: nginx:1.25
                replicas: 1
                port: 8080
                tier: premium
                schedule: "*/15 * * * *"
                extraLabels:
                  - "team=platform"
                  - "env=ci"
              hasStatus: false

    reconciler-probe:
      apiTypes:
        group: reconciler.orkestra.io
        version: v1alpha1
        kind: ReconcilerProbe
        plural: reconcilerprobes

      imports:
        - motif: ./motifs/core.yaml
        - motif: ./motifs/policy.yaml
        - motif: ./motifs/rbac.yaml
        - motif: ./motifs/workloads.yaml
        - motif: ./motifs/network.yaml
        - motif: ./motifs/storage.yaml

      # ── Validation ────────────────────────────────────────────────────────
      validation:
        rules:
          - field: spec.replicas
            greaterThan: 0
            valueType: integer
            message: "replicas must be at least 1"
            action: deny
          - field: spec.tier
            operator: in
            value: "basic,premium"
            message: "tier must be basic or premium"
            action: deny

      # ── Mutation ──────────────────────────────────────────────────────────
      mutation:
        rules:
          - field: spec.image
            default: "nginx:stable"

      operatorBox:
        reconciler:
          workers: 3
          resync: 30s

        onDelete:
          ordered: true
          groups:
            - clusterRoleBindings:
            - clusterRoles:
            - persistentVolumes:
            - deployments:
            - cronJobs:
            - jobs:
            - services:
            - secrets:
            - configMaps:
            - serviceAccounts:
            - namespaces:

        status:
          include: ./status/status.yaml
