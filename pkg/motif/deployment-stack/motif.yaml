apiVersion: orkestra.orkspace.io/v1
kind: Motif
metadata:
  name: deployment-stack
  version: v1
  description: >
    Full application deployment stack: ServiceAccount, Role, RoleBinding,
    Deployment, Service, HPA, PDB, and optional Ingress.
    All inputs are optional except image, port, name, and namespace.
    Ingress is only created when the CR data.host field is non-empty.
  author: orkspace
  license: Apache-2.0

inputs:
  - name: name
    required: true
    description: Resource name prefix. Pass the runtime expression for metadata.name from the katalog with block.

  - name: namespace
    required: true
    description: Target namespace. Pass the runtime expression for metadata.namespace from the katalog with block.

  - name: image
    required: true
    description: Container image (e.g. ghcr.io/myorg/myapp:latest)

  - name: port
    required: true
    description: Container port the application listens on (e.g. 8080)

  - name: replicas
    default: "2"
    description: Desired replica count

  - name: maxReplicas
    default: "10"
    description: Maximum replicas for HPA scale-out

  - name: resourceProfile
    default: "burst"
    description: Orkestra resource profile (burst, standard, optimized)

  - name: ingressClass
    default: "nginx"
    description: Ingress class name (nginx, traefik, kong, etc.)

  - name: host
    default: ""
    description: >
      Public hostname for Ingress (e.g. myapp.example.com).
      When empty the Ingress resource is present but the when condition
      prevents it from being created until data.host is set in the CR.

resources:

  serviceAccounts:
    - name: '{{ index .inputs "name" }}-sa'
      namespace: '{{ index .inputs "namespace" }}'
      reconcile: true

  roles:
    - name: '{{ index .inputs "name" }}-role'
      namespace: '{{ index .inputs "namespace" }}'
      reconcile: true
      rules:
        - apiGroups: ["apps"]
          resources: ["deployments"]
          verbs: ["get", "list", "watch", "update", "patch"]
          resourceNames:
            - '{{ index .inputs "name" }}'

  roleBindings:
    - name: '{{ index .inputs "name" }}-rolebinding'
      namespace: '{{ index .inputs "namespace" }}'
      reconcile: true
      roleRef:
        name: '{{ index .inputs "name" }}-role'
      subjects:
        - kind: ServiceAccount
          name: '{{ index .inputs "name" }}-sa'
          namespace: '{{ index .inputs "namespace" }}'

  deployments:
    - name: '{{ index .inputs "name" }}'
      namespace: '{{ index .inputs "namespace" }}'
      image: '{{ index .inputs "image" }}'
      replicas: '{{ index .inputs "replicas" }}'
      port: '{{ index .inputs "port" }}'
      serviceAccountName: '{{ index .inputs "name" }}-sa'
      resourceProfile: '{{ index .inputs "resourceProfile" }}'
      reconcile: true
      when:
        - field: data.image
          exists: true

  services:
    - name: '{{ index .inputs "name" }}-svc'
      namespace: '{{ index .inputs "namespace" }}'
      port: '{{ index .inputs "port" }}'
      targetPort: '{{ index .inputs "port" }}'
      reconcile: true

  ingresses:
    - name: '{{ index .inputs "name" }}-ingress'
      namespace: '{{ index .inputs "namespace" }}'
      host: '{{ index .inputs "host" }}'
      serviceName: '{{ index .inputs "name" }}-svc'
      servicePort: '{{ index .inputs "port" }}'
      ingressClass: '{{ index .inputs "ingressClass" }}'
      reconcile: true
      when:
        - field: data.host
          exists: true

  hpa:
    - name: '{{ index .inputs "name" }}-hpa'
      namespace: '{{ index .inputs "namespace" }}'
      scaleTargetRef:
        apiVersion: apps/v1
        kind: Deployment
        name: '{{ index .inputs "name" }}'
      minReplicas: '{{ index .inputs "replicas" }}'
      maxReplicas: '{{ index .inputs "maxReplicas" }}'
      targetCPUUtilizationPercentage: "70"
      reconcile: true
      when:
        - field: data.image
          exists: true

  pdb:
    - name: '{{ index .inputs "name" }}-pdb'
      namespace: '{{ index .inputs "namespace" }}'
      minAvailable: "1"
      reconcile: true
      when:
        - field: data.image
          exists: true
