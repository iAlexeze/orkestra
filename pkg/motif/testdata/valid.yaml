apiVersion: orkestra.orkspace.io/v1
kind: Motif
metadata:
  name: test-db
  version: v1
  description: Test database motif

inputs:
  - name: image
    required: true
    description: Container image

  - name: volumeSize
    default: "5Gi"
    description: PVC size

resources:
  statefulSets:
    - name: "{{ .metadata.name }}-db"
      image: "{{ index .inputs \"image\" }}"
      replicas: 1
      volumeClaims:
        - name: data
          size: "{{ index .inputs \"volumeSize\" }}"
          mountPath: /data
