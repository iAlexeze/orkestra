apiVersion: orkestra.orkspace.io/v1
kind: Motif
metadata:
  name: org-standards

profiles:
  resources:
    - name: org-standard
      requests:
        cpu: "200m"
        memory: "256Mi"
      limits:
        cpu: "1"
        memory: "1Gi"

resources:
  deployments:
    - name: "app"
      replicas: 1
