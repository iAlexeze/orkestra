apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: profile-probe-autoscale
  author: orkspace
  version: 0.1.0
  description: >
    ProfileProbe — living integration test for autoscale profiles.
    Each CRD uses a different autoscale profile. The profile expands at
    katalog load time into a full autoscale block. Run the operator and
    trigger load to observe autoscaler behavior per profile.

spec:
  crds:
    profile-probe-burst:
      crdFile: crds/probes/crd-burst.yaml
      crFiles:
        - crds/probes/cr-burst.yaml
      operatorBox:
        autoscale:
          profile: burst
        reconciler:
          default: true
          workers: 2
          resync: 30s
          queue:
            maxDepth: 50
        onCreate:
          deployments:
            - name: "{{ .metadata.name }}-burst"
              image: "{{ .spec.image }}"
              port: "{{ .spec.port }}"
              reconcile: true

        status:
          fields:
            - path: phase
              value: "Pending"
              when:
                - field: status.phase
                  operator: notExists

            - path: phase
              value: "Ready"
              when:
                - field: "{{ allReplicasReady .children.deployment }}"
                  equals: "true"

    profile-probe-steady:
      crdFile: crds/probes/crd-steady.yaml
      crFiles:
        - crds/probes/cr-steady.yaml
      operatorBox:
        autoscale:
          profile: steady
        reconciler:
          workers: 2
          resync: 30s
          queue:
            maxDepth: 50
        onCreate:
          deployments:
            - name: "{{ .metadata.name }}-steady"
              image: "{{ .spec.image }}"
              port: "{{ .spec.port }}"
              reconcile: true

        status:
          fields:
            - path: phase
              value: "Pending"
              when:
                - field: status.phase
                  operator: notExists

            - path: phase
              value: "Ready"
              when:
                - field: "{{ allReplicasReady .children.deployment }}"
                  equals: "true"

    profile-probe-batch:
      crdFile: crds/probes/crd-batch.yaml
      crFiles:
        - crds/probes/cr-batch.yaml

      operatorBox:
        autoscale:
          profile: batch
        reconciler:
          default: true
          workers: 2
          resync: 30s
          queue:
            maxDepth: 50
        onCreate:
          deployments:
            - name: "{{ .metadata.name }}-batch"
              image: "{{ .spec.image }}"
              port: "{{ .spec.port }}"
              reconcile: true

        status:
          fields:
            - path: phase
              value: "Pending"
              when:
                - field: status.phase
                  operator: notExists

            - path: phase
              value: "Ready"
              when:
                - field: "{{ allReplicasReady .children.deployment }}"
                  equals: "true"

    profile-probe-latency-sensitive:
      crdFile: crds/probes/crd-latency-sensitive.yaml
      crFiles:
        - crds/probes/cr-latency-sensitive.yaml
      operatorBox:
        autoscale:
          profile: latency-sensitive
        reconciler:
          default: true
          workers: 4
          resync: 30s
          queue:
            maxDepth: 100

        onCreate:
          deployments:
            - name: "{{ .metadata.name }}-latency"
              image: "{{ .spec.image }}"
              port: "{{ .spec.port }}"
              reconcile: true

        status:
          fields:
            - path: phase
              value: "Pending"
              when:
                - field: status.phase
                  operator: notExists

            - path: phase
              value: "Ready"
              when:
                - field: "{{ allReplicasReady .children.deployment }}"
                  equals: "true"

    profile-probe-cost-optimized:
      crdFile: crds/probes/crd-optimized.yaml
      crFiles:
        - crds/probes/cr-optimized.yaml
      operatorBox:
        autoscale:
          profile: cost-optimized
        reconciler:
          default: true
          workers: 4
          resync: 30s
          queue:
            maxDepth: 100
        onCreate:
          deployments:
            - name: "{{ .metadata.name }}-cost"
              image: "{{ .spec.image }}"
              port: "{{ .spec.port }}"
              reconcile: true

        status:
          fields:
            - path: phase
              value: "Pending"
              when:
                - field: status.phase
                  operator: notExists

            - path: phase
              value: "Ready"
              when:
                - field: "{{ allReplicasReady .children.deployment }}"
                  equals: "true"
