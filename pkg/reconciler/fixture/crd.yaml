apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: reconcilerprobes.reconciler.orkestra.io
spec:
  group: reconciler.orkestra.io
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Tier
          type: string
          jsonPath: .status.tier
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                # Core fields used across multiple resource templates
                image:
                  type: string
                replicas:
                  type: integer
                port:
                  type: integer
                tier:
                  type: string
                  # enum: [basic, premium]
                schedule:
                  type: string
                # Used by forEach
                extraLabels:
                  type: array
                  items:
                    type: string
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
  scope: Namespaced
  names:
    plural: reconcilerprobes
    singular: reconcilerprobe
    kind: ReconcilerProbe
