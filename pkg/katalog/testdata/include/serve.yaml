apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: test
gateway:
  api:
    enabled: true
    auth:
      tokens:
        - name: cc
          secretRef:
            name: ork-apply-token
            key: token
spec:
  crds:
    platform:
      apiTypes:
        group: platform.orkestra.io
        version: v1alpha1
        kind: Platform
        plural: platforms
      serve:
        enabled: true
        include: ./serve-fields.yaml
        fields:
          image:
            label: "Image"
            order: 3
