# Triggers: enqueueGate template uses a sentinel not declared in preReconcile.sentinels
apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: bad-watch-undeclared-sentinel-in-gate
  version: 0.1.0
  description: gate template references a sentinel that is not declared.
spec:
  crds:
    widget:
      crdFile: ../crd.yaml
      operatorBox:
        preReconcile:
          sentinels:
            - generationChanged
          enqueueGate:
            when:
              - field: "{{ labelsChanged }}"
                equals: "true"
