# Triggers: unknown HPA behavior.profile
apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: bad-hpa-profile
  version: 0.1.0
spec:
  crds:
    widget:
      apiTypes:
        group: example.io
        version: v1alpha1
        kind: Widget
        plural: widgets
      operatorBox:
        reconciler:
          workers: 2
        onCreate:
          hpa:
            - name: widget-hpa
              minReplicas: 1
              maxReplicas: 10
              scaleTargetRef:
                apiVersion: apps/v1
                kind: Deployment
                name: widget-controller
              behavior:
                profile: aggressive
