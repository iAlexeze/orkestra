apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: validate-test
  version: 0.1.0
spec:
  crds:
    widget:
      apiTypes:
        group: example.io
        version: v1alpha1
        kind: Widget
        plural: widgets
      operatorBox:
        reconciler:
          workers: 2
        onCreate:
          deployments:
            - name: "{{ .metadata.name }}-controller"
              image: example.io/widget-controller:latest
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
