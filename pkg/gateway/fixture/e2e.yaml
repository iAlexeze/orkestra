# https://orkestra.sh/docs/reference/schema/e2e/
apiVersion: orkestra.orkspace.io/v1
kind: E2E
metadata:
  name: gateway-idp-fixture-e2e
  description: >
    End-to-end test for the gateway IDP fixture.
    Exercises: Apply API (app workload), conditional admission rules
    (deny when, deny anyOf, warn when), dryRun violation response,
    schema catalog endpoint.

spec:
  katalog: ./katalog.yaml
  crd: ./crd.yaml
  cr: ./cr-default.yaml

  cluster:
    provider: kind
    name: ork-e2e-gateway-idp
    reuse: false

  setup:
    apply:
      - path: ./setup.yaml
        wait:
          - kind: Namespace
            name: team-payments
            timeout: 10s
          - kind: Namespace
            name: team-platform
            timeout: 10s
    helm:
      - repo: https://argoproj.github.io/argo-helm
        chart: argo-cd
        namespace: argocd
        createNamespace: true
        version: "7.3.11"
        wait:
          - kind: Deployment
            name: argo-cd-argocd-server
            namespace: argocd
            ready: true
            timeout: 180s

      - repo: https://charts.jetstack.io
        chart: cert-manager
        namespace: cert-manager
        createNamespace: true
        version: v1.14.5
        values:
          installCRDs: true
        wait:
          - kind: Deployment
            name: cert-manager-webhook
            namespace: cert-manager
            ready: true
            timeout: 120s

      - repo: https://prometheus-community.github.io/helm-charts
        chart: kube-prometheus-stack
        namespace: monitoring
        createNamespace: true
        version: "61.3.2"
        values:
          grafana.enabled: "false"
          alertmanager.enabled: "false"
          nodeExporter.enabled: "false"
          kubeStateMetrics.enabled: "false"
          prometheus.enabled: "false"
          prometheusOperator.admissionWebhooks.enabled: "false"
        wait:
          - kind: Deployment
            name: kube-prometheus-stack-operator
            namespace: monitoring
            ready: true
            timeout: 180s

  expect:

    # ── happy path ──────────────────────────────────────────────────────────────
    - name: PlatformResource accepted and reaches Ready
      after: cr-applied
      timeout: 120s
      kubectl:
        get:
          - kind: PlatformResource
            name: payments-api
            namespace: team-payments
            field: .status.phase
            equals: Ready

    - name: ArgoCD Application created for app workload
      after: cr-applied
      timeout: 60s
      kubectl:
        get:
          - kind: Application
            name: payments-api
            namespace: argocd
            field: .metadata.name
            equals: payments-api

    # ── unconditional deny ───────────────────────────────────────────────────────
    - name: Admission blocks missing spec.team
      after: cr-applied
      timeout: 30s
      commands:
        - run: |
            kubectl apply -f - <<'EOF'
            apiVersion: gateway.fixture.orkestra.io/v1alpha1
            kind: PlatformResource
            metadata:
              name: no-team-resource
              namespace: team-payments
            spec:
              workloadType: app
              environment: staging
            EOF
          exitCode: 1
          outputContains: "spec.team is required"

    - name: Admission blocks invalid workloadType
      after: cr-applied
      timeout: 30s
      commands:
        - run: |
            kubectl apply -f - <<'EOF'
            apiVersion: gateway.fixture.orkestra.io/v1alpha1
            kind: PlatformResource
            metadata:
              name: invalid-type
              namespace: team-payments
            spec:
              workloadType: unknown-type
              team: team-payments
              environment: staging
            EOF
          exitCode: 1
          outputContains: "must be one of: app, cert, monitoring"

    # ── warn when ───────────────────────────────────────────────────────────────
    - name: Admission warns on production without approval ticket (warn when)
      after: cr-applied
      timeout: 30s
      commands:
        - run: |
            kubectl apply -f - <<'EOF'
            apiVersion: gateway.fixture.orkestra.io/v1alpha1
            kind: PlatformResource
            metadata:
              name: payments-api-prod
              namespace: team-payments
            spec:
              workloadType: app
              team: team-payments
              environment: production
              repoURL: https://github.com/myorg/payments
              targetRevision: main
              targetNamespace: team-payments
            EOF
          exitCode: 0
          outputContains: "productionApproval"

    - name: Warn rule skipped when approval ticket present (warn when — condition met, field present)
      after: cr-applied
      timeout: 30s
      kubectl:
        apply:
          - inline: |
              apiVersion: gateway.fixture.orkestra.io/v1alpha1
              kind: PlatformResource
              metadata:
                name: payments-api-prod-approved
                namespace: team-payments
              spec:
                workloadType: app
                team: team-payments
                environment: production
                repoURL: https://github.com/myorg/payments
                targetRevision: v1.4.2
                targetNamespace: team-payments
                productionApproval: CHG-20240721-0042
      resources:
        - kind: PlatformResource
          name: payments-api-prod-approved
          namespace: team-payments

    - name: Warn rule skipped entirely for staging (warn when — condition not met)
      after: cr-applied
      timeout: 30s
      kubectl:
        apply:
          - inline: |
              apiVersion: gateway.fixture.orkestra.io/v1alpha1
              kind: PlatformResource
              metadata:
                name: payments-api-staging
                namespace: team-payments
              spec:
                workloadType: app
                team: team-payments
                environment: staging
                repoURL: https://github.com/myorg/payments
                targetRevision: main
                targetNamespace: team-payments
      resources:
        - kind: PlatformResource
          name: payments-api-staging
          namespace: team-payments

    # ── deny when ───────────────────────────────────────────────────────────────
    - name: Admission blocks cert workload missing domain (deny when)
      after: cr-applied
      timeout: 30s
      commands:
        - run: |
            kubectl apply -f - <<'EOF'
            apiVersion: gateway.fixture.orkestra.io/v1alpha1
            kind: PlatformResource
            metadata:
              name: cert-no-domain
              namespace: team-platform
            spec:
              workloadType: cert
              team: team-platform
              environment: staging
              issuer: letsencrypt-staging
            EOF
          exitCode: 1
          outputContains: "spec.domain is required for cert workloads"

    - name: Deny when rule skipped for cert workload with domain present
      after: cr-applied
      timeout: 30s
      kubectl:
        apply:
          - inline: |
              apiVersion: gateway.fixture.orkestra.io/v1alpha1
              kind: PlatformResource
              metadata:
                name: api-tls-cert
                namespace: team-platform
              spec:
                workloadType: cert
                team: team-platform
                environment: production
                domain: api.payments.example.com
                issuer: letsencrypt-prod
                productionApproval: CHG-20240721-0099
      resources:
        - kind: PlatformResource
          name: api-tls-cert
          namespace: team-platform

    - name: cert-manager Certificate created for cert workload
      after: cr-applied
      timeout: 60s
      resources:
        - kind: Certificate
          name: api-tls-cert
          namespace: team-platform

    - name: Deny when rule skipped entirely for non-cert workload (workloadType=app, no domain)
      after: cr-applied
      timeout: 30s
      kubectl:
        apply:
          - inline: |
              apiVersion: gateway.fixture.orkestra.io/v1alpha1
              kind: PlatformResource
              metadata:
                name: app-no-domain
                namespace: team-platform
              spec:
                workloadType: app
                team: team-platform
                environment: staging
                repoURL: https://github.com/myorg/infra
                targetRevision: main
                targetNamespace: team-platform
      resources:
        - kind: PlatformResource
          name: app-no-domain
          namespace: team-platform

    # ── deny anyOf ──────────────────────────────────────────────────────────────
    - name: Admission blocks app workload missing repoURL (deny anyOf)
      after: cr-applied
      timeout: 30s
      commands:
        - run: |
            kubectl apply -f - <<'EOF'
            apiVersion: gateway.fixture.orkestra.io/v1alpha1
            kind: PlatformResource
            metadata:
              name: app-no-repo
              namespace: team-platform
            spec:
              workloadType: app
              team: team-platform
              environment: staging
            EOF
          exitCode: 1
          outputContains: "spec.repoURL is required for app and monitoring workloads"

    - name: Admission blocks monitoring workload missing repoURL (deny anyOf)
      after: cr-applied
      timeout: 30s
      commands:
        - run: |
            kubectl apply -f - <<'EOF'
            apiVersion: gateway.fixture.orkestra.io/v1alpha1
            kind: PlatformResource
            metadata:
              name: monitoring-no-repo
              namespace: team-platform
            spec:
              workloadType: monitoring
              team: team-platform
              environment: staging
              scrapeInterval: 15s
            EOF
          exitCode: 1
          outputContains: "spec.repoURL is required for app and monitoring workloads"

    - name: Deny anyOf rule skipped for monitoring with repoURL present
      after: cr-applied
      timeout: 30s
      kubectl:
        apply:
          - inline: |
              apiVersion: gateway.fixture.orkestra.io/v1alpha1
              kind: PlatformResource
              metadata:
                name: platform-monitor
                namespace: team-platform
              spec:
                workloadType: monitoring
                team: team-platform
                environment: staging
                repoURL: https://github.com/myorg/platform
                scrapeInterval: 30s
      resources:
        - kind: PlatformResource
          name: platform-monitor
          namespace: team-platform

    - name: Prometheus ServiceMonitor created for monitoring workload
      after: cr-applied
      timeout: 60s
      resources:
        - kind: ServiceMonitor
          name: platform-monitor
          namespace: team-platform

    - name: Deny anyOf rule skipped entirely for cert workload (not in anyOf list)
      after: cr-applied
      timeout: 30s
      kubectl:
        apply:
          - inline: |
              apiVersion: gateway.fixture.orkestra.io/v1alpha1
              kind: PlatformResource
              metadata:
                name: cert-no-repo
                namespace: team-platform
              spec:
                workloadType: cert
                team: team-platform
                environment: staging
                domain: infra.example.com
                issuer: letsencrypt-staging
      resources:
        - kind: PlatformResource
          name: cert-no-repo
          namespace: team-platform

    # ── deletion ─────────────────────────────────────────────────────────────────
    - name: ArgoCD Application removed after PlatformResource deletion
      after: cr-deleted
      timeout: 60s
      resources:
        - kind: Application
          name: payments-api
          namespace: argocd
          count: 0

  onFailure:
    kubectl:
      logs:
        - leaderElection:
            lease: orkestra-konductor
          namespace: orkestra-system
          since: 5m
        - labelSelector: app.kubernetes.io/component=gateway
          namespace: orkestra-system
          since: 5m
      describe:
        - kind: PlatformResource
          name: payments-api
          namespace: team-payments
      events:
        - kind: PlatformResource
          name: payments-api
          namespace: team-payments
