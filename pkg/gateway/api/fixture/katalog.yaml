# Gateway Serve fixture — exercises all serve features introduced in v0.7.12+.
#
# Sub-files:
#   serve/platformresource.yaml     — field hints (when/anyOf/category/disabled/defaults)
#   admission/platformresource.yaml — validation rules (required, unique, warn)
#   status/platformresource.yaml   — status field projections
#
# What this covers:
#   serve.category           — catalog organisation label
#   serve.ignore       — hides system-managed fields from the form
#   serve.fields.category    — section headings in the form
#   serve.fields.when        — AND conditions (field-based + time-based)
#   serve.fields.anyOf       — OR conditions
#   serve.fields.disabled    — greyed-out locked fields with a reason message
#   CRD default: values    — form inputs pre-populated from CRD schema
#   ?dryRun=true           — POST /api/v1/apply preview with field violations
#   GET /api/v1/schema/    — service catalog (category + description)
apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: gateway-serve-fixture
  author: orkestra
  version: 0.1.0
  description: >
    Gateway Serve fixture for testing the Gateway API, schema endpoint, and
    Serve form features. Uses PlatformResource — same multi-type CR as
    the 05-all-in-one example in ecosystem-compostion pack.
  tags:
    - fixture
    - gateway
    - serve

gateway:
  endpoint: http://orkestra-gateway.orkestra-system.svc:8080
  api:
    enabled: true
    auth:
      tokens:
        - name: control-center
          secretRef:
            name: ork-apply-token
            key: token
            rotateAfter: 90d
        # - name: ci-pipeline
        #   token: "${ORK_CI_TOKEN}"

security:
  webhooks:
    admission:
      enabled: true
  deletionProtection:
    enabled: false

spec:
  crds:
    platRsc:
      apiTypes:
        group: gateway.fixture.orkestra.io
        version: v1alpha1
        kind: PlatformResource
        plural: platformresources

      serve:
        enabled: true
        target: apifixture
        namespace: '{{ teamName }}'
        category: "Compute"
        description: "Self-service application and infrastructure provisioning"
        ignore:
          - serviceSelector
          - alertThresholds
          - provider
          - region
          - class
          - legacyMigration
          - maintenanceWindow
        include: ./serve/platformresource.yaml

      validation:
        include: ./admission/platformresource.yaml

      operatorBox:
        reconciler:
          workers: 2
          resync: 30s

        status:
          include: ./status/platformresource.yaml

        onReconcile:
          custom:
            - apiVersion: argoproj.io/v1alpha1
              kind: Application
              metadata:
                name: "{{ .metadata.name }}"
                namespace: argocd
              spec:
                project: default
                source:
                  repoURL: "{{ .spec.repoURL }}"
                  targetRevision: "{{ .spec.targetRevision }}"
                  path: "."
                destination:
                  server: https://kubernetes.default.svc
                  namespace: "{{ .spec.targetNamespace }}"
                syncPolicy:
                  automated:
                    prune: true
                    selfHeal: true
              hasStatus: true
              when:
                - field: spec.workloadType
                  equals: app

            - apiVersion: cert-manager.io/v1
              kind: Certificate
              metadata:
                name: "{{ .metadata.name }}"
                namespace: "{{ .metadata.namespace }}"
              spec:
                secretName: "{{ .metadata.name }}-tls"
                issuerRef:
                  name: "{{ .spec.issuer }}"
                  kind: ClusterIssuer
                dnsNames:
                  - "{{ .spec.domain }}"
              hasStatus: true
              when:
                - field: spec.workloadType
                  equals: cert

            - apiVersion: monitoring.coreos.com/v1
              kind: ServiceMonitor
              metadata:
                name: "{{ .metadata.name }}"
                namespace: "{{ .metadata.namespace }}"
              spec:
                selector:
                  matchLabels:
                    app: "{{ .metadata.name }}"
                endpoints:
                  - port: metrics
                    interval: "{{ .spec.scrapeInterval }}"
              when:
                - field: spec.workloadType
                  equals: monitoring
