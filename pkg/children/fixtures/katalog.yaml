apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: children-foreach-fixture
  description: >
    Comprehensive fixture covering every child resource type, all using forEach.
    Imports six focused motifs — one per resource group.

spec:
  crds:
    tenant:
      crdFile: crd.yaml
      crFiles:
        - cr.yaml

      imports:
        - motif: motifs/01-namespaced/motif.yaml
        - motif: motifs/02-rbac/motif.yaml
        - motif: motifs/03-workloads/motif.yaml
        - motif: motifs/04-network/motif.yaml
        - motif: motifs/05-config/motif.yaml
        - motif: motifs/06-storage/motif.yaml
