apiVersion: orkestra.orkspace.io/v1
kind: Motif
metadata:
  name: fixture-plan
  description: >
    Fixture motif — TenantPlan operator. Creates a ConfigMap to prove
    that the custom child CR's own operator runs after creation.

resources:
  onCreate:
    configMaps:
      - name: "{{ .metadata.name }}-config"
        namespace: default
        data:
          tenant: "{{ .metadata.name }}"
