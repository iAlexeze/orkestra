apiVersion: orkestra.orkspace.io/v1
kind: Motif
metadata:
  name: fixture-storage
  description: >
    Fixture motif — PV and PVC, all forEach.
    PVs (cluster-scoped) expand over spec.apps. PVCs expand over spec.namespaces.

resources:
  persistentVolumes:
    - name: "{{ .metadata.name }}-{{ .app }}-pv"
      capacity: "1Gi"
      accessModes: ["ReadWriteOnce"]
      hostPath: "/tmp/orkestra-{{ .metadata.name }}-{{ .app }}"
      forEach:
        field: spec.apps
        as: app

  persistentVolumeClaims:
    - name: "{{ .metadata.name }}-{{ .ns }}-pvc"
      namespace: "{{ .ns }}"
      storage: "1Gi"
      accessModes: ["ReadWriteOnce"]
      forEach:
        field: spec.namespaces
        as: ns
