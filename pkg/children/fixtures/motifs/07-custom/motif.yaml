apiVersion: orkestra.orkspace.io/v1
kind: Motif
metadata:
  name: fixture-custom
  description: >
    Fixture motif — custom child CR. Creates a TenantPlan via onCreate.custom:
    to cover the custom: child type alongside the forEach children.

resources:
  onCreate:
    custom:
      - apiVersion: test.orkestra.io/v1alpha1
        kind: TenantPlan
        metadata:
          name: "{{ .metadata.name }}-plan"
          namespaced: false
        hasStatus: false
