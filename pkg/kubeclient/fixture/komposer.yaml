apiVersion: orkestra.orkspace.io/v1
kind: Komposer
metadata:
  name: args-demo
  description: >
    Composes the hooks and constructor args examples into a single operator.
    01-hooks: BlockchainApp — runtime injects args into hooks automatically.
    02-constructor: BlockchainNode — constructor calls ScopedFor explicitly.

imports:
  files:
    - 01-hooks/katalog.yaml
    - 02-constructor/katalog.yaml
    - 03-hooks-targets/katalog.yaml
