<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Orkestra Login</title>
  <style>
    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .box {
      background: #161b22;
      padding: 32px;
      border-radius: 8px;
      width: 320px;
      box-shadow: 0 0 12px rgba(0,0,0,0.4);
    }
    h1 {
      margin-top: 0;
      font-size: 20px;
      text-align: center;
      margin-bottom: 24px;
    }
    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      border-radius: 4px;
      border: 1px solid #30363d;
      background: #0d1117;
      color: #e6edf3;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #238636;
      border: none;
      border-radius: 4px;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    .error {
      background: #da3633;
      padding: 8px;
      border-radius: 4px;
      margin-bottom: 12px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Orkestra Control Center</h1>

    {{if .Error}}
      <div class="error">{{.Error}}</div>
    {{end}}

    <form method="POST" action="/login">
      <input type="text" name="username" placeholder="Username" required>
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>
  </div>
</body>
</html>
