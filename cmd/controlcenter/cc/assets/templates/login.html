<!DOCTYPE html>
<html lang="en" data-theme="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Orkestra Control Center</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="https://png.pngtree.com/png-clipart/20190619/original/pngtree-user-authentication-glyph-round-circle-multi-color-background-png-image_3982133.jpg">

  <style>
    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }

    .box {
      background: #161b22;
      padding: 32px;
      border-radius: 8px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 0 12px rgba(0,0,0,0.4);
      box-sizing: border-box;
    }

    h1 {
      margin-top: 0;
      font-size: 20px;
      text-align: center;
      margin-bottom: 24px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 14px;
      border-radius: 4px;
      border: 1px solid #30363d;
      background: #0d1117;
      color: #e6edf3;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #238636;
      border: none;
      border-radius: 4px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      font-size: 16px;
    }

    .error {
      background: #da3633;
      padding: 8px;
      border-radius: 4px;
      margin-bottom: 12px;
      text-align: center;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 16px 0;
      color: #8b949e;
      font-size: 13px;
    }
    .divider::before, .divider::after {
      content: "";
      flex: 1;
      border-top: 1px solid #30363d;
    }

    .github-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 12px;
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 4px;
      color: #e6edf3;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
      text-decoration: none;
      box-sizing: border-box;
    }
    .github-btn:hover { background: #30363d; }
  </style>
</head>

<body>
  <div class="box">
    <h1>Orkestra Control Center</h1>

    {{if .Error}}
      <div class="error">{{.Error}}</div>
    {{end}}

    {{if .GitHubEnabled}}
      <a class="github-btn" href="/auth/github">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577
          0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61-.546-1.385-1.335-1.755-1.335-1.755-1.087-.744.084-.729.084-.729
          1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93
          0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405
          1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22
          0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286
          0 .315.21.69.825.57C20.565 21.795 24 17.295 24 12c0-6.63-5.37-12-12-12"/>
        </svg>
        Sign in with GitHub
      </a>
      <div class="divider">or</div>
    {{end}}

    <form method="POST" action="/login">
      <input type="text" name="username" placeholder="Username" required>
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>
  </div>
</body>
</html>
